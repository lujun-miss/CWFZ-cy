<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>顾问定制订单 - 策源易答</title>
    <link href="libs/css/tailwind.css" rel="stylesheet">
    <link href="libs/css/font-awesome.min.css" rel="stylesheet">
    <script src="data-bridge.js"></script>
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f6f7fb; }
        .bundle-hero { background: linear-gradient(135deg, #312e81 0%, #4338ca 45%, #6366f1 100%); }
        .bundle-hero::after {
            content: ''; position: absolute; inset: 0;
            background-image: linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px);
            background-size: 28px 28px; pointer-events: none;
        }
        .item-row:hover { background: #f8fafc; }
    </style>
    <script>
        (function authGuard() {
            try {
                var p = localStorage.getItem('ceyuan_member_profile');
                if (p) { var d = JSON.parse(p); if (d && d.phone) return; }
            } catch (e) {}
            try {
                localStorage.setItem('ceyuan_member_profile', JSON.stringify({
                    phone: '13800138000', contact: '演示用户', company: '演示企业', type: 'personal'
                }));
            } catch (e) {}
        })();
    </script>
</head>
<body class="text-slate-800">

    <!-- 顶部栏 -->
    <header class="bg-white border-b border-slate-100 sticky top-0 z-40">
        <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-indigo-500/25">
                    <i class="fa fa-cubes text-lg"></i>
                </div>
                <div class="flex flex-col">
                    <span class="text-lg font-black tracking-tight leading-none">策源易答</span>
                    <span class="text-[10px] text-slate-400 mt-1">顾问定制订单 · 专属报价</span>
                </div>
            </div>
            <a href="service-orders.html" class="text-xs font-bold text-slate-500 hover:text-indigo-600 flex items-center">
                <i class="fa fa-file-text-o mr-1.5"></i>我的订单
            </a>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-6 py-8" id="mainBox">
        <div class="bg-white rounded-3xl border border-slate-100 p-14 text-center text-slate-400">
            <i class="fa fa-circle-o-notch fa-spin text-2xl"></i>
            <p class="text-sm mt-3">正在加载服务包…</p>
        </div>
    </main>

    <!-- 支付弹窗 -->
    <div id="payModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[60] hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-md overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
                <h3 class="text-base font-black">确认订单并支付</h3>
                <button onclick="closePay()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500"><i class="fa fa-times"></i></button>
            </div>
            <div id="payView" class="p-6 space-y-4">
                <div class="p-4 bg-slate-50 rounded-2xl">
                    <p class="text-sm font-bold" id="payName">服务包</p>
                    <p class="text-[11px] text-slate-400 mt-1" id="paySub"></p>
                    <div class="flex items-end justify-between mt-3 pt-3 border-t border-slate-200">
                        <span class="text-xs text-slate-500">应付金额</span>
                        <span class="text-2xl font-black text-indigo-600" id="payAmt">¥0</span>
                    </div>
                </div>
                <div class="space-y-2">
                    <label class="pay-method flex items-center justify-between p-3 border-2 border-slate-200 rounded-xl cursor-pointer" data-method="wechat">
                        <span class="flex items-center text-sm font-bold"><i class="fa fa-weixin text-emerald-500 mr-2 text-base"></i>微信支付</span>
                        <input type="radio" name="payMethod" value="wechat" checked class="accent-indigo-600">
                    </label>
                    <label class="pay-method flex items-center justify-between p-3 border-2 border-slate-200 rounded-xl cursor-pointer" data-method="alipay">
                        <span class="flex items-center text-sm font-bold"><i class="fa fa-alipay text-blue-500 mr-2 text-base"></i>支付宝</span>
                        <input type="radio" name="payMethod" value="alipay" class="accent-indigo-600">
                    </label>
                    <label class="pay-method flex items-center justify-between p-3 border-2 border-slate-200 rounded-xl cursor-pointer" data-method="bank">
                        <span class="flex items-center text-sm font-bold"><i class="fa fa-bank text-orange-500 mr-2 text-base"></i>对公转账</span>
                        <input type="radio" name="payMethod" value="bank" class="accent-indigo-600">
                    </label>
                </div>
                <div id="bankBox" class="hidden p-3.5 bg-orange-50/60 border border-orange-100 rounded-xl text-[11px] text-slate-600 leading-relaxed"></div>
                <button onclick="confirmPay()" class="w-full py-3 bg-gradient-to-r from-indigo-600 to-blue-600 text-white rounded-xl text-sm font-black hover:opacity-95 transition-all">确认支付</button>
            </div>
            <div id="successView" class="p-8 text-center hidden">
                <div class="w-16 h-16 mx-auto rounded-full bg-emerald-50 flex items-center justify-center mb-4">
                    <i class="fa fa-check text-emerald-500 text-2xl"></i>
                </div>
                <h3 class="text-lg font-black" id="successTitle">支付成功</h3>
                <p class="text-xs text-slate-500 mt-2 leading-relaxed" id="successDesc"></p>
                <p class="text-[11px] text-slate-400 mt-3">订单号：<span id="successOrderNo" class="font-mono"></span></p>
                <div class="flex gap-2 mt-5">
                    <a href="service-orders.html" class="flex-1 py-2.5 bg-indigo-600 text-white rounded-xl text-xs font-bold text-center">查看我的订单</a>
                    <button onclick="closePay()" class="flex-1 py-2.5 bg-white border border-slate-200 text-slate-500 rounded-xl text-xs font-bold">继续浏览</button>
                </div>
            </div>
        </div>
    </div>

<script>
    var bundle = null;
    var payOrderId = '';

    function fmtMoney(n) { return (Number(n) || 0).toLocaleString('zh-CN'); }
    function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

    function todayStr() {
        var d = new Date(), p = function (n) { return String(n).padStart(2, '0'); };
        return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
    }
    function isExpired(b) { return !!(b && b.expireAt && b.expireAt < todayStr()); }

    function bankInfo() {
        var d = (window.DataBridge && DataBridge.loadServiceContact) ? DataBridge.loadServiceContact() : {};
        return {
            holder: d.bankHolder || '策源易答（深圳）科技有限公司',
            branch: d.bankBranch || '招商银行深圳科技园支行',
            account: d.bankAccount || '7559 0188 2210 901'
        };
    }

    function loadBundle() {
        var token = '';
        try { token = new URLSearchParams(location.search).get('token') || ''; } catch (e) {}
        bundle = (token && window.DataBridge && DataBridge.getServiceBundleByToken) ? DataBridge.getServiceBundleByToken(token) : null;
        if (!bundle && token && DataBridge && DataBridge.getServiceBundle) bundle = DataBridge.getServiceBundle(token);
        render();
    }

    function statusInfo() {
        if (!bundle) return { text: '链接无效', cls: 'bg-slate-100 text-slate-500', canBuy: false };
        if (bundle.status === 'closed') return { text: '方案已作废', cls: 'bg-slate-100 text-slate-500', canBuy: false };
        if (bundle.status === 'paid') return { text: '已付款', cls: 'bg-emerald-50 text-emerald-600', canBuy: false };
        if (bundle.status === 'ordered') return { text: '已下单待付款', cls: 'bg-amber-50 text-amber-600', canBuy: false };
        if (isExpired(bundle)) return { text: '方案已过期', cls: 'bg-rose-50 text-rose-500', canBuy: false };
        return { text: '待确认下单', cls: 'bg-indigo-50 text-indigo-600', canBuy: true };
    }

    function render() {
        var box = document.getElementById('mainBox');
        if (!bundle) {
            box.innerHTML = '<div class="bg-white rounded-3xl border border-slate-100 py-20 text-center">'
                + '<i class="fa fa-link text-3xl text-slate-300"></i>'
                + '<p class="text-sm font-bold text-slate-500 mt-4">订单不存在或链接已失效</p>'
                + '<p class="text-xs text-slate-400 mt-1">请向您的服务顾问重新获取专属链接</p>'
                + '<a href="service-market.html" class="inline-block mt-5 px-5 py-2.5 bg-indigo-600 text-white rounded-xl text-xs font-bold">前往服务商城</a></div>';
            return;
        }
        var st = statusInfo();
        var itemsHtml = bundle.items.map(function (it, i) {
            return '<div class="item-row flex items-center gap-3 px-4 py-3 border-b border-slate-50 last:border-0 transition-all">'
                + '<div class="w-7 h-7 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center text-[11px] font-black flex-shrink-0">' + (i + 1) + '</div>'
                + '<div class="flex-1 min-w-0">'
                + '<p class="text-sm font-bold text-slate-700 truncate">' + esc(it.svcName) + '</p>'
                + '<p class="text-[11px] text-slate-400 mt-0.5">' + (it.custom ? '顾问定制增项' : '标准服务') + '</p>'
                + '</div>'
                + '<span class="text-xs text-slate-400 flex-shrink-0">原价 ¥' + fmtMoney(it.originalPrice) + '</span>'
                + '</div>';
        }).join('');

        // 服务流程（顾问推送订单时配置）
        var msList = Array.isArray(bundle.milestones) ? bundle.milestones : [];
        var msHtml = '';
        if (msList.length) {
            msHtml = '<div class="bg-white rounded-3xl border border-slate-100 overflow-hidden">'
                + '  <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">'
                + '    <h2 class="text-sm font-black flex items-center"><i class="fa fa-list-ol text-indigo-500 mr-2"></i>服务流程</h2>'
                + '    <span class="text-[11px] text-slate-400">共 ' + msList.length + ' 步</span>'
                + '  </div>'
                + '  <div class="p-5">'
                + msList.map(function (m, i) {
                    var last = i === msList.length - 1;
                    return '<div class="flex gap-3 ' + (last ? '' : 'pb-4') + '">'
                        + '<div class="flex flex-col items-center flex-shrink-0">'
                        + '  <div class="w-7 h-7 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center text-[11px] font-black">' + (i + 1) + '</div>'
                        + (last ? '' : '<div class="w-px flex-1 bg-indigo-100 my-1"></div>')
                        + '</div>'
                        + '<div class="flex-1 min-w-0 pb-0.5">'
                        + '  <p class="text-sm font-bold text-slate-700">' + esc(m.name) + '</p>'
                        + (m.desc ? '<p class="text-[11.5px] text-slate-500 mt-1 leading-relaxed">' + esc(m.desc) + '</p>' : '')
                        + '</div></div>';
                }).join('')
                + '  </div>'
                + '</div>';
        }

        // 服务内容清单（顾问推送订单时配置）
        var incList = Array.isArray(bundle.includes) ? bundle.includes : [];
        var incHtml = '';
        if (incList.length) {
            incHtml = '<div class="bg-white rounded-3xl border border-slate-100 overflow-hidden">'
                + '  <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">'
                + '    <h2 class="text-sm font-black flex items-center"><i class="fa fa-check-square-o text-indigo-500 mr-2"></i>服务内容清单</h2>'
                + '    <span class="text-[11px] text-slate-400">共 ' + incList.length + ' 项</span>'
                + '  </div>'
                + '  <div class="p-5 grid grid-cols-1 md:grid-cols-2 gap-2.5">'
                + incList.map(function (t) {
                    return '<div class="flex items-start gap-2 text-xs text-slate-600">'
                        + '<i class="fa fa-check-circle text-indigo-400 mt-0.5 flex-shrink-0"></i>'
                        + '<span class="leading-relaxed">' + esc(t) + '</span></div>';
                }).join('')
                + '  </div>'
                + '</div>';
        }

        box.innerHTML = '<div class="bundle-hero relative overflow-hidden rounded-3xl p-7 text-white mb-5">'
            + '  <div class="relative z-10">'
            + '    <div class="flex items-center gap-2 mb-3">'
            + '      <span class="px-2.5 py-1 rounded-full bg-white/15 text-[10px] font-bold border border-white/20">顾问定制订单</span>'
            + '      <span class="px-2.5 py-1 rounded-full bg-white/15 text-[10px] font-bold border border-white/20"><i class="fa fa-lock mr-1"></i>仅本客户可见</span>'
            + '    </div>'
            + '    <h1 class="text-2xl font-black leading-tight">' + esc(bundle.title) + '</h1>'
            + '    <p class="text-xs text-indigo-100 mt-2">' + esc(bundle.customerName) + ' · 订单编号 ' + esc(bundle.id)
            + (bundle.expireAt ? ' · 有效期至 ' + esc(bundle.expireAt) : '') + '</p>'
            + '  </div>'
            + '</div>'
            + '<div class="grid grid-cols-1 lg:grid-cols-3 gap-5">'
            + '  <div class="lg:col-span-2 space-y-5">'
            + '    <div class="bg-white rounded-3xl border border-slate-100 overflow-hidden">'
            + '      <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">'
            + '        <h2 class="text-sm font-black flex items-center"><i class="fa fa-list-ul text-indigo-500 mr-2"></i>服务清单</h2>'
            + '        <span class="text-[11px] text-slate-400">共 ' + bundle.items.length + ' 项</span>'
            + '      </div>'
            + '      <div>' + itemsHtml + '</div>'
            + '    </div>'
            + incHtml
            + msHtml
            + (bundle.note
                ? '<div class="bg-white rounded-3xl border border-slate-100 p-5"><h2 class="text-sm font-black mb-2"><i class="fa fa-comment-o text-indigo-500 mr-2"></i>顾问说明</h2><p class="text-xs text-slate-600 leading-relaxed">' + esc(bundle.note) + '</p></div>'
                : '')
            + '    <div class="bg-indigo-50/50 border border-indigo-100 rounded-2xl p-4">'
            + '      <p class="text-[11px] text-indigo-700 leading-relaxed"><i class="fa fa-info-circle mr-1"></i>本订单由服务顾问根据沟通结果（含面谈）定制，仅通过专属链接展示，不进入公开商城；价格、服务清单与服务流程以下单时为准。</p>'
            + '    </div>'
            + '  </div>'
            + '  <div class="lg:col-span-1">'
            + '    <div class="bg-white rounded-3xl border border-slate-100 p-5 sticky top-24">'
            + '      <span class="inline-block px-2.5 py-1 rounded-full text-[10px] font-bold ' + st.cls + '">' + st.text + '</span>'
            + '      <div class="mt-4 space-y-2 text-xs">'
            + '        <div class="flex items-center justify-between"><span class="text-slate-500">逐项原价合计</span><span class="text-slate-600">¥' + fmtMoney(bundle.originalTotal) + '</span></div>'
            + '        <div class="flex items-center justify-between"><span class="text-slate-500">整单优惠</span><span class="text-emerald-600 font-bold">-¥' + fmtMoney(bundle.discount) + '</span></div>'
            + '      </div>'
            + '      <div class="mt-3 pt-3 border-t border-slate-100 flex items-end justify-between">'
            + '        <span class="text-xs text-slate-500">应付总价</span>'
            + '        <span class="text-2xl font-black text-indigo-600">¥' + fmtMoney(bundle.totalPrice) + '</span>'
            + '      </div>'
            + (st.canBuy
                ? '<button onclick="openPay()" class="w-full mt-4 py-3 bg-gradient-to-r from-indigo-600 to-blue-600 text-white rounded-xl text-sm font-black hover:opacity-95 transition-all"><i class="fa fa-credit-card mr-1.5"></i>确认并付款</button>'
                : '<button disabled class="w-full mt-4 py-3 bg-slate-100 text-slate-400 rounded-xl text-sm font-black cursor-not-allowed">' + st.text + '</button>')
            + '      <p class="text-[10px] text-slate-400 mt-3 leading-relaxed">' + (st.canBuy ? '支付后服务顾问将在 24 小时内与您联系，启动服务。' : (bundle.status === 'ordered' || bundle.status === 'paid' ? '可在「我的订单」中查看订单与后续进度。' : '如需重新报价，请联系您的服务顾问。')) + '</p>'
            + '    </div>'
            + '  </div>'
            + '</div>';
    }

    function show(id) { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex'); }
    function hide(id) { document.getElementById(id).classList.add('hidden'); document.getElementById(id).classList.remove('flex'); }

    document.querySelectorAll('.pay-method').forEach(function (l) {
        l.addEventListener('click', function () {
            document.querySelectorAll('.pay-method').forEach(function (x) {
                var on = x === l;
                x.classList.toggle('border-indigo-300', on);
                x.classList.toggle('bg-indigo-50/50', on);
                x.classList.toggle('border-slate-200', !on);
                x.querySelector('input').checked = on;
            });
            var bank = document.querySelector('input[name="payMethod"]:checked').value === 'bank';
            var bb = document.getElementById('bankBox');
            if (bank) {
                var b = bankInfo();
                bb.innerHTML = '收款户名：<b>' + esc(b.holder) + '</b><br>开户银行：' + esc(b.branch) + '<br>银行账号：<b class="font-mono">' + esc(b.account) + '</b><br>转账后请在「我的订单」上传转账凭证，运营审核通过后自动进入服务流程。';
                bb.classList.remove('hidden');
            } else {
                bb.classList.add('hidden');
            }
        });
    });

    function openPay() {
        if (!bundle) return;
        document.getElementById('payName').textContent = bundle.title;
        document.getElementById('paySub').textContent = '共 ' + bundle.items.length + ' 项 · 原价 ¥' + fmtMoney(bundle.originalTotal) + ' · 优惠 ¥' + fmtMoney(bundle.discount);
        document.getElementById('payAmt').textContent = '¥' + fmtMoney(bundle.totalPrice);
        document.getElementById('payView').classList.remove('hidden');
        document.getElementById('successView').classList.add('hidden');
        show('payModal');
    }
    function closePay() { hide('payModal'); }

    function confirmPay() {
        if (!bundle) return;
        var profile = {};
        try { profile = JSON.parse(localStorage.getItem('ceyuan_member_profile') || '{}') || {}; } catch (e) {}
        var company = profile.company || '演示企业';
        var contact = profile.contact || '演示用户';
        var phone = profile.phone || '13800138000';
        var methodRaw = document.querySelector('input[name="payMethod"]:checked').value;
        var methodMap = { wechat: '微信支付', alipay: '支付宝', bank: '对公转账' };
        var method = methodMap[methodRaw] || '微信支付';
        var isBank = method === '对公转账';
        if (!(window.DataBridge && DataBridge.addServiceOrder)) { alert('数据层未加载，无法下单'); return; }
        // 顾问推送时已生成待付款订单，这里直接更新该订单，避免重复建单
        var row = null;
        if (bundle.orderId && DataBridge.loadServiceOrders && DataBridge.saveServiceOrders) {
            var orders = DataBridge.loadServiceOrders();
            var idx = orders.findIndex(function (o) { return o.id === bundle.orderId; });
            if (idx >= 0) {
                orders[idx].status = isBank ? 'unpaid' : 'serving';
                orders[idx].payStatus = isBank ? 'waiting' : 'confirmed';
                orders[idx].payMethod = method;
                orders[idx].company = company;
                orders[idx].contact = contact;
                orders[idx].phone = phone;
                DataBridge.saveServiceOrders(orders);
                row = orders[idx];
            }
        }
        if (!row) {
            row = DataBridge.addServiceOrder({
                svcId: 'BUNDLE', svcName: bundle.title, provider: '策源易答服务顾问',
                icon: 'fa-file-text-o', category: '专属服务',
                amount: bundle.totalPrice, originalAmount: bundle.originalTotal,
                bundleId: bundle.id,
                items: bundle.items.map(function (it) {
                    return { svcId: it.svcId, svcName: it.svcName, tierName: it.tierName, originalPrice: it.originalPrice };
                }),
                milestones: (bundle.milestones || []).map(function (m) {
                    return { name: m.name, desc: m.desc, days: m.days };
                }),
                includes: bundle.includes || [],
                status: isBank ? 'unpaid' : 'serving',
                payStatus: isBank ? 'waiting' : 'confirmed',
                payMethod: method, company: company, contact: contact, phone: phone
            });
        }
        payOrderId = row.id;
        if (DataBridge.updateServiceBundle) {
            DataBridge.updateServiceBundle(bundle.id, { status: isBank ? 'ordered' : 'paid', orderId: row.id });
        }
        document.getElementById('successTitle').textContent = isBank ? '订单提交成功' : '支付成功';
        document.getElementById('successDesc').innerHTML = isBank
            ? '已生成对公转账订单，请完成转账后在「我的订单」上传凭证，<br>审核通过后订单自动进入服务流程。'
            : '订单已支付，服务顾问将在 24 小时内与您联系，按服务流程启动服务。';
        document.getElementById('successOrderNo').textContent = row.id;
        document.getElementById('payView').classList.add('hidden');
        document.getElementById('successView').classList.remove('hidden');
        loadBundle();
    }

    loadBundle();
</script>
</body>
</html>
