            try {
                var p = localStorage.getItem('ceyuan_member_profile');
                if (p) {
                    var d = JSON.parse(p);
                    if (d && d.phone) return;
                }
            } catch (e) {}
            try {
                localStorage.setItem('ceyuan_member_profile', JSON.stringify({
                    phone: '13800138000', contact: '演示用户', company: '演示企业', type: 'personal'
                }));
            } catch (e) {}

    <script>
        // 框架内跳转（商城为沉浸式全屏页），独立打开时直接跳
        function goPage(file) {
            try {
                if (parent && parent.window && typeof parent.window.switchPage === 'function') {
                    parent.window.switchPage(file);
                    return;
                }
            } catch (e) {}
            window.location.href = file;
        }

        let ORDERS = [];
        let curTab = 'all';
        let payOrderId = null;
        let reviewOrderId = null;
        let starVal = 5;

        function fmtMoney(n) { return (Number(n) || 0).toLocaleString('zh-CN'); }
        // 分类图标（后台无图标字段，按分类自动匹配）
        function categoryIcon(cat) {
            const m = { '政策咨询': 'fa-file-text-o', '申报代理': 'fa-pencil-square-o', '知识产权': 'fa-copyright', '财务审计': 'fa-calculator', '技术转移': 'fa-exchange', '检验检测': 'fa-flask', '专属服务': 'fa-file-text-o' };
            return m[cat] || 'fa-file-text-o';
        }

        const STATUS = {
            unpaid:   { text: '待付款', cls: 'bg-red-50 text-red-600' },
            serving:  { text: '服务中', cls: 'bg-blue-50 text-blue-600' },
            done:     { text: '已完成', cls: 'bg-emerald-50 text-emerald-600' },
            reviewed: { text: '已评价', cls: 'bg-slate-100 text-slate-500' }
        };
        // 对公收款账户取自后台「客服与咨询 → 对公转账收款账户」配置
        function bankInfo() {
            const d = (window.DataBridge && DataBridge.loadServiceContact) ? DataBridge.loadServiceContact() : {};
            return {
                holder: d.bankHolder || '策源易答（深圳）科技有限公司',
                branch: d.bankBranch || '招商银行深圳科技园支行',
                account: d.bankAccount || '7559 0188 2210 901'
            };
        }
        // 对公转账订单按凭证状态细化展示
        function statusOf(o) {
            if (o.status === 'unpaid' && o.payMethod === '对公转账') {
                if (o.payStatus === 'pending') return { text: '待审核', cls: 'bg-amber-50 text-amber-600' };
                if (o.payStatus === 'rejected') return { text: '凭证被驳回', cls: 'bg-rose-50 text-rose-600' };
                return { text: '待转账', cls: 'bg-orange-50 text-orange-600' };
            }
            return STATUS[o.status] || STATUS.unpaid;
        }
        // 订单进度节点跟随商品配置的服务流程（商城看到什么流程，订单就是什么流程）
        const FALLBACK_STEPS = ['签订合同', '需求评估', '方案制定', '材料准备', '审核提交', '完成交付'];
        let PRODUCT_CACHE = null;
        function getOrderSteps(o) {
            if (PRODUCT_CACHE === null) {
                try { PRODUCT_CACHE = (typeof DataBridge !== 'undefined' && DataBridge.loadServiceProducts) ? (DataBridge.loadServiceProducts() || []) : []; }
                catch (e) { PRODUCT_CACHE = []; }
            }
            const p = PRODUCT_CACHE.find(x => x.id === o.svcId);
            if (p && Array.isArray(p.process) && p.process.length) return p.process.map(s => s.t);
            return FALLBACK_STEPS;
        }

        function load() {
            ORDERS = (typeof DataBridge !== 'undefined') ? DataBridge.loadServiceOrders() : [];
            // 顾问推送但历史数据尚未建单的专属订单，也归入订单列表（待付款）
            try {
                var bundles = (typeof DataBridge !== 'undefined' && DataBridge.loadServiceBundles) ? (DataBridge.loadServiceBundles() || []) : [];
                var linked = {};
                ORDERS.forEach(function (o) { if (o.bundleId) linked[o.bundleId] = 1; });
                bundles.forEach(function (b) {
                    if (linked[b.id] || b.status !== 'pushed') return;
                    ORDERS.unshift({
                        id: 'ZD' + String(b.id).slice(-6), svcName: b.title, provider: '策源易答服务顾问',
                        icon: 'fa-file-text-o', category: '专属服务', amount: b.totalPrice, originalAmount: b.originalTotal,
                        bundleId: b.id, items: b.items, milestones: b.milestones, includes: b.includes || [],
                        status: 'unpaid', payMethod: '', payStatus: 'waiting',
                        createTime: b.pushedAt || b.at || '', progress: 0
                    });
                });
            } catch (e) {}
        }
        function openBundleOrder(bid) {
            var b = (typeof DataBridge !== 'undefined' && DataBridge.loadServiceBundles)
                ? (DataBridge.loadServiceBundles() || []).find(function (x) { return x.id === bid; }) : null;
            if (b && b.token) { location.href = 'service-bundle.html?token=' + encodeURIComponent(b.token); }
            else { alert('订单链接已失效，请联系顾问重新推送'); }
        }

        // ===== 订单详情 =====
        function openOrderDetail(id) {
            const o = ORDERS.find(x => x.id === id);
            if (!o) return;
            const st = statusOf(o);

            // 定制订单若订单上缺少明细，从对应服务包补齐
            let items = o.items || [];
            let includes = o.includes || [];
            let mils = o.milestones || [];
            if ((!items.length || !includes.length || !mils.length) && o.bundleId && window.DataBridge && DataBridge.getServiceBundle) {
                const b = DataBridge.getServiceBundle(o.bundleId);
                if (b) {
                    if (!items.length) items = b.items || [];
                    if (!includes.length) includes = b.includes || [];
                    if (!mils.length) mils = b.milestones || [];
                }
            }
            // 历史定制订单没有内容清单时，取首个服务商品在后台维护的服务内容
            if (!includes.length && items.length) {
                const pid = (items.find(it => it.svcId) || {}).svcId;
                const p = (pid && window.DataBridge && DataBridge.loadServiceProducts)
                    ? (DataBridge.loadServiceProducts() || []).find(x => x.id === pid) : null;
                if (p && Array.isArray(p.includes)) includes = p.includes;
            }

            // 服务项
            let itemsHtml = '';
            if (items.length) {
                itemsHtml = items.map((it, i) => `
                    <div class="flex items-center justify-between py-2 border-b border-slate-50 last:border-0">
                        <span class="text-xs text-slate-700 min-w-0 truncate"><span class="text-slate-300 mr-1">${i + 1}.</span>${it.svcName || '定制服务项'}</span>
                        <span class="text-xs text-slate-500 flex-shrink-0 ml-3">${it.originalPrice > 0 ? '¥' + fmtMoney(it.originalPrice) : '面议'}</span>
                    </div>`).join('');
            } else {
                itemsHtml = `
                    <div class="flex items-center justify-between py-2">
                        <span class="text-xs text-slate-700"><i class="fa fa-check-circle text-orange-400 mr-2"></i>${o.svcName}</span>
                        <span class="text-xs text-slate-500">${o.originalAmount > 0 ? '¥' + fmtMoney(o.originalAmount) : (o.amount > 0 ? '¥' + fmtMoney(o.amount) : '面议')}</span>
                    </div>`;
            }

            // 服务内容清单（顾问配置）
            let incHtml = '';
            if (includes.length) {
                incHtml = `
                <div class="mt-5">
                    <p class="text-xs font-bold text-slate-600 mb-1.5"><i class="fa fa-check-square-o text-orange-500 mr-1.5"></i>服务内容清单</p>
                    <div class="p-3 bg-slate-50 rounded-xl space-y-1.5">
                        ${includes.map(x => `<div class="text-[11px] text-slate-600 leading-relaxed"><i class="fa fa-check-circle text-indigo-400 mr-1.5"></i>${x}</div>`).join('')}
                    </div>
                </div>`;
            }

            // 服务流程
            let processHtml = '';
            if (mils.length) {
                processHtml = `
                <div class="mt-5">
                    <p class="text-xs font-bold text-slate-600 mb-2.5"><i class="fa fa-tasks text-orange-500 mr-1.5"></i>服务流程</p>
                    <div class="space-y-2">
                        ${mils.map((m, i) => `
                        <div class="flex items-start gap-2.5 p-2.5 bg-slate-50 rounded-xl">
                            <span class="w-6 h-6 rounded-full bg-orange-100 text-orange-600 flex items-center justify-center text-[10px] font-black flex-shrink-0">${i + 1}</span>
                            <div class="min-w-0">
                                <p class="text-xs font-bold text-slate-700">${m.name || '服务阶段'}</p>
                                ${m.desc ? `<p class="text-[11px] text-slate-500 mt-0.5">${m.desc}</p>` : ''}
                            </div>
                        </div>`).join('')}
                    </div>
                </div>`;
            }

            // 金额明细
            const orig = o.originalAmount || 0;
            const discount = orig > o.amount ? orig - o.amount : 0;
            const amountHtml = `
                <div class="mt-5 p-3.5 bg-orange-50/60 border border-orange-100 rounded-2xl">
                    ${orig > 0 ? `<div class="flex items-center justify-between text-xs text-slate-500 mb-1"><span>服务原价</span><span>¥${fmtMoney(orig)}</span></div>` : ''}
                    ${discount > 0 ? `<div class="flex items-center justify-between text-xs text-orange-600 mb-1"><span>${o.bundleId ? '专属优惠' : '客服改价优惠'}</span><span>-¥${fmtMoney(discount)}</span></div>` : ''}
                    <div class="flex items-center justify-between pt-1.5 border-t border-orange-100">
                        <span class="text-xs font-bold text-slate-700">应付金额</span>
                        <span class="text-lg font-black text-orange-600">¥${fmtMoney(o.amount)}</span>
                    </div>
                </div>`;

            // 服务进度（服务中/已完成/已评价）
            let progressHtml = '';
            if (o.status === 'serving' || o.status === 'done' || o.status === 'reviewed') {
                const steps = getOrderSteps(o);
                const pg = Math.max(0, Math.min(100, o.progress || 0));
                progressHtml = `
                <div class="mt-5">
                    <div class="flex items-center justify-between mb-2">
                        <p class="text-xs font-bold text-slate-600"><i class="fa fa-tasks text-orange-500 mr-1.5"></i>服务进度</p>
                        <span class="text-[11px] font-bold ${pg >= 100 ? 'text-emerald-600' : 'text-orange-600'}">${pg}%</span>
                    </div>
                    <div class="h-1.5 bg-slate-100 rounded-full overflow-hidden mb-2.5">
                        <div class="h-full ${pg >= 100 ? 'bg-emerald-500' : 'bg-orange-500'} rounded-full" style="width:${pg}%"></div>
                    </div>
                    <div class="flex flex-wrap gap-1.5">
                        ${steps.map((s, i) => {
                            const done = pg >= ((i + 1) / steps.length) * 100;
                            const cur = !done && pg >= (i / steps.length) * 100;
                            return `<span class="text-[10px] px-2 py-1 rounded-md ${done ? 'bg-emerald-50 text-emerald-600' : cur ? 'bg-orange-50 text-orange-600 font-bold' : 'bg-slate-50 text-slate-400'}">${i + 1}. ${s}</span>`;
                        }).join('')}
                    </div>
                </div>`;
            }

            // 订单信息
            const infoHtml = `
                <div class="mt-5 grid grid-cols-2 gap-2 text-[11px]">
                    <div class="p-2.5 bg-slate-50 rounded-xl"><span class="text-slate-400">下单时间</span><p class="font-bold text-slate-700 mt-0.5">${o.createTime || '-'}</p></div>
                    <div class="p-2.5 bg-slate-50 rounded-xl"><span class="text-slate-400">服务商</span><p class="font-bold text-slate-700 mt-0.5 truncate">${o.provider || '-'}</p></div>
                    <div class="p-2.5 bg-slate-50 rounded-xl"><span class="text-slate-400">服务对象</span><p class="font-bold text-slate-700 mt-0.5 truncate">${o.company || o.contact || '-'}</p></div>
                    <div class="p-2.5 bg-slate-50 rounded-xl"><span class="text-slate-400">联系人</span><p class="font-bold text-slate-700 mt-0.5 truncate">${o.contact || '-'}${o.phone ? ' · ' + o.phone : ''}</p></div>
                </div>`;

            // 评价与回复
            let reviewHtml = '';
            if (o.reviewText || o.rating > 0) {
                const stars = o.rating > 0 ? '★'.repeat(o.rating) + '☆'.repeat(Math.max(0, 5 - o.rating)) : '';
                reviewHtml = `
                <div class="mt-5 p-3.5 bg-amber-50/60 border border-amber-100 rounded-2xl">
                    <div class="flex items-center justify-between mb-1.5">
                        <p class="text-xs font-bold text-slate-700"><i class="fa fa-star text-amber-500 mr-1.5"></i>服务评价</p>
                        <span class="text-amber-500 text-xs tracking-wider">${stars}</span>
                    </div>
                    ${o.reviewText ? `<p class="text-[11px] text-slate-600 leading-relaxed">${o.reviewText}</p>` : '<p class="text-[11px] text-slate-400">客户暂未填写评价内容</p>'}
                    ${o.reviewTime ? `<p class="text-[10px] text-slate-400 mt-1">${o.reviewTime}</p>` : ''}
                    ${o.replyText ? `<div class="mt-2 p-2.5 bg-white rounded-xl border border-amber-100"><p class="text-[10px] font-bold text-slate-500 mb-1">服务商回复</p><p class="text-[11px] text-slate-600 leading-relaxed">${o.replyText}</p>${o.replyTime ? `<p class="text-[10px] text-slate-400 mt-1">${o.replyTime}</p>` : ''}</div>` : ''}
                </div>`;
            }

            // 转账凭证
            let voucherHtml = '';
            if (o.voucher) {
                voucherHtml = `
                <div class="mt-3 p-3 bg-slate-50 border border-slate-100 rounded-xl text-[11px] text-slate-600">
                    <p class="font-bold text-slate-700 mb-1"><i class="fa fa-file-o mr-1.5"></i>对公转账凭证</p>
                    <p>付款方：${o.voucher.payer || '-'} · 转账日期：${o.voucher.payDate || '-'}</p>
                    <p class="mt-0.5">凭证文件：${o.voucher.fileName || '-'}${o.voucher.uploadTime ? ' · 上传于 ' + o.voucher.uploadTime : ''}</p>
                </div>`;
            }

            document.getElementById('orderDetailBody').innerHTML = `
                <div class="flex items-center justify-between mb-4">
                    <div class="text-[11px] text-slate-400 leading-relaxed">
                        <p>订单号：${o.id}</p>
                        <p class="mt-0.5">下单时间：${o.createTime || '-'}</p>
                    </div>
                    <span class="px-2.5 py-1 rounded-md text-xs font-bold ${st.cls}">${st.text}</span>
                </div>

                <div class="flex items-center gap-3 p-3.5 border border-slate-100 rounded-2xl">
                    <div class="w-12 h-12 gradient-orange rounded-xl flex items-center justify-center text-orange-500 flex-shrink-0"><i class="fa ${categoryIcon(o.category)} text-xl"></i></div>
                    <div class="flex-1 min-w-0">
                        <p class="font-bold text-sm text-slate-800 truncate">${o.svcName}</p>
                        <p class="text-[11px] text-slate-400 mt-1 truncate">${o.provider ? o.provider + ' · ' : ''}${o.category || '服务'}${o.bundleId ? ' · <span class="text-indigo-600 font-bold">专属服务</span>' : ''}</p>
                    </div>
                </div>

                <div class="mt-5">
                    <p class="text-xs font-bold text-slate-600 mb-1.5"><i class="fa fa-list-ul text-orange-500 mr-1.5"></i>服务项（共 ${items.length || 1} 项）</p>
                    <div>${itemsHtml}</div>
                </div>

                ${incHtml}
                ${processHtml}
                ${progressHtml}
                ${amountHtml}
                ${infoHtml}
                ${reviewHtml}

                <div class="mt-3 grid grid-cols-2 gap-2 text-[11px] text-slate-500">
                    <div class="p-2.5 bg-slate-50 rounded-xl"><span class="text-slate-400">支付方式</span><p class="font-bold text-slate-700 mt-0.5">${o.payMethod || '未选择'}</p></div>
                    <div class="p-2.5 bg-slate-50 rounded-xl"><span class="text-slate-400">支付状态</span><p class="font-bold text-slate-700 mt-0.5">${o.payStatus === 'pending' ? '凭证审核中' : o.payStatus === 'rejected' ? '凭证被驳回' : o.payStatus === 'confirmed' ? '已支付' : '未支付'}</p></div>
                </div>
                ${voucherHtml}

                ${o.priceAdjustReason ? `<div class="mt-3 p-3 bg-indigo-50 border border-indigo-100 rounded-xl text-[11px] text-indigo-700"><i class="fa fa-comment-o mr-1"></i>顾问说明：${o.priceAdjustReason}</div>` : ''}
            `;
            show('orderDetailModal');
        }
        function closeOrderDetail() { hide('orderDetailModal'); }

        function setTab(t) {
            curTab = t;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
            render();
        }

        function render() {
            const unpaidCnt = ORDERS.filter(o => o.status === 'unpaid').length;
            document.getElementById('cntUnpaid').textContent = unpaidCnt ? '(' + unpaidCnt + ')' : '';

            let list = ORDERS;
            if (curTab === 'unpaid') list = ORDERS.filter(o => o.status === 'unpaid');
            else if (curTab === 'serving') list = ORDERS.filter(o => o.status === 'serving');
            else if (curTab === 'done') list = ORDERS.filter(o => o.status === 'done' || o.status === 'reviewed');

            const box = document.getElementById('orderList');
            if (list.length === 0) {
                box.innerHTML = `<div class="bg-white rounded-2xl border border-slate-100 py-16 text-center text-slate-400">
                    <i class="fa fa-inbox text-4xl block mb-3"></i>
                    <p class="text-sm">暂无相关订单</p>
                    <button onclick="goPage('service-market.html')" class="mt-4 px-5 py-2 bg-orange-500 hover:bg-orange-600 text-white rounded-xl text-sm font-bold">去商城看看</button>
                </div>`;
                return;
            }
            box.innerHTML = list.map(o => orderCard(o)).join('');
        }

        function orderCard(o) {
            const st = statusOf(o);
            let body = '';
            // 服务进度（服务中）
            if (o.status === 'serving') {
                const steps = getOrderSteps(o);
                const stepIdx = Math.min(steps.length - 1, Math.floor((o.progress + 5) * steps.length / 100));
                body = `
                    <div class="mt-3">
                        <div class="flex justify-between text-[11px] text-slate-400 mb-1.5">
                            <span class="text-blue-600 font-bold"><i class="fa fa-circle-o-notch fa-spin mr-1"></i>服务进行中 · ${steps[stepIdx]}</span>
                            <span>${o.progress}%</span>
                        </div>
                        <div class="h-2 bg-slate-100 rounded-full overflow-hidden">
                            <div class="h-full bg-gradient-to-r from-orange-400 to-orange-600 rounded-full" style="width:${o.progress}%"></div>
                        </div>
                        <div class="flex justify-between mt-2 text-[10px] text-slate-400 gap-1">
                            ${steps.map((s, i) => `<span class="${i <= stepIdx ? 'text-orange-600 font-bold' : ''} text-center leading-tight">${s}</span>`).join('')}
                        </div>
                        <div class="mt-2 text-[10px] text-slate-400 flex items-center gap-1"><i class="fa fa-info-circle"></i>服务全部完成后可评价</div>
                    </div>`;
            } else if (o.status === 'unpaid' && o.bundleId && o.payMethod !== '对公转账') {
                body = `<div class="mt-3 text-[11px] text-indigo-600 bg-indigo-50 border border-indigo-100 rounded-xl px-3.5 py-2.5 font-bold flex items-center"><i class="fa fa-file-text-o mr-1.5"></i>顾问为您定制的专属订单，含服务清单与服务流程，确认后支付</div>`;
            } else if (o.status === 'unpaid' && o.payMethod === '对公转账') {
                const v = o.voucher;
                const audit = o.voucherAudit;
                let tip = '';
                if (o.payStatus === 'pending') {
                    tip = `<div class="mt-2 text-[11px] text-amber-600 font-bold flex items-center"><i class="fa fa-clock-o mr-1"></i>凭证已提交${v && v.uploadTime ? '（' + v.uploadTime + '）' : ''}，运营审核通过后自动进入服务流程</div>`;
                } else if (o.payStatus === 'rejected') {
                    tip = `<div class="mt-2 text-[11px] text-rose-600 font-bold flex items-start"><i class="fa fa-exclamation-circle mr-1 mt-0.5"></i><span>凭证未通过：${audit && audit.note ? audit.note : '凭证信息不清晰'}，请重新上传</span></div>`;
                } else {
                    tip = `<div class="mt-2 text-[11px] text-slate-400"><i class="fa fa-info-circle mr-1"></i>请完成转账后上传凭证，运营审核通过后订单自动进入服务流程</div>`;
                }
                body = `
                    <div class="mt-3 p-3.5 bg-orange-50/50 border border-orange-100 rounded-xl">
                        <div class="flex items-center justify-between text-[11px] gap-3">
                            <span class="text-slate-500 flex-shrink-0">对公收款账户</span>
                            <span class="font-bold text-slate-700 font-mono">${bankInfo().branch} · ${bankInfo().account}</span>
                        </div>
                        <div class="text-[10px] text-slate-400 mt-1">户名：${bankInfo().holder} · 转账请备注订单号 ${o.id}</div>
                        ${tip}
                    </div>`;
            } else if (o.status === 'done') {
                body = `<div class="mt-3 flex items-center text-[11px] text-emerald-600 font-bold"><i class="fa fa-check-circle mr-1"></i>服务已完成，期待您的评价</div>`;
            } else if (o.status === 'reviewed') {
                const starIcons = Array.from({length:5},(_,i)=>`<i class="fa fa-star ${i<o.rating?'text-amber-400':'text-slate-200'}"></i>`).join('');
                const replyHtml = o.replyText ? `<div class="mt-2 p-3 bg-blue-50 rounded-xl border border-blue-100"><div class="flex items-center space-x-2 mb-1"><div class="w-5 h-5 bg-blue-500 text-white rounded-full flex items-center justify-center text-[9px] font-bold">${(o.provider||'商')[0]}</div><span class="text-[10px] font-semibold text-blue-700">${o.provider||'服务商'} · 回复</span><span class="text-[10px] text-slate-400 ml-auto">${o.replyTime||''}</span></div><p class="text-[11px] text-slate-600 pl-7">${o.replyText}</p></div>` : '';
                body = `<div class="mt-3 p-4 bg-orange-50/50 rounded-xl border border-orange-100"><div class="flex items-center space-x-2 mb-2"><div class="flex items-center space-x-0.5 text-sm">${starIcons}</div><span class="text-xs text-slate-400">${o.rating}.0 分</span><span class="text-[10px] text-slate-400 ml-auto">${o.reviewTime||''}</span></div>${o.reviewText ? `<p class="text-xs text-slate-600">${o.reviewText}</p>` : ''}${replyHtml}</div>`;
            }

            // 操作按钮
            let acts = '';
            if (o.status === 'unpaid' && o.bundleId && o.payMethod !== '对公转账') {
                acts = `
                    <button onclick="openOrderDetail('${o.id}')" class="px-4 py-2 bg-white border border-slate-200 text-slate-500 rounded-xl text-xs font-bold hover:bg-slate-50">查看详情</button>
                    <button onclick="openBundleOrder('${o.bundleId}')" class="px-5 py-2 bg-gradient-to-r from-indigo-500 to-indigo-600 text-white rounded-xl text-xs font-bold"><i class="fa fa-credit-card mr-1"></i>去支付</button>`;
            } else if (o.status === 'unpaid' && o.payMethod === '对公转账') {
                if (o.payStatus === 'pending') {
                    acts = `
                    <button onclick="openVoucher('${o.id}', true)" class="px-4 py-2 bg-white border border-slate-200 text-slate-500 rounded-xl text-xs font-bold hover:bg-slate-50">查看凭证</button>
                    <button class="px-4 py-2 bg-white border border-orange-200 text-orange-600 rounded-xl text-xs font-bold hover:bg-orange-50"><i class="fa fa-phone mr-1"></i>联系顾问</button>`;
                } else {
                    acts = `
                    <button onclick="removeOrder('${o.id}')" class="px-4 py-2 bg-white border border-slate-200 text-slate-500 rounded-xl text-xs font-bold hover:bg-slate-50">取消订单</button>
                    <button onclick="openVoucher('${o.id}', false)" class="px-5 py-2 bg-gradient-to-r from-orange-500 to-orange-600 text-white rounded-xl text-xs font-bold">${o.payStatus === 'rejected' ? '重新上传凭证' : '上传转账凭证'}</button>`;
                }
            } else if (o.status === 'unpaid') {
                acts = `
                    <button onclick="removeOrder('${o.id}')" class="px-4 py-2 bg-white border border-slate-200 text-slate-500 rounded-xl text-xs font-bold hover:bg-slate-50">取消订单</button>
                    <button onclick="openPay('${o.id}')" class="px-5 py-2 bg-gradient-to-r from-orange-500 to-orange-600 text-white rounded-xl text-xs font-bold">立即支付</button>`;
            } else if (o.status === 'serving') {
                acts = `
                    <button class="px-4 py-2 bg-white border border-slate-200 text-slate-500 rounded-xl text-xs font-bold hover:bg-slate-50"><i class="fa fa-phone mr-1"></i>联系顾问</button>
                    <button onclick="goPage('service-market.html')" class="px-4 py-2 bg-white border border-orange-200 text-orange-600 rounded-xl text-xs font-bold hover:bg-orange-50">再次购买</button>`;
            } else if (o.status === 'done') {
                acts = `
                    <button onclick="openReview('${o.id}')" class="px-4 py-2 bg-white border border-orange-200 text-orange-600 rounded-xl text-xs font-bold hover:bg-orange-50"><i class="fa fa-star mr-1"></i>去评价</button>
                    <button onclick="goPage('service-market.html')" class="px-5 py-2 bg-white border border-slate-200 text-slate-500 rounded-xl text-xs font-bold hover:bg-slate-50">再次购买</button>`;
            } else {
                acts = `
                    <button onclick="goPage('service-market.html')" class="px-4 py-2 bg-white border border-slate-200 text-slate-500 rounded-xl text-xs font-bold hover:bg-slate-50">再次购买</button>`;
            }

            if (acts.indexOf('openOrderDetail') === -1) {
                acts = `<button onclick="openOrderDetail('${o.id}')" class="px-4 py-2 bg-white border border-slate-200 text-slate-500 rounded-xl text-xs font-bold hover:bg-slate-50">查看详情</button>` + acts;
            }

            return `
            <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden card-hover transition-all">
                <div class="px-5 py-3 bg-slate-50/70 flex items-center justify-between border-b border-slate-100">
                    <div class="flex items-center space-x-3 text-xs text-slate-400">
                        <span>订单号：${o.id}</span>
                        <span>${o.createTime}</span>
                        ${o.payMethod ? `<span class="text-slate-300">|</span><span><i class="fa fa-credit-card mr-1"></i>${o.payMethod}</span>` : ''}
                    </div>
                    <span class="px-2.5 py-1 rounded-md text-xs font-bold ${st.cls}">${st.text}</span>
                </div>
                <div class="p-5 flex items-center space-x-4">
                    <div class="w-14 h-14 gradient-orange rounded-2xl flex items-center justify-center flex-shrink-0 text-orange-500">
                        <i class="fa ${categoryIcon(o.category)} text-2xl"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="font-bold text-slate-800 truncate">${o.svcName}</p>
                        <p class="text-xs text-slate-400 mt-1"><i class="fa fa-building-o mr-1"></i>${o.provider} · ${o.category}${o.bundleId ? ' · <span class="text-indigo-600 font-bold"><i class="fa fa-file-text-o mr-0.5"></i>专属服务</span>' : ''}</p>
                    </div>
                    <div class="text-right flex-shrink-0">
                        <p class="text-orange-600 font-black">¥${fmtMoney(o.amount)}</p>
                        ${o.originalAmount && o.originalAmount > 0 ? `<p class="text-[10px] text-slate-400"><span class="line-through">¥${fmtMoney(o.originalAmount)}</span><span class="text-orange-500 ml-1">${o.bundleId ? '专属优惠' : '客服已改价'}</span></p>` : ''}
                    </div>
                </div>
                ${o.bundleId && o.items && o.items.length ? `
                <div class="px-5 pb-4">
                    <div class="p-3 bg-slate-50 rounded-xl space-y-1.5">
                        <p class="text-[10px] font-bold text-slate-400 mb-1">服务项（共 ${o.items.length} 项）</p>
                        ${o.items.map((it, i) => `
                        <div class="flex items-center justify-between gap-3">
                            <span class="text-[11px] text-slate-600 min-w-0 truncate"><span class="text-slate-300 mr-1">${i + 1}.</span>${it.svcName}</span>
                            <span class="text-[11px] text-slate-400 flex-shrink-0">${it.originalPrice > 0 ? '¥' + fmtMoney(it.originalPrice) : '面议'}</span>
                        </div>`).join('')}
                    </div>
                </div>` : ''}
                ${body ? `<div class="px-5 pb-4">${body}</div>` : ''}
                <div class="px-5 py-3 border-t border-slate-50 flex items-center justify-end space-x-2">${acts}</div>
            </div>`;
        }

        // ===== 支付 =====
        function openPay(id) {
            payOrderId = id;
            const o = ORDERS.find(x => x.id === id);
            if (!o) return;
            document.getElementById('payOrderName').textContent = o.svcName;
            document.getElementById('payOrderId').textContent = '订单号：' + o.id;
            document.getElementById('payOrderAmt').textContent = fmtMoney(o.amount);
            selectMethod('微信支付');
            show('payModal');
        }
        function closePay() { hide('payModal'); payOrderId = null; }
        function selectMethod(m) {
            document.querySelectorAll('#payModal .pay-method').forEach(l => {
                const on = l.dataset.method === m;
                l.classList.toggle('border-orange-300', on);
                l.classList.toggle('bg-orange-50/50', on);
                l.classList.toggle('border-slate-200', !on);
                l.querySelector('input').checked = on;
            });
        }
        document.querySelectorAll('#payModal .pay-method').forEach(l =>
            l.addEventListener('click', () => selectMethod(l.dataset.method)));
        function confirmPayOrder() {
            const o = ORDERS.find(x => x.id === payOrderId);
            if (!o) return;
            const method = document.querySelector('#payModal input[name="odPay"]:checked').value;
            if (method === '对公转账') {
                o.payMethod = method;
                o.payStatus = 'waiting';
                o.voucher = null;
                o.voucherAudit = null;
                persist();
                const oid = o.id;
                hide('payModal');
                payOrderId = null;
                setTab('unpaid');
                openVoucher(oid, false);
                return;
            }
            o.status = 'serving';
            o.payMethod = method;
            o.payStatus = 'confirmed';
            o.progress = 10;
            persist();
            hide('payModal');
            payOrderId = null;
            setTab('serving');
            alert('支付成功！订单已进入服务流程，服务顾问将尽快与您联系。');
        }
        function removeOrder(id) {
            if (!confirm('确定取消该待付款订单吗？')) return;
            ORDERS = ORDERS.filter(o => o.id !== id);
            persist();
            render();
        }

        // ===== 对公转账凭证 =====
        let voucherOrderId = null;
        let voucherDataUrl = '';
        let voucherFileName = '';

        function nowStr() {
            const n = new Date(), p = x => String(x).padStart(2, '0');
            return n.getFullYear() + '-' + p(n.getMonth() + 1) + '-' + p(n.getDate()) + ' ' + p(n.getHours()) + ':' + p(n.getMinutes());
        }
        function openVoucher(id, readonly) {
            const o = ORDERS.find(x => x.id === id);
            if (!o) return;
            const bank = bankInfo();
            document.getElementById('voucherBankHolder').textContent = bank.holder;
            document.getElementById('voucherBankBranch').textContent = bank.branch;
            document.getElementById('voucherBankAccount').textContent = bank.account;
            voucherOrderId = id;
            voucherDataUrl = (o.voucher && o.voucher.dataUrl) || '';
            voucherFileName = (o.voucher && o.voucher.fileName) || '';
            document.getElementById('voucherOrderName').textContent = o.svcName;
            document.getElementById('voucherOrderId').textContent = '订单号：' + o.id;
            document.getElementById('voucherOrderNo').textContent = o.id;
            document.getElementById('voucherOrderAmt').textContent = fmtMoney(o.amount);
            document.getElementById('voucherTitle').innerHTML = readonly
                ? '<i class="fa fa-file-image-o text-orange-500 mr-2"></i>已提交的转账凭证'
                : '<i class="fa fa-bank text-orange-500 mr-2"></i>' + (o.payStatus === 'rejected' ? '重新上传转账凭证' : '上传转账凭证');

            const note = document.getElementById('voucherAuditNote');
            if (o.payStatus === 'rejected' && o.voucherAudit && o.voucherAudit.note) {
                note.textContent = '驳回原因：' + o.voucherAudit.note;
                note.classList.remove('hidden');
            } else {
                note.classList.add('hidden');
            }

            const form = document.getElementById('voucherForm');
            const ro = document.getElementById('voucherReadonly');
            const footer = document.getElementById('voucherFooter');
            if (readonly) {
                form.classList.add('hidden');
                ro.classList.remove('hidden');
                footer.classList.add('hidden');
                const img = document.getElementById('voucherViewImg');
                const no = document.getElementById('voucherViewNoImg');
                if (o.voucher && o.voucher.dataUrl) {
                    img.src = o.voucher.dataUrl;
                    img.classList.remove('hidden');
                    no.classList.add('hidden');
                } else {
                    img.classList.add('hidden');
                    no.classList.remove('hidden');
                }
                document.getElementById('voucherViewPayer').textContent = (o.voucher && o.voucher.payer) || '—';
                document.getElementById('voucherViewDate').textContent = (o.voucher && o.voucher.payDate) || '—';
                document.getElementById('voucherViewTime').textContent = (o.voucher && o.voucher.uploadTime) || '—';
            } else {
                form.classList.remove('hidden');
                ro.classList.add('hidden');
                footer.classList.remove('hidden');
                document.getElementById('voucherPayer').value = (o.voucher && o.voucher.payer) || '';
                document.getElementById('voucherDate').value = (o.voucher && o.voucher.payDate) || new Date().toISOString().slice(0, 10);
                document.getElementById('voucherFile').value = '';
                if (voucherDataUrl) {
                    renderVoucherPreview(voucherDataUrl, voucherFileName);
                } else {
                    document.getElementById('voucherDrop').classList.remove('hidden');
                    document.getElementById('voucherPreviewBox').classList.add('hidden');
                }
            }
            show('voucherModal');
        }
        function closeVoucher() { hide('voucherModal'); voucherOrderId = null; }
        function renderVoucherPreview(url, name) {
            document.getElementById('voucherPreview').src = url;
            document.getElementById('voucherFileName').textContent = name || '';
            document.getElementById('voucherPreviewBox').classList.remove('hidden');
            document.getElementById('voucherDrop').classList.add('hidden');
        }
        // 图片压缩后转 dataURL，避免 localStorage 超限
        function onVoucherFile(input) {
            const f = input.files && input.files[0];
            if (!f) return;
            if (f.size > 5 * 1024 * 1024) {
                alert('图片不能超过 5MB，请压缩后重试');
                input.value = '';
                return;
            }
            voucherFileName = f.name;
            const reader = new FileReader();
            reader.onload = function (e) {
                const raw = e.target.result;
                const img = new Image();
                img.onload = function () {
                    const maxW = 900;
                    const scale = Math.min(1, maxW / img.width);
                    const c = document.createElement('canvas');
                    c.width = Math.round(img.width * scale);
                    c.height = Math.round(img.height * scale);
                    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                    voucherDataUrl = c.toDataURL('image/jpeg', 0.7);
                    renderVoucherPreview(voucherDataUrl, voucherFileName);
                };
                img.onerror = function () {
                    voucherDataUrl = raw;
                    renderVoucherPreview(voucherDataUrl, voucherFileName);
                };
                img.src = raw;
            };
            reader.readAsDataURL(f);
        }
        function submitVoucher() {
            const o = ORDERS.find(x => x.id === voucherOrderId);
            if (!o) return;
            const payer = document.getElementById('voucherPayer').value.trim();
            const payDate = document.getElementById('voucherDate').value;
            if (!payer) { alert('请填写付款账户名称'); return; }
            if (!payDate) { alert('请选择转账日期'); return; }
            if (!voucherDataUrl) { alert('请上传转账凭证图片'); return; }
            o.payMethod = '对公转账';
            o.payStatus = 'pending';
            o.voucher = { payer: payer, payDate: payDate, fileName: voucherFileName || '转账凭证', dataUrl: voucherDataUrl, uploadTime: nowStr() };
            o.voucherAudit = null;
            persist();
            closeVoucher();
            setTab('unpaid');
            alert('凭证已提交，运营审核通过后订单将自动进入服务流程。');
        }

        // ===== 评价 =====
        function openReview(id) {
            reviewOrderId = id;
            const o = ORDERS.find(x => x.id === id);
            document.getElementById('reviewName').textContent = o.svcName;
            document.getElementById('reviewText').value = '';
            setStar(5);
            show('reviewModal');
        }
        function closeReview() { hide('reviewModal'); reviewOrderId = null; }
        function setStar(v) {
            starVal = v;
            document.querySelectorAll('#starBox i').forEach(i => {
                const on = Number(i.dataset.v) <= v;
                i.classList.toggle('text-amber-400', on);
                i.classList.toggle('text-slate-300', !on);
            });
        }
        function submitReview() {
            const o = ORDERS.find(x => x.id === reviewOrderId);
            if (o) {
                o.status = 'reviewed';
                o.rating = starVal;
                o.reviewText = document.getElementById('reviewText').value.trim();
                const n = new Date(), pad = x => String(x).padStart(2, '0');
                o.reviewTime = n.getFullYear() + '-' + pad(n.getMonth()+1) + '-' + pad(n.getDate()) + ' ' + pad(n.getHours()) + ':' + pad(n.getMinutes());
                persist();
            }
            hide('reviewModal');
            reviewOrderId = null;
            render();
        }

        function persist() {
            if (typeof DataBridge !== 'undefined') DataBridge.saveServiceOrders(ORDERS);
        }
        function show(id) { const m = document.getElementById(id); m.classList.remove('hidden'); m.classList.add('flex'); }
        function hide(id) { const m = document.getElementById(id); m.classList.add('hidden'); m.classList.remove('flex'); }

        // 初始化
        load();
        render();
        // 从商城对公转账下单后，带 upload 参数直达凭证上传
        const uploadId = new URLSearchParams(location.search).get('upload');
        if (uploadId) {
            setTimeout(function () {
                const o = ORDERS.find(x => x.id === uploadId);
                if (o) openVoucher(uploadId, o.payStatus === 'pending');
            }, 200);
        }
    </script>
</body>
</html>
