<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找回密码 - 策源易答</title>
    <link href="libs/css/tailwind.css" rel="stylesheet">
    <link href="libs/css/font-awesome.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        input:focus { border-color: #818cf8 !important; outline: none; box-shadow: 0 0 0 3px rgba(99,102,241,.12); }
        .field-err { border-color: #f87171 !important; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-up { animation: fadeUp .35s ease both; }
    </style>
</head>
<body class="min-h-screen" style="background: linear-gradient(135deg, #eef2ff 0%, #e0f2fe 50%, #f5f3ff 100%);">
    <div class="min-h-screen flex items-center justify-center px-4 py-8">
        <div class="w-full grid grid-cols-2 gap-6 items-stretch" style="min-height: calc(100vh - 64px);">
            <!-- 左侧品牌区 -->
            <div class="relative rounded-2xl p-8 text-white overflow-hidden shadow-2xl flex flex-col justify-between" style="background: radial-gradient(130% 130% at 0% 0%, #6366f1 0%, #4f46e5 30%, #6d28d9 65%, #1e2a78 100%);">
                <!-- 右上光斑 -->
                <div class="pointer-events-none absolute w-80 h-80 rounded-full" style="top:-7rem; right:-6rem; background: radial-gradient(circle at 50% 50%, rgba(255,255,255,.45) 0%, rgba(255,255,255,0) 65%);"></div>
                <!-- 左下光斑 -->
                <div class="pointer-events-none absolute w-72 h-72 rounded-full" style="bottom:-6rem; left:-5rem; background: radial-gradient(circle at 50% 50%, rgba(34,211,238,.45) 0%, rgba(34,211,238,0) 70%);"></div>
                <!-- 细网格 -->
                <div class="pointer-events-none absolute inset-0" style="opacity:.12; background-image: linear-gradient(rgba(255,255,255,.35) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.35) 1px, transparent 1px); background-size: 30px 30px;"></div>
                <!-- 水印 -->
                <div class="pointer-events-none absolute font-black leading-none select-none" style="right:-1rem; bottom:.5rem; font-size:150px; color: rgba(255,255,255,.055);">策</div>

                <div class="relative">
                    <span class="inline-flex items-center rounded-full text-[10px] font-bold" style="gap:.4rem; padding:.3rem .8rem; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25);">
                        <span class="rounded-full" style="width:6px;height:6px;background:#6ee7b7;"></span>AI + 政策服务 · 政策智能引擎
                    </span>
                    <h1 class="text-3xl font-black leading-snug mt-5 mb-3">忘记密码？<br>三步重置，<span class="relative inline-block">快速找回<span class="absolute left-0 w-full rounded" style="bottom:-2px;height:4px;background:linear-gradient(90deg,#fbbf24,#f472b6);"></span></span></h1>
                    <p class="text-xs leading-relaxed" style="color: rgba(255,255,255,.72); max-width:34rem;">通过注册手机号接收验证码，验证身份后即可设置新密码。整个过程不超过 1 分钟。</p>
                </div>

                <div class="relative mt-8" style="display:flex;flex-direction:column;gap:.6rem;">
                    <div class="flex items-center rounded-xl" style="gap:.75rem;padding:.6rem .85rem;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(6px);">
                        <span class="flex items-center justify-center rounded-lg" style="width:28px;height:28px;background:rgba(110,231,183,.18);"><i class="fa fa-mobile-alt text-xs" style="color:#6ee7b7;"></i></span>
                        <span class="text-xs" style="color:rgba(255,255,255,.92);">仅限已注册手机号找回</span>
                    </div>
                    <div class="flex items-center rounded-xl" style="gap:.75rem;padding:.6rem .85rem;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(6px);">
                        <span class="flex items-center justify-center rounded-lg" style="width:28px;height:28px;background:rgba(147,197,253,.2);"><i class="fa fa-clock text-xs" style="color:#93c5fd;"></i></span>
                        <span class="text-xs" style="color:rgba(255,255,255,.92);">验证码 10 分钟内有效</span>
                    </div>
                    <div class="flex items-center rounded-xl" style="gap:.75rem;padding:.6rem .85rem;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(6px);">
                        <span class="flex items-center justify-center rounded-lg" style="width:28px;height:28px;background:rgba(253,230,138,.2);"><i class="fa fa-lock text-xs" style="color:#fde68a;"></i></span>
                        <span class="text-xs" style="color:rgba(255,255,255,.92);">重置后旧密码即时失效</span>
                    </div>
                    <div class="flex items-center rounded-xl" style="gap:.75rem;padding:.6rem .85rem;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(6px);">
                        <span class="flex items-center justify-center rounded-lg" style="width:28px;height:28px;background:rgba(196,181,253,.2);"><i class="fa fa-headset text-xs" style="color:#c4b5fd;"></i></span>
                        <span class="text-xs" style="color:rgba(255,255,255,.92);">客服 7×12 小时在线协助</span>
                    </div>
                </div>

                <div class="relative mt-6 pt-4 flex items-center text-[10px]" style="border-top:1px solid rgba(255,255,255,.16);gap:1.1rem;color:rgba(255,255,255,.6);">
                    <span><i class="fa fa-shield-alt mr-1" style="color:#6ee7b7;"></i>政策源自官方公开渠道</span>
                    <span>每日同步更新</span>
                    <span>支持个人与企业账号</span>
                </div>
            </div>

            <!-- 右侧找回表单 -->
            <div class="flex flex-col">
                <!-- 顶部品牌标题 -->
                <div class="relative flex items-center justify-center mb-5">
                    <div class="flex items-center space-x-3.5">
                        <div class="w-14 h-14 rounded-2xl flex items-center justify-center shadow-lg flex-shrink-0" style="background: linear-gradient(160deg, #4f46e5 0%, #7c3aed 100%);">
                            <span class="text-white font-black text-2xl">策</span>
                        </div>
                        <div>
                            <div class="text-2xl font-black tracking-tight text-slate-800">策源易答</div>
                            <div class="text-[11px] text-slate-400 uppercase tracking-[0.2em] mt-0.5">AI + 政策服务</div>
                        </div>
                    </div>
                    <button onclick="openGuide('forgot-password.html')" class="absolute right-0 top-1/2 -translate-y-1/2 text-[11px] text-amber-600 hover:text-amber-700 font-bold"><i class="fa fa-book mr-1"></i>会员与策能值指南</button>
                </div>
                <div class="bg-white/85 backdrop-blur rounded-2xl border border-white/60 shadow-2xl p-6 animate-fade-up flex-1">
                <div class="flex items-center justify-between mb-4">
                    <div>
                        <h2 class="text-lg font-black text-slate-800 leading-tight">找回密码</h2>
                        <p class="text-[11px] text-slate-400 mt-0.5">验证手机号后设置新密码</p>
                    </div>
                </div>

                <div class="space-y-3">
                    <div>
                        <label class="text-[11px] text-slate-500 font-bold block mb-1">注册手机号 <span class="text-red-400">*</span></label>
                        <input id="fp_phone" type="text" placeholder="请输入注册时使用的 11 位手机号" maxlength="11" value="13800138000" class="w-full px-3 py-2.5 text-xs rounded-xl border border-slate-200 bg-white transition-all">
                    </div>
                    <div>
                        <label class="text-[11px] text-slate-500 font-bold block mb-1">短信验证码 <span class="text-red-400">*</span></label>
                        <div class="flex gap-2">
                            <input id="fp_sms" type="text" placeholder="6 位验证码" maxlength="6" value="123456" class="flex-1 px-3 py-2.5 text-xs rounded-xl border border-slate-200 bg-white transition-all">
                            <button id="fpSmsBtn" onclick="sendSms()" class="px-3 py-2 rounded-xl text-[11px] font-bold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 transition-all whitespace-nowrap flex-shrink-0">获取验证码</button>
                        </div>
                    </div>
                    <div>
                        <label class="text-[11px] text-slate-500 font-bold block mb-1">新密码 <span class="text-red-400">*</span></label>
                        <div class="relative">
                            <input id="fp_pwd" type="password" placeholder="6-20 位，建议字母+数字组合" maxlength="20" value="Demo123456" class="w-full px-3 py-2.5 pr-9 text-xs rounded-xl border border-slate-200 bg-white transition-all">
                            <i id="eye_fp" onclick="togglePwd('fp_pwd','eye_fp')" class="fa fa-eye-slash absolute right-3 top-3 cursor-pointer text-slate-400 hover:text-indigo-500 text-xs"></i>
                        </div>
                    </div>
                    <div>
                        <label class="text-[11px] text-slate-500 font-bold block mb-1">确认新密码 <span class="text-red-400">*</span></label>
                        <div class="relative">
                            <input id="fp_pwd2" type="password" placeholder="请再次输入新密码" maxlength="20" value="Demo123456" class="w-full px-3 py-2.5 pr-9 text-xs rounded-xl border border-slate-200 bg-white transition-all">
                            <i id="eye_fp2" onclick="togglePwd('fp_pwd2','eye_fp2')" class="fa fa-eye-slash absolute right-3 top-3 cursor-pointer text-slate-400 hover:text-indigo-500 text-xs"></i>
                        </div>
                    </div>

                    <button onclick="submitReset()" class="w-full py-3 rounded-xl text-sm font-bold text-white bg-gradient-to-r from-indigo-500 to-purple-600 hover:opacity-90 transition-all shadow-lg">
                        <i class="fa fa-key mr-1"></i>重置密码
                    </button>
                    <p class="text-center text-[11px] text-slate-400">想起密码了？<a onclick="goPage('login.html')" class="text-indigo-500 font-bold cursor-pointer hover:text-indigo-700">返回登录</a></p>
                </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function goPage(url) {
            try { if (parent && parent.window && parent.window.switchPage) { parent.window.switchPage(url, null); return; } } catch (e) {}
            window.location.href = url;
        }
        // 打开会员指南，并记录来源页（存储不可用时不影响跳转）
        function openGuide(from) {
            try { sessionStorage.setItem('ceyuan_guide_from', from); } catch (e) {}
            goPage('member-guide.html');
        }
        function toast(msg, ok) {
            var t = document.createElement('div');
            t.className = 'fixed top-5 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-xl text-xs font-bold text-white shadow-lg ' + (ok === false ? 'bg-red-500' : 'bg-slate-800');
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(function(){ t.remove(); }, 2200);
        }
        function markErr(id) { document.getElementById(id).classList.add('field-err'); }
        function clearErr(id) { document.getElementById(id).classList.remove('field-err'); }
        function togglePwd(inputId, eyeId) {
            var input = document.getElementById(inputId);
            var eye = document.getElementById(eyeId);
            if (input.type === 'password') {
                input.type = 'text';
                eye.classList.remove('fa-eye-slash');
                eye.classList.add('fa-eye');
            } else {
                input.type = 'password';
                eye.classList.remove('fa-eye');
                eye.classList.add('fa-eye-slash');
            }
        }
        // 演示环境密码散列（与 login.html / register.html 保持一致）
        function hashPwd(s) {
            var h = 5381;
            for (var i = 0; i < s.length; i++) { h = ((h << 5) + h) ^ s.charCodeAt(i); }
            return (h >>> 0).toString(16);
        }

        var SMS_SENT = false;
        var SMS_CODE = '123456';

        function sendSms() {
            var phone = document.getElementById('fp_phone').value.trim();
            if (!/^1\d{10}$/.test(phone)) { toast('请先输入正确的 11 位手机号', false); markErr('fp_phone'); return; }
            var users = [];
            try { users = JSON.parse(localStorage.getItem('ceyuan_registered_users') || '[]'); } catch (e) {}
            if (!users.some(function(u){ return u.phone === phone; })) {
                toast('该手机号未注册，无法找回密码', false); markErr('fp_phone'); return;
            }
            SMS_SENT = true;
            SMS_CODE = '123456'; // 演示环境固定验证码
            var btn = document.getElementById('fpSmsBtn');
            btn.disabled = true;
            var s = 60;
            btn.textContent = s + 's 后重发';
            var timer = setInterval(function() {
                s--;
                if (s <= 0) { clearInterval(timer); btn.disabled = false; btn.textContent = '获取验证码'; return; }
                btn.textContent = s + 's 后重发';
            }, 1000);
            document.getElementById('fp_sms').value = '123456';
            toast('验证码已发送并自动填入：123456（演示环境）');
        }

        function submitReset() {
            var phone = document.getElementById('fp_phone').value.trim();
            var sms = document.getElementById('fp_sms').value.trim();
            var pwd = document.getElementById('fp_pwd').value;
            var pwd2 = document.getElementById('fp_pwd2').value;
            ['fp_phone', 'fp_sms', 'fp_pwd', 'fp_pwd2'].forEach(clearErr);

            if (!/^1\d{10}$/.test(phone)) { toast('请输入正确的 11 位手机号', false); markErr('fp_phone'); return; }
            if (!SMS_SENT) { toast('请先获取短信验证码', false); return; }
            if (!/^\d{6}$/.test(sms)) { toast('请输入 6 位短信验证码', false); markErr('fp_sms'); return; }
            if (sms !== SMS_CODE) { toast('短信验证码错误，请重新输入', false); markErr('fp_sms'); return; }
            if (pwd.length < 6) { toast('新密码至少 6 位', false); markErr('fp_pwd'); return; }
            if (pwd !== pwd2) { toast('两次输入的密码不一致，请重新确认', false); markErr('fp_pwd2'); return; }

            var users = [];
            try { users = JSON.parse(localStorage.getItem('ceyuan_registered_users') || '[]'); } catch (e) {}
            var idx = users.findIndex(function(u){ return u.phone === phone; });
            if (idx === -1) { toast('该手机号未注册，无法找回密码', false); markErr('fp_phone'); return; }

            users[idx].pwdHash = hashPwd(pwd);
            try { localStorage.setItem('ceyuan_registered_users', JSON.stringify(users)); } catch (e) {}

            toast('密码重置成功，正在跳转登录页...');
            setTimeout(function(){ goPage('login.html'); }, 1200);
        }
    </script>
</body>
</html>
