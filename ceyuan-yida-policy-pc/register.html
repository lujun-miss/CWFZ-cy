                </div>
                </div>
            </div>
        </div>
    </div>

function initRegionSelects() {
    var pSel = document.getElementById('rg_province');
    REGION_DATA.provinces.forEach(function(p) {
        var o = document.createElement('option'); o.value = p; o.textContent = p; pSel.appendChild(o);
    });
}
function onRegProvinceChange() {
    var prov = document.getElementById('rg_province').value;
    var cSel = document.getElementById('rg_city');
    var dSel = document.getElementById('rg_district');
    cSel.innerHTML = '<option value="">城市</option>';
    dSel.innerHTML = '<option value="">区县</option>';
    (REGION_DATA.cityMap[prov] || []).forEach(function(c) {
        var o = document.createElement('option'); o.value = c; o.textContent = c; cSel.appendChild(o);
    });
}
function onRegCityChange() {
    var city = document.getElementById('rg_city').value;
    var dSel = document.getElementById('rg_district');
    dSel.innerHTML = '<option value="">区县</option>';
    (REGION_DATA.districtMap[city] || REGION_DATA.genericDistricts).forEach(function(d) {
        var o = document.createElement('option'); o.value = d; o.textContent = d; dSel.appendChild(o);
    });

initRegionSelects();
        function goPage(url) {
            try { if (parent && parent.window && parent.window.switchPage) { parent.window.switchPage(url, null); return; } } catch (e) {}
            window.location.href = url;
        }
        // 打开会员指南，并记录来源页（存储不可用时不影响跳转）
        function openGuide(from) {
            try { sessionStorage.setItem('ceyuan_guide_from', from); } catch (e) {}
            goPage('member-guide.html');
        }
        function toast(msg, ok) {
            var t = document.createElement('div');
            t.className = 'fixed top-5 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-xl text-xs font-bold text-white shadow-lg ' + (ok === false ? 'bg-red-500' : 'bg-slate-800');
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(function(){ t.remove(); }, 2200);
        }

        var SMS_CODE = '123456'; // 演示环境：默认匹配预填验证码，不点获取也能提交
        var REG_TYPE = 'personal'; // personal | enterprise
        function togglePwd(inputId, eyeId) {
            var input = document.getElementById(inputId);
            var eye = document.getElementById(eyeId);
            if (input.type === 'password') {
                input.type = 'text';
                eye.classList.remove('fa-eye-slash');
                eye.classList.add('fa-eye');
            } else {
                input.type = 'password';
                eye.classList.remove('fa-eye');
                eye.classList.add('fa-eye-slash');
            }
        }
        function switchRegType(t) {
            REG_TYPE = t;
            var isEnt = t === 'enterprise';
            document.getElementById('entFields').style.display = isEnt ? '' : 'none';
            document.getElementById('rgTitle').textContent = isEnt ? '企业注册' : '个人注册';
            document.getElementById('rgSub').textContent = isEnt ? '填写企业信息，30 秒完成注册' : '手机号快速注册，30 秒完成';
            var on = 'flex-1 py-2 rounded-lg text-xs font-bold bg-white text-indigo-600 shadow-sm transition-all';
            var off = 'flex-1 py-2 rounded-lg text-xs font-bold text-slate-500 transition-all';
            document.getElementById('tabPersonal').className = isEnt ? off : on;
            document.getElementById('tabEnterprise').className = isEnt ? on : off;
        }
        function sendSms() {
            var phone = document.getElementById('rg_phone').value.trim();
            if (!/^1\d{10}$/.test(phone)) { toast('请先填写正确的 11 位手机号', false); markErr('rg_phone'); return; }
            clearErr('rg_phone');
            SMS_CODE = String(Math.floor(100000 + Math.random() * 900000));
            // 演示环境：自动填入验证码，省去手工输入
            document.getElementById('rg_sms').value = SMS_CODE;
            clearErr('rg_sms');
            var btn = document.getElementById('smsBtn');
            var sec = 60;
            btn.disabled = true;
            btn.textContent = sec + 's 后重发';
            btn.classList.add('opacity-50');
            var timer = setInterval(function() {
                sec--;
                if (sec <= 0) { clearInterval(timer); btn.disabled = false; btn.textContent = '获取验证码'; btn.classList.remove('opacity-50'); }
                else btn.textContent = sec + 's 后重发';
            }, 1000);
            toast('验证码已发送并自动填入：' + SMS_CODE + '（演示环境）');
        }

        function markErr(id) { document.getElementById(id).classList.add('field-err'); }
        function clearErr(id) { document.getElementById(id).classList.remove('field-err'); }
        // 演示环境密码散列（仅用于避免明文存储，非真实加密），与 login.html 保持一致
        function hashPwd(s) {
            var h = 5381;
            for (var i = 0; i < s.length; i++) { h = ((h << 5) + h) ^ s.charCodeAt(i); }
            return (h >>> 0).toString(16);
        }

        function submitRegister() {
            var isEnt = REG_TYPE === 'enterprise';
            var company = document.getElementById('rg_company').value.trim();
            var code = document.getElementById('rg_code').value.trim();
            var contact = document.getElementById('rg_contact').value.trim();
            var phone = document.getElementById('rg_phone').value.trim();
            var sms = document.getElementById('rg_sms').value.trim();
            var pwd = document.getElementById('rg_pwd').value;
            var pwd2 = document.getElementById('rg_pwd2').value;
            var inviteCode = document.getElementById('rg_invite').value.trim().toUpperCase();
            var agree = document.getElementById('rg_agree').checked;
            ['rg_company','rg_code','rg_contact','rg_phone','rg_sms','rg_pwd','rg_pwd2','rg_invite'].forEach(clearErr);
            var prov = document.getElementById('rg_province').value;
            var city = document.getElementById('rg_city').value;
            var district = document.getElementById('rg_district').value;
            var regionFilled = !!(prov && city && district);

            if (isEnt) {
                if (!company) { toast('请填写企业名称', false); markErr('rg_company'); return; }
                if (!/^[0-9A-Z]{18}$/.test(code)) { toast('统一社会信用代码需为 18 位数字/大写字母', false); markErr('rg_code'); return; }
                if (!contact) { toast('请填写联系人', false); markErr('rg_contact'); return; }
            }
            if (!/^1\d{10}$/.test(phone)) { toast('请填写正确的 11 位手机号', false); markErr('rg_phone'); return; }
            if (!SMS_CODE || sms !== SMS_CODE) { toast('验证码不正确，请先获取验证码', false); markErr('rg_sms'); return; }
            if (pwd.length < 6) { toast('密码至少 6 位', false); markErr('rg_pwd'); return; }
            if (pwd !== pwd2) { toast('两次输入的密码不一致，请重新确认', false); markErr('rg_pwd2'); return; }
            if (inviteCode && !/^CY[0-9A-Z]{6}$/.test(inviteCode)) { toast('邀请码格式不正确，应为 8 位字母数字（CY 开头）', false); markErr('rg_invite'); return; }
            if (!agree) { toast('请先勾选并同意服务协议', false); return; }

            var users = [];
            try { users = JSON.parse(localStorage.getItem('ceyuan_registered_users') || '[]'); } catch (e) {}
            // 演示环境：同手机号/同信用代码已存在时覆盖旧记录，方便反复演示，不阻断注册
            users = users.filter(function(u){ return u.phone !== phone && !(isEnt && u.code && u.code === code); });
            var rec = { type: REG_TYPE, phone: phone, pwdHash: hashPwd(pwd), province: regionFilled ? prov : '', city: regionFilled ? city : '', district: regionFilled ? district : '', regTime: new Date().toISOString().slice(0, 19).replace('T', ' ') };
            if (isEnt) { rec.company = company; rec.code = code; rec.contact = contact; }
            users.unshift(rec);
            try { localStorage.setItem('ceyuan_registered_users', JSON.stringify(users)); } catch (e) {}
            // 同步会员中心信息（所在地区选填，未选时留空，注册成功页可补充）
            try {
                var regionText = regionFilled ? (prov + ' ' + city + ' ' + district) : '';
                localStorage.setItem('ceyuan_member_profile', JSON.stringify(isEnt
                    ? { company: company, code: code, contact: contact, phone: phone, industry: '', region: regionText, province: regionFilled ? prov : '', city: regionFilled ? city : '', district: regionFilled ? district : '', accountType: 'enterprise' }
                    : { company: '', code: '', contact: '', phone: phone, industry: '', region: regionText, province: regionFilled ? prov : '', city: regionFilled ? city : '', district: regionFilled ? district : '', accountType: 'personal' }));
                if (regionFilled) {
                    localStorage.setItem('ceyuan_current_city', JSON.stringify({ name: city, province: prov, district: district, t: Date.now() }));
                }
            } catch (e) {}

            // 邀请码奖励：邀请人获 100 策能值（写入 ceyuan_member_v2）
            var inviteOk = false;
            if (inviteCode) {
                try {
                    var mb = JSON.parse(localStorage.getItem('ceyuan_member_v2') || '{}');
                    if (typeof mb.general !== 'number') mb.general = 0;
                    mb.general += 100;
                    if (!Array.isArray(mb.rewards)) mb.rewards = [];
                    mb.rewards.unshift({ id:'invite_' + Date.now(), type:'invite', title:'邀请好友注册奖励', desc:'邀请码 ' + inviteCode + ' 邀请 ' + phone + ' 注册成功', credit:100, time:new Date().toISOString().slice(0,10), claimed:true });
                    localStorage.setItem('ceyuan_member_v2', JSON.stringify(mb));
                    inviteOk = true;
                } catch (e) {}
                rec.invitedBy = inviteCode;
            }

            if (regionFilled) {
                // 已选地区：注册成功后直接进入首页
                toast(inviteOk ? '注册成功！邀请码有效，邀请人已获 100 策能值，正在进入首页...' : '注册成功！正在进入首页...');
                setTimeout(function(){ goPage('dashboard.html'); }, 900);
            } else {
                // 未选地区：进入登录成功页，引导选择所在地区
                toast(inviteOk ? '注册成功！邀请码有效，邀请人已获 100 策能值' : '注册成功！请选择所在地区，获取更精准的政策服务');
                setTimeout(function(){ goPage('login-success.html'); }, 900);
            }
        }
    </script>
