<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客户管理 - 策源易达政策销售平台</title>
    <link href="libs/css/tailwind.css" rel="stylesheet">
    <link href="libs/css/font-awesome.min.css" rel="stylesheet">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
        .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
        .drawer-transition { transition: transform 0.3s ease-in-out; }
        .modal-transition { transition: opacity 0.2s ease-in-out; }
        /* 品牌绿色板（预编译 tailwind.css 未包含 brand 色，手动补充） */
        :root { --brand-50:#f0fdf4; --brand-100:#dcfce7; --brand-200:#bbf7d0; --brand-300:#86efac; --brand-400:#4ade80; --brand-500:#22c55e; --brand-600:#16a34a; --brand-700:#15803d; --brand-800:#166534; --brand-900:#14532d; }
        .bg-brand-50 { background-color: var(--brand-50); }
        .bg-brand-50\/40 { background-color: #f0fdf466; }
        .hover\:bg-brand-50:hover { background-color: var(--brand-50); }
        .hover\:bg-brand-50\/40:hover { background-color: #f0fdf466; }
        .bg-brand-100 { background-color: var(--brand-100); }
        .bg-brand-600 { background-color: var(--brand-600); }
        .hover\:bg-brand-700:hover { background-color: var(--brand-700); }
        .text-brand-600 { color: var(--brand-600); }
        .text-brand-700 { color: var(--brand-700); }
        .hover\:text-brand-600:hover { color: var(--brand-600); }
        .hover\:text-brand-700:hover { color: var(--brand-700); }
        .border-brand-600 { border-color: var(--brand-600); }
        .hover\:border-brand-300:hover { border-color: var(--brand-300); }
        .focus\:ring-brand-500:focus { --tw-ring-color: var(--brand-500); }
        .from-brand-500 { --tw-gradient-from: var(--brand-500); --tw-gradient-stops: var(--tw-gradient-via-stops, var(--tw-gradient-position), var(--tw-gradient-from) var(--tw-gradient-from-position), var(--tw-gradient-to) var(--tw-gradient-to-position)); }
        .to-brand-700 { --tw-gradient-to: var(--brand-700); }
    </style>
    <script>
        // 登录拦截：未登录时强制跳转到登录页
        (function authGuard() {
            try {
                var p = localStorage.getItem('ceyuan_member_profile');
                if (!p) { window.location.href = 'login.html'; return; }
                var d = JSON.parse(p);
                if (!d || !d.phone) { window.location.href = 'login.html'; return; }
            } catch (e) {
                window.location.href = 'login.html';
            }
        })();
    </script>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- 顶部导航 -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
        <div class="max-w-[1600px] mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-brand-600 rounded-lg flex items-center justify-center">
                    <i class="fa fa-users text-white text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-gray-800">客户管理</h1>
                    <p class="text-xs text-gray-500">平台注册 + 销售录入双轨客户 · 政策匹配与跟进</p>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <button class="text-gray-600 hover:text-brand-600"><i class="fa fa-bell"></i></button>
                <div class="flex items-center space-x-2">
                    <img src="https://api.dicebear.com/7.x/initials/svg?seed=张销售" class="w-9 h-9 rounded-full bg-brand-100">
                    <span class="text-sm text-gray-700">张销售</span>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-[1600px] mx-auto px-6 py-6">
        <!-- 搜索筛选与操作 -->
        <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100 mb-6">
            <div class="flex flex-wrap items-center gap-3">
                <div class="flex-1 min-w-[240px] relative">
                    <i class="fa fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="searchInput" oninput="renderTable()" placeholder="搜索企业名称、联系人、手机号..."
                        class="w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent">
                </div>
                <select id="filterIndustry" onchange="renderTable()" class="px-4 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm text-gray-700">
                    <option value="">全部行业</option>
                    <option>电子信息</option>
                    <option>生物医药</option>
                    <option>新材料</option>
                    <option>高端装备</option>
                    <option>新能源</option>
                </select>
                <select id="filterSource" onchange="renderTable()" class="px-4 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm text-gray-700">
                    <option value="">全部来源</option>
                    <option>平台注册</option>
                    <option>销售录入</option>
                    <option>批量导入</option>
                    <option>分享转化</option>
                </select>
                <button onclick="resetFilters()" class="px-4 py-2.5 border border-gray-200 rounded-lg text-sm text-gray-600 hover:bg-gray-50">
                    <i class="fa fa-refresh mr-1"></i>重置
                </button>
                <div class="flex items-center gap-2 ml-auto">
                    <button onclick="openNewCustomer()" class="px-4 py-2.5 bg-brand-600 text-white rounded-lg text-sm font-medium hover:bg-brand-700"><i class="fa fa-plus mr-1"></i>录入企业</button>
                    <button onclick="openImportCustomers()" class="px-4 py-2.5 border border-brand-600 text-brand-600 rounded-lg text-sm font-medium hover:bg-brand-50"><i class="fa fa-upload mr-1"></i>导入名单</button>
                </div>
            </div>
        </div>

        <!-- 用户类型 Tab -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="px-6 py-3 border-b border-gray-100 flex items-center space-x-1">
                <button id="tabAll" onclick="switchUserTab('all')" class="px-4 py-2 rounded-lg text-sm font-bold transition-colors bg-brand-600 text-white">全部用户 <span id="cntAll" class="ml-1 opacity-75">0</span></button>
                <button id="tabEnt" onclick="switchUserTab('enterprise')" class="px-4 py-2 rounded-lg text-sm font-bold transition-colors text-gray-600 hover:bg-gray-50">🟢 企业用户 <span id="cntEnt" class="ml-1 opacity-60">0</span></button>
                <button id="tabPer" onclick="switchUserTab('personal')" class="px-4 py-2 rounded-lg text-sm font-bold transition-colors text-gray-600 hover:bg-gray-50">🔵 个人用户 <span id="cntPer" class="ml-1 opacity-60">0</span></button>
            </div>
            <!-- 状态筛选：带数量角标（与 H5 客户列表同口径） -->
            <div class="px-6 py-2.5 border-b border-gray-100 flex items-center gap-2 flex-wrap" id="statusChips"></div>
            <div class="overflow-x-auto scrollbar-thin">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="bg-gray-50 text-gray-500 text-left">
                            <th class="px-6 py-3 font-medium">类型</th>
                            <th class="px-6 py-3 font-medium">名称</th>
                            <th class="px-6 py-3 font-medium">客户来源</th>
                            <th class="px-6 py-3 font-medium">行业/职业</th>
                            <th class="px-6 py-3 font-medium">最近沟通 / 下次跟进</th>
                            <th class="px-6 py-3 font-medium">状态</th>
                            <th class="px-6 py-3 font-medium">注册时间</th>
                            <th class="px-6 py-3 font-medium text-right">操作</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100" id="customerTable"></tbody>
                </table>
            </div>
            <div class="px-6 py-4 border-t border-gray-100 flex items-center justify-between text-sm text-gray-500">
                <span id="tableCount">共 0 条记录</span>
                <div class="flex items-center space-x-1">
                    <button class="px-3 py-1.5 border border-gray-200 rounded hover:bg-gray-50"><i class="fa fa-chevron-left"></i></button>
                    <button class="px-3 py-1.5 bg-brand-600 text-white rounded">1</button>
                    <button class="px-3 py-1.5 border border-gray-200 rounded hover:bg-gray-50"><i class="fa fa-chevron-right"></i></button>
                </div>
            </div>
        </div>
    </main>

    <!-- 客户详情抽屉 -->
    <div id="overlay" class="fixed inset-0 bg-black/30 z-40 hidden" onclick="closeDrawer()"></div>
    <aside id="drawer" class="fixed top-0 right-0 h-full w-full max-w-[520px] bg-white shadow-2xl z-50 drawer-transition transform translate-x-full overflow-y-auto scrollbar-thin">
        <div class="sticky top-0 bg-white border-b border-gray-100 px-6 py-4 flex items-center justify-between z-10">
            <h3 class="font-semibold text-gray-800">客户详情</h3>
            <button onclick="closeDrawer()" class="w-8 h-8 rounded-lg hover:bg-gray-100 flex items-center justify-center text-gray-500">
                <i class="fa fa-times"></i>
            </button>
        </div>
        <div id="drawerBody" class="p-6"></div>
        <div class="sticky bottom-0 bg-white border-t border-gray-100 p-4">
            <button onclick="openFollowupModal()" class="w-full py-2.5 bg-brand-600 text-white rounded-lg text-sm font-bold hover:bg-brand-700">
                <i class="fa fa-plus mr-1"></i>新增跟进记录
            </button>
        </div>
    </aside>

    <!-- 新增跟进弹窗 -->
    <div id="followupModalOverlay" class="fixed inset-0 bg-black/40 z-[60] hidden items-center justify-center modal-transition">
        <div class="bg-white rounded-2xl w-full max-w-[480px] shadow-2xl">
            <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
                <h3 id="followupModalTitle" class="font-semibold text-gray-800">新增跟进</h3>
                <button onclick="closeFollowupModal()" class="w-8 h-8 rounded-lg hover:bg-gray-100 flex items-center justify-center text-gray-500"><i class="fa fa-times"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs text-gray-500 mb-1 block">跟进方式</label>
                        <select id="fuType" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-500">
                            <option>电话沟通</option><option>上门拜访</option><option>邮件发送</option><option>微信沟通</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-gray-500 mb-1 block">跟进日期</label>
                        <input id="fuDate" type="date" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-500">
                    </div>
                </div>
                <div>
                    <label class="text-xs text-gray-500 mb-1 block">沟通纪要 <span class="text-red-500">*</span></label>
                    <textarea id="fuContent" rows="4" placeholder="记录本次沟通要点、客户反馈、达成共识..." class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-500"></textarea>
                </div>
                <div>
                    <label class="text-xs text-gray-500 mb-1 block">下次跟进计划（日期，可选）</label>
                    <input id="fuPlan" type="date" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-500">
                </div>
            </div>
            <div class="px-6 py-4 border-t border-gray-100 flex justify-end space-x-3">
                <button onclick="closeFollowupModal()" class="px-5 py-2.5 border border-gray-200 rounded-lg text-sm text-gray-600 hover:bg-gray-50">取消</button>
                <button onclick="saveFollowup()" class="px-5 py-2.5 bg-brand-600 text-white rounded-lg text-sm hover:bg-brand-700">保存</button>
            </div>
        </div>
    </div>

    <!-- 录入企业弹窗 -->
    <div id="newCustomerOverlay" class="fixed inset-0 bg-black/40 z-[60] hidden items-center justify-center modal-transition">
        <div class="bg-white rounded-2xl w-full max-w-[560px] shadow-2xl max-h-[88vh] overflow-y-auto scrollbar-thin">
            <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between sticky top-0 bg-white">
                <h3 class="font-semibold text-gray-800">录入企业</h3>
                <button onclick="closeNewCustomer()" class="w-8 h-8 rounded-lg hover:bg-gray-100 flex items-center justify-center text-gray-500"><i class="fa fa-times"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div class="col-span-2"><label class="text-xs text-gray-500 mb-1 block">企业名称 <span class="text-red-500">*</span></label>
                        <input id="ncName" type="text" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-500" placeholder="如：星河智造科技有限公司"></div>
                    <div><label class="text-xs text-gray-500 mb-1 block">统一社会信用代码</label><input id="ncCode" type="text" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-500"></div>
                    <div><label class="text-xs text-gray-500 mb-1 block">联系人</label><input id="ncContact" type="text" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-500"></div>
                    <div><label class="text-xs text-gray-500 mb-1 block">手机号</label><input id="ncPhone" type="text" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-500"></div>
                    <div><label class="text-xs text-gray-500 mb-1 block">行业</label><input id="ncIndustry" type="text" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-500" placeholder="如：电子信息"></div>
                    <div><label class="text-xs text-gray-500 mb-1 block">所在地区</label><input id="ncRegion" type="text" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-500" placeholder="如：杭州市余杭区"></div>
                    <div><label class="text-xs text-gray-500 mb-1 block">员工人数</label><input id="ncEmployees" type="number" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-500"></div>
                    <div><label class="text-xs text-gray-500 mb-1 block">年营业收入（万元）</label><input id="ncRevenue" type="number" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-500"></div>
                    <div><label class="text-xs text-gray-500 mb-1 block">已有资质（顿号分隔）</label><input id="ncQuals" type="text" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-500" placeholder="高新技术企业、专精特新"></div>
                    <div><label class="text-xs text-gray-500 mb-1 block">意向状态</label>
                        <select id="ncStatus" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-500">
                            <option>潜在客户</option><option>意向客户</option><option>成交客户</option>
                        </select></div>
                </div>
                <p class="text-[11px] text-gray-400"><i class="fa fa-info-circle mr-1"></i>录入客户来源固定为「销售录入」，无平台账号，仅支持外链触达；客户注册后自动转为「平台注册」。</p>
            </div>
            <div class="px-6 py-4 border-t border-gray-100 flex justify-end space-x-3 sticky bottom-0 bg-white">
                <button onclick="closeNewCustomer()" class="px-5 py-2.5 border border-gray-200 rounded-lg text-sm text-gray-600 hover:bg-gray-50">取消</button>
                <button onclick="submitNewCustomer()" class="px-5 py-2.5 bg-brand-600 text-white rounded-lg text-sm hover:bg-brand-700">确认录入</button>
            </div>
        </div>
    </div>

    <!-- 导入名单弹窗 -->
    <div id="importOverlay" class="fixed inset-0 bg-black/40 z-[60] hidden items-center justify-center modal-transition">
        <div class="bg-white rounded-2xl w-full max-w-[560px] shadow-2xl">
            <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
                <h3 class="font-semibold text-gray-800">导入客户名单</h3>
                <button onclick="closeImport()" class="w-8 h-8 rounded-lg hover:bg-gray-100 flex items-center justify-center text-gray-500"><i class="fa fa-times"></i></button>
            </div>
            <div class="p-6">
                <div class="border border-dashed border-gray-300 rounded-xl p-6 text-center bg-gray-50">
                    <i class="fa fa-file-excel-o text-3xl text-brand-600 mb-2"></i>
                    <p class="text-sm text-gray-700 font-medium">支持 .xlsx / .xls / .csv</p>
                    <p class="text-xs text-gray-400 mt-1">表头：企业名称、联系人、手机号、行业、意向状态</p>
                    <input id="importFile" type="file" accept=".xlsx,.xls,.csv" class="hidden" onchange="parseImportFile(event)">
                    <div class="flex justify-center gap-2 mt-4">
                        <button onclick="document.getElementById('importFile').click()" class="px-4 py-2 bg-brand-600 text-white rounded-lg text-xs font-bold hover:bg-brand-700"><i class="fa fa-upload mr-1"></i>选择文件</button>
                        <button onclick="downloadTemplate()" class="px-4 py-2 border border-gray-200 text-gray-600 rounded-lg text-xs hover:bg-white"><i class="fa fa-download mr-1"></i>下载模板</button>
                    </div>
                </div>
                <div id="importPreview" class="mt-4"></div>
            </div>
            <div class="px-6 py-4 border-t border-gray-100 flex justify-end space-x-3">
                <button onclick="closeImport()" class="px-5 py-2.5 border border-gray-200 rounded-lg text-sm text-gray-600 hover:bg-gray-50">取消</button>
                <button onclick="confirmImport()" class="px-5 py-2.5 bg-brand-600 text-white rounded-lg text-sm hover:bg-brand-700 disabled:opacity-40">确认导入</button>
            </div>
        </div>
    </div>

    <script src="libs/js/xlsx.full.min.js"></script>
    <script src="data-bridge.js?v=20261016g"></script>
    <script>
        var CUSTOMERS = [];
        var CURRENT_ID = null;   // 抽屉当前用户
        var CURRENT_TAB = 'all'; // 用户类型 tab：all / enterprise / personal
        var STATUS_FILTER = '全部'; // 状态筛选（带数量角标）
        var DRAWER_TAB = 'credits'; // 抽屉内选项卡：credits 策能值记录 / orders 服务商城订单 / reports 报告存档 / followups 跟进记录与计划

        // 客户来源（与 H5 同口径）：平台注册 / 分享转化 = 有平台账号；销售录入 / 批量导入 = 仅外链触达
        var SOURCE_COLORS = { '平台注册': 'bg-blue-50 text-blue-700', '销售录入': 'bg-orange-50 text-orange-700', '批量导入': 'bg-gray-100 text-gray-600', '分享转化': 'bg-emerald-50 text-emerald-700' };
        function customerSource(u) { return u.source || '平台注册'; }
        function hasAccount(u) { var s = customerSource(u); return s === '平台注册' || s === '分享转化'; }

        var AVATAR_COLORS = ['bg-brand-100 text-brand-700', 'bg-blue-100 text-blue-700', 'bg-purple-100 text-purple-700', 'bg-orange-100 text-orange-700', 'bg-teal-100 text-teal-700', 'bg-pink-100 text-pink-700'];
        // 企业状态色
        var ENT_STATUS_COLORS = { '潜在客户': 'bg-blue-50 text-blue-700', '意向客户': 'bg-orange-50 text-orange-700', '成交客户': 'bg-emerald-50 text-emerald-700', '流失客户': 'bg-gray-100 text-gray-500' };
        // 个人状态色
        var PER_STATUS_COLORS = { '潜在用户': 'bg-blue-50 text-blue-700', '意向用户': 'bg-orange-50 text-orange-700', '活跃用户': 'bg-emerald-50 text-emerald-700', '沉睡用户': 'bg-gray-100 text-gray-500' };
        var FU_ICONS = { '电话沟通': ['fa-phone', 'bg-brand-100 text-brand-600'], '上门拜访': ['fa-map-marker', 'bg-blue-100 text-blue-600'], '邮件发送': ['fa-envelope', 'bg-orange-100 text-orange-600'], '微信沟通': ['fa-weixin', 'bg-green-100 text-green-600'] };
        function statusColor(u) {
            if (u.type === 'personal') return PER_STATUS_COLORS[u.status] || 'bg-gray-100 text-gray-500';
            return ENT_STATUS_COLORS[u.status] || 'bg-gray-100 text-gray-500';
        }

        function load() {
            CUSTOMERS = DataBridge.loadCustomers();
            // 迁移：旧数据无 type 字段则补 enterprise，无 registerTime 则补默认值
            CUSTOMERS.forEach(function(u) {
                if (!u.type) u.type = 'enterprise';
                if (!u.registerTime) u.registerTime = '';
                if (!u.source) u.source = '平台注册';
                if (u.credits == null) u.credits = 0;
                if (!Array.isArray(u.creditHistory)) u.creditHistory = [];
            });
            renderTable();
        }

        // ===== 工具 =====
        function esc(s) {
            return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        function getCustomer(id) {
            for (var i = 0; i < CUSTOMERS.length; i++) if (CUSTOMERS[i].id === id) return CUSTOMERS[i];
            return null;
        }
        function nextId() {
            var max = 0;
            CUSTOMERS.forEach(function(c) { var n = parseInt(String(c.id).replace(/\D/g, '')) || 0; if (n > max) max = n; });
            return 'U' + String(max + 1).padStart(3, '0');
        }

        function lastFollowup(u) {
            if (!u.followups || !u.followups.length) return null;
            var arr = u.followups.slice().sort(function(a, b) { return b.date.localeCompare(a.date); });
            return arr[0];
        }
        function lastContact(u) {
            var f = lastFollowup(u);
            return f ? f.date : '';
        }
        function nextPlan(u) {
            var today = new Date().toISOString().slice(0, 10);
            var plans = (u.followups || []).map(function(f) { return f.plan; }).filter(function(p) { return p && p >= today; });
            plans.sort();
            return plans.length ? plans[0] : '';
        }

        function filteredCustomers() {
            var kw = (document.getElementById('searchInput').value || '').trim().toLowerCase();

            return CUSTOMERS.filter(function(c) {

                if (kw) {
                    // 企业：搜 name/contact/phone；个人：搜 realName/phone/occupation
                    var hay = c.type === 'personal' ? (c.realName + ' ' + c.phone + ' ' + (c.occupation || '')) : (c.name + ' ' + (c.contact || '') + ' ' + (c.phone || ''));
                    if (hay.toLowerCase().indexOf(kw) === -1) return false;
                }
                if (ind) {
                    // 行业筛选只对企业生效
                    if (c.type === 'enterprise' && c.industry !== ind) return false;
                }
                if (src && customerSource(c) !== src) return false;
                if (STATUS_FILTER !== '全部' && c.status !== STATUS_FILTER) return false;
                return true;
            });
        }

        function downloadTemplate() {
            if (!window.XLSX) { alert('XLSX 库未加载'); return; }
            var headers = ['企业名称', '联系人', '手机号', '行业', '意向状态'];
            var samples = [
                ['天启信息技术有限公司', '周海燕', '13800005566', '软件信息', '意向客户'],
                ['瑞丰食品科技有限公司', '孙德旺', '13700009900', '食品加工', '潜在客户'],
                ['东方精密机械有限公司', '钱国强', '13500007788', '装备制造', '成交客户']
            ];
            var ws = XLSX.utils.aoa_to_sheet([headers].concat(samples));
            ws['!cols'] = [{ wch: 24 }, { wch: 10 }, { wch: 14 }, { wch: 12 }, { wch: 14 }];
            var wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, '客户名单');
            XLSX.writeFile(wb, '客户导入模板.xlsx');
        }
        function parseImportFile(ev) {
            var f = (ev.target.files && ev.target.files[0]) || null;
            if (!f) return;
            if (!/\.(xlsx|xls|csv)$/i.test(f.name)) { alert('仅支持 .xlsx / .xls / .csv 文件'); return; }
            if (!window.XLSX) { alert('XLSX 库未加载'); return; }
            var reader = new FileReader();
            reader.onload = function(e) {
                try {
                    var wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
                    var sheet = wb.Sheets[wb.SheetNames[0]];
                    var rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
                    var ALIAS = {
                        name: ['企业名称', '公司名称', '名称', 'name'],
                        contact: ['联系人', '对接人', 'contact'],
                        phone: ['手机号', '电话', '手机', 'phone', 'tel'],
                        industry: ['行业', '所属行业', 'industry'],
                        status: ['意向状态', '状态', '客户状态', 'stage', 'status']
                    };
                    function cell(row, key) {
                        for (var k in row) if (ALIAS[key].indexOf(String(k).trim()) >= 0) return String(row[k] || '').trim();
                        return '';
                    }
                    IMPORT_ROWS = [];
                    var dup = 0;
                    rows.forEach(function(row) {
                        var name = cell(row, 'name');
                        if (!name) return;
                        if (CUSTOMERS.some(function(c) { return c.type !== 'personal' && c.name === name; }) || IMPORT_ROWS.some(function(r) { return r.name === name; })) { dup++; return; }
                        var st = cell(row, 'status');
                        if (st !== '潜在客户' && st !== '意向客户' && st !== '成交客户') st = '潜在客户';
                        IMPORT_ROWS.push({ name: name, contact: cell(row, 'contact'), phone: cell(row, 'phone'), industry: cell(row, 'industry'), status: st });
                    });
                    document.getElementById('importPreview').innerHTML =
                        '<div class="border border-gray-100 rounded-lg p-3">' +
                            '<p class="text-sm text-gray-700 mb-2"><i class="fa fa-check-circle text-brand-600 mr-1"></i>已解析 <b>' + IMPORT_ROWS.length + '</b> 条有效记录' + (dup ? '，跳过重复 <b>' + dup + '</b> 条' : '') + '</p>' +
                            (IMPORT_ROWS.length ? '<div class="space-y-1 max-h-40 overflow-y-auto scrollbar-thin">' + IMPORT_ROWS.slice(0, 8).map(function(r) {
                                return '<p class="text-xs text-gray-500">' + esc(r.name) + ' · ' + esc(r.contact || '—') + ' · ' + esc(r.phone || '—') + ' · ' + esc(r.status) + '</p>';
                            }).join('') + (IMPORT_ROWS.length > 8 ? '<p class="text-xs text-gray-400">…共 ' + IMPORT_ROWS.length + ' 条</p>' : '') + '</div>' : '<p class="text-xs text-gray-400">文件内没有可导入的数据行</p>') +
                        '</div>';
                } catch (err) {
                    alert('解析失败：' + err.message);
                }
            };
            reader.readAsArrayBuffer(f);
        }
        function confirmImport() {
            if (!IMPORT_ROWS.length) { alert('没有可导入的数据'); return; }
            IMPORT_ROWS.forEach(function(r) {
                CUSTOMERS.push({
                    id: nextId(), type: 'enterprise', name: r.name, code: '', contact: r.contact,
                    phone: r.phone, industry: r.industry, region: '', employees: 0, revenue: 0, quals: [],
                    status: r.status, source: '批量导入', registerTime: '', credits: 0, creditHistory: [], followups: []
                });
            });
            persist();
            var n = IMPORT_ROWS.length;
            closeImport();
            CURRENT_TAB = 'all'; STATUS_FILTER = '全部';

            alert('已导入 ' + n + ' 条客户（来源：批量导入，仅外链触达）');
        }

                        ['研发费用占比', pf.rdRatio != null ? pf.rdRatio + '%' : '—'],
                        ['高新技术产品占比', pf.hiTechRatio != null ? pf.hiTechRatio + '%' : '—'],
                        ['有效知识产权', pf.ipCount != null ? pf.ipCount + ' 项' : '—'],
                        ['成立年限', pf.duration != null ? pf.duration + ' 年' : '—']
                    ];
                    html += '<div class="grid grid-cols-2 gap-3 text-sm">' + kv.map(function(x) {
                        return '<div><span class="text-gray-500 text-xs">' + x[0] + '：</span><span class="text-gray-700">' + x[1] + '</span></div>';
                    }).join('') + '</div>';
                    html += '<div class="mt-3 pt-3 border-t border-gray-100 text-sm"><span class="text-gray-500 text-xs">已有资质：</span><span class="text-gray-700">' +
                        ((meta && meta.quals && meta.quals.length) ? esc(meta.quals.join('、')) : '—') + '</span></div>';
                } else {
                    html += '<p class="text-xs text-gray-400 leading-relaxed">该企业尚未在「科创测评」或「精准政策雷达」提交数据，暂无档案字段。销售端补录后自动同步至客户档案。</p>';
                }
                html += '</div>';
            }

            var orders = [];
            try {
                orders = (DataBridge.loadServiceOrders() || []).filter(function(o) {
                    return isPer ? (o.contact === (u.realName || '')) : (o.company === (u.name || ''));
                });
            } catch (e) {}
            var O_ST = { unpaid: ['待付款', 'bg-red-50 text-red-600'], serving: ['服务中', 'bg-blue-50 text-blue-600'], done: ['已完成', 'bg-emerald-50 text-emerald-600'], reviewed: ['已评价', 'bg-slate-100 text-slate-500'] };

            // 策能值获取记录（按客户维度记录，倒序）
            var creditHist = (u.creditHistory || []).slice().sort(function(a, b) { return String(b.date).localeCompare(String(a.date)); });

            // 报告存档（与智能报告 / H5 共用一份；每个客户仅保留最新一份）
            var reports = [];
            try {
                var allReports = (DataBridge.loadSalesReports ? DataBridge.loadSalesReports() : []) || [];
                reports = allReports.filter(function(r) {
                    return String(r.customerName || '') === String(isPer ? (u.realName || '') : (u.name || ''));
                }).sort(function(a, b) { return String(b.createdAt || b.createTime || '').localeCompare(String(a.createdAt || a.createTime || '')); });
                reports = reports.slice(0, 1);
            } catch (e) { reports = []; }

            // 选项卡：策能值记录 / 服务商城订单 / 报告存档 / 跟进记录与计划（默认展示上次停留的面板）
            var tabBtn = 'px-3 py-1.5 rounded-lg text-xs font-bold transition-colors ';
            var tabOn = 'bg-brand-600 text-white';
            var tabOff = 'bg-gray-100 text-gray-600';
            html += '<div class="flex gap-2 mb-3 flex-wrap">' +
                '<button onclick="switchDrawerTab(\'credits\')" class="' + tabBtn + (DRAWER_TAB === 'credits' ? tabOn : tabOff) + '"><i class="fa fa-bolt mr-1"></i>策能值记录 (' + creditHist.length + ')</button>' +
                '<button onclick="switchDrawerTab(\'orders\')" class="' + tabBtn + (DRAWER_TAB === 'orders' ? tabOn : tabOff) + '"><i class="fa fa-shopping-bag mr-1"></i>服务商城订单 (' + orders.length + ')</button>' +
                '<button onclick="switchDrawerTab(\'reports\')" class="' + tabBtn + (DRAWER_TAB === 'reports' ? tabOn : tabOff) + '"><i class="fa fa-file-text-o mr-1"></i>报告存档 (' + reports.length + ')</button>' +
                '<button onclick="switchDrawerTab(\'followups\')" class="' + tabBtn + (DRAWER_TAB === 'followups' ? tabOn : tabOff) + '"><i class="fa fa-comments mr-1"></i>跟进记录与计划 (' + (u.followups || []).length + ')</button>' +
                '</div>';

            // 面板一：策能值记录
            html += '<div id="drawerPanelCredits"' + (DRAWER_TAB === 'credits' ? '' : ' class="hidden"') + '>';
            if (creditHist.length) {
                html += '<div class="space-y-1.5">' + creditHist.map(function(h) {
                    return '<div class="flex items-center justify-between bg-white border border-gray-100 rounded-lg px-3 py-2">' +
                        '<div class="flex items-center gap-2 min-w-0">' +
                        '<span class="text-xs text-gray-400 flex-shrink-0">' + esc(h.date) + '</span>' +
                        '<span class="text-xs text-gray-700 truncate">' + esc(h.item) + '</span></div>' +
                        '<span class="text-xs font-bold text-emerald-600 flex-shrink-0">+' + (Number(h.amount) || 0) + '</span></div>';
                }).join('') + '</div>';
            } else {
                html += '<div class="border border-dashed border-gray-200 rounded-lg p-3 text-center bg-white"><p class="text-xs text-gray-400">暂无策能值获取记录</p></div>';
            }
            html += '</div>';

            // 面板二：服务商城订单
            html += '<div id="drawerPanelOrders"' + (DRAWER_TAB === 'orders' ? '' : ' class="hidden"') + '>';
            html += '<div class="mb-5"><div class="flex items-center justify-between mb-3">' +
                '<h5 class="text-sm font-semibold text-gray-700"><i class="fa fa-shopping-bag text-orange-500 mr-1"></i>服务商城订单</h5>' +
                (orders.length ? '<span class="text-[10px] text-gray-400">累计消费 ¥' + orders.reduce(function(s, o) { return s + (Number(o.amount) || 0); }, 0).toLocaleString() + '</span>' : '') +
                '</div>';
            if (orders.length) {
                html += '<div class="space-y-2">' + orders.map(function(o) {
                    var st = O_ST[o.status] || O_ST.unpaid;
                    return '<div class="flex items-center gap-3 border border-gray-100 rounded-lg px-3 py-2.5 hover:border-orange-200 transition-colors">' +
                        '<div class="w-8 h-8 rounded-lg bg-orange-50 flex items-center justify-center flex-shrink-0"><i class="fa ' + esc(o.icon || 'fa-file-text-o') + ' text-orange-500 text-sm"></i></div>' +
                        '<div class="flex-1 min-w-0"><p class="text-sm font-medium text-gray-700 truncate">' + esc(o.svcName) + '</p>' +
                        '<p class="text-[10px] text-gray-400 mt-0.5">' + esc(o.createTime) + ' · ' + esc(o.provider || '') + '</p></div>' +
                        '<div class="text-right flex-shrink-0"><p class="text-sm font-bold text-gray-800">¥' + (Number(o.amount) || 0).toLocaleString() + '</p>' +
                        '<span class="text-[10px] px-1.5 py-0.5 rounded ' + st[1] + '">' + st[0] + '</span></div></div>';
                }).join('') + '</div>';
            } else {
                html += '<div class="border border-dashed border-gray-200 rounded-lg p-3 text-center"><p class="text-xs text-gray-400">暂无订单 · 客户尚未在服务商城下单</p></div>';
            }
            html += '</div>';
            html += '</div>';   // 面板二结束

            // 面板三：报告存档（一个客户仅保留最新一份）
            html += '<div id="drawerPanelReports"' + (DRAWER_TAB === 'reports' ? '' : ' class="hidden"') + '>';
            if (reports.length) {
                var r = reports[0];
                html += '<div class="border border-gray-100 rounded-lg p-4">' +
                    '<div class="flex items-center justify-between mb-2">' +
                        '<p class="text-sm font-semibold text-gray-800">' + esc(r.title || '企业分析报告') + '</p>' +
                        '<span class="px-2 py-0.5 bg-blue-50 text-blue-700 rounded text-xs">' + esc(r.type || '政策匹配') + '</span></div>' +
                    '<p class="text-xs text-gray-400 mb-3">生成于 ' + esc(r.createdAt || r.createTime || '—') + ' · 仅保留最新一份</p>' +
                    '<div class="flex gap-2">' +
                        '<button onclick="openReport(\'' + r.id + '\')" class="flex-1 py-2 bg-brand-600 text-white rounded-lg text-xs font-bold hover:bg-brand-700"><i class="fa fa-eye mr-1"></i>查看报告</button>' +
                        '<button onclick="goReport()" class="px-3 py-2 border border-brand-600 text-brand-600 rounded-lg text-xs hover:bg-brand-50"><i class="fa fa-plus mr-1"></i>重新生成</button>' +
                    '</div></div>';
            } else {
                html += '<div class="border border-dashed border-gray-200 rounded-lg p-3 text-center bg-white"><p class="text-xs text-gray-400">暂无报告存档 · 在「智能报告」生成后自动归档到该客户</p></div>';
            }
            html += '</div>';

            // 面板四：跟进记录与计划
            html += '<div id="drawerPanelFollowups"' + (DRAWER_TAB === 'followups' ? '' : ' class="hidden"') + '>';
            html += '<div><div class="flex items-center justify-between mb-3">' +
                '<h5 class="text-sm font-semibold text-gray-700"><i class="fa fa-comments ' + (isPer ? 'text-blue-600' : 'text-brand-600') + ' mr-1"></i>跟进记录与计划</h5>' +
                '<button onclick="openFollowupModal()" class="text-xs ' + (isPer ? 'text-blue-600 hover:text-blue-700' : 'text-brand-600 hover:text-brand-700') + '"><i class="fa fa-plus mr-0.5"></i>添加</button></div>' +
                '<div class="space-y-4">' +
                ((u.followups || []).slice().sort(function(a, b) { return b.date.localeCompare(a.date); }).map(function(f) {
                    var ic = FU_ICONS[f.type] || ['fa-comment', 'bg-gray-100 text-gray-600'];
                    return '<div class="flex space-x-3"><div class="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 ' + ic[1] + '"><i class="fa ' + ic[0] + ' text-xs"></i></div>' +
                        '<div class="flex-1"><div class="flex items-center justify-between">' +
                        '<p class="text-sm font-medium text-gray-700">' + esc(f.type) + '</p>' +
                        '<span class="text-xs text-gray-400">' + esc(f.date) + '</span></div>' +
                        '<p class="text-xs text-gray-500 mt-1">' + esc(f.content) + '</p>' +
                        (f.plan ? '<p class="text-[10px] text-orange-600 mt-1"><i class="fa fa-calendar-check-o mr-1"></i>跟进计划：' + esc(f.plan) + '</p>' : '') +
                        '</div></div>';
                }).join('') || '<p class="text-xs text-gray-400 py-2">暂无跟进记录</p>') +
                '</div></div>';
            html += '</div>';   // 面板三结束

            document.getElementById('drawerBody').innerHTML = html;
        }

        // 打开报告存档 / 跳转智能报告
        function openReport(rid) {
            var url = 'report-viewer.html?id=' + rid;
            if (parent && parent.window && parent.window.switchPage) parent.window.switchPage(url, null);
            else window.location.href = url;
        }
        function goReport() {
            if (parent && parent.window && parent.window.switchPage) parent.window.switchPage('sales-report.html', null);
            else window.location.href = 'sales-report.html';
        }

        // 抽屉内选项卡切换（重绘抽屉即可同步按钮高亮与面板显隐）
        function switchDrawerTab(tab) {
            if (!CURRENT_ID) return;
            DRAWER_TAB = tab;
            var c = getCustomer(CURRENT_ID);
            if (c) renderDrawer(c);
        }

        // ===== 新增跟进 =====
        function openFollowupModal() {
            if (!CURRENT_ID) return;
            document.getElementById('followupModalTitle').textContent = '新增跟进 · ' + (getCustomer(CURRENT_ID).name || getCustomer(CURRENT_ID).realName || '');
            document.getElementById('fuType').value = '电话沟通';
            document.getElementById('fuDate').value = new Date().toISOString().slice(0, 10);
            document.getElementById('fuContent').value = '';
            document.getElementById('fuPlan').value = '';
            showOverlay('followupModalOverlay');
        }
        function closeFollowupModal() { hideOverlay('followupModalOverlay'); }
        function saveFollowup() {
            var c = getCustomer(CURRENT_ID);
            if (!c) return;
            var content = document.getElementById('fuContent').value.trim();
            if (!content) { alert('请填写沟通纪要'); return; }
            if (!c.followups) c.followups = [];
            c.followups.unshift({
                type: document.getElementById('fuType').value,
                date: document.getElementById('fuDate').value || new Date().toISOString().slice(0, 10),
                content: content,
                plan: document.getElementById('fuPlan').value
            });
            persist();
            closeFollowupModal();
            renderDrawer(c);
            renderTable();
        }

        // ===== 弹窗通用 =====
        function showOverlay(id) {
            var el = document.getElementById(id);
            el.classList.remove('hidden');
            el.classList.add('flex');
        }
        function hideOverlay(id) {
            var el = document.getElementById(id);
            el.classList.add('hidden');
            el.classList.remove('flex');
        }

        document.addEventListener('DOMContentLoaded', load);
    </script>
</body>
</html>
