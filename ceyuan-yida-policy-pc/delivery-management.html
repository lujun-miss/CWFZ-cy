<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交付管理 - 策源易答运营平台</title>
    <link href="libs/css/tailwind.css" rel="stylesheet">
    <link href="libs/css/font-awesome.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f7f8fa; }
        .progress-bar { transition: width 0.6s ease; }
        .scroll-hide::-webkit-scrollbar { display: none; }
        .scroll-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .timeline-dot { transition: all 0.2s; }
        .modal-mask { background: rgba(15,23,42,0.5); backdrop-filter: blur(2px); }
    </style>
</head>
<body class="text-slate-800">

    <div class="p-8">
        <!-- 页面标题 -->
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-2xl font-black text-slate-800 flex items-center">
                    <i class="fa fa-truck text-orange-500 mr-3"></i>交付管理
                </h1>
                <p class="text-sm text-slate-400 mt-1">运营管理平台 / 服务交易运营 / 交付管理</p>
            </div>
            <button onclick="render()" class="px-4 py-2.5 bg-slate-50 hover:bg-orange-50 text-slate-600 hover:text-orange-600 rounded-xl text-sm font-bold transition-all flex items-center">
                <i class="fa fa-refresh mr-1.5"></i>刷新
            </button>
        </div>

        <!-- 说明条 -->
        <div class="mb-4 px-4 py-2.5 bg-blue-50/60 border border-blue-100 rounded-xl">
            <p class="text-xs text-slate-600 leading-relaxed">
                <span class="font-semibold text-slate-700">定位：</span>从订单接单后进入交付阶段，跟踪服务进度、管理交付物（成果文件）、联动销售中心同步进度、企业平台查看成果。
                <span class="font-semibold text-slate-700 ml-1">联动：</span>进度更新 → 企业侧「我的订单」进度条同步变化；成果交付 → 企业平台可查看下载。
            </p>
        </div>

        <!-- 搜索 + 列表 -->
        <div class="bg-white rounded-[20px] border border-slate-100 shadow-sm overflow-hidden">
            <div class="p-5 border-b border-slate-100 flex flex-wrap items-center gap-3">
                <div class="flex items-center space-x-3">
                    <div class="w-1 h-6 bg-gradient-to-b from-orange-400 to-orange-600 rounded-full"></div>
                    <h2 class="text-lg font-bold">交付列表</h2>
                    <span class="text-xs text-slate-400">共 <span id="dCount" class="text-orange-600 font-bold">0</span> 项交付</span>
                </div>
                <div class="flex-1"></div>
                <div class="relative">
                    <i class="fa fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                    <input id="q" oninput="render()" type="text" placeholder="搜索订单号、服务、企业..." class="pl-9 pr-4 py-2 bg-slate-50 rounded-xl text-sm border border-transparent focus:border-orange-300 focus:bg-white focus:outline-none w-56 transition-all">
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="bg-slate-50 text-xs text-slate-500 uppercase">
                            <th class="px-6 py-4 text-left font-semibold">订单号</th>
                            <th class="px-6 py-4 text-left font-semibold">服务名称</th>
                            <th class="px-6 py-4 text-left font-semibold">企业名称</th>
                            <th class="px-6 py-4 text-left font-semibold">当前里程碑</th>
                            <th class="px-6 py-4 text-left font-semibold">进度</th>
                            <th class="px-6 py-4 text-left font-semibold">交付物</th>
                            <th class="px-6 py-4 text-center font-semibold">操作</th>
                        </tr>
                    </thead>
                    <tbody id="tbody" class="divide-y divide-slate-50"></tbody>
                </table>
            </div>
            <div class="px-5 py-4 border-t border-slate-100 flex justify-between text-sm">
                <span class="text-slate-500">共 <span id="dCount2" class="font-bold text-slate-700">0</span> 项</span>
                <span class="text-xs text-slate-400"><i class="fa fa-check-circle text-emerald-500 mr-1"></i>进度联动企业侧「我的订单」、成果联动企业平台</span>
            </div>
        </div>
    </div>

    <!-- 交付详情弹窗 -->
    <div id="detailModal" class="fixed inset-0 modal-mask z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-4xl w-full max-h-[90vh] overflow-y-auto scroll-hide">
            <div class="sticky top-0 bg-white border-b border-slate-100 px-8 py-5 flex items-center justify-between z-10">
                <h3 class="text-lg font-bold flex items-center space-x-2">
                    <i class="fa fa-truck text-orange-500"></i>
                    <span>交付详情</span>
                </h3>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-500">
                    <i class="fa fa-times"></i>
                </button>
            </div>
            <div id="detailBody" class="p-8 space-y-8"></div>
        </div>
    </div>

    <!-- 上传交付物弹窗 -->
    <div id="uploadModal" class="fixed inset-0 modal-mask z-[55] hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
                <h3 class="text-base font-bold"><i class="fa fa-upload text-orange-500 mr-2"></i>上传交付物</h3>
                <button onclick="closeUpload()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-500"><i class="fa fa-times"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <p class="text-xs font-bold text-slate-600 mb-1.5">里程碑</p>
                    <p id="uploadMilestone" class="text-sm text-slate-700 bg-slate-50 rounded-xl px-4 py-2.5">—</p>
                </div>
                <div>
                    <p class="text-xs font-bold text-slate-600 mb-1.5">交付物名称 <span class="text-rose-500">*</span></p>
                    <input id="uploadName" type="text" placeholder="如：高企申报方案.pptx" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-400 focus:bg-white">
                </div>
                <div>
                    <p class="text-xs font-bold text-slate-600 mb-1.5">文件类型</p>
                    <select id="uploadType" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-400">
                        <option value="pdf">PDF 文档 (.pdf)</option>
                        <option value="word">Word 文档 (.docx)</option>
                        <option value="excel">Excel 表格 (.xlsx)</option>
                        <option value="ppt">PPT 演示 (.pptx)</option>
                        <option value="other">其他文件</option>
                    </select>
                </div>
            </div>
            <div class="px-6 py-4 border-t border-slate-100 flex justify-end space-x-2 bg-slate-50/60">
                <button onclick="closeUpload()" class="px-5 py-2.5 bg-white border border-slate-200 text-slate-600 rounded-xl text-sm font-bold">取消</button>
                <button onclick="confirmUpload()" class="px-6 py-2.5 bg-gradient-to-r from-orange-500 to-orange-600 text-white rounded-xl text-sm font-bold">确认上传</button>
            </div>
        </div>
    </div>

    <!-- 添加沟通记录弹窗 -->
    <div id="noteModal" class="fixed inset-0 modal-mask z-[55] hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
                <h3 class="text-base font-bold"><i class="fa fa-comment-o text-orange-500 mr-2"></i>添加交付记录</h3>
                <button onclick="closeNote()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-500"><i class="fa fa-times"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <p class="text-xs font-bold text-slate-600 mb-1.5">记录内容 <span class="text-rose-500">*</span></p>
                    <textarea id="noteText" rows="4" placeholder="如：已完成需求沟通，方案制定中，预计1月10日完成方案初稿。" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-400 focus:bg-white"></textarea>
                </div>
            </div>
            <div class="px-6 py-4 border-t border-slate-100 flex justify-end space-x-2 bg-slate-50/60">
                <button onclick="closeNote()" class="px-5 py-2.5 bg-white border border-slate-200 text-slate-600 rounded-xl text-sm font-bold">取消</button>
                <button onclick="confirmNote()" class="px-6 py-2.5 bg-gradient-to-r from-orange-500 to-orange-600 text-white rounded-xl text-sm font-bold">发布记录</button>
            </div>
        </div>
    </div>

    <script src="data-bridge.js"></script>
    <script>
        let ORDERS = [];
        let detailId = null;
        let uploadMsIdx = null;
        let noteMsIdx = null;

        // 5 个交付里程碑（与订单管理的 STEPS 一致，但这里关注"交付物"）
        const MILESTONES = [
            { name: '需求沟通', deliv: '需求确认书' },
            { name: '方案制定', deliv: '服务方案书' },
            { name: '材料准备', deliv: '申报材料/审计底稿' },
            { name: '审核提交', deliv: '受理回执/审查意见' },
            { name: '完成交付', deliv: '最终成果报告' }
        ];

        // 每个里程碑的交付物种子（演示用）
        const SEED_DELIVERABLES = {
            0: [{ name: '需求确认书.pdf', type: 'pdf', date: '2026-09-01' }],
            1: [{ name: '高企申报方案.pptx', type: 'ppt', date: '2026-09-02' }],
            2: [], // 进行中，待上传
            3: [],
            4: []
        };
        const SEED_NOTES = [
            { who: '李专家（运营）', avatar: '李', color: 'blue', time: '2026-09-01 14:25', text: '已完成需求沟通，企业知识产权情况已确认，进入方案制定阶段。' },
            { who: '张经理（企业）', avatar: '张', color: 'orange', time: '2026-09-01 15:30', text: '收到，方案中知识产权布局部分请重点关注，我们专利数量较少。' }
        ];

        // 运行时交付物与记录（按订单 id 存储）
        let deliverables = {}; // { orderId: [ {msIdx, name, type, date} ] }
        let notes = {};        // { orderId: [ {who, avatar, color, time, text} ] }

        function fmtMoney(n) { return (Number(n) || 0).toLocaleString('zh-CN'); }

        function load() {
            ORDERS = (typeof DataBridge !== 'undefined') ? DataBridge.loadServiceOrders() : [];
            // 只看已付款的（serving + done + reviewed），unpaid 不进交付
            ORDERS = ORDERS.filter(o => o.status !== 'unpaid');
        }

        function curMsIdx(o) {
            return Math.min(MILESTONES.length - 1, Math.floor((o.progress || 0) / 20));
        }

        function render() {
            const q = document.getElementById('q').value.trim().toLowerCase();
            const list = ORDERS.filter(o => {
                if (q && !(o.id.toLowerCase().includes(q) || o.svcName.toLowerCase().includes(q) || o.company.toLowerCase().includes(q))) return false;
                return true;
            });
            document.getElementById('dCount').textContent = list.length;
            document.getElementById('dCount2').textContent = list.length;

            const tb = document.getElementById('tbody');
            if (list.length === 0) {
                tb.innerHTML = `<tr><td colspan="7" class="px-6 py-12 text-center text-slate-400"><i class="fa fa-inbox text-2xl block mb-2"></i>暂无交付任务（待付款订单接单后进入交付）</td></tr>`;
                return;
            }
            tb.innerHTML = list.map(o => {
                const msIdx = curMsIdx(o);
                const ms = MILESTONES[msIdx];
                const delivs = (deliverables[o.id] || []).filter(d => d.msIdx === msIdx);
                const delivBadge = delivs.length > 0
                    ? `<span class="text-xs text-emerald-600 font-bold"><i class="fa fa-paperclip mr-1"></i>${delivs.length} 份</span>`
                    : `<span class="text-xs text-slate-400">待上传</span>`;
                const isDone = o.status === 'done' || o.status === 'reviewed';
                return `
                <tr class="hover:bg-slate-50 transition-colors">
                    <td class="px-6 py-4"><span class="text-xs font-mono text-slate-500">${o.id}</span></td>
                    <td class="px-6 py-4">
                        <div class="flex items-center space-x-2">
                            <div class="w-8 h-8 bg-orange-50 text-orange-600 rounded-lg flex items-center justify-center"><i class="fa ${o.icon || 'fa-cube'} text-xs"></i></div>
                            <span class="text-sm font-medium">${o.svcName}</span>
                        </div>
                    </td>
                    <td class="px-6 py-4 text-sm text-slate-600">
                        <div>${o.company}</div>
                        <div class="text-xs text-slate-400">${o.contact}</div>
                    </td>
                    <td class="px-6 py-4">
                        <span class="text-xs font-medium ${isDone ? 'text-emerald-600' : 'text-orange-600'}">${isDone ? '✓ ' : ''}${ms.name}</span>
                        <span class="text-[10px] text-slate-400 block">第 ${msIdx + 1}/${MILESTONES.length} 步</span>
                    </td>
                    <td class="px-6 py-4">
                        <div class="w-28">
                            <div class="flex items-center justify-between text-[10px] mb-1">
                                <span class="text-slate-400">${isDone ? '已完成' : '进行中'}</span>
                                <span class="text-orange-600 font-bold">${o.progress}%</span>
                            </div>
                            <div class="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden">
                                <div class="progress-bar h-full ${isDone ? 'bg-emerald-500' : 'bg-orange-500'}" style="width: ${o.progress}%"></div>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-4">${delivBadge}</td>
                    <td class="px-6 py-4">
                        <div class="flex items-center justify-center">
                            <button onclick="openDetail('${o.id}')" class="px-3 py-1.5 bg-slate-50 hover:bg-orange-50 hover:text-orange-600 text-slate-600 text-xs rounded-lg transition-all">交付详情</button>
                        </div>
                    </td>
                </tr>`;
            }).join('');
        }

        // ===== 详情弹窗 =====
        function openDetail(id) {
            const o = ORDERS.find(x => x.id === id);
            if (!o) return;
            detailId = id;
            // 初始化该订单的交付物和记录
            if (!deliverables[id]) {
                deliverables[id] = [];
                // 种子：已完成的里程碑自动带交付物
                const msIdx = curMsIdx(o);
                for (let i = 0; i <= msIdx; i++) {
                    const seed = SEED_DELIVERABLES[i] || [];
                    seed.forEach(d => deliverables[id].push({ msIdx: i, name: d.name, type: d.type, date: d.date }));
                }
            }
            if (!notes[id]) notes[id] = [...SEED_NOTES];

            const msIdx = curMsIdx(o);
            const isDone = o.status === 'done' || o.status === 'reviewed';

            // 里程碑时间轴
            const stepsHtml = MILESTONES.map((m, i) => {
                const done = isDone || i < msIdx;
                const cur = !isDone && i === msIdx;
                const delivs = (deliverables[id] || []).filter(d => d.msIdx === i);
                const dotCls = done ? 'bg-emerald-500' : cur ? 'bg-orange-500 animate-pulse' : 'bg-slate-200';
                const cardCls = done ? 'bg-emerald-50 border-emerald-100' : cur ? 'bg-orange-50 border-orange-100' : 'bg-slate-50 border-slate-100';
                const badge = done ? '<span class="text-[10px] bg-emerald-500 text-white px-2 py-0.5 rounded-full">已完成</span>' : cur ? '<span class="text-[10px] bg-orange-500 text-white px-2 py-0.5 rounded-full">进行中</span>' : '<span class="text-[10px] bg-slate-200 text-slate-500 px-2 py-0.5 rounded-full">待开始</span>';

                let delivHtml = '';
                if (delivs.length > 0) {
                    delivHtml = delivs.map(d => {
                        const icon = d.type === 'pdf' ? 'fa-file-pdf-o text-red-400' : d.type === 'word' ? 'fa-file-word-o text-blue-400' : d.type === 'excel' ? 'fa-file-excel-o text-green-500' : d.type === 'ppt' ? 'fa-file-powerpoint-o text-orange-400' : 'fa-file-o text-slate-400';
                        return `<div class="flex items-center space-x-2 bg-white rounded-lg px-3 py-2 mb-1">
                            <i class="fa ${icon}"></i>
                            <span class="text-xs flex-1">${d.name}</span>
                            <span class="text-[10px] text-slate-400">${d.date}</span>
                        </div>`;
                    }).join('');
                } else if (cur) {
                    delivHtml = `<div class="text-[10px] text-slate-400 italic">待上传交付物</div>`;
                }

                const actions = cur ? `
                    <button onclick="openUpload(${i})" class="text-[10px] text-orange-600 hover:underline ml-2"><i class="fa fa-upload mr-0.5"></i>上传交付物</button>
                    <button onclick="openNote(${i})" class="text-[10px] text-blue-600 hover:underline ml-2"><i class="fa fa-comment-o mr-0.5"></i>添加记录</button>
                ` : '';

                return `<div class="relative mb-5">
                    <div class="timeline-dot absolute -left-6 top-0 w-4 h-4 ${dotCls} rounded-full border-4 border-white shadow"></div>
                    <div class="ml-4 p-4 ${cardCls} rounded-xl border">
                        <div class="flex items-center justify-between mb-2">
                            <h4 class="font-bold text-sm ${done || cur ? '' : 'text-slate-500'}">${m.name}</h4>
                            ${badge}
                        </div>
                        <p class="text-[10px] text-slate-400 mb-2">交付物：${m.deliv}</p>
                        ${delivHtml}
                        ${actions}
                    </div>
                </div>`;
            }).join('');

            // 沟通记录
            const notesHtml = (notes[id] || []).map(n => `
                <div class="p-4 bg-slate-50 rounded-2xl">
                    <div class="flex items-start space-x-3">
                        <div class="w-8 h-8 bg-${n.color}-500 text-white rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0">${n.avatar}</div>
                        <div class="flex-1">
                            <div class="flex items-center justify-between mb-1">
                                <span class="text-sm font-semibold">${n.who}</span>
                                <span class="text-[10px] text-slate-400">${n.time}</span>
                            </div>
                            <p class="text-xs text-slate-600">${n.text}</p>
                        </div>
                    </div>
                </div>
            `).join('');

            // 底部操作
            let acts = '';
            if (!isDone) {
                acts = `<button onclick="advanceProgress()" class="px-6 py-3 bg-gradient-to-r from-orange-500 to-orange-600 text-white rounded-2xl text-sm font-semibold hover:shadow-lg hover:shadow-orange-500/30 transition-all">
                    <i class="fa fa-arrow-up mr-1"></i>推进至下一里程碑
                </button>`;
            } else {
                acts = `<span class="text-sm text-emerald-600 font-bold"><i class="fa fa-check-circle mr-1"></i>所有里程碑已完成，交付闭环</span>`;
            }

            document.getElementById('detailBody').innerHTML = `
                <div class="flex items-center justify-between p-5 bg-gradient-to-r from-orange-50 to-orange-100 rounded-2xl">
                    <div class="flex items-center space-x-4">
                        <div class="w-12 h-12 bg-orange-500 text-white rounded-2xl flex items-center justify-center"><i class="fa ${o.icon || 'fa-cogs'} text-xl"></i></div>
                        <div>
                            <h4 class="font-bold text-base">${o.svcName}</h4>
                            <p class="text-xs text-slate-500 mt-1">订单号：${o.id} · ${o.company}</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-[10px] text-slate-500">总进度</p>
                        <p class="text-2xl font-black text-orange-600">${o.progress}%</p>
                    </div>
                </div>
                <div>
                    <h3 class="text-base font-bold mb-4 flex items-center space-x-2"><i class="fa fa-flag-o text-orange-500"></i><span>交付里程碑</span></h3>
                    <div class="relative pl-6">
                        <div class="absolute left-2 top-2 bottom-2 w-0.5 bg-slate-100"></div>
                        ${stepsHtml}
                    </div>
                </div>
                <div>
                    <h3 class="text-base font-bold mb-4 flex items-center space-x-2"><i class="fa fa-comments-o text-orange-500"></i><span>交付记录</span></h3>
                    <div class="space-y-3">${notesHtml}</div>
                </div>
                <div class="flex items-center justify-end space-x-3 pt-4 border-t border-slate-100">${acts}</div>
            `;
            const m = document.getElementById('detailModal');
            m.classList.remove('hidden'); m.classList.add('flex');
        }
        function closeModal() {
            const m = document.getElementById('detailModal');
            m.classList.add('hidden'); m.classList.remove('flex');
            detailId = null;
        }

        // ===== 推进进度（联动订单管理 + 企业侧我的订单） =====
        function advanceProgress() {
            const o = ORDERS.find(x => x.id === detailId);
            if (!o) return;
            o.progress = Math.min(100, o.progress + 20);
            if (o.progress >= 100) o.status = 'done';
            persist();
            // 刷新详情弹窗
            openDetail(detailId);
            render();
            if (o.status === 'done') alert('所有里程碑已完成！订单状态变更为「已完成」，企业侧可查看并评价。');
        }

        // ===== 上传交付物 =====
        function openUpload(msIdx) {
            uploadMsIdx = msIdx;
            document.getElementById('uploadMilestone').textContent = MILESTONES[msIdx].name + ' · ' + MILESTONES[msIdx].deliv;
            document.getElementById('uploadName').value = '';
            const m = document.getElementById('uploadModal');
            m.classList.remove('hidden'); m.classList.add('flex');
        }
        function closeUpload() {
            const m = document.getElementById('uploadModal');
            m.classList.add('hidden'); m.classList.remove('flex');
            uploadMsIdx = null;
        }
        function confirmUpload() {
            const name = document.getElementById('uploadName').value.trim();
            if (!name) { alert('请填写交付物名称'); return; }
            const type = document.getElementById('uploadType').value;
            const today = new Date().toISOString().slice(0, 10);
            if (!deliverables[detailId]) deliverables[detailId] = [];
            deliverables[detailId].push({ msIdx: uploadMsIdx, name, type, date: today });
            closeUpload();
            openDetail(detailId); // 刷新详情
            render(); // 刷新列表交付物计数
        }

        // ===== 添加交付记录 =====
        function openNote(msIdx) {
            noteMsIdx = msIdx;
            document.getElementById('noteText').value = '';
            const m = document.getElementById('noteModal');
            m.classList.remove('hidden'); m.classList.add('flex');
        }
        function closeNote() {
            const m = document.getElementById('noteModal');
            m.classList.add('hidden'); m.classList.remove('flex');
            noteMsIdx = null;
        }
        function confirmNote() {
            const text = document.getElementById('noteText').value.trim();
            if (!text) { alert('请填写记录内容'); return; }
            const now = new Date();
            const pad = n => String(n).padStart(2, '0');
            const time = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes());
            if (!notes[detailId]) notes[detailId] = [];
            notes[detailId].push({ who: '运营管理员', avatar: '运', color: 'orange', time, text });
            closeNote();
            openDetail(detailId);
        }

        function persist() {
            if (typeof DataBridge !== 'undefined') DataBridge.saveServiceOrders(ORDERS);
        }

        // 初始化
        load();
        render();
    </script>
</body>
</html>
