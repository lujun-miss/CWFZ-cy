<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务订单监控 - 策源易答运营平台</title>
    <link href="libs/css/tailwind.css" rel="stylesheet">
    <link href="libs/css/font-awesome.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f7f8fa; }
        .scroll-hide::-webkit-scrollbar { display: none; }
        .scroll-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .modal-mask { background: rgba(15,23,42,0.5); backdrop-filter: blur(2px); }
    </style>
</head>
<body class="text-slate-800">

    <div class="p-8">
        <!-- 标题 -->
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-2xl font-black flex items-center"><i class="fa fa-eye text-orange-500 mr-3"></i>服务订单监控</h1>
                <p class="text-sm text-slate-400 mt-1">运营管理平台 / 服务交易运营 / 服务订单监控</p>
            </div>
            <button onclick="render()" class="px-4 py-2.5 bg-slate-50 hover:bg-orange-50 text-slate-600 hover:text-orange-600 rounded-xl text-sm font-bold transition-all flex items-center">
                <i class="fa fa-refresh mr-1.5"></i>刷新
            </button>
        </div>

        <!-- 说明条 -->
        <div class="mb-4 px-4 py-2.5 bg-blue-50/60 border border-blue-100 rounded-xl">
            <p class="text-xs text-slate-600 leading-relaxed">
                <span class="font-semibold text-slate-700">核心功能：</span>监控交付进度与质量 · 处理结算。
                <span class="font-semibold text-slate-700 ml-1">数据输出：</span>服务交付时效与满意度报表、财务对账依据。
            </p>
        </div>

        <!-- KPI 汇总 -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-4 text-center">
                <p class="text-xs text-slate-500 mb-1">订单总数</p>
                <p class="text-2xl font-bold text-slate-800" id="kTotal">0</p>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-4 text-center">
                <p class="text-xs text-slate-500 mb-1">服务中</p>
                <p class="text-2xl font-bold text-blue-600" id="kServing">0</p>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-4 text-center">
                <p class="text-xs text-slate-500 mb-1">平均交付时长</p>
                <p class="text-2xl font-bold text-slate-800" id="kAvgDays">0<span class="text-sm font-normal text-slate-400">天</span></p>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-4 text-center">
                <p class="text-xs text-slate-500 mb-1">满意度</p>
                <p class="text-2xl font-bold text-emerald-600" id="kSat">0<span class="text-sm font-normal text-slate-400">%</span></p>
            </div>
        </div>

        <!-- 订单列表 -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between flex-wrap gap-3">
                <div class="flex items-center space-x-3">
                    <div class="w-1 h-6 bg-gradient-to-b from-orange-400 to-orange-600 rounded-full"></div>
                    <h2 class="font-bold text-slate-800">服务订单监管</h2>
                    <span class="text-xs text-slate-400">共 <span id="orderCount" class="text-orange-600 font-bold">0</span> 笔</span>
                </div>
                <div class="flex items-center space-x-2">
                    <input id="q" oninput="render()" type="text" placeholder="搜索订单号、服务、企业..." class="px-3 py-1.5 border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-1 focus:ring-orange-500 w-52">
                    <select id="fStatus" onchange="render()" class="px-3 py-1.5 border border-slate-200 rounded-lg text-xs text-slate-600">
                        <option value="">全部状态</option>
                        <option value="unpaid">待付款</option>
                        <option value="serving">服务中</option>
                        <option value="done">已完成</option>
                        <option value="reviewed">已评价</option>
                    </select>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="bg-slate-50 text-xs text-slate-500 uppercase">
                            <th class="px-6 py-3 text-left font-semibold">订单号</th>
                            <th class="px-6 py-3 text-left font-semibold">服务名称</th>
                            <th class="px-6 py-3 text-left font-semibold">企业</th>
                            <th class="px-6 py-3 text-left font-semibold">金额</th>
                            <th class="px-6 py-3 text-left font-semibold">进度</th>
                            <th class="px-6 py-3 text-left font-semibold">状态</th>
                            <th class="px-6 py-3 text-left font-semibold">结算</th>
                            <th class="px-6 py-3 text-center font-semibold">操作</th>
                        </tr>
                    </thead>
                    <tbody id="tbody" class="divide-y divide-slate-50"></tbody>
                </table>
            </div>
            <div class="px-6 py-4 border-t border-slate-100 flex justify-between text-xs text-slate-400">
                <span>数据与企业侧服务商城、订单管理实时同步</span>
                <span><i class="fa fa-check-circle text-emerald-500 mr-1"></i>交付时效与满意度报表 · 财务对账依据</span>
            </div>
        </div>
    </div>

    <!-- 结算弹窗 -->
    <div id="settleModal" class="fixed inset-0 modal-mask z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-lg w-full overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
                <h3 class="text-base font-bold"><i class="fa fa-rmb text-orange-500 mr-2"></i>结算处理</h3>
                <button onclick="closeM('settleModal')" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-500"><i class="fa fa-times"></i></button>
            </div>
            <div id="settleBody" class="p-6 space-y-4"></div>
        </div>
    </div>

    <script src="data-bridge.js"></script>
    <script>
        const statusMap = {
            unpaid:   { text: '待付款', cls: 'bg-red-50 text-red-600', icon: 'fa-clock-o' },
            serving:  { text: '服务中', cls: 'bg-blue-50 text-blue-600', icon: 'fa-spinner' },
            done:     { text: '已完成', cls: 'bg-emerald-50 text-emerald-600', icon: 'fa-check-circle-o' },
            reviewed: { text: '已评价', cls: 'bg-slate-100 text-slate-500', icon: 'fa-star' }
        };
        let ORDERS = [];

        function fmtMoney(n) { return (Number(n) || 0).toLocaleString('zh-CN'); }

        function load() {
            ORDERS = (typeof DataBridge !== 'undefined') ? DataBridge.loadServiceOrders() : [];
        }

        function render() {
            const q = document.getElementById('q').value.trim().toLowerCase();
            const fStatus = document.getElementById('fStatus').value;
            let list = ORDERS.filter(o => {
                if (fStatus && o.status !== fStatus) return false;
                if (q && !(o.id.toLowerCase().includes(q) || o.svcName.toLowerCase().includes(q) || o.company.toLowerCase().includes(q))) return false;
                return true;
            });

            // KPI
            document.getElementById('kTotal').textContent = ORDERS.length;
            document.getElementById('kServing').textContent = ORDERS.filter(o => o.status === 'serving').length;
            const doneOrders = ORDERS.filter(o => o.status === 'done' || o.status === 'reviewed');
            const avgDays = doneOrders.length > 0 ? (doneOrders.reduce((s, o) => {
                const created = new Date(String(o.createTime || '').replace(/-/g, '/'));
                const days = isNaN(created) ? 5 : Math.max(1, Math.round((Date.now() - created.getTime()) / 86400000));
                return s + days;
            }, 0) / doneOrders.length).toFixed(1) : '—';
            document.getElementById('kAvgDays').innerHTML = avgDays + '<span class="text-sm font-normal text-slate-400">天</span>';
            const reviewed = ORDERS.filter(o => o.status === 'reviewed');
            const satRate = reviewed.length > 0 ? Math.round(reviewed.reduce((s, o) => s + (o.rating || 5), 0) / reviewed.length * 20) : 0;
            document.getElementById('kSat').innerHTML = (satRate || '—') + '<span class="text-sm font-normal text-slate-400">%</span>';
            document.getElementById('orderCount').textContent = list.length;

            const tb = document.getElementById('tbody');
            if (list.length === 0) {
                tb.innerHTML = '<tr><td colspan="8" class="px-6 py-12 text-center text-slate-400"><i class="fa fa-inbox text-2xl block mb-2"></i>暂无订单</td></tr>';
                return;
            }
            tb.innerHTML = list.map(o => {
                const st = statusMap[o.status] || statusMap.unpaid;
                const isDone = o.status === 'done' || o.status === 'reviewed';
                const settleStatus = o.settled ? '<span class="text-xs text-emerald-600 font-bold"><i class="fa fa-check mr-0.5"></i>已结算</span>' : isDone ? '<span class="text-xs text-orange-600 font-bold"><i class="fa fa-rmb mr-0.5"></i>待结算</span>' : '<span class="text-xs text-slate-400">—</span>';
                const acts = isDone && !o.settled
                    ? `<button onclick="openSettle('${o.id}')" class="px-3 py-1.5 bg-orange-500 hover:bg-orange-600 text-white text-xs rounded-lg transition-all">结算</button>`
                    : '<span class="text-xs text-slate-300">—</span>';
                return `<tr class="hover:bg-slate-50 transition-colors">
                    <td class="px-6 py-4"><span class="text-xs font-mono text-slate-500">${o.id}</span></td>
                    <td class="px-6 py-4">
                        <div class="flex items-center space-x-2">
                            <div class="w-8 h-8 bg-orange-50 text-orange-600 rounded-lg flex items-center justify-center"><i class="fa ${o.icon||'fa-cube'} text-xs"></i></div>
                            <span class="text-sm font-medium">${o.svcName}</span>
                        </div>
                    </td>
                    <td class="px-6 py-4 text-sm text-slate-600">${o.company}</td>
                    <td class="px-6 py-4"><span class="text-orange-600 font-bold">¥${fmtMoney(o.amount)}</span></td>
                    <td class="px-6 py-4">
                        <div class="w-24">
                            <div class="flex items-center justify-between text-[10px] mb-1">
                                <span class="text-slate-400">${isDone?'完成':'进行中'}</span>
                                <span class="text-orange-600 font-bold">${o.progress||0}%</span>
                            </div>
                            <div class="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden">
                                <div class="h-full ${isDone?'bg-emerald-500':'bg-orange-500'}" style="width:${o.progress||0}%"></div>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-4">
                        <span class="inline-flex items-center space-x-1 text-xs px-2.5 py-1 rounded-full ${st.cls}"><i class="fa ${st.icon}"></i><span>${st.text}</span></span>
                    </td>
                    <td class="px-6 py-4">${settleStatus}</td>
                    <td class="px-6 py-4"><div class="flex items-center justify-center space-x-2">${acts}</div></td>
                </tr>`;
            }).join('');
        }

        // ===== 结算 =====
        function openSettle(id) {
            const o = ORDERS.find(x => x.id === id);
            if (!o) return;
            const platformFee = Math.round(o.amount * 0.1); // 平台服务费 10%
            const providerIncome = o.amount - platformFee;
            document.getElementById('settleBody').innerHTML = `
                <div class="p-4 bg-slate-50 rounded-xl space-y-2 text-sm">
                    <div class="flex justify-between"><span class="text-slate-500">订单号</span><span class="font-mono">${o.id}</span></div>
                    <div class="flex justify-between"><span class="text-slate-500">服务名称</span><span class="font-medium">${o.svcName}</span></div>
                    <div class="flex justify-between"><span class="text-slate-500">服务商</span><span>${o.provider}</span></div>
                    <div class="flex justify-between"><span class="text-slate-500">企业</span><span>${o.company}</span></div>
                </div>
                <div class="p-4 bg-orange-50 rounded-xl space-y-3">
                    <div class="flex justify-between text-sm"><span class="text-slate-600">订单金额</span><span class="font-bold">¥${fmtMoney(o.amount)}</span></div>
                    <div class="flex justify-between text-sm"><span class="text-slate-600">平台服务费 (10%)</span><span class="text-orange-600 font-bold">-¥${fmtMoney(platformFee)}</span></div>
                    <div class="flex justify-between text-sm"><span class="text-slate-600">服务商应收</span><span class="text-emerald-600 font-bold">¥${fmtMoney(providerIncome)}</span></div>
                </div>
                <div>
                    <p class="text-xs font-bold text-slate-600 mb-1.5">结算备注</p>
                    <textarea id="settleNote" rows="2" placeholder="如：已打款至服务商对公账户。" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-400 focus:bg-white"></textarea>
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button onclick="closeM('settleModal')" class="px-5 py-2.5 bg-white border border-slate-200 text-slate-600 rounded-xl text-sm font-bold">取消</button>
                    <button onclick="settleConfirm('${o.id}')" class="px-6 py-2.5 bg-gradient-to-r from-orange-500 to-orange-600 text-white rounded-xl text-sm font-bold"><i class="fa fa-check mr-1"></i>确认结算</button>
                </div>`;
            showM('settleModal');
        }
        function settleConfirm(id) {
            const o = ORDERS.find(x => x.id === id);
            if (!o) return;
            o.settled = true;
            o.settleNote = document.getElementById('settleNote').value.trim();
            if (typeof DataBridge !== 'undefined') DataBridge.saveServiceOrders(ORDERS);
            closeM('settleModal');
            render();
            alert('结算完成！服务商应收 ¥' + fmtMoney(o.amount - Math.round(o.amount * 0.1)) + '，财务对账记录已生成。');
        }

        function showM(id) { const m = document.getElementById(id); m.classList.remove('hidden'); m.classList.add('flex'); }
        function closeM(id) { const m = document.getElementById(id); m.classList.add('hidden'); m.classList.remove('flex'); }

        load();
        render();
    </script>
</body>
</html>
