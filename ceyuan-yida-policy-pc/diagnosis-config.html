<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>诊断维度配置 - 策源易答</title>
    <link href="libs/css/tailwind.css" rel="stylesheet">
    <link href="libs/css/font-awesome.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .scroll-thin::-webkit-scrollbar { width: 6px; height: 6px; }
        .scroll-thin::-webkit-scrollbar-thumb { background: rgba(100,116,139,0.3); border-radius: 3px; }
        .tab-active { color:#2563eb; border-bottom-color:#2563eb; }
        .inp { @apply w-full px-2.5 py-1.5 border border-slate-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-400; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <div class="max-w-[1400px] mx-auto p-6">
        <!-- 页面标题 -->
        <div class="mb-5 flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-black text-slate-800">诊断维度配置</h1>
                <p class="text-sm text-slate-500">管理科创能力诊断的六大维度基准、评级阈值与推荐政策 · 保存后前端诊断页自动同步</p>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="resetToDefault()" class="px-4 py-2 bg-white border border-slate-200 text-slate-600 rounded-xl text-xs font-bold hover:bg-slate-50">
                    <i class="fa fa-refresh mr-1.5"></i>恢复默认
                </button>
                <button onclick="goPage('ability-diagnosis.html')" class="px-4 py-2 bg-white border border-blue-200 text-blue-600 rounded-xl text-xs font-bold hover:bg-blue-50">
                    <i class="fa fa-eye mr-1.5"></i>预览前端
                </button>
                <button onclick="saveAll()" class="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold hover:bg-blue-700 shadow-lg shadow-blue-100">
                    <i class="fa fa-save mr-1.5"></i>保存配置
                </button>
            </div>
        </div>

        <!-- Tab 栏 -->
        <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden">
            <div class="border-b border-slate-200 px-5 pt-4">
                <div class="flex space-x-1">
                    <button onclick="switchTab('dim')" id="tabDim" class="px-4 py-2 text-xs font-bold border-b-2 tab-active transition-all">
                        <i class="fa fa-bar-chart mr-1"></i>维度与行业基准
                    </button>
                    <button onclick="switchTab('rating')" id="tabRating" class="px-4 py-2 text-xs font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-700 transition-all">
                        <i class="fa fa-trophy mr-1"></i>评级与排名阈值
                    </button>
                    <button onclick="switchTab('advice')" id="tabAdvice" class="px-4 py-2 text-xs font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-700 transition-all">
                        <i class="fa fa-line-chart mr-1"></i>短板与建议
                    </button>
                    <button onclick="switchTab('scoring')" id="tabScoring" class="px-4 py-2 text-xs font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-700 transition-all">
                        <i class="fa fa-calculator mr-1"></i>计分公式
                    </button>
                </div>
            </div>
            <div id="tabContent" class="p-5 min-h-[480px]"></div>
        </div>
    </div>

<script src="data-bridge.js"></script>
<script>
    var CFG = null;
    var CURRENT_TAB = 'dim';

    var DIM_COLORS = {
        tech:{bg:'#eff6ff', text:'#2563eb'}, rd:{bg:'#ecfdf5', text:'#059669'},
        ip:{bg:'#fff7ed', text:'#f97316'}, transform:{bg:'#faf5ff', text:'#9333ea'},
        talent:{bg:'#fdf2f8', text:'#ec4899'}, market:{bg:'#ecfeff', text:'#0891b2'}
    };

    function goPage(url) {
        if (parent && parent.window && parent.window.switchPage) {
            parent.window.switchPage(url, null);
        } else {
            window.location.href = url;
        }
    }

    function load() {
        CFG = JSON.parse(JSON.stringify(DataBridge.loadDiagnosisConfig()));
        renderTab();
    }

    function switchTab(tab) {
        CURRENT_TAB = tab;
        ['dim','rating','advice','scoring'].forEach(function(t) {
            var el = document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1));
            if (!el) return;
            if (t === tab) {
                el.classList.add('tab-active');
                el.classList.remove('border-transparent','text-slate-500');
            } else {
                el.classList.remove('tab-active');
                el.classList.add('border-transparent','text-slate-500');
            }
        });
        renderTab();
    }

    function renderTab() {
        var box = document.getElementById('tabContent');
        if (CURRENT_TAB === 'dim') box.innerHTML = renderDimTab();
        else if (CURRENT_TAB === 'rating') box.innerHTML = renderRatingTab();
        else if (CURRENT_TAB === 'advice') box.innerHTML = renderAdviceTab();
        else box.innerHTML = renderScoringTab();
    }

    // ===== Tab1: 维度与行业基准 =====
    function renderDimTab() {
        return '<div class="text-xs text-slate-500 mb-4"><i class="fa fa-info-circle text-blue-400 mr-1"></i>' +
            '每个维度的行业均值用于「同行对比」基准线，行业标杆用于展示天花板。前端诊断雷达图与对比模块实时引用。</div>' +
            '<div class="border border-slate-200 rounded-xl overflow-hidden">' +
            '<table class="w-full text-sm">' +
            '<thead><tr class="bg-slate-50 text-[11px] text-slate-500 uppercase">' +
            '<th class="px-4 py-2.5 text-left font-bold">维度</th>' +
            '<th class="px-4 py-2.5 text-left font-bold">说明</th>' +
            '<th class="px-4 py-2.5 text-center font-bold w-28">行业均值</th>' +
            '<th class="px-4 py-2.5 text-center font-bold w-28">行业标杆</th>' +
            '</tr></thead><tbody class="divide-y divide-slate-100">' +
            CFG.dims.map(function(d, i) {
                var c = DIM_COLORS[d.key] || {bg:'#f1f5f9', text:'#475569'};
                return '<tr>' +
                    '<td class="px-4 py-2.5"><span class="inline-flex items-center px-2.5 py-1 rounded-lg font-bold text-xs" style="background:'+c.bg+';color:'+c.text+'">' + d.name + '</span></td>' +
                    '<td class="px-4 py-2.5"><input type="text" value="' + d.desc + '" class="w-full px-2 py-1 border border-slate-200 rounded text-xs outline-none focus:ring-1 focus:ring-blue-400" oninput="CFG.dims[' + i + '].desc=this.value"></td>' +
                    '<td class="px-4 py-2.5 text-center"><input type="number" min="0" max="100" value="' + d.avg + '" class="w-20 px-2 py-1 border border-slate-200 rounded text-xs outline-none focus:ring-1 focus:ring-blue-400 text-center" oninput="CFG.dims[' + i + '].avg=Number(this.value)"></td>' +
                    '<td class="px-4 py-2.5 text-center"><input type="number" min="0" max="100" value="' + d.best + '" class="w-20 px-2 py-1 border border-slate-200 rounded text-xs outline-none focus:ring-1 focus:ring-blue-400 text-center" oninput="CFG.dims[' + i + '].best=Number(this.value)"></td>' +
                    '</tr>';
            }).join('') +
            '</tbody></table></div>';
    }

    // ===== Tab2: 评级与排名阈值 =====
    function renderRatingTab() {
        return '<div class="text-xs text-slate-500 mb-4"><i class="fa fa-info-circle text-blue-400 mr-1"></i>' +
            '综合得分 ≥ 阈值 命中对应评级与行业排名，按从高到低依次匹配。阈值必须降序排列。</div>' +
            '<div class="space-y-3 max-w-2xl">' +
            CFG.ratings.map(function(r, i) {
                var colorMap = {'A+':'bg-blue-600','A':'bg-blue-500','B':'bg-green-500','C':'bg-orange-500','D':'bg-red-500'};
                var c = colorMap[r.grade] || 'bg-slate-500';
                return '<div class="flex items-center gap-3 border border-slate-200 rounded-xl p-3">' +
                    '<span class="w-9 h-9 rounded-full ' + c + ' text-white flex items-center justify-center text-xs font-black flex-shrink-0">' + r.grade + '</span>' +
                    '<div class="flex items-center gap-2 flex-1">' +
                    '<label class="text-xs text-slate-500 whitespace-nowrap">得分 ≥</label>' +
                    '<input type="number" min="0" max="100" value="' + r.min + '" class="w-20 px-2 py-1.5 border border-slate-200 rounded text-sm outline-none focus:ring-1 focus:ring-blue-400 text-center" oninput="CFG.ratings[' + i + '].min=Number(this.value)">' +
                    '<label class="text-xs text-slate-500 whitespace-nowrap ml-2">行业排名</label>' +
                    '<input type="text" value="' + r.rank + '" class="flex-1 px-2 py-1.5 border border-slate-200 rounded text-sm outline-none focus:ring-1 focus:ring-blue-400" oninput="CFG.ratings[' + i + '].rank=this.value">' +
                    '</div>' +
                    '<button onclick="removeRating(' + i + ')" class="px-2 py-1.5 bg-red-50 text-red-500 rounded text-xs font-bold hover:bg-red-100"><i class="fa fa-trash"></i></button>' +
                    '</div>';
            }).join('') +
            '<button onclick="addRating()" class="w-full py-2.5 border-2 border-dashed border-slate-200 rounded-xl text-xs font-bold text-slate-400 hover:border-blue-200 hover:text-blue-500 transition-all"><i class="fa fa-plus mr-1"></i>新增评级档位</button>' +
            '</div>';
    }

    function addRating() {
        CFG.ratings.push({ min:50, grade:'E', rank:'TOP 95%' });
        renderTab();
    }
    function removeRating(i) {
        CFG.ratings.splice(i, 1);
        renderTab();
    }

    // ===== Tab4: 短板与建议 =====
    function renderAdviceTab() {
        var tierColorMap = {'严重短板':'bg-red-500', '偏弱':'bg-orange-500', '持平':'bg-slate-500', '优势':'bg-green-500', '领先':'bg-emerald-600'};
        // 区块1：短板分档阈值
        var tierHtml = '<div class="mb-8">' +
            '<div class="flex items-center justify-between mb-3">' +
            '<h3 class="text-sm font-bold text-slate-700"><i class="fa fa-exclamation-triangle text-red-500 mr-1.5"></i>短板分档阈值</h3>' +
            '<button onclick="addTier()" class="px-2.5 py-1 bg-red-500 text-white rounded-lg text-[10px] font-bold hover:bg-red-600"><i class="fa fa-plus mr-1"></i>新增档位</button>' +
            '</div>' +
            '<div class="text-xs text-slate-500 mb-3">依据：企业维度得分 − 行业均值 = 差距，差距 ≤ 上限 命中该档（按从小到大匹配）。</div>' +
            '<div class="space-y-2 max-w-2xl">' +
            CFG.shortboardTiers.map(function(t, i) {
                var c = tierColorMap[t.label] || 'bg-slate-400';
                return '<div class="flex items-center gap-3 border border-slate-200 rounded-xl p-2.5">' +
                    '<span class="w-9 h-9 rounded-full ' + c + ' text-white flex items-center justify-center text-[10px] font-black flex-shrink-0 text-center leading-tight">' + t.label + '</span>' +
                    '<div class="flex items-center gap-2 flex-1">' +
                    '<label class="text-xs text-slate-500 whitespace-nowrap">差距 ≤</label>' +
                    '<input type="number" value="' + t.max + '" class="w-20 px-2 py-1.5 border border-slate-200 rounded text-sm outline-none focus:ring-1 focus:ring-blue-400 text-center" oninput="CFG.shortboardTiers[' + i + '].max=Number(this.value)">' +
                    '<label class="text-xs text-slate-500 whitespace-nowrap ml-2">档位名称</label>' +
                    '<input type="text" value="' + t.label + '" class="flex-1 px-2 py-1.5 border border-slate-200 rounded text-sm outline-none focus:ring-1 focus:ring-blue-400" oninput="CFG.shortboardTiers[' + i + '].label=this.value">' +
                    '</div>' +
                    '<button onclick="removeTier(' + i + ')" class="px-2 py-1.5 bg-red-50 text-red-500 rounded text-xs font-bold hover:bg-red-100"><i class="fa fa-trash"></i></button>' +
                    '</div>';
            }).join('') +
            '</div></div>';
        // 区块2：发展路径阶段
        var stagePalette = ['blue', 'purple', 'green', 'orange', 'teal'];
        var stageHtml = '<div class="mb-8">' +
            '<div class="flex items-center justify-between mb-3">' +
            '<h3 class="text-sm font-bold text-slate-700"><i class="fa fa-road text-blue-500 mr-1.5"></i>发展路径阶段</h3>' +
            '<button onclick="addStage()" class="px-2.5 py-1 bg-blue-500 text-white rounded-lg text-[10px] font-bold hover:bg-blue-600"><i class="fa fa-plus mr-1"></i>新增阶段</button>' +
            '</div>' +
            '<div class="text-xs text-slate-500 mb-3">依据：取得分最低的 2 个维度作为重点维度，目标分 = 最弱维度得分 + 增量，各阶段行动从建议文案库循环取用。</div>' +
            '<div class="space-y-2 max-w-2xl">' +
            CFG.devPathStages.map(function(s, i) {
                return '<div class="flex items-center gap-2 border border-slate-200 rounded-xl p-2.5">' +
                    '<span class="w-6 h-6 rounded-full ' + stagePalette[i % 5] + '-500 text-white flex items-center justify-center text-[10px] font-bold flex-shrink-0">' + (i + 1) + '</span>' +
                    '<input type="text" value="' + s.title + '" placeholder="阶段名称" class="w-24 px-2 py-1.5 border border-slate-200 rounded text-sm outline-none focus:ring-1 focus:ring-blue-400" oninput="CFG.devPathStages[' + i + '].title=this.value">' +
                    '<input type="text" value="' + s.range + '" placeholder="时间范围" class="w-24 px-2 py-1.5 border border-slate-200 rounded text-sm outline-none focus:ring-1 focus:ring-blue-400" oninput="CFG.devPathStages[' + i + '].range=this.value">' +
                    '<div class="flex items-center gap-1.5 flex-1">' +
                    '<label class="text-xs text-slate-500 whitespace-nowrap">目标增量</label>' +
                    '<input type="number" min="0" max="50" value="' + s.inc + '" class="w-16 px-2 py-1.5 border border-slate-200 rounded text-sm outline-none focus:ring-1 focus:ring-blue-400 text-center" oninput="CFG.devPathStages[' + i + '].inc=Number(this.value)">' +
                    '<span class="text-xs text-slate-400">分</span>' +
                    '</div>' +
                    '<button onclick="removeStage(' + i + ')" class="px-2 py-1.5 bg-red-50 text-red-500 rounded text-xs font-bold hover:bg-red-100"><i class="fa fa-trash"></i></button>' +
                    '</div>';
            }).join('') +
            '</div></div>';
        // 区块3：维度建议文案库
        var suggHtml = '<div>' +
            '<div class="flex items-center justify-between mb-3">' +
            '<h3 class="text-sm font-bold text-slate-700"><i class="fa fa-commenting-o text-purple-500 mr-1.5"></i>维度建议文案库</h3>' +
            '<button onclick="addSuggestion()" class="px-2.5 py-1 bg-purple-500 text-white rounded-lg text-[10px] font-bold hover:bg-purple-600"><i class="fa fa-plus mr-1"></i>新增维度</button>' +
            '</div>' +
            '<div class="text-xs text-slate-500 mb-3">提升建议取得分最低 4 个维度的全部文案；发展路径取最低 2 个维度文案按阶段轮换。每个维度建议保留 3 条。</div>' +
            '<div class="grid grid-cols-2 gap-4">' +
            CFG.dims.map(function(d, i) {
                var c = DIM_COLORS[d.key] || {bg:'#f1f5f9', text:'#475569'};
                var suggs = d.suggestions || [];
                var rows = suggs.map(function(s, j) {
                    return '<div class="flex items-center gap-1.5 mb-1.5">' +
                        '<span class="text-[10px] text-slate-400 w-3 flex-shrink-0">' + (j + 1) + '</span>' +
                        '<input type="text" value="' + s + '" class="flex-1 px-2 py-1 border border-slate-200 rounded text-[11px] outline-none focus:ring-1 focus:ring-purple-400" oninput="CFG.dims[' + i + '].suggestions[' + j + ']=this.value">' +
                        '<button onclick="removeSuggestion(' + i + ',' + j + ')" class="text-red-400 hover:text-red-600 text-[10px] px-1 flex-shrink-0"><i class="fa fa-times"></i></button>' +
                        '</div>';
                }).join('');
                return '<div class="border border-slate-200 rounded-xl p-3">' +
                    '<div class="flex items-center gap-2 mb-2">' +
                    '<span class="inline-flex items-center px-2 py-0.5 rounded-lg font-bold text-[11px]" style="background:' + c.bg + ';color:' + c.text + '">' + d.name + '</span>' +
                    '<span class="text-[10px] text-slate-400 ml-auto">' + suggs.length + ' 条</span>' +
                    '</div>' + rows +
                    '<button onclick="addSuggestionItem(' + i + ')" class="text-[10px] text-purple-500 hover:text-purple-700 font-bold mt-1"><i class="fa fa-plus mr-0.5"></i>加一条</button>' +
                    '</div>';
            }).join('') +
            '</div></div>';
        return tierHtml + stageHtml + suggHtml;
    }

    function addTier() {
        CFG.shortboardTiers.push({ max:30, label:'新档位' });
        renderTab();
    }
    function removeTier(i) { CFG.shortboardTiers.splice(i, 1); renderTab(); }
    function addStage() {
        CFG.devPathStages.push({ title:'新阶段', range:'12个月以上', inc:40 });
        renderTab();
    }
    function removeStage(i) { CFG.devPathStages.splice(i, 1); renderTab(); }
    function addSuggestion() {
        CFG.dims.push({ key:'new_dim_' + Date.now(), name:'新维度', desc:'', avg:60, best:90, suggestions:['建议一', '建议二', '建议三'] });
        renderTab();
    }
    function addSuggestionItem(dimIdx) {
        if (!Array.isArray(CFG.dims[dimIdx].suggestions)) CFG.dims[dimIdx].suggestions = [];
        CFG.dims[dimIdx].suggestions.push('新增建议');
        renderTab();
    }
    function removeSuggestion(dimIdx, sIdx) {
        CFG.dims[dimIdx].suggestions.splice(sIdx, 1);
        renderTab();
    }

    // ===== Tab5: 计分公式 =====
    // 每个维度专属的字段下拉（不再全局同一份）
    var FIELD_LABELS = {
        patent:'发明专利(项)', rdPct:'研发占比(%)', rdAmount:'研发金额(万元)',
        software:'软件著作(项)', utility:'实用新型(项)', htPct:'高新收入占比(%)',
        quals:'已获资质(项)', employees:'员工人数', revenue:'年营收(万元)'
    };
    var DIM_FIELDS = {
        tech:      ['patent','rdPct','quals'],
        rd:        ['rdPct','rdAmount'],
        ip:        ['patent','software','utility','quals'],
        transform: ['htPct','quals'],
        talent:    ['employees','quals'],
        market:    ['revenue']
    };
    // 兜底：旧数据可能有不在 DIM_FIELDS 里的 field，也支持自定义添加的维度
    var ALL_FIELDS = Object.keys(FIELD_LABELS);
    function fieldSelect(d, di, ri, cur) {
        var key = d && d.key;
        var pool = (key && DIM_FIELDS[key]) ? DIM_FIELDS[key] : ALL_FIELDS;
        // 保留当前值（即使不在推荐列表里），防止老配置丢失
        if (cur && pool.indexOf(cur) === -1) pool = [cur].concat(pool);
        var opts = pool.map(function(f) {
            return '<option value="' + f + '"' + (f === cur ? ' selected' : '') + '>' + (FIELD_LABELS[f] || f) + '</option>';
        }).join('');
        return '<select class="px-1.5 py-1 border border-slate-200 rounded text-[11px] outline-none focus:ring-1 focus:ring-blue-400 bg-white" onchange="updRule(' + di + ',' + ri + ',\'field\',this.value)">' + opts + '</select>';
    }
    // ===== 规则公式预览：根据规则实时生成一行人话说明 =====
    function ruleFormula(d, r) {
        var key = d && d.key;
        var colorKey = key || 'tech';
        var accent = (DIM_COLORS[colorKey] || {text:'#475569'}).text;
        var name = FIELD_LABELS[r.field] || r.field || '-';
        var html = '<div class="mt-1.5 pl-1.5 text-[10px] rounded py-1 px-1.5" style="background:rgba(99,102,241,0.06);color:#475569;line-height:1.5">';
        if (r.mode === 'unit') {
            var expr = r.div ? name + ' ÷ ' + r.div : name;
            html += '<i class="fa fa-calculator" style="color:' + accent + ';margin-right:2px"></i>';
            html += '单条得分 = <b style="color:' + accent + '">min(' + r.cap + ', ' + expr + ' × ' + r.per + ')</b>';
            html += ' <span class="text-slate-400">（' + name + ' 每多 1 单位加 ' + r.per + ' 分，本条封顶 ' + r.cap + ' 分）</span>';
        } else if (r.mode === 'tier') {
            html += '<i class="fa fa-th-large" style="color:' + accent + ';margin-right:2px"></i>';
            html += '分档命中：';
            (r.tiers || []).forEach(function(t, i) {
                html += '<b style="color:' + accent + '">' + name + ' < ' + t.max + ' → ' + t.score + '分</b>';
                if (i < r.tiers.length - 1) html += '，';
            });
        } else if (r.mode === 'scale') {
            html += '<i class="fa fa-building" style="color:' + accent + ';margin-right:2px"></i>';
            html += '规模修正：';
            var sc = ['微型','小型','中型','大型'];
            sc.forEach(function(s, i) {
                html += '<b style="color:' + accent + '">' + s + ' +' + ((r.bonus || {})[s] || 0) + '分</b>';
                if (i < sc.length - 1) html += '，';
            });
            html += ' <span class="text-slate-400">（上限 ' + r.cap + ' 分）</span>';
        }
        html += '</div>';
        return html;
    }
    function renderScoringTab() {
        return '<div class="text-xs text-slate-500 mb-4"><i class="fa fa-info-circle text-blue-400 mr-1"></i>' +
            '每个维度的得分 = 各条规则得分之和（维度满分100）。三种规则：<b>按单位</b> 每单位加N分、可设上限；<b>按分档</b> 值小于某数得固定分；<b>规模修正</b> 按企业规模加分。</div>' +
            '<div class="grid grid-cols-2 gap-4">' +
            CFG.dims.map(function(d, di) {
                var c = DIM_COLORS[d.key] || {bg:'#f1f5f9', text:'#475569'};
                var rules = (CFG.scoring[d.key] || []);
                var rows = rules.map(function(r, ri) { return ruleRow(d, di, r, ri); }).join('');
                return '<div class="border border-slate-200 rounded-xl p-3">' +
                    '<div class="flex items-center gap-2 mb-2.5">' +
                    '<span class="inline-flex items-center px-2 py-0.5 rounded-lg font-bold text-[11px]" style="background:' + c.bg + ';color:' + c.text + '">' + d.name + '</span>' +
                    '<div class="ml-auto flex gap-1">' +
                    '<button onclick="addRule(' + di + ',\'unit\')" class="px-1.5 py-0.5 bg-blue-50 text-blue-600 rounded text-[10px] font-bold hover:bg-blue-100" title="按单位计分">+单位</button>' +
                    '<button onclick="addRule(' + di + ',\'tier\')" class="px-1.5 py-0.5 bg-green-50 text-green-600 rounded text-[10px] font-bold hover:bg-green-100" title="按分档计分">+分档</button>' +
                    '<button onclick="addRule(' + di + ',\'scale\')" class="px-1.5 py-0.5 bg-orange-50 text-orange-600 rounded text-[10px] font-bold hover:bg-orange-100" title="按规模修正">+规模</button>' +
                    '</div></div>' +
                    (rows || '<p class="text-[10px] text-slate-400 py-2 text-center">暂无规则，请添加</p>') +
                    '</div>';
            }).join('') +
            '</div>';
    }

    function ruleRow(d, di, r, ri) {
        if (r.mode === 'unit') {
            var divRow = r.div ? ('<div class="flex items-center gap-1.5 mt-1 pl-1"><span class="text-[10px] text-slate-400">每</span>' +
                '<input type="number" value="' + r.div + '" class="w-16 px-1.5 py-0.5 border border-slate-200 rounded text-[10px] outline-none focus:ring-1 focus:ring-blue-400 text-center" oninput="updRule(' + di + ',' + ri + ',\'div\',this.value)">' +
                '<span class="text-[10px] text-slate-400">单位起算</span></div>') : '';
            return '<div class="bg-slate-50 rounded-lg p-2 mb-2">' +
                '<div class="flex items-center gap-1.5 flex-wrap">' +
                fieldSelect(d, di, ri, r.field) +
                '<span class="text-[10px] text-slate-500">每单位</span>' +
                '<input type="number" step="0.1" value="' + r.per + '" class="w-14 px-1.5 py-1 border border-slate-200 rounded text-[11px] outline-none focus:ring-1 focus:ring-blue-400 text-center" oninput="updRule(' + di + ',' + ri + ',\'per\',this.value)">' +
                '<span class="text-[10px] text-slate-500">分</span>' +
                '<span class="text-[10px] text-slate-500 ml-1">上限</span>' +
                '<input type="number" value="' + r.cap + '" class="w-14 px-1.5 py-1 border border-slate-200 rounded text-[11px] outline-none focus:ring-1 focus:ring-blue-400 text-center" oninput="updRule(' + di + ',' + ri + ',\'cap\',this.value)">' +
                '<span class="text-[10px] text-slate-500">分</span>' +
                '<button onclick="removeRule(' + di + ',' + ri + ')" class="text-red-400 hover:text-red-600 text-[10px] px-1 ml-auto"><i class="fa fa-trash"></i></button>' +
                '</div>' + divRow +
                ruleFormula(d, r) +
                '</div>';
        }
        if (r.mode === 'tier') {
            var tierRows = (r.tiers || []).map(function(t, ti) {
                return '<div class="flex items-center gap-1.5 mb-1">' +
                    '<span class="text-[10px] text-slate-500">值 &lt;</span>' +
                    '<input type="number" value="' + t.max + '" class="w-16 px-1.5 py-0.5 border border-slate-200 rounded text-[10px] outline-none focus:ring-1 focus:ring-green-400 text-center" oninput="updTier(' + di + ',' + ri + ',' + ti + ',\'max\',this.value)">' +
                    '<span class="text-[10px] text-slate-500">得</span>' +
                    '<input type="number" value="' + t.score + '" class="w-14 px-1.5 py-0.5 border border-slate-200 rounded text-[10px] outline-none focus:ring-1 focus:ring-green-400 text-center" oninput="updTier(' + di + ',' + ri + ',' + ti + ',\'score\',this.value)">' +
                    '<span class="text-[10px] text-slate-500">分</span>' +
                    '<button onclick="removeTierItem(' + di + ',' + ri + ',' + ti + ')" class="text-red-400 hover:text-red-600 text-[10px] px-1 ml-auto"><i class="fa fa-times"></i></button>' +
                    '</div>';
            }).join('');
            return '<div class="bg-slate-50 rounded-lg p-2 mb-2">' +
                '<div class="flex items-center gap-1.5 mb-1.5">' +
                fieldSelect(d, di, ri, r.field) +
                '<span class="text-[10px] text-slate-400">按数值分档（从小到大）</span>' +
                '<button onclick="removeRule(' + di + ',' + ri + ')" class="text-red-400 hover:text-red-600 text-[10px] px-1 ml-auto"><i class="fa fa-trash"></i></button>' +
                '</div>' + tierRows +
                '<button onclick="addTierItem(' + di + ',' + ri + ')" class="text-[10px] text-green-600 hover:text-green-700 font-bold mb-1"><i class="fa fa-plus mr-0.5"></i>加一档</button>' +
                ruleFormula(d, r) +
                '</div>';
        }
        // scale 规模修正
        var scales = ['微型', '小型', '中型', '大型'];
        var bonusInputs = scales.map(function(s) {
            return '<span class="text-[10px] text-slate-500">' + s + '</span>' +
                '<input type="number" value="' + ((r.bonus || {})[s] || 0) + '" class="w-12 px-1 py-0.5 border border-slate-200 rounded text-[10px] outline-none focus:ring-1 focus:ring-orange-400 text-center" oninput="updScaleBonus(' + di + ',' + ri + ',\'' + s + '\',this.value)">';
        }).join('');
        return '<div class="bg-slate-50 rounded-lg p-2 mb-2">' +
            '<div class="flex items-center gap-1 mb-1.5">' +
            '<span class="text-[10px] font-bold text-slate-600">' + (r.label || '规模修正') + '</span>' +
            '<button onclick="removeRule(' + di + ',' + ri + ')" class="text-red-400 hover:text-red-600 text-[10px] px-1 ml-auto"><i class="fa fa-trash"></i></button>' +
            '</div>' +
            '<div class="flex items-center gap-1 flex-wrap">' + bonusInputs +
            '<span class="text-[10px] text-slate-500 ml-1">上限</span>' +
            '<input type="number" value="' + r.cap + '" class="w-12 px-1 py-0.5 border border-slate-200 rounded text-[10px] outline-none focus:ring-1 focus:ring-orange-400 text-center" oninput="updRule(' + di + ',' + ri + ',\'cap\',this.value)">' +
            '</div>' +
            ruleFormula(d, r) +
            '</div>';
    }

    function addRule(dimIdx, mode) {
        var key = CFG.dims[dimIdx].key;
        if (!CFG.scoring[key]) CFG.scoring[key] = [];
        var dimFields = DIM_FIELDS[key] || ALL_FIELDS;
        // unit/tier 自动选中本维度第一个字段，避免出现"知识产权"里还出现"年营收"
        var firstField = dimFields[0] || 'patent';
        if (mode === 'unit') CFG.scoring[key].push({ label:'新规则', field:firstField, mode:'unit', per:1, cap:20 });
        else if (mode === 'tier') CFG.scoring[key].push({ label:'新分档', field:firstField, mode:'tier', tiers:[{ max:100, score:30 }, { max:99999999, score:80 }] });
        else CFG.scoring[key].push({ label:'规模修正', mode:'scale', bonus:{ '微型':0, '小型':2, '中型':5, '大型':8 }, cap:10 });
        renderTab();
    }
    function removeRule(dimIdx, ri) {
        CFG.scoring[CFG.dims[dimIdx].key].splice(ri, 1);
        renderTab();
    }
    function updRule(dimIdx, ri, k, v) {
        var r = CFG.scoring[CFG.dims[dimIdx].key][ri];
        r[k] = (k === 'per' || k === 'cap' || k === 'div') ? (Number(v) || 0) : v;
        if (k === 'div' && !r.div) delete r.div;
    }
    function addTierItem(dimIdx, ri) {
        var r = CFG.scoring[CFG.dims[dimIdx].key][ri];
        r.tiers.push({ max:99999999, score:100 });
        renderTab();
    }
    function removeTierItem(dimIdx, ri, ti) {
        CFG.scoring[CFG.dims[dimIdx].key][ri].tiers.splice(ti, 1);
        renderTab();
    }
    function updTier(dimIdx, ri, ti, k, v) {
        CFG.scoring[CFG.dims[dimIdx].key][ri].tiers[ti][k] = Number(v) || 0;
    }
    function updScaleBonus(dimIdx, ri, scale, v) {
        var r = CFG.scoring[CFG.dims[dimIdx].key][ri];
        if (!r.bonus) r.bonus = {};
        r.bonus[scale] = Number(v) || 0;
    }

    // ===== 保存 / 重置 =====
    function saveAll() {
        // 校验评级阈值降序
        for (var i = 1; i < CFG.ratings.length; i++) {
            if (CFG.ratings[i].min >= CFG.ratings[i-1].min) {
                showToast('评级阈值必须从高到低降序排列（第' + (i) + '档 ≥ 第' + (i-1) + '档）', 'error');
                return;
            }
        }
        // 校验短板分档阈值升序
        for (var j = 1; j < CFG.shortboardTiers.length; j++) {
            if (CFG.shortboardTiers[j].max <= CFG.shortboardTiers[j-1].max) {
                showToast('短板分档上限必须从小到大升序排列', 'error');
                return;
            }
        }
        var ok = DataBridge.saveDiagnosisConfig(CFG);
        if (ok) showToast('配置已保存，前端诊断页刷新后生效', 'success');
        else showToast('保存失败', 'error');
    }

    function resetToDefault() {
        if (!confirm('确定恢复默认配置？当前修改将被覆盖。')) return;
        localStorage.removeItem(DataBridge.KEYS.DIAGNOSIS_CONFIG);
        CFG = JSON.parse(JSON.stringify(DataBridge.DEFAULT_DIAGNOSIS_CONFIG));
        renderTab();
        showToast('已恢复默认配置', 'success');
    }

    function showToast(msg, type) {
        type = type || 'success';
        var colors = { success:'bg-green-500', error:'bg-red-500', info:'bg-blue-500' };
        var icons = { success:'check-circle', error:'times-circle', info:'info-circle' };
        var d = document.createElement('div');
        d.className = colors[type] + ' text-white px-5 py-3 rounded-xl shadow-xl fixed top-6 right-6 z-[9999] text-sm font-bold flex items-center space-x-2';
        d.style.cssText = 'opacity:0;transform:translateX(20px);transition:all .3s;';
        d.innerHTML = '<i class="fa fa-' + icons[type] + '"></i><span>' + msg + '</span>';
        document.body.appendChild(d);
        requestAnimationFrame(function() { d.style.opacity='1'; d.style.transform='translateX(0)'; });
        setTimeout(function() { d.style.opacity='0'; d.style.transform='translateX(20px)'; setTimeout(function(){ d.remove(); }, 300); }, 2600);
    }

    document.addEventListener('DOMContentLoaded', load);
</script>
</body>
</html>
