<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客户管理 - 策源易达政策销售平台</title>
    <link href="libs/css/tailwind.css" rel="stylesheet">
    <link href="libs/css/font-awesome.min.css" rel="stylesheet">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
        .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
        .drawer-transition { transition: transform 0.3s ease-in-out; }
        .modal-transition { transition: opacity 0.2s ease-in-out; }
        /* 品牌绿色板（预编译 tailwind.css 未包含 brand 色，手动补充） */
        :root { --brand-50:#f0fdf4; --brand-100:#dcfce7; --brand-200:#bbf7d0; --brand-300:#86efac; --brand-400:#4ade80; --brand-500:#22c55e; --brand-600:#16a34a; --brand-700:#15803d; --brand-800:#166534; --brand-900:#14532d; }
        .bg-brand-50 { background-color: var(--brand-50); }
        .bg-brand-50\/40 { background-color: #f0fdf466; }
        .hover\:bg-brand-50:hover { background-color: var(--brand-50); }
        .hover\:bg-brand-50\/40:hover { background-color: #f0fdf466; }
        .bg-brand-100 { background-color: var(--brand-100); }
        .bg-brand-600 { background-color: var(--brand-600); }
        .hover\:bg-brand-700:hover { background-color: var(--brand-700); }
        .text-brand-600 { color: var(--brand-600); }
        .text-brand-700 { color: var(--brand-700); }
        .hover\:text-brand-600:hover { color: var(--brand-600); }
        .hover\:text-brand-700:hover { color: var(--brand-700); }
        .border-brand-600 { border-color: var(--brand-600); }
        .hover\:border-brand-300:hover { border-color: var(--brand-300); }
        .focus\:ring-brand-500:focus { --tw-ring-color: var(--brand-500); }
        .from-brand-500 { --tw-gradient-from: var(--brand-500); --tw-gradient-stops: var(--tw-gradient-via-stops, var(--tw-gradient-position), var(--tw-gradient-from) var(--tw-gradient-from-position), var(--tw-gradient-to) var(--tw-gradient-to-position)); }
        .to-brand-700 { --tw-gradient-to: var(--brand-700); }
    </style>
    <script>
        // 演示模式：未登录时自动注入演示账号，避免 iframe 并行加载时跳转中断
        (function authGuard() {
            try {
                var p = localStorage.getItem('ceyuan_member_profile');
                if (p) {
                    var d = JSON.parse(p);
                    if (d && d.phone) return;
                }
            } catch (e) {}
            try {
                localStorage.setItem('ceyuan_member_profile', JSON.stringify({
                    phone: '13800138000', contact: '演示用户', company: '演示企业', type: 'personal'
                }));
            } catch (e) {}
        })();
    </script>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- 顶部导航 -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
        <div class="w-full px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-brand-600 rounded-lg flex items-center justify-center">
                    <i class="fa fa-users text-white text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-gray-800">客户管理</h1>
                    <p class="text-xs text-gray-500">客服统一管理客户 · 线索、转化状态、销售分配与流水全程留痕</p>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <button class="text-gray-600 hover:text-brand-600"><i class="fa fa-bell"></i></button>
                <div class="flex items-center space-x-2">
                    <img src="https://api.dicebear.com/7.x/initials/svg?seed=张销售" class="w-9 h-9 rounded-full bg-brand-100">
                    <span class="text-sm text-gray-700">张销售</span>
                </div>
            </div>
        </div>
    </header>

    <main class="w-full px-6 py-6">
        <!-- 搜索筛选与操作 -->
        <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100 mb-6">
            <div class="flex flex-wrap items-center gap-3">
                <div class="flex-1 min-w-[240px] relative">
                    <i class="fa fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="searchInput" oninput="renderTable()" placeholder="搜索企业名称 / 统一社会信用代码 / 手机号 / 联系人..."
                        class="w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent">
                </div>
                <select id="filterIndustry" onchange="renderTable()" class="px-4 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm text-gray-700">
                    <option value="">全部行业</option>
                    <option>电子信息</option>
                    <option>生物医药</option>
                    <option>新材料</option>
                    <option>高端装备</option>
                    <option>新能源</option>
                </select>
                <select id="filterOwner" onchange="renderTable()" class="px-4 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm text-gray-700">
                    <option value="">全部销售员</option>
                    <option value="__none">未分配</option>
                    <option>张销售</option>
                    <option>王销售</option>
                    <option>李销售</option>
                </select>
                <button onclick="renderTable()" class="px-5 py-2.5 bg-brand-600 text-white rounded-lg text-sm font-medium hover:bg-brand-700">
                    <i class="fa fa-search mr-1"></i>查询
                </button>
                <button onclick="resetFilters()" class="px-4 py-2.5 border border-gray-200 rounded-lg text-sm text-gray-600 hover:bg-gray-50">
                    <i class="fa fa-refresh mr-1"></i>重置
                </button>
                <div class="flex items-center gap-2 ml-auto">
                    <button onclick="openNewCustomer()" class="px-4 py-2.5 bg-brand-600 text-white rounded-lg text-sm font-medium hover:bg-brand-700"><i class="fa fa-plus mr-1"></i>录入企业</button>
                    <button onclick="openImportCustomers()" class="px-4 py-2.5 border border-brand-600 text-brand-600 rounded-lg text-sm font-medium hover:bg-brand-50"><i class="fa fa-upload mr-1"></i>导入名单</button>
                    <button onclick="openAssignLog()" class="px-4 py-2.5 border border-gray-200 text-gray-600 rounded-lg text-sm font-medium hover:bg-gray-50"><i class="fa fa-exchange mr-1"></i>分配记录</button>
                </div>
            </div>
            <!-- 客户来源多选（复选框式） -->
            <div class="flex flex-wrap items-center gap-2 mt-4 pt-4 border-t border-gray-100">
                <span class="text-xs text-gray-500 font-medium mr-1">客户来源：</span>
                <div id="sourceFilter" class="flex flex-wrap items-center gap-2"></div>
            </div>
        </div>

        <!-- 用户类型 Tab -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="px-6 py-3 border-b border-gray-100 flex items-center space-x-1">
                <button id="tabAll" onclick="switchUserTab('all')" class="px-4 py-2 rounded-lg text-sm font-bold transition-colors bg-brand-600 text-white">全部用户 <span id="cntAll" class="ml-1 opacity-75">0</span></button>
                <button id="tabEnt" onclick="switchUserTab('enterprise')" class="px-4 py-2 rounded-lg text-sm font-bold transition-colors text-gray-600 hover:bg-gray-50">🟢 企业用户 <span id="cntEnt" class="ml-1 opacity-60">0</span></button>
                <button id="tabPer" onclick="switchUserTab('personal')" class="px-4 py-2 rounded-lg text-sm font-bold transition-colors text-gray-600 hover:bg-gray-50">🔵 个人用户 <span id="cntPer" class="ml-1 opacity-60">0</span></button>
            </div>
            <!-- 状态筛选：带数量角标（与 H5 客户列表同口径） -->
            <div class="px-6 py-2.5 border-b border-gray-100 flex items-center gap-2 flex-wrap" id="statusChips"></div>
            <div class="overflow-x-auto scrollbar-thin">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="bg-gray-50 text-gray-500 text-left">
                            <th class="px-6 py-3 font-medium">类型</th>
                            <th class="px-6 py-3 font-medium">名称</th>
                            <th class="px-6 py-3 font-medium">客户来源</th>
                            <th class="px-6 py-3 font-medium">行业/职业</th>
                            <th class="px-6 py-3 font-medium">转化状态</th>
                            <th class="px-6 py-3 font-medium">线索</th>
                            <th class="px-6 py-3 font-medium">负责人</th>
                            <th class="px-6 py-3 font-medium">注册时间</th>
                            <th class="px-6 py-3 font-medium text-right">操作</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100" id="customerTable"></tbody>
                </table>
            </div>
            <div class="px-6 py-4 border-t border-gray-100 flex items-center justify-between text-sm text-gray-500">
                <span id="tableCount">共 0 条记录</span>
                <div class="flex items-center space-x-1">
                    <button class="px-3 py-1.5 border border-gray-200 rounded hover:bg-gray-50"><i class="fa fa-chevron-left"></i></button>
                    <button class="px-3 py-1.5 bg-brand-600 text-white rounded">1</button>
                    <button class="px-3 py-1.5 border border-gray-200 rounded hover:bg-gray-50"><i class="fa fa-chevron-right"></i></button>
                </div>
            </div>
        </div>
    </main>

    <!-- 客户详情抽屉 -->
    <div id="overlay" class="fixed inset-0 bg-black/30 z-40 hidden" onclick="closeDrawer()"></div>
    <aside id="drawer" class="fixed top-0 right-0 h-full w-full max-w-[520px] bg-white shadow-2xl z-50 drawer-transition transform translate-x-full overflow-y-auto scrollbar-thin">
        <div class="sticky top-0 bg-white border-b border-gray-100 px-6 py-4 flex items-center justify-between z-10">
            <h3 class="font-semibold text-gray-800">客户详情</h3>
            <button onclick="closeDrawer()" class="w-8 h-8 rounded-lg hover:bg-gray-100 flex items-center justify-center text-gray-500">
                <i class="fa fa-times"></i>
            </button>
        </div>
        <div id="drawerBody" class="p-6"></div>
    </aside>

    <!-- 录入企业弹窗 -->
    <div id="newCustomerOverlay" class="fixed inset-0 bg-black/40 z-[60] hidden items-center justify-center modal-transition">
        <div class="bg-white rounded-2xl w-full max-w-[560px] shadow-2xl max-h-[88vh] overflow-y-auto scrollbar-thin">
            <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between sticky top-0 bg-white">
                <h3 class="font-semibold text-gray-800">录入企业</h3>
                <button onclick="closeNewCustomer()" class="w-8 h-8 rounded-lg hover:bg-gray-100 flex items-center justify-center text-gray-500"><i class="fa fa-times"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div class="col-span-2"><label class="text-xs text-gray-500 mb-1 block">企业名称 <span class="text-red-500">*</span></label>
                        <input id="ncName" type="text" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-500" placeholder="如：星河智造科技有限公司"></div>
                    <div><label class="text-xs text-gray-500 mb-1 block">统一社会信用代码</label><input id="ncCode" type="text" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-500"></div>
                    <div><label class="text-xs text-gray-500 mb-1 block">联系人</label><input id="ncContact" type="text" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-500"></div>
                    <div><label class="text-xs text-gray-500 mb-1 block">手机号</label><input id="ncPhone" type="text" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-500"></div>
                    <div><label class="text-xs text-gray-500 mb-1 block">行业</label><input id="ncIndustry" type="text" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-500" placeholder="如：电子信息"></div>
                    <div><label class="text-xs text-gray-500 mb-1 block">所在地区</label><input id="ncRegion" type="text" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-500" placeholder="如：杭州市余杭区"></div>
                    <div><label class="text-xs text-gray-500 mb-1 block">已有资质（顿号分隔）</label><input id="ncQuals" type="text" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-500" placeholder="高新技术企业、专精特新"></div>
                    <div><label class="text-xs text-gray-500 mb-1 block">意向状态</label>
                        <select id="ncStatus" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-500">
                            <option>潜在客户</option><option>意向客户</option><option>成交客户</option>
                        </select></div>
                </div>
                <p class="text-[11px] text-gray-400"><i class="fa fa-info-circle mr-1"></i>客户由客服统一录入，来源记为「客服录入」，无平台账号，仅支持外链触达；客户注册后自动转为「平台注册」。销售端不在此录入客户，仅接收客服分配的客户并跟进。</p>
            </div>
            <div class="px-6 py-4 border-t border-gray-100 flex justify-end space-x-3 sticky bottom-0 bg-white">
                <button onclick="closeNewCustomer()" class="px-5 py-2.5 border border-gray-200 rounded-lg text-sm text-gray-600 hover:bg-gray-50">取消</button>
                <button onclick="submitNewCustomer()" class="px-5 py-2.5 bg-brand-600 text-white rounded-lg text-sm hover:bg-brand-700">确认录入</button>
            </div>
        </div>
    </div>

    <!-- 编辑客户弹窗 -->
    <div id="editCustomerOverlay" class="fixed inset-0 bg-black/40 z-[60] hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full shadow-2xl" style="max-width:540px;max-height:88vh;display:flex;flex-direction:column;">
            <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between flex-shrink-0">
                <h3 class="font-semibold text-gray-800"><i class="fa fa-pencil text-brand-600 mr-1"></i>编辑客户资料</h3>
                <button onclick="closeEditCustomer()" class="w-8 h-8 rounded-lg hover:bg-gray-100 flex items-center justify-center text-gray-500"><i class="fa fa-times"></i></button>
            </div>
            <div class="p-6 overflow-y-auto space-y-4" style="flex:1;">
                <div id="ecEntGroup" class="space-y-4">
                    <div><label class="text-xs text-gray-500 mb-1 block">企业名称 <span class="text-red-500">*</span></label><input id="ecName" type="text" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-500"></div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="text-xs text-gray-500 mb-1 block">统一社会信用代码</label><input id="ecCode" type="text" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-500"></div>
                        <div><label class="text-xs text-gray-500 mb-1 block">联系人</label><input id="ecContact" type="text" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-500"></div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="text-xs text-gray-500 mb-1 block">手机号</label><input id="ecPhone" type="text" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-500"></div>
                        <div><label class="text-xs text-gray-500 mb-1 block">行业</label><input id="ecIndustry" type="text" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-500"></div>
                    </div>
                    <div><label class="text-xs text-gray-500 mb-1 block">所在地区</label><input id="ecRegion" type="text" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-500"></div>
                    <div><label class="text-xs text-gray-500 mb-1 block">已有资质（顿号分隔）</label><input id="ecQuals" type="text" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-500"></div>
                </div>
                <div id="ecPerGroup" class="space-y-4 hidden">
                    <div><label class="text-xs text-gray-500 mb-1 block">姓名 <span class="text-red-500">*</span></label><input id="ecRealName" type="text" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-500"></div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="text-xs text-gray-500 mb-1 block">手机号</label><input id="ecPerPhone" type="text" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-500"></div>
                        <div><label class="text-xs text-gray-500 mb-1 block">职业</label><input id="ecOccupation" type="text" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-500"></div>
                    </div>
                    <div><label class="text-xs text-gray-500 mb-1 block">所在地区</label><input id="ecPerRegion" type="text" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-500"></div>
                </div>
                <div><label class="text-xs text-gray-500 mb-1 block">转化状态</label>
                    <select id="ecStatus" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-500"></select>
                </div>
            </div>
            <div class="px-6 py-4 border-t border-gray-100 flex justify-end space-x-3 flex-shrink-0">
                <button onclick="closeEditCustomer()" class="px-5 py-2.5 border border-gray-200 rounded-lg text-sm text-gray-600 hover:bg-gray-50">取消</button>
                <button onclick="submitEditCustomer()" class="px-5 py-2.5 bg-brand-600 text-white rounded-lg text-sm font-medium hover:bg-brand-700">保存修改</button>
            </div>
        </div>
    </div>

    <!-- 分配记录弹窗 -->
    <div id="assignLogOverlay" class="fixed inset-0 bg-black/40 z-[60] hidden items-center justify-center modal-transition">
        <div class="bg-white rounded-2xl w-full shadow-2xl" style="max-width:760px;max-height:86vh;display:flex;flex-direction:column;">
            <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between flex-shrink-0">
                <div>
                    <h3 class="font-semibold text-gray-800"><i class="fa fa-exchange text-brand-600 mr-1"></i>客户分配记录</h3>
                    <p class="text-xs text-gray-400 mt-0.5">记录客服把客户分配给销售的完整流水，按时间倒序</p>
                </div>
                <button onclick="closeAssignLog()" class="w-8 h-8 rounded-lg hover:bg-gray-100 flex items-center justify-center text-gray-500"><i class="fa fa-times"></i></button>
            </div>
            <div class="p-6 overflow-y-auto" style="flex:1;" id="assignLogBody"></div>
        </div>
    </div>

    <!-- 导入名单弹窗 -->
    <div id="importOverlay" class="fixed inset-0 bg-black/40 z-[60] hidden items-center justify-center modal-transition">
        <div class="bg-white rounded-2xl w-full max-w-[560px] shadow-2xl">
            <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
                <h3 class="font-semibold text-gray-800">导入客户名单</h3>
                <button onclick="closeImport()" class="w-8 h-8 rounded-lg hover:bg-gray-100 flex items-center justify-center text-gray-500"><i class="fa fa-times"></i></button>
            </div>
            <div class="p-6">
                <div class="flex items-center gap-3 mb-4">
                    <label class="text-xs text-gray-500 flex-shrink-0">客户来源</label>
                    <select id="importSource" class="px-3 py-2 border border-gray-200 rounded-lg text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-brand-500">
                        <option>天眼查</option>
                        <option>批量导入</option>
                    </select>
                    <span class="text-[11px] text-gray-400">选定后整批导入的客户都标记为该来源</span>
                </div>
                <div class="border border-dashed border-gray-300 rounded-xl p-6 text-center bg-gray-50">
                    <i class="fa fa-file-excel-o text-3xl text-brand-600 mb-2"></i>
                    <p class="text-sm text-gray-700 font-medium">支持 .xlsx / .xls / .csv</p>
                    <p class="text-xs text-gray-400 mt-1">表头：企业名称、联系人、手机号、行业、意向状态</p>
                    <input id="importFile" type="file" accept=".xlsx,.xls,.csv" class="hidden" onchange="parseImportFile(event)">
                    <div class="flex justify-center gap-2 mt-4">
                        <button onclick="document.getElementById('importFile').click()" class="px-4 py-2 bg-brand-600 text-white rounded-lg text-xs font-bold hover:bg-brand-700"><i class="fa fa-upload mr-1"></i>选择文件</button>
                        <button onclick="downloadTemplate()" class="px-4 py-2 border border-gray-200 text-gray-600 rounded-lg text-xs hover:bg-white"><i class="fa fa-download mr-1"></i>下载模板</button>
                    </div>
                </div>
                <div id="importPreview" class="mt-4"></div>
            </div>
            <div class="px-6 py-4 border-t border-gray-100 flex justify-end space-x-3">
                <button onclick="closeImport()" class="px-5 py-2.5 border border-gray-200 rounded-lg text-sm text-gray-600 hover:bg-gray-50">取消</button>
                <button onclick="confirmImport()" class="px-5 py-2.5 bg-brand-600 text-white rounded-lg text-sm hover:bg-brand-700 disabled:opacity-40">确认导入</button>
            </div>
        </div>
    </div>

    <script src="libs/js/xlsx.full.min.js"></script>
    <script src="data-bridge.js?v=20261016g"></script>
    <script>
        var CUSTOMERS = [];
        var CURRENT_ID = null;   // 抽屉当前用户
        var CURRENT_TAB = 'all'; // 用户类型 tab：all / enterprise / personal
        var STATUS_FILTER = '全部'; // 状态筛选（带数量角标）
        var DRAWER_TAB = 'credits'; // 抽屉内选项卡：credits 策能值记录 / orders 服务商城订单 / reports 报告存档 / leads 线索记录 / records 分配与转化

        // 客户来源（首次获取渠道）与账号状态分离：registered=true 表示已有平台账号
        var SOURCE_COLORS = { '平台注册': 'bg-blue-50 text-blue-700', '客服录入': 'bg-orange-50 text-orange-700', '销售录入': 'bg-orange-50 text-orange-700', '批量导入': 'bg-gray-100 text-gray-600', '天眼查': 'bg-purple-50 text-purple-700' };
        function customerSource(u) { return u.source || '平台注册'; }
        function hasAccount(u) {
            if (typeof u.registered === 'boolean') return u.registered;
            return customerSource(u) === '平台注册';
        }
        // 来源多选筛选（复选框式，可多选；未选中任何项 = 全部）
        var SOURCE_OPTIONS = [['__registered', '已注册账号'], ['天眼查', '天眼查'], ['平台注册', '平台注册'], ['客服录入', '客服录入'], ['批量导入', '批量导入']];
        var SOURCE_FILTER = [];
        function renderSourceChips() {
            var box = document.getElementById('sourceFilter');
            if (!box) return;
            box.innerHTML = SOURCE_OPTIONS.map(function(o) {
                var on = SOURCE_FILTER.indexOf(o[0]) !== -1;
                return '<button type="button" onclick="toggleSource(\'' + o[0] + '\')" class="px-3 py-1.5 rounded-full border text-xs font-medium transition-colors ' +
                    (on ? 'bg-brand-600 border-brand-600 text-white' : 'bg-white border-gray-200 text-gray-600 hover:border-brand-400 hover:text-brand-600') + '">' +
                    (on ? '<i class="fa fa-check mr-1"></i>' : '') + o[1] + '</button>';
            }).join('');
        }
        function toggleSource(v) {
            var i = SOURCE_FILTER.indexOf(v);
            if (i === -1) SOURCE_FILTER.push(v); else SOURCE_FILTER.splice(i, 1);
            renderSourceChips();
            renderTable();
        }

        // 手机号匹配：直接包含；若库里是脱敏号码（138****1234），用前段+后段校验完整号码
        function phoneMatch(phone, kw) {
            var p = String(phone || '').toLowerCase();
            if (!p) return false;
            if (p.indexOf(kw) !== -1) return true;
            if (!/^\d{7,}$/.test(kw)) return false;
            var star = p.indexOf('*');
            if (star === -1) return false;
            var pre = p.slice(0, star).replace(/[^0-9]/g, '');
            var suf = p.slice(p.lastIndexOf('*') + 1).replace(/[^0-9]/g, '');
            return kw.indexOf(pre) === 0 && kw.slice(-suf.length) === suf;
        }

        var AVATAR_COLORS = ['bg-brand-100 text-brand-700', 'bg-blue-100 text-blue-700', 'bg-purple-100 text-purple-700', 'bg-orange-100 text-orange-700', 'bg-teal-100 text-teal-700', 'bg-pink-100 text-pink-700'];
        // 企业状态色
        var ENT_STATUS_COLORS = { '潜在客户': 'bg-blue-50 text-blue-700', '意向客户': 'bg-orange-50 text-orange-700', '成交客户': 'bg-emerald-50 text-emerald-700', '流失客户': 'bg-gray-100 text-gray-500' };
        // 个人状态色
        var PER_STATUS_COLORS = { '潜在用户': 'bg-blue-50 text-blue-700', '意向用户': 'bg-orange-50 text-orange-700', '活跃用户': 'bg-emerald-50 text-emerald-700', '沉睡用户': 'bg-gray-100 text-gray-500' };
        function statusColor(u) {
            if (u.type === 'personal') return PER_STATUS_COLORS[u.status] || 'bg-gray-100 text-gray-500';
            return ENT_STATUS_COLORS[u.status] || 'bg-gray-100 text-gray-500';
        }

        function load() {
            CUSTOMERS = DataBridge.loadCustomers();
            // 迁移：旧数据无 type 字段则补 enterprise，无 registerTime 则补默认值
            CUSTOMERS.forEach(function(u) {
                if (!u.type) u.type = 'enterprise';
                if (!u.registerTime) u.registerTime = '';
                if (!u.source) u.source = '平台注册';
                if (u.source === '销售录入') u.source = '客服录入';
                if (!u.owner) u.owner = '';
                if (u.credits == null) u.credits = 0;
                if (!Array.isArray(u.creditHistory)) u.creditHistory = [];
                if (!Array.isArray(u.assignHistory)) u.assignHistory = [];
                if (!Array.isArray(u.statusHistory)) u.statusHistory = [];
            });
            renderSourceChips();
            renderTable();
        }

        // ===== 工具 =====
        function esc(s) {
            return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        function getCustomer(id) {
            for (var i = 0; i < CUSTOMERS.length; i++) if (CUSTOMERS[i].id === id) return CUSTOMERS[i];
            return null;
        }
        function nextId() {
            var max = 0;
            CUSTOMERS.forEach(function(c) { var n = parseInt(String(c.id).replace(/\D/g, '')) || 0; if (n > max) max = n; });
            return 'U' + String(max + 1).padStart(3, '0');
        }
        function persist() { DataBridge.saveCustomers(CUSTOMERS); }

        // ===== Tab 切换 =====
        function switchUserTab(tab) {
            CURRENT_TAB = tab;
            STATUS_FILTER = '全部';
            document.getElementById('tabAll').className = 'px-4 py-2 rounded-lg text-sm font-bold transition-colors ' + (tab === 'all' ? 'bg-brand-600 text-white' : 'text-gray-600 hover:bg-gray-50');
            document.getElementById('tabEnt').className = 'px-4 py-2 rounded-lg text-sm font-bold transition-colors ' + (tab === 'enterprise' ? 'bg-brand-600 text-white' : 'text-gray-600 hover:bg-gray-50');
            document.getElementById('tabPer').className = 'px-4 py-2 rounded-lg text-sm font-bold transition-colors ' + (tab === 'personal' ? 'bg-brand-600 text-white' : 'text-gray-600 hover:bg-gray-50');
            renderTable();
        }

        // ===== 状态筛选 chips（带数量角标） =====
        function statusOptions() {
            if (CURRENT_TAB === 'enterprise') return ['全部', '潜在客户', '意向客户', '成交客户', '流失客户'];
            if (CURRENT_TAB === 'personal') return ['全部', '潜在用户', '意向用户', '活跃用户', '沉睡用户'];
            return ['全部', '潜在客户', '意向客户', '成交客户', '潜在用户', '意向用户', '活跃用户'];
        }
        function renderStatusChips() {
            var opts = statusOptions();
            var base = CUSTOMERS.filter(function(c) {
                return CURRENT_TAB === 'all' || c.type === CURRENT_TAB;
            });
            document.getElementById('statusChips').innerHTML = opts.map(function(o) {
                var n = o === '全部' ? base.length : base.filter(function(c) { return c.status === o; }).length;
                var on = o === STATUS_FILTER;
                return '<button onclick="switchStatus(\'' + o + '\')" class="px-2.5 py-1 rounded-full text-xs transition-colors ' +
                    (on ? 'bg-brand-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200') + '">' + o +
                    ' <span class="' + (on ? 'opacity-75' : 'text-gray-400') + '">' + n + '</span></button>';
            }).join('');
        }
        function switchStatus(s) { STATUS_FILTER = s; renderTable(); }

        // ===== 列表渲染 =====
        function filteredCustomers() {
            var kw = (document.getElementById('searchInput').value || '').trim().toLowerCase();
            var ind = document.getElementById('filterIndustry').value;
            return CUSTOMERS.filter(function(c) {
                if (CURRENT_TAB !== 'all' && c.type !== CURRENT_TAB) return false;
                if (kw) {
                    // 企业：搜 企业名称/统一社会信用代码/联系人/手机号；个人：搜 姓名/手机号/职业
                    var hay = c.type === 'personal' ? ((c.realName || '') + ' ' + (c.phone || '') + ' ' + (c.occupation || '')) : ((c.name || '') + ' ' + (c.code || '') + ' ' + (c.contact || '') + ' ' + (c.phone || ''));
                    if (hay.toLowerCase().indexOf(kw) === -1 && !phoneMatch(c.phone, kw)) return false;
                }
                if (ind) {
                    // 行业筛选只对企业生效
                    if (c.type === 'enterprise' && c.industry !== ind) return false;
                }
                if (SOURCE_FILTER.length) {
                    var srcHit = SOURCE_FILTER.some(function(f) {
                        return f === '__registered' ? hasAccount(c) : customerSource(c) === f;
                    });
                    if (!srcHit) return false;
                }
                var ownerF = (document.getElementById('filterOwner') || {}).value || '';
                if (ownerF) {
                    if (ownerF === '__none') { if (c.owner) return false; }
                    else if ((c.owner || '') !== ownerF) return false;
                }
                if (STATUS_FILTER !== '全部' && c.status !== STATUS_FILTER) return false;
                return true;
            });
        }

        function renderTable() {
            // 更新 tab 徽章
            document.getElementById('cntAll').textContent = CUSTOMERS.length;
            var entCnt = CUSTOMERS.filter(function(u){ return u.type === 'enterprise'; }).length;
            var perCnt = CUSTOMERS.filter(function(u){ return u.type === 'personal'; }).length;
            document.getElementById('cntEnt').textContent = entCnt;
            document.getElementById('cntPer').textContent = perCnt;
            var list = filteredCustomers();
            var tbody = document.getElementById('customerTable');
            if (!list.length) {
                tbody.innerHTML = '<tr><td colspan="10" class="px-6 py-10 text-center text-gray-400 text-sm"><i class="fa fa-inbox mr-1"></i>暂无' + (CURRENT_TAB === 'enterprise' ? '企业' : CURRENT_TAB === 'personal' ? '个人' : '') + '客户</td></tr>';
            } else {
                tbody.innerHTML = list.map(function(u, i) {
                    var typeLabel = u.type === 'personal' ? '<span class="px-2 py-0.5 bg-blue-50 text-blue-700 rounded text-xs font-bold">🔵 个人</span>' : '<span class="px-2 py-0.5 bg-brand-50 text-brand-700 rounded text-xs font-bold">🟢 企业</span>';
                    var mainName = u.type === 'personal' ? (u.realName || '—') : u.name;
                    var subLine = u.type === 'personal' ? (u.phone || '—') : (u.code || '—');
                    var indOrJob = u.type === 'personal' ? (u.occupation || '—') : (u.industry || '—');
                    var src = customerSource(u);
                    var srcBadge = '<span class="px-2 py-0.5 rounded text-xs ' + (SOURCE_COLORS[src] || 'bg-gray-100 text-gray-600') + '">' + esc(src) + '</span>' +
                        (hasAccount(u)
                            ? (src === '平台注册' ? '' : '<span class="text-[10px] text-emerald-600 ml-1" title="' + esc('首次来源：' + src + (u.registerTime ? ' · ' + u.registerTime + ' 注册' : '')) + '">已注册</span>')
                            : '<span class="text-[10px] text-gray-400 ml-1">仅外链触达</span>');
                    return '<tr class="hover:bg-brand-50/40 cursor-pointer" onclick="openDrawer(\'' + u.id + '\')">' +
                        '<td class="px-6 py-3.5">' + typeLabel + '</td>' +
                        '<td class="px-6 py-3.5"><div class="flex items-center space-x-3">' +
                            '<div class="w-9 h-9 ' + AVATAR_COLORS[i % 6] + ' rounded-lg flex items-center justify-center font-semibold text-sm">' + esc((u.type === 'personal' ? u.realName : u.name) || '—').charAt(0) + '</div>' +
                            '<div><p class="font-medium text-gray-800">' + esc(mainName) + '</p><p class="text-xs text-gray-400">' + esc(subLine) + '</p></div>' +
                        '</div></td>' +
                        '<td class="px-6 py-3.5">' + srcBadge + '</td>' +
                        '<td class="px-6 py-3.5"><span class="text-gray-600">' + esc(indOrJob) + '</span></td>' +
                        '<td class="px-6 py-3.5"><span class="px-2.5 py-1 rounded-full text-xs ' + statusColor(u) + '">' + esc(u.status || '—') + '</span></td>' +
                        '<td class="px-6 py-3.5">' + leadsCell(u) + '</td>' +
                        '<td class="px-6 py-3.5">' + ownerSelect(u) + '</td>' +
                        '<td class="px-6 py-3.5 text-gray-500 text-xs">' + esc(u.registerTime || (hasAccount(u) ? '—' : '未注册平台')) + '</td>' +
                        '<td class="px-6 py-3.5 text-right">' +
                            '<button class="text-gray-500 hover:text-gray-700 mr-1" title="编辑资料" onclick="event.stopPropagation();openEditCustomer(\'' + u.id + '\')"><i class="fa fa-pencil"></i></button>' +
                            '<button class="text-brand-600 hover:text-brand-700 mr-1" title="查看详情" onclick="event.stopPropagation();openDrawer(\'' + u.id + '\')"><i class="fa fa-eye"></i></button>' +
                            '<button class="text-blue-600 hover:text-blue-700 mr-1" title="政策雷达匹配" onclick="event.stopPropagation();window.parent&&window.parent.switchPage?window.parent.switchPage(\'policy-radar.html\',null):(window.location.href=\'policy-radar.html\')"><i class="fa fa-radar"></i></button>' +
                            '<button class="text-indigo-500 hover:text-indigo-600" title="分配与转化记录" onclick="event.stopPropagation();openDrawer(\'' + u.id + '\', \'record\')"><i class="fa fa-exchange"></i></button>' +
                        '</td></tr>';
                }).join('');
            }
            document.getElementById('tableCount').textContent = '共 ' + list.length + ' 条记录';
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('filterIndustry').value = '';
            SOURCE_FILTER = [];
            renderSourceChips();
            document.getElementById('filterOwner').value = '';
            STATUS_FILTER = '全部';
            renderTable();
        }

        // ===== 录入企业 / 导入名单（与 H5 客户模块同口径） =====
        function openNewCustomer() {
            ['ncName','ncCode','ncContact','ncPhone','ncIndustry','ncRegion','ncQuals'].forEach(function(id) {
                document.getElementById(id).value = '';
            });
            document.getElementById('ncStatus').value = '潜在客户';
            var el = document.getElementById('newCustomerOverlay');
            el.classList.remove('hidden'); el.classList.add('flex');
        }
        function closeNewCustomer() {
            var el = document.getElementById('newCustomerOverlay');
            el.classList.add('hidden'); el.classList.remove('flex');
        }
        function submitNewCustomer() {
            var name = document.getElementById('ncName').value.trim();
            if (!name) { alert('请先填写企业名称'); return; }
            if (CUSTOMERS.some(function(c) { return c.type !== 'personal' && c.name === name; })) { alert('该企业已存在，请勿重复录入'); return; }
            var qualsRaw = document.getElementById('ncQuals').value.trim();
            CUSTOMERS.unshift({
                id: nextId(), type: 'enterprise', name: name,
                code: document.getElementById('ncCode').value.trim(),
                contact: document.getElementById('ncContact').value.trim(),
                phone: document.getElementById('ncPhone').value.trim(),
                industry: document.getElementById('ncIndustry').value.trim(),
                region: document.getElementById('ncRegion').value.trim(),
                quals: qualsRaw ? qualsRaw.split(/[、,，]/).map(function(s) { return s.trim(); }).filter(Boolean) : [],
                status: document.getElementById('ncStatus').value,
                source: '客服录入', registerTime: '',
                credits: 0, creditHistory: [], followups: []
            });
            persist(); closeNewCustomer();
            CURRENT_TAB = 'all'; STATUS_FILTER = '全部';
            switchUserTab('all');
        }

        // ===== 编辑客户资料 =====
        var EDIT_ID = null;
        function openEditCustomer(id) {
            var u = getCustomer(id);
            if (!u) return;
            EDIT_ID = id;
            var isPer = u.type === 'personal';
            document.getElementById('ecEntGroup').classList.toggle('hidden', isPer);
            document.getElementById('ecPerGroup').classList.toggle('hidden', !isPer);
            if (isPer) {
                document.getElementById('ecRealName').value = u.realName || u.name || '';
                document.getElementById('ecPerPhone').value = u.phone || '';
                document.getElementById('ecOccupation').value = u.occupation || '';
                document.getElementById('ecPerRegion').value = u.region || '';
            } else {
                document.getElementById('ecName').value = u.name || '';
                document.getElementById('ecCode').value = u.code || '';
                document.getElementById('ecContact').value = u.contact || '';
                document.getElementById('ecPhone').value = u.phone || '';
                document.getElementById('ecIndustry').value = u.industry || '';
                document.getElementById('ecRegion').value = u.region || '';
                document.getElementById('ecQuals').value = Array.isArray(u.quals) ? u.quals.join('、') : '';
            }
            var stOpts = isPer ? ['潜在用户', '意向用户', '活跃用户', '沉睡用户'] : ['潜在客户', '意向客户', '成交客户', '流失客户'];
            document.getElementById('ecStatus').innerHTML = stOpts.map(function(s) {
                return '<option' + ((u.status || stOpts[0]) === s ? ' selected' : '') + '>' + s + '</option>';
            }).join('');
            var el = document.getElementById('editCustomerOverlay');
            el.classList.remove('hidden'); el.classList.add('flex');
        }
        function closeEditCustomer() {
            var el = document.getElementById('editCustomerOverlay');
            el.classList.add('hidden'); el.classList.remove('flex');
        }
        function submitEditCustomer() {
            var u = getCustomer(EDIT_ID);
            if (!u) return;
            var isPer = u.type === 'personal';
            var newStatus = document.getElementById('ecStatus').value;
            if (isPer) {
                var rn = document.getElementById('ecRealName').value.trim();
                if (!rn) { alert('请填写姓名'); return; }
                u.realName = rn; u.name = rn;
                u.phone = document.getElementById('ecPerPhone').value.trim();
                u.occupation = document.getElementById('ecOccupation').value.trim();
                u.region = document.getElementById('ecPerRegion').value.trim();
            } else {
                var nm = document.getElementById('ecName').value.trim();
                if (!nm) { alert('请填写企业名称'); return; }
                u.name = nm;
                u.code = document.getElementById('ecCode').value.trim();
                u.contact = document.getElementById('ecContact').value.trim();
                u.phone = document.getElementById('ecPhone').value.trim();
                u.industry = document.getElementById('ecIndustry').value.trim();
                u.region = document.getElementById('ecRegion').value.trim();
                var q = document.getElementById('ecQuals').value.trim();
                u.quals = q ? q.split(/[、,，]/).map(function(s) { return s.trim(); }).filter(Boolean) : [];
            }
            // 转化状态变更同样留痕
            if (newStatus !== u.status) {
                var from = u.status || '—';
                if (!Array.isArray(u.statusHistory)) u.statusHistory = [];
                u.statusHistory.push({ time: nowStamp(), from: from, to: newStatus, note: '编辑资料时修改', by: '客服' });
                u.status = newStatus;
            }
            persist();
            closeEditCustomer();
            renderTable();
            if (CURRENT_ID === EDIT_ID) renderDrawer(u);
            showToast('客户资料已更新');
        }
        function callCustomer() {
            var u = getCustomer(CURRENT_ID);
            if (!u || !u.phone) { alert('该客户未填写手机号'); return; }
            window.location.href = 'tel:' + u.phone;
        }
        function sendMaterial() {
            closeDrawer();
            var url = 'share-management.html';
            if (window.parent && window.parent.switchPage) window.parent.switchPage(url, null);
            else window.location.href = url;
        }

        // ---- 导入名单（Excel / CSV） ----
        var IMPORT_ROWS = [];
        function openImportCustomers() {
            IMPORT_ROWS = [];
            document.getElementById('importPreview').innerHTML = '';
            document.getElementById('importFile').value = '';
            var el = document.getElementById('importOverlay');
            el.classList.remove('hidden'); el.classList.add('flex');
        }
        function closeImport() {
            var el = document.getElementById('importOverlay');
            el.classList.add('hidden'); el.classList.remove('flex');
        }
        function downloadTemplate() {
            if (!window.XLSX) { alert('XLSX 库未加载'); return; }
            var headers = ['企业名称', '联系人', '手机号', '行业', '意向状态'];
            var samples = [
                ['天启信息技术有限公司', '周海燕', '13800005566', '软件信息', '意向客户'],
                ['瑞丰食品科技有限公司', '孙德旺', '13700009900', '食品加工', '潜在客户'],
                ['东方精密机械有限公司', '钱国强', '13500007788', '装备制造', '成交客户']
            ];
            var ws = XLSX.utils.aoa_to_sheet([headers].concat(samples));
            ws['!cols'] = [{ wch: 24 }, { wch: 10 }, { wch: 14 }, { wch: 12 }, { wch: 14 }];
            var wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, '客户名单');
            XLSX.writeFile(wb, '客户导入模板.xlsx');
        }
        function parseImportFile(ev) {
            var f = (ev.target.files && ev.target.files[0]) || null;
            if (!f) return;
            if (!/\.(xlsx|xls|csv)$/i.test(f.name)) { alert('仅支持 .xlsx / .xls / .csv 文件'); return; }
            if (!window.XLSX) { alert('XLSX 库未加载'); return; }
            var reader = new FileReader();
            reader.onload = function(e) {
                try {
                    var wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
                    var sheet = wb.Sheets[wb.SheetNames[0]];
                    var rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
                    var ALIAS = {
                        name: ['企业名称', '公司名称', '名称', 'name'],
                        contact: ['联系人', '对接人', 'contact'],
                        phone: ['手机号', '电话', '手机', 'phone', 'tel'],
                        industry: ['行业', '所属行业', 'industry'],
                        status: ['意向状态', '状态', '客户状态', 'stage', 'status']
                    };
                    function cell(row, key) {
                        for (var k in row) if (ALIAS[key].indexOf(String(k).trim()) >= 0) return String(row[k] || '').trim();
                        return '';
                    }
                    IMPORT_ROWS = [];
                    var dup = 0;
                    rows.forEach(function(row) {
                        var name = cell(row, 'name');
                        if (!name) return;
                        if (CUSTOMERS.some(function(c) { return c.type !== 'personal' && c.name === name; }) || IMPORT_ROWS.some(function(r) { return r.name === name; })) { dup++; return; }
                        var st = cell(row, 'status');
                        if (st !== '潜在客户' && st !== '意向客户' && st !== '成交客户') st = '潜在客户';
                        IMPORT_ROWS.push({ name: name, contact: cell(row, 'contact'), phone: cell(row, 'phone'), industry: cell(row, 'industry'), status: st });
                    });
                    document.getElementById('importPreview').innerHTML =
                        '<div class="border border-gray-100 rounded-lg p-3">' +

                        '<span class="text-[10px] text-gray-400">' + esc(h.time) + ' · ' + esc(h.by || '客服') + '</span></div>';
                }).join('') + '</div>'
                : '<div class="border border-dashed border-gray-200 rounded-lg p-3 text-center"><p class="text-xs text-gray-400">暂无分配记录</p></div>';
            html += '</div>';
            html += '<div><p class="text-sm font-semibold text-gray-700 mb-2"><i class="fa fa-flag-o text-emerald-600 mr-1"></i>转化记录 (' + sHist.length + ')</p>';
            html += sHist.length
                ? '<div class="space-y-1.5">' + sHist.map(function(h) {
                    return '<div class="bg-white border border-gray-100 rounded-lg px-3 py-2">' +
                        '<div class="flex items-center justify-between"><span class="text-xs text-gray-700">' + esc(h.from) + ' → <span class="font-bold text-emerald-700">' + esc(h.to) + '</span></span>' +
                        '<span class="text-[10px] text-gray-400">' + esc(h.time) + ' · ' + esc(h.by || '客服') + '</span></div>' +
                        (h.note ? '<p class="text-[11px] text-gray-500 mt-1">' + esc(h.note) + '</p>' : '') + '</div>';
                }).join('') + '</div>'
                : '<div class="border border-dashed border-gray-200 rounded-lg p-3 text-center"><p class="text-xs text-gray-400">暂无转化记录</p></div>';
            html += '</div>';
            html += '</div>';   // 分配与转化面板结束

            document.getElementById('drawerBody').innerHTML = html;
        }

        // 打开报告存档 / 跳转智能报告
        function openReport(rid) {
            var url = 'report-viewer.html?id=' + rid;
            if (parent && parent.window && parent.window.switchPage) parent.window.switchPage(url, null);
            else window.location.href = url;
        }
        function goReport() {
            if (parent && parent.window && parent.window.switchPage) parent.window.switchPage('sales-report.html', null);
            else window.location.href = 'sales-report.html';
        }

        // 抽屉内选项卡切换（重绘抽屉即可同步按钮高亮与面板显隐）
        function switchDrawerTab(tab) {
            if (!CURRENT_ID) return;
            DRAWER_TAB = tab;
            var c = getCustomer(CURRENT_ID);
            if (c) renderDrawer(c);
        }

        /** 保存转化状态并记录流水 */
        function saveCustomerStatus() {
            if (!CURRENT_ID) return;
            var u = getCustomer(CURRENT_ID);
            if (!u) return;
            var to = document.getElementById('cdStatus').value;
            var note = (document.getElementById('cdStatusNote').value || '').trim();
            var from = u.status || '—';
            if (from === to && !note) { showToast('转化状态未变化'); return; }
            if (!Array.isArray(u.statusHistory)) u.statusHistory = [];
            u.statusHistory.push({ time: nowStamp(), from: from, to: to, note: note, by: '客服' });
            u.status = to;
            persist();
            renderTable();
            renderDrawer(u);
            showToast('已将「' + (u.name || u.realName || '客户') + '」标记为 ' + to + '，转化记录已保存');
        }

        // ===== 线索与负责人标记 =====
        var SALES_LIST = ['张销售', '王销售', '李销售'];
        function loadClueList() {
            try { return DataBridge.loadClues ? (DataBridge.loadClues() || []) : []; } catch (e) { return []; }
        }
        /** 该客户关联的线索（按企业名称或手机号匹配） */
        function leadsOf(obj) {
            var name = String(obj.name || '').trim();
            var phone = String(obj.phone || '').trim();
            if (!name && !phone) return [];
            return loadClueList().filter(function(c) {
                if (name && c.company && String(c.company).trim() === name) return true;
                if (phone && c.phone && String(c.phone).trim() === phone) return true;
                return false;
            });
        }
        function ownerOf(u) {
            if (u.owner) return u.owner;
            var ls = leadsOf(u).filter(function(c) { return !!c.sales; });
            return ls.length ? ls[0].sales : '';
        }
        /** 分配负责人：同步写入客户池与对应线索（线索认领后自动转「跟进中」），并记录分配流水 */
        function assignOwner(id, val) {
            var u = CUSTOMERS.filter(function(c) { return c.id === id; })[0];
            if (!u) return;
            var from = ownerOf(u) || '未分配';
            var to = val || '未分配';
            if (from !== to) {
                if (!Array.isArray(u.assignHistory)) u.assignHistory = [];
                u.assignHistory.push({ time: nowStamp(), from: from, to: to, by: '客服' });
            }
            u.owner = val || '';
            persist();
            var clues = loadClueList(), hit = 0;
            clues.forEach(function(c) {
                var match = (u.name && c.company === u.name) || (u.phone && c.phone && String(c.phone).trim() === String(u.phone).trim());
                if (!match) return;
                hit++;
                c.sales = val || '';
                c.salesInitial = val ? val.charAt(0) : '-';
                if (val && c.stage === '待跟进') c.stage = '跟进中';
            });
            if (hit && DataBridge.saveClues) DataBridge.saveClues(clues);
            if (from !== to) showToast('已将「' + (u.name || u.realName || '客户') + '」分配给 ' + to + '，已记入分配记录');
            renderTable();
        }

        function nowStamp() {
            var d = new Date();
            var p = function(n) { return String(n).padStart(2, '0'); };
            return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
        }

        function showToast(msg) {
            var el = document.getElementById('cmToast');
            if (!el) {
                el = document.createElement('div');
                el.id = 'cmToast';
                el.style.cssText = 'position:fixed;left:50%;bottom:32px;transform:translateX(-50%);z-index:9999;background:#0f172a;color:#fff;padding:10px 18px;border-radius:10px;font-size:12px;box-shadow:0 8px 24px rgba(15,23,42,.25);opacity:0;transition:opacity .2s;pointer-events:none;';
                document.body.appendChild(el);
            }
            el.textContent = msg;
            el.style.opacity = '1';
            clearTimeout(el._t);
            el._t = setTimeout(function() { el.style.opacity = '0'; }, 2400);
        }

        // ===== 分配记录（全局流水） =====
        function openAssignLog() {
            var rows = [];
            CUSTOMERS.forEach(function(u) {
                (u.assignHistory || []).forEach(function(h) {
                    rows.push({ time: h.time, name: u.name || u.realName || '—', type: u.type === 'personal' ? '个人' : '企业', from: h.from, to: h.to, by: h.by || '客服' });
                });
            });
            rows.sort(function(a, b) { return String(b.time).localeCompare(String(a.time)); });
            var body = document.getElementById('assignLogBody');
            if (!rows.length) {
                body.innerHTML = '<div class="border border-dashed border-gray-200 rounded-xl p-10 text-center text-gray-400 text-sm"><i class="fa fa-exchange mr-1"></i>暂无分配记录 · 在客户列表「负责人」下拉选择销售后自动记录</div>';
            } else {
                body.innerHTML = '<div class="flex items-center justify-between mb-3"><p class="text-xs text-gray-500">共 <span class="font-bold text-gray-700">' + rows.length + '</span> 条分配流水</p><p class="text-[11px] text-gray-400">分配后对应线索自动同步负责人</p></div>' +
                    '<div class="border border-gray-100 rounded-xl overflow-hidden"><table class="w-full text-sm"><thead><tr class="bg-gray-50 text-gray-500 text-left text-xs"><th class="px-4 py-2.5">时间</th><th class="px-4 py-2.5">客户</th><th class="px-4 py-2.5">类型</th><th class="px-4 py-2.5">原负责人</th><th class="px-4 py-2.5">新负责人</th><th class="px-4 py-2.5">操作人</th></tr></thead><tbody>' +
                    rows.map(function(r) {
                        return '<tr class="border-t border-gray-50"><td class="px-4 py-2.5 text-xs text-gray-500 whitespace-nowrap">' + esc(r.time) + '</td><td class="px-4 py-2.5 text-gray-700">' + esc(r.name) + '</td><td class="px-4 py-2.5 text-xs text-gray-500">' + r.type + '</td><td class="px-4 py-2.5 text-xs text-gray-500">' + esc(r.from) + '</td><td class="px-4 py-2.5 text-xs"><span class="px-2 py-0.5 rounded bg-brand-50 text-brand-700 font-bold">' + esc(r.to) + '</span></td><td class="px-4 py-2.5 text-xs text-gray-500">' + esc(r.by) + '</td></tr>';
                    }).join('') + '</tbody></table></div>';
            }
            var ov = document.getElementById('assignLogOverlay');
            ov.classList.remove('hidden'); ov.classList.add('flex');
        }
        function closeAssignLog() {
            var ov = document.getElementById('assignLogOverlay');
            ov.classList.add('hidden'); ov.classList.remove('flex');
        }
        function ownerSelect(u) {
            var cur = ownerOf(u);
            return '<select onclick="event.stopPropagation()" onchange="assignOwner(\'' + u.id + '\', this.value)" class="text-xs border border-gray-200 rounded-lg px-1.5 py-1 bg-white text-gray-700 focus:outline-none">' +
                '<option value=""' + (cur ? '' : ' selected') + '>未分配</option>' +
                SALES_LIST.map(function(n) { return '<option' + (cur === n ? ' selected' : '') + '>' + n + '</option>'; }).join('') +
                '</select>';
        }
        function leadsCell(u) {
            var ls = leadsOf(u);
            if (!ls.length) return '<span class="text-xs text-gray-300">—</span>';
            var tip = ls.map(function(c) { return (c.source || '线索') + ' · ' + (c.stage || '待跟进'); }).join('\n');
            return '<span class="px-2 py-0.5 bg-rose-50 text-rose-600 rounded text-xs font-bold" title="' + esc(tip) + '">' + ls.length + ' 条</span>';
        }
        // ===== 弹窗通用 =====
        function showOverlay(id) {
            var el = document.getElementById(id);
            el.classList.remove('hidden');
            el.classList.add('flex');
        }
        function hideOverlay(id) {
            var el = document.getElementById(id);
            el.classList.add('hidden');
            el.classList.remove('flex');
        }

        document.addEventListener('DOMContentLoaded', load);
    </script>
</body>
</html>
