<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能报告列表 - 策源易达政策销售平台</title>
    <link href="libs/css/tailwind.css" rel="stylesheet">
    <link href="libs/css/font-awesome.min.css" rel="stylesheet">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f6f8; }
        :root { --brand-50:#f0fdf4; --brand-100:#dcfce7; --brand-500:#22c55e; --brand-600:#16a34a; --brand-700:#15803d; }
        .bg-brand-600 { background-color: var(--brand-600); }
        .hover\:bg-brand-700:hover { background-color: var(--brand-700); }
        .text-brand-600 { color: var(--brand-600); }
        .bg-brand-50 { background-color: var(--brand-50); }
        .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 100; padding: 10px 20px; border-radius: 10px; font-size: 13px; color: #fff; box-shadow: 0 8px 20px rgba(0,0,0,.15); opacity: 0; transition: opacity .25s; pointer-events: none; }
        .toast.show { opacity: 1; }
        .page-title::before { content: ''; width: 4px; height: 18px; background: #16a34a; border-radius: 2px; margin-right: 10px; display: inline-block; vertical-align: middle; }
    </style>
</head>
<body class="min-h-screen">
    <div class="max-w-[1200px] mx-auto px-6 py-6">
        <!-- 顶部：标题 + 生成按钮 -->
        <div class="flex items-center justify-between flex-wrap gap-3 mb-5">
            <div>
                <h1 class="text-lg font-bold text-gray-800 page-title">智能报告</h1>
                <p class="text-xs text-gray-400 mt-1 ml-4">管理所有已生成的企业分析报告，点击「生成智能报告」可新建</p>
            </div>
            <button onclick="goGenerate()" class="px-5 py-2.5 bg-brand-600 text-white rounded-lg text-sm hover:bg-brand-700 font-bold shadow-sm"><i class="fa fa-plus mr-1.5"></i>生成智能报告</button>
        </div>

        <!-- 工具栏 -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 mb-4 flex items-center gap-3 flex-wrap">
            <div class="relative flex-1 min-w-[240px]">
                <i class="fa fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                <input id="kw" type="text" placeholder="搜索报告标题或客户名称" class="w-full pl-9 pr-3 py-2 border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500" oninput="render()">
            </div>
            <select id="sortBy" class="px-3 py-2 border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-500" onchange="render()">
                <option value="timeDesc">最新生成优先</option>
                <option value="timeAsc">最早生成优先</option>
                <option value="name">按报告标题</option>
            </select>
            <span class="text-xs text-gray-400" id="listCount"></span>
        </div>

        <!-- 列表 -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div id="listBody"></div>
            <div id="pager" class="px-5 py-3 border-t border-gray-100 flex items-center justify-between text-xs text-gray-500"></div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="data-bridge.js?v=20261126b"></script>
    <script>
        var REPORTS = [];
        var PAGE_SIZE = 15;
        var curPage = 1;

        function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
        function toast(msg, ok) {
            var t = document.getElementById('toast');
            t.textContent = msg; t.style.background = ok === false ? '#ef4444' : '#16a34a';
            t.classList.add('show'); setTimeout(function(){ t.classList.remove('show'); }, 2000);
        }
        // 在 iframe 壳内走 parent.switchPage，否则直接跳转
        function openPage(url) {
            // file:// 预览时 iframe 为不透明源（origin "null"），读取 parent 上的属性会抛 SecurityError
            try {
                if (parent && parent !== window && parent.window.switchPage) {
                    parent.window.switchPage(url, null);
                    return;
                }
            } catch (e) {}
            window.location.href = url;
        }

        function load() {
            REPORTS = DataBridge.loadSalesReports() || [];
            curPage = 1;
            render();
        }

        function getFiltered() {
            var kw = (document.getElementById('kw').value || '').trim().toLowerCase();
            var sb = document.getElementById('sortBy').value;
            var arr = REPORTS.filter(function(r) {
                if (kw) {
                    var hit = (r.title || '').toLowerCase().indexOf(kw) >= 0 || (r.customerName || '').toLowerCase().indexOf(kw) >= 0;
                    if (!hit) return false;
                }
                return true;
            });
            arr.sort(function(a, b) {
                if (sb === 'name') return (a.title || '').localeCompare(b.title || '', 'zh');
                var ta = a.createdAt || '', tb = b.createdAt || '';
                return sb === 'timeAsc' ? ta.localeCompare(tb) : tb.localeCompare(ta);
            });
            return arr;
        }

        function render() {
            var arr = getFiltered();
            document.getElementById('listCount').textContent = '共 ' + arr.length + ' 份';
            var body = document.getElementById('listBody');
            if (!arr.length) {
                body.innerHTML = '<div class="py-20 text-center text-gray-400"><i class="fa fa-inbox text-4xl mb-3 block"></i><p class="text-sm">暂无匹配的报告</p><button onclick="goGenerate()" class="mt-4 px-4 py-2 bg-brand-600 text-white rounded-lg text-xs hover:bg-brand-700 font-bold"><i class="fa fa-plus mr-1"></i>生成第一份报告</button></div>';
                document.getElementById('pager').innerHTML = '';
                return;
            }
            var totalPages = Math.max(1, Math.ceil(arr.length / PAGE_SIZE));
            if (curPage > totalPages) curPage = totalPages;
            var start = (curPage - 1) * PAGE_SIZE;
            var pageRows = arr.slice(start, start + PAGE_SIZE);

            var html = '<table class="w-full text-sm"><thead class="bg-gray-50 text-gray-500 text-xs"><tr>' +
                '<th class="text-left font-medium px-5 py-3">报告标题</th>' +
                '<th class="text-left font-medium px-4 py-3 w-40">客户</th>' +
                '<th class="text-left font-medium px-4 py-3 w-28">生成人</th>' +
                '<th class="text-center font-medium px-4 py-3 w-24">分享/浏览</th>' +
                '<th class="text-left font-medium px-4 py-3 w-40">生成时间</th>' +
                '<th class="text-right font-medium px-5 py-3 w-44">操作</th>' +
                '</tr></thead><tbody class="divide-y divide-gray-100">';
            pageRows.forEach(function(r) {
                var highCount = Array.isArray(r.policies) ? r.policies.filter(function(p){ return (p.matchLevel||'') === '高匹配' || (p.score||0) >= 80; }).length : 0;
                var sh = Array.isArray(r.shares) ? r.shares : [];
                var views = 0; sh.forEach(function(s){ if (Array.isArray(s.views)) views += s.views.length; });
                html += '<tr class="hover:bg-brand-50/40 transition-colors">' +
                    '<td class="px-5 py-3.5"><div class="font-medium text-gray-800 cursor-pointer hover:text-brand-600" onclick="viewReport(\'' + esc(r.id) + '\')">' + esc(r.title || '未命名报告') + '</div>' +
                    (highCount ? '<div class="text-[11px] text-gray-400 mt-0.5"><i class="fa fa-thumbs-up text-brand-600 mr-1"></i>高匹配 ' + highCount + ' 项</div>' : '') + '</td>' +
                    '<td class="px-4 py-3.5 text-gray-600 text-xs">' + esc(r.customerName || '-') + '</td>' +
                    '<td class="px-4 py-3.5 text-gray-600 text-xs"><i class="fa fa-user text-gray-300 mr-1"></i>' + esc(r.createdBy || '-') + '</td>' +
                    '<td class="px-4 py-3.5 text-center text-gray-500 text-xs">' + sh.length + ' / ' + views + '</td>' +
                    '<td class="px-4 py-3.5 text-gray-500 text-xs">' + esc(r.createdAt || '-') + '</td>' +
                    '<td class="px-5 py-3.5 text-right whitespace-nowrap">' +
                    '<button onclick="viewReport(\'' + esc(r.id) + '\')" title="查看" class="text-gray-500 hover:text-brand-600 px-2 text-xs"><i class="fa fa-eye mr-1"></i>查看</button>' +
                    '<button onclick="editReport(\'' + esc(r.id) + '\')" title="编辑" class="text-gray-500 hover:text-brand-600 px-2 text-xs"><i class="fa fa-edit mr-1"></i>编辑</button>' +
                    '<button onclick="delReport(\'' + esc(r.id) + '\')" title="删除" class="text-gray-400 hover:text-red-500 px-2 text-xs"><i class="fa fa-trash"></i></button>' +
                    '</td></tr>';
            });
            html += '</tbody></table>';
            body.innerHTML = html;

            // 分页器
            var pager = document.getElementById('pager');
            if (totalPages <= 1) { pager.innerHTML = '<span>共 ' + arr.length + ' 份</span>'; return; }
            var pagerHtml = '<span>第 ' + curPage + ' / ' + totalPages + ' 页，共 ' + arr.length + ' 份</span><div class="flex items-center gap-1">';
            pagerHtml += '<button ' + (curPage === 1 ? 'disabled' : '') + ' onclick="goPage(' + (curPage - 1) + ')" class="px-2.5 py-1 rounded border border-gray-200 hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed"><i class="fa fa-chevron-left text-[10px]"></i></button>';
            var from = Math.max(1, curPage - 2), to = Math.min(totalPages, curPage + 2);
            for (var p = from; p <= to; p++) {
                pagerHtml += '<button onclick="goPage(' + p + ')" class="px-2.5 py-1 rounded text-xs ' + (p === curPage ? 'bg-brand-600 text-white' : 'border border-gray-200 hover:bg-gray-50') + '">' + p + '</button>';
            }
            pagerHtml += '<button ' + (curPage === totalPages ? 'disabled' : '') + ' onclick="goPage(' + (curPage + 1) + ')" class="px-2.5 py-1 rounded border border-gray-200 hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed"><i class="fa fa-chevron-right text-[10px]"></i></button>';
            pagerHtml += '</div>';
            pager.innerHTML = pagerHtml;
        }

        function goPage(p) { curPage = p; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
        function goGenerate() { openPage('sales-report.html'); }
        function viewReport(id) { openPage('report-view.html?id=' + encodeURIComponent(id) + '&owner=1'); }
        function editReport(id) { openPage('sales-report.html?id=' + encodeURIComponent(id)); }
        function delReport(id) {
            if (!confirm('确定删除该报告？删除后不可恢复')) return;
            REPORTS = REPORTS.filter(function(x) { return x.id !== id; });
            DataBridge.saveSalesReports(REPORTS);
            toast('已删除');
            render();
        }

        document.addEventListener('DOMContentLoaded', load);
    </script>
</body>
</html>
