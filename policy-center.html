<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <link href="libs/css/tailwind.css" rel="stylesheet">
    <link href="libs/css/font-awesome.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
        .left-sidebar { background: linear-gradient(180deg, #e3f2fd 0%, #bbdefb 40%, #90caf9 80%, #64b5f6 100%); border-right: 1px solid rgba(255,255,255,0.4); }
        .scroll-thin::-webkit-scrollbar { width: 6px; }
        .scroll-thin::-webkit-scrollbar-thumb { background: rgba(59,130,246,0.3); border-radius: 3px; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .region-tab { cursor: pointer; transition: all .15s ease; white-space: nowrap; user-select: none; }
        .region-tab:hover { color: #2563eb; background: rgba(37,99,235,.06); }
        .region-tab.tab-active { background: #4f46e5; color: #fff; box-shadow: 0 4px 12px -4px rgba(79,70,229,.5); }
        .region-chip { cursor: pointer; transition: all .15s ease; white-space: nowrap; user-select: none; }
        .region-chip:hover { color: #2563eb; border-color: #2563eb; }
        .region-chip.chip-active { background: rgba(37,99,235,.10); color: #2563eb; border-color: #2563eb; font-weight: 700; }
        /* ===== 高级查询：参考图风格（纯文字标签） ===== */
        .aq-row { display: flex; align-items: flex-start; padding: 10px 0; border-bottom: 1px dashed #e2e8f0; }
        .aq-row:last-child { border-bottom: none; }
        .aq-label { width: 84px; flex-shrink: 0; color: #64748b; font-size: 13px; font-weight: 600; padding-top: 2px; }
        .aq-tags { flex: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 18px; }
        .aq-tag { color: #64748b; font-size: 13px; cursor: pointer; padding: 1px 2px; transition: all .12s; line-height: 1.8; }
        .aq-tag:hover { color: #2563eb; }
        .aq-tag.active { color: #2563eb; font-weight: 700; }
        .aq-toggle { color: #2563eb; font-size: 12px; cursor: pointer; flex-shrink: 0; padding-top: 3px; font-weight: 600; }
        .aq-toggle:hover { text-decoration: underline; }
        .aq-collapse { overflow: hidden; max-height: 30px; transition: max-height .25s ease; }
        .aq-collapse.open { max-height: 600px; }
        .aq-pager { color: #64748b; font-size: 12px; cursor: pointer; user-select: none; }
        .aq-pager span { margin: 0 4px; }
        .aq-pager .aq-page-cur { color: #2563eb; font-weight: 700; }
        /* 政策列表（精简卡片，参考政务公告列表） */
        .pc-card { display: flex; align-items: center; gap: 14px; background: #fff; border: 1px solid #eef2f7; border-radius: 10px; padding: 16px 22px; margin-bottom: 8px; cursor: pointer; transition: all .18s ease; }
        .pc-card:hover { border-color: #a5b4fc; box-shadow: 0 8px 20px -12px rgba(79,70,229,.22); transform: translateY(-1px); }
        .pc-card:hover .pc-title { color: #4f46e5; }
        .pc-title { font-size: 15px; font-weight: 700; color: #1e293b; transition: color .15s; line-height: 1.5; }
        .pc-meta { font-size: 12px; color: #94a3b8; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-top: 6px; }
        .pc-meta i { color: #c4b5fd; margin-right: 4px; }
        /* 条件区整体展开/收起（骑缝胶囊按钮） */
        .aq-more-wrap { position: relative; height: 0; }
        .aq-more-btn { position: absolute; left: 50%; transform: translateX(-50%); top: -12px; padding: 5px 22px; background: #fff; border: 1px solid #e2e8f0; border-radius: 999px; font-size: 12px; font-weight: 700; color: #64748b; cursor: pointer; transition: all .15s; box-shadow: 0 4px 12px -6px rgba(100,116,139,.4); z-index: 5; }
        .aq-more-btn:hover { color: #4f46e5; border-color: #a5b4fc; }
        .aq-more-btn i { transition: transform .2s; }
        .aq-more-btn.open i { transform: rotate(180deg); }
        .list-pager { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 20px 0 8px; font-size: 13px; color: #64748b; }
        .list-pager button { padding: 5px 12px; border: 1px solid #e2e8f0; background: #fff; border-radius: 6px; cursor: pointer; font-size: 12px; color: #475569; }
        .list-pager button:hover { border-color: #6366f1; color: #4f46e5; }
        .list-pager button:disabled { opacity: .4; cursor: not-allowed; }
        .list-pager select { padding: 4px 8px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 12px; }
        .policy-card { transition: all .2s ease; cursor: pointer; }
        .policy-card:hover { box-shadow: 0 8px 20px -10px rgba(79,70,229,.25); border-color: #818cf8; background: #fff; }
        @keyframes modalIn { from { opacity: 0; transform: translate(-50%, calc(-50% - 12px)) scale(0.97); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
        .animate-modal-in { animation: modalIn 0.18s cubic-bezier(0.4, 0, 0.2, 1) both; }
    </style>
    <script>

    <script>
        function goPage(url) {
            try { if (parent && parent.window && parent.window.switchPage) { parent.window.switchPage(url, null); return; } } catch (e) {}
            window.location.href = url;
        }

        var COND_LABELS = { duration:'企业成立年限', rdRatio:'研发费用占比', hiTechRatio:'高新产品收入占比', ipOwned:'核心自主知识产权', scale:'企业规模', industry:'行业类型', region:'注册地区', employees:'员工人数', rdInvest:'年度研发投入', revenue:'年度营业收入', netAssets:'净资产', capital:'注册资本', hiTechCert:'高新技术企业资质', smeCert:'科技型中小企业', gazelleCert:'专精特新资质', profit:'年度净利润', exportRatio:'出口收入占比', projectInvest:'项目总投入', qualification:'企业资质' };
        var COND_UNITS = { duration:'年', rdRatio:'%', hiTechRatio:'%', employees:'人', rdInvest:'万元', revenue:'万元', netAssets:'万元', capital:'万元', profit:'万元', exportRatio:'%', projectInvest:'万元' };
        function _normOp(op) { return ({ '>=':'≥', '<=':'≤', '==':'=', '=':'=' })[op] || op; }
        function conditionText(c) {
            var label = COND_LABELS[c.type] || c.type;
            var op = _normOp(c.op);
            var val = (c.val === true || c.val === 'true') ? '是' : (c.val === false || c.val === 'false') ? '否' : c.val;
            var unit = COND_UNITS[c.type] || '';
            if (c.type === 'qualification') return label + ' 包含 ' + val;
            if (val === '是' || val === '否') return label + '：' + val;
            if (val === undefined || val === null || val === '') return label + ' ' + op;
            return label + ' ' + op + ' ' + val + unit;
        }

        var LEVEL_STYLE = {
            '国家级': { bg:'#eef2ff', color:'#4f46e5', icon:'fa-flag' },
            '省级':   { bg:'#eff6ff', color:'#2563eb', icon:'fa-building' },
            '市级':   { bg:'#f0fdfa', color:'#0d9488', icon:'fa-building-o' },
            '区县级': { bg:'#fffbeb', color:'#d97706', icon:'fa-map-marker' },
            '区级':   { bg:'#fffbeb', color:'#d97706', icon:'fa-map-marker' }
        };
        var BATCH_BADGE = { open:['申报中','#059669','#ecfdf5'], upcoming:['未开始','#2563eb','#eff6ff'], closed:['已截止','#94a3b8','#f1f5f9'] };

        var POLICIES = DataBridge.loadPolicyLibrary();
        var STATE = { province:'all', city:'all', district:'all', kw:'', level:'all', industry:'all', batchStatus:'all', sort:'deadline', dept:'all', deptPage:1, hotKw:'', page:1, pageSize:20 };
        var ALL_LEVELS = ['国家级','省级','市级','区级'];
        var LEVEL_ORDER = { '国家级':1, '省级':2, '市级':3, '区级':4, '区县级':4 };
        // UI 显示「区级」，数据中存「区县级」，做映射

        function policyBatchStatus(p) {
            if (!p.batches || !p.batches.length) return 'perennial';
            var today = new Date();
            var hasOpen = p.batches.some(function(b){ return DataBridge.batchStatus(b, today) === 'open'; });
            if (hasOpen) {
                var urgent = p.batches.some(function(b){
                    if (DataBridge.batchStatus(b, today) !== 'open') return false;
                    var d = new Date(b.end); return (d - today) / 86400000 <= 7;
                });
                return urgent ? 'urgent' : 'open';
            }
            var hasUpcoming = p.batches.some(function(b){ return DataBridge.batchStatus(b, today) === 'upcoming'; });
            return hasUpcoming ? 'upcoming' : 'closed';
        }

        function latestBatch(p) {
            if (!p.batches || !p.batches.length) return null;

            // 优先申报中，其次未开始，最后最近截止
            var sorted = p.batches.slice().sort(function(a,b){ return String(a.end).localeCompare(String(b.end)); });

            if (open.length) return open[0];
            var upcoming = sorted.filter(function(b){ return DataBridge.batchStatus(b, today) === 'upcoming'; });
            if (upcoming.length) return upcoming[0];
            return sorted[sorted.length - 1];
        }

        function aggregate() {
            var provMap = {};
            POLICIES.forEach(function(p) {
                var prov = (p.region && p.region.province) || '全国';
                if (!provMap[prov]) provMap[prov] = { count:0, cities:{} };
                provMap[prov].count++;
                var city = p.region && p.region.city;
                if (city) {
                    if (!provMap[prov].cities[city]) provMap[prov].cities[city] = { count:0, districts:{} };
                    provMap[prov].cities[city].count++;
                    var dist = p.region && p.region.district;
                    if (dist) {
                        provMap[prov].cities[city].districts[dist] = (provMap[prov].cities[city].districts[dist] || 0) + 1;
                    }
                }
            });
            return provMap;
        }

            deptPagerEl.innerHTML = '<span class="' + (STATE.deptPage<=1?'opacity-40':'') + '" onclick="' + (STATE.deptPage>1?"setDeptPage("+(STATE.deptPage-1)+")":'') + '">❬</span><span class="aq-page-cur">' + STATE.deptPage + '</span>/<span>' + deptTotal + '</span><span class="' + (STATE.deptPage>=deptTotal?'opacity-40':'') + '" onclick="' + (STATE.deptPage<deptTotal?"setDeptPage("+(STATE.deptPage+1)+")":'') + '">❭</span>';

            var hotKeywords = ['国家级制造业单项冠军企业认定','T/SIA002软件企业评估','创新型中小企业','国家级工程研究中心认定','GB/T 29490知识产权管理体系','国家级重点实验室认定','国家级科技型中小企业认定','GB/T23001两化融合管理体系','国家高新技术企业认定','国家级专精特新"小巨人"企业认定','国家级工业设计中心认定','国家科学技术奖','国家知识产权优势企业认定'];
            var hotEl = document.getElementById('aqHot');
            hotEl.innerHTML = hotKeywords.map(function(k){ return aqTag(k, STATE.hotKw===k, "pickHot('" + k + "')"); }).join('');
        }

        function pickHot(kw) {
            STATE.hotKw = (STATE.hotKw === kw) ? '' : kw;
            STATE.page = 1;
            renderAdvancedFilters();
            renderCards();
        }

        function filtered() {
            var kw = STATE.kw.trim().toLowerCase();
            var list = POLICIES.filter(function(p) {
                var prov = (p.region && p.region.province) || '全国';
                if (STATE.province !== 'all' && prov !== STATE.province) return false;
                if (STATE.city !== 'all' && (!p.region || p.region.city !== STATE.city)) return false;
                if (STATE.district !== 'all' && (!p.region || p.region.district !== STATE.district)) return false;
                if (STATE.level !== 'all' && p.level !== uiLevelToData(STATE.level)) return false;
                if (STATE.industry !== 'all' && p.industry !== STATE.industry) return false;
                if (STATE.batchStatus !== 'all' && policyBatchStatus(p) !== STATE.batchStatus) return false;
                if (STATE.dept !== 'all' && p.dept !== STATE.dept) return false;
                if (STATE.hotKw) {
                    if (p.name.indexOf(STATE.hotKw) < 0) return false;
                }
                if (kw) {
                    var hay = (p.name + ' ' + p.dept + ' ' + (p.industry||'') + ' ' + regionText(p)).toLowerCase();
                    if (hay.indexOf(kw) < 0) return false;
                }
                return true;
            });
            // 排序
            var today = new Date();
            list.sort(function(a, b) {
                if (STATE.sort === 'level') {
                    return (LEVEL_ORDER[a.level] || 9) - (LEVEL_ORDER[b.level] || 9);
                }
                if (STATE.sort === 'effective') {
                    return String(b.effective || '').localeCompare(String(a.effective || ''));
                }
                // 默认按最新批次截止日期升序（即将截止的排前面）
                var ba = latestBatch(a), bb = latestBatch(b);
                var ea = ba ? ba.end : '9999-12-31';
                var eb = bb ? bb.end : '9999-12-31';
                return ea.localeCompare(eb);
            });
            return list;
        }

        // 条件区整体展开/收起
        var aqMoreOpen = false;
        function toggleAqMore() {
            aqMoreOpen = !aqMoreOpen;
            document.getElementById('aqMore').classList.toggle('hidden', !aqMoreOpen);
            var btn = document.getElementById('aqMoreToggle');
            btn.classList.toggle('open', aqMoreOpen);
            btn.innerHTML = aqMoreOpen ? '收起条件 <i class="fa fa-angle-up ml-1"></i>' : '展开更多条件 <i class="fa fa-angle-down ml-1"></i>';
        }

        function renderCards() {
            var list = filtered();
            var grid = document.getElementById('policyGrid');
            var empty = document.getElementById('emptyState');
            document.getElementById('totalCount').textContent = POLICIES.length;
            var desc = '共 <b class="text-indigo-600">' + list.length + '</b> 条政策';
            var crumbs = [];
            if (STATE.province !== 'all') crumbs.push(STATE.province);
            if (STATE.city !== 'all') crumbs.push(STATE.city);
            if (STATE.district !== 'all') crumbs.push(STATE.district);
            if (crumbs.length) desc = '<i class="fa fa-map-marker text-indigo-400 mr-1"></i>' + crumbs.join(' / ') + ' · ' + desc;
            if (STATE.kw.trim()) desc += ' · 关键词「' + STATE.kw.trim() + '」';
            var extra = [];
            if (STATE.level !== 'all') extra.push(STATE.level);
            if (STATE.industry !== 'all') extra.push(STATE.industry);
            if (STATE.batchStatus !== 'all') {
                var stMap = { urgent:'即将截止', open:'申报中', upcoming:'未开始', closed:'已截止', perennial:'常年受理' };
                extra.push(stMap[STATE.batchStatus]);
            }
            if (STATE.dept !== 'all') extra.push(STATE.dept);
            if (extra.length) desc += ' · 已选 ' + extra.join('、');
            document.getElementById('filterDesc').innerHTML = desc;

            if (!list.length) { grid.innerHTML = ''; empty.classList.remove('hidden'); document.getElementById('listPager').innerHTML=''; return; }
            empty.classList.add('hidden');

            // 分页
            var totalPages = Math.max(1, Math.ceil(list.length / STATE.pageSize));
            if (STATE.page > totalPages) STATE.page = totalPages;
            var pageStart = (STATE.page - 1) * STATE.pageSize;
            var pageList = list.slice(pageStart, pageStart + STATE.pageSize);

            // 层级徽章配色
            var LEVEL_BADGE = {
                '国家级': ['#dc2626', '#fef2f2'],
                '省级':   ['#2563eb', '#eff6ff'],
                '市级':   ['#059669', '#ecfdf5'],
                '区级':   ['#7c3aed', '#f5f3ff']
            };
            // 判断政策是否为"申报型"（用显式 policyType 字段）
            function hasBatch(p) { return DataBridge.isDeclaration(p); }
            // 根据政策"有什么"返回对应的展示信息
            function pcStatus(p) {
                if (!hasBatch(p)) {
                    // 通知/公告类：没有申报批次，用发布/生效日期
                    var pubDate = p.effective || (p.batches && p.batches[0] && p.batches[0].start) || '';
                    return { type:'notice', txt:'政策通知', icon:'fa-bell', days:null, open:false, pubDate: pubDate };
                }
                // 申报型：根据批次状态细分
                var st = policyBatchStatus(p);
                var b = latestBatch(p);
                if (st === 'perennial') return { type:'apply', txt:'常年受理', days:null, open:true, batch:b };
                if (st === 'closed') return { type:'apply', txt:'本期已结束', days:null, open:false, batch:b };
                if (st === 'upcoming' && b && b.start) {
                    var ds = Math.ceil((new Date(b.start) - new Date()) / 86400000);
                    return { type:'apply', txt:'距申报开始还有', days:Math.max(ds,0), open:false, batch:b };
                }
                var de = b && b.end ? Math.ceil((new Date(b.end) - new Date()) / 86400000) : 0;
                return { type:'apply', txt:'距申报结束还有', days:Math.max(de,0), open:true, batch:b };
            }

            grid.innerHTML = pageList.map(function(p) {
                // 简化卡片：只展示标题、发布单位、发布时间（参考政务公告列表）
                var pubDate = p.effective || (p.batches && p.batches[0] && p.batches[0].start) || '—';
                return '<div class="pc-card" onclick="openDetail(\'' + p.id + '\')">' +
                    '<div class="flex-1 min-w-0">' +
                        '<div class="pc-title truncate" title="' + p.name + '">' + p.name + '</div>' +
                        '<div class="pc-meta">' +
                            '<span><i class="fa fa-building"></i>' + (p.dept || '—') + '</span>' +
                            '<span><i class="fa fa-clock-o"></i>发布时间：' + pubDate + '</span>' +
                        '</div>' +
                    '</div>' +
                    '<i class="fa fa-chevron-right text-slate-300 text-xs ml-2"></i>' +
                '</div>';
            }).join('');

            // 分页控件
            var pager = document.getElementById('listPager');
            var pageOpts = '';
            for (var i = 1; i <= totalPages; i++) {
                pageOpts += '<option value="' + i + '"' + (i===STATE.page?' selected':'') + '>' + i + '</option>';
            }
            pager.innerHTML =
                '<span>共<b class="text-indigo-600 mx-1">' + list.length + '</b>条记录 ' + STATE.page + '/' + totalPages + '页</span>' +
                '<button onclick="gotoPage(1)"' + (STATE.page===1?' disabled':'') + '>首页</button>' +
                '<button onclick="gotoPage(' + (STATE.page-1) + ')"' + (STATE.page===1?' disabled':'') + '>上一页</button>' +
                '<button onclick="gotoPage(' + (STATE.page+1) + ')"' + (STATE.page===totalPages?' disabled':'') + '>下一页</button>' +
                '<button onclick="gotoPage(' + totalPages + ')"' + (STATE.page===totalPages?' disabled':'') + '>尾页</button>' +
                '<span>第</span><select onchange="gotoPage(this.value)">' + pageOpts + '</select><span>页</span>';
        }

        function gotoPage(p) {
            STATE.page = parseInt(p);
            renderCards();
        }

        // ===== 详情弹窗 =====
        function openDetail(id) {
            goPage('policy-detail.html?policyId=' + encodeURIComponent(id) + '&v=20250929a');
        }
        function closeDetail() {} // 保留兼容

        renderProvinceTabs();
        renderAdvancedFilters();
        renderCards();
    </script>
    <script src="libs/js/topbar.js"></script>
</body>
</html>
