<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分享管理 - 策源易达政策销售平台</title>
    <link href="libs/css/tailwind.css" rel="stylesheet">
    <link href="libs/css/font-awesome.min.css" rel="stylesheet">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
        .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
        :root { --brand-50:#f0fdf4; --brand-100:#dcfce7; --brand-500:#22c55e; --brand-600:#16a34a; --brand-700:#15803d; }
        .bg-brand-50 { background-color: var(--brand-50); }
        .bg-brand-50\/40:hover { background-color: #f0fdf466; }
        .bg-brand-100 { background-color: var(--brand-100); }
        .bg-brand-600 { background-color: var(--brand-600); }
        .hover\:bg-brand-700:hover { background-color: var(--brand-700); }
        .text-brand-600 { color: var(--brand-600); }
        .text-brand-700 { color: var(--brand-700); }
        .hover\:text-brand-700:hover { color: var(--brand-700); }
        .hover\:text-brand-600:hover { color: var(--brand-600); }
        .focus\:ring-brand-500:focus { --tw-ring-color: var(--brand-500); }
        /* 抽屉 */
        .drawer-mask { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 50; transition: opacity .2s; }
        .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 480px; max-width: 100%; background: #fff; z-index: 51; transform: translateX(100%); transition: transform .25s; box-shadow: -4px 0 20px rgba(0,0,0,.08); overflow-y: auto; }
        .drawer.open { transform: translateX(0); }
        .bar-cell { display: flex; align-items: center; gap: 8px; }
        .bar-track { flex: 1; height: 6px; background: #f1f5f9; border-radius: 3px; overflow: hidden; }
        .bar-fill { height: 100%; background: linear-gradient(90deg, #16a34a, #4ade80); border-radius: 3px; transition: width .3s; }
    </style>
    <script>
        // 登录拦截：未登录时强制跳转到登录页
        (function authGuard() {
            try {
                var p = localStorage.getItem('ceyuan_member_profile');
                if (!p) { window.location.href = 'login.html'; return; }
                var d = JSON.parse(p);
                if (!d || !d.phone) { window.location.href = 'login.html'; return; }
            } catch (e) {
                window.location.href = 'login.html';
            }
        })();
    </script>
</head>
<body class="bg-gray-50 min-h-screen">
    <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
        <div class="max-w-[1600px] mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-brand-600 rounded-lg flex items-center justify-center">
                    <i class="fa fa-share-alt text-white text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-gray-800">分享管理</h1>
                    <p class="text-xs text-gray-500">客户阅读行为追踪 · 数据来源于智能报告模块</p>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <button onclick="refresh()" class="text-sm text-brand-600 hover:text-brand-700"><i class="fa fa-refresh mr-1"></i>刷新</button>
                <button class="text-gray-600 hover:text-brand-600"><i class="fa fa-bell"></i></button>
                <div class="flex items-center space-x-2">
                    <div class="w-9 h-9 rounded-full bg-brand-100 flex items-center justify-center text-brand-700 font-semibold">张</div>
                    <span class="text-sm text-gray-700">张销售</span>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-[1600px] mx-auto px-6 py-6">
        <!-- 列表 -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between flex-wrap gap-3">
                <h2 class="font-semibold text-gray-800">客户阅读行为记录</h2>
                <div class="flex items-center space-x-2 text-sm">
                    <input id="q" oninput="render()" type="text" placeholder="搜索客户/企业/报告" class="px-3 py-1.5 border border-gray-200 rounded-md focus:outline-none focus:ring-1 focus:ring-brand-500 text-xs w-52">
                    <select id="filter" onchange="render()" class="px-3 py-1.5 border border-gray-200 rounded-md text-gray-600 text-xs">
                        <option value="">全部状态</option>
                        <option value="opened">已打开</option>
                        <option value="silent">未打开</option>
                    </select>
                    <button onclick="gotoReportMgr()" class="px-3 py-1.5 border border-brand-600 text-brand-600 rounded-md text-xs hover:bg-brand-50 font-bold"><i class="fa fa-plus mr-1"></i>生成报告并分享</button>
                </div>
            </div>
            <div class="overflow-x-auto scrollbar-thin">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="bg-gray-50 text-gray-500 text-left">
                            <th class="px-6 py-3 font-medium">分享对象</th>
                            <th class="px-6 py-3 font-medium">报告名称</th>
                            <th class="px-6 py-3 font-medium">打开次数</th>
                            <th class="px-6 py-3 font-medium">最近访问</th>
                            <th class="px-6 py-3 font-medium">累计停留</th>
                            <th class="px-6 py-3 font-medium">打开状态</th>
                            <th class="px-6 py-3 font-medium text-right">操作</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100" id="tbody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- 行为详情抽屉 -->
    <div class="drawer-mask hidden" onclick="closeDrawer()" id="mask"></div>
    <div class="drawer" id="drawer">
        <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between sticky top-0 bg-white">
            <div>
                <h2 class="font-semibold text-gray-800" id="dTitle">行为详情</h2>
                <p class="text-xs text-gray-400 mt-0.5" id="dSub"></p>
            </div>
            <button onclick="closeDrawer()" class="text-gray-400 hover:text-gray-600"><i class="fa fa-times text-lg"></i></button>
        </div>
        <div class="p-6" id="dBody"></div>
    </div>

    <script src="data-bridge.js"></script>
    <script>
        var FLAT = []; // 扁平化分享记录 [{shareId,toName,toPhone,reportId,reportTitle,createdAt,expireAt,views,totalDur,lastAt}]
        function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
        function fmtDur(sec) { sec = sec || 0; var m = Math.floor(sec/60); var s = sec%60; return m + "'" + String(s).padStart(2,'0') + '"'; }
        function gotoReportMgr() {
            if (parent && parent.window && parent.window.switchPage) parent.window.switchPage('sales-report.html', null);
            else window.location.href = 'sales-report.html';
        }
        function viewReport(rid, sid) {
            var url = 'report-viewer.html?id=' + rid + (sid ? '&shareId=' + sid : '');
            if (parent && parent.window && parent.window.switchPage) parent.window.switchPage(url, null);
            else window.location.href = url;
        }
        function openDrawer(i) {
            var s = FLAT[i];
            document.getElementById('dTitle').textContent = '「' + s.reportCompany + '」阅读行为';
            document.getElementById('dSub').textContent = s.reportTitle + ' · 分享给 ' + s.toName + (s.toPhone ? '（' + s.toPhone + '）' : '') + ' · ' + s.createdAt;
            var views = s.views || [];
            var body = '';
            if (!views.length) {
                body = '<div class="text-center py-10 text-sm text-gray-400"><i class="fa fa-hourglass-half text-3xl mb-3"></i><p>客户尚未打开此链接</p><p class="text-xs mt-2">可通过「复制链接」按钮提醒客户</p></div>';
            } else {
                // 浏览时间线
                body += '<p class="text-xs text-gray-500 font-semibold mb-2">浏览时间线（共 ' + views.length + ' 次）</p>';
                body += '<div class="space-y-3 mb-5">';
                views.forEach(function(v, idx) {
                    var color = idx === views.length - 1 ? 'bg-brand-50 border-brand-200' : 'bg-gray-50 border-gray-100';
                    body += '<div class="flex items-center gap-3 border-l-2 pl-3 py-1.5 ' + color + '">' +
                        '<div class="flex-1"><p class="text-sm font-medium text-gray-700">' + esc(v.at) + '</p></div>' +
                        '<span class="text-xs text-gray-500">停留 ' + fmtDur(v.durSec) + '</span></div>';
                });
                body += '</div>';
                // 汇总小卡
                body += '<p class="text-xs text-gray-500 font-semibold mb-2">行为汇总</p>';
                body += '<div class="grid grid-cols-3 gap-2 mb-5">' +
                    '<div class="bg-gray-50 rounded p-3 text-center"><p class="text-lg font-bold text-gray-800">' + views.length + '</p><p class="text-xs text-gray-500">打开次数</p></div>' +
                    '<div class="bg-gray-50 rounded p-3 text-center"><p class="text-lg font-bold text-gray-800">' + fmtDur(s.totalDur) + '</p><p class="text-xs text-gray-500">累计停留</p></div>' +
                    '<div class="bg-gray-50 rounded p-3 text-center"><p class="text-lg font-bold text-gray-800">' + fmtDur(Math.round(s.totalDur / views.length)) + '</p><p class="text-xs text-gray-500">平均停留</p></div>' +
                    '</div>';
                // 最后操作
                body += '<div class="flex gap-2">' +
                    '<button onclick="closeDrawer();viewReport(\'' + s.reportId + '\',\'' + s.shareId + '\')" class="flex-1 px-3 py-2 bg-brand-600 text-white rounded-lg text-xs font-bold hover:bg-brand-700"><i class="fa fa-eye mr-1"></i>打开报告链接</button>' +
                    '<button onclick="deleteShare(\'' + s.reportId + '\',\'' + s.shareId + '\')" class="px-3 py-2 border border-red-200 text-red-500 rounded-lg text-xs hover:bg-red-50"><i class="fa fa-trash"></i></button>' +
                    '</div>';
            }
            document.getElementById('dBody').innerHTML = body;
            document.getElementById('mask').classList.remove('hidden');
            document.getElementById('drawer').classList.add('open');
        }
        function closeDrawer() {
            document.getElementById('mask').classList.add('hidden');
            document.getElementById('drawer').classList.remove('open');
        }
        function deleteShare(rid, sid) {
            if (!confirm('确认删除这条分享记录？')) return;
            var reports = DataBridge.loadSalesReports();
            reports.forEach(function(r) {
                if (r.id === rid && Array.isArray(r.shares)) r.shares = r.shares.filter(function(s) { return s.shareId !== sid; });
            });
            DataBridge.saveSalesReports(reports);
            closeDrawer();
            refresh();
        }

        function refresh() {
            var reports = DataBridge.loadSalesReports();
            FLAT = [];
            reports.forEach(function(r) {
                if (!Array.isArray(r.shares)) return;
                r.shares.forEach(function(s) {
                    var v = s.views || [];
                    var totalDur = 0; v.forEach(function(x) { totalDur += (x.durSec || 0); });
                    var lastAt = v.length ? v[v.length - 1].at : '';
                    FLAT.push({
                        shareId: s.shareId, toName: s.toName || '（匿名）', toPhone: s.toPhone || '',
                        reportId: r.id, reportTitle: r.title, reportCompany: r.customerName,
                        reportType: r.type, createdAt: s.createdAt, expireAt: s.expireAt,
                        views: v, totalDur: totalDur, lastAt: lastAt
                    });
                });
            });
            render();
        }

        function render() {
            var q = (document.getElementById('q').value || '').trim().toLowerCase();
            var f = document.getElementById('filter').value;
            var list = FLAT.filter(function(s) {
                if (q && s.toName.toLowerCase().indexOf(q) < 0 && s.reportTitle.toLowerCase().indexOf(q) < 0 && s.reportCompany.toLowerCase().indexOf(q) < 0) return false;
                if (f === 'opened' && !(s.views && s.views.length)) return false;
                if (f === 'silent' && s.views && s.views.length) return false;
                return true;
            });

            var html = list.map(function(s, i) {
                var vLen = s.views.length;
                var statusBadge = vLen
                    ? '<span class="px-2 py-0.5 bg-emerald-50 text-emerald-700 rounded text-xs">已打开 ' + vLen + ' 次</span>'
                    : '<span class="px-2 py-0.5 bg-gray-100 text-gray-500 rounded text-xs">未打开</span>';
                var lastAt = s.lastAt || '<span class="text-gray-300">—</span>';
                var dur = vLen ? fmtDur(s.totalDur) : '<span class="text-gray-300">—</span>';

                var contact = esc(s.toName) + (s.toPhone ? ' · ' + esc(s.toPhone) : '');
                return '<tr class="hover:bg-brand-50/40">' +
                    '<td class="px-6 py-4">' +
                        '<div class="flex items-center gap-3">' +
                            '<div class="w-8 h-8 bg-brand-100 text-brand-700 rounded-full flex items-center justify-center text-xs font-semibold flex-shrink-0">' + esc((s.reportCompany || '?').charAt(0)) + '</div>' +
                            '<div><p class="text-sm font-medium text-gray-800">' + esc(s.reportCompany) + '</p>' +
                            '<p class="text-xs text-gray-400">' + contact + '</p></div>' +
                        '</div>' +
                    '</td>' +
                    '<td class="px-6 py-4"><p class="text-sm text-gray-800">' + esc(s.reportTitle) + '</p><p class="text-xs text-gray-400">分享于 ' + esc(s.createdAt) + '</p></td>' +
                    '<td class="px-6 py-4 text-sm font-medium text-gray-700">' + vLen + '</td>' +
                    '<td class="px-6 py-4 text-xs text-gray-500">' + lastAt + '</td>' +
                    '<td class="px-6 py-4 text-sm text-gray-600">' + dur + '</td>' +
                    '<td class="px-6 py-4">' + statusBadge + '</td>' +
                    '<td class="px-6 py-4 text-right"><button class="text-brand-600 hover:text-brand-700 mr-3" title="查看行为详情" onclick="openDrawer(' + i + ')"><i class="fa fa-eye"></i></button>' +
                    '<button class="text-gray-500 hover:text-brand-600" title="打开报告链接" onclick="viewReport(\'' + s.reportId + '\',\'' + s.shareId + '\')"><i class="fa fa-external-link"></i></button></td>' +
                    '</tr>';
            }).join('');
            document.getElementById('tbody').innerHTML = html ||
                '<tr><td colspan="7" class="px-6 py-12 text-center text-sm text-gray-400"><i class="fa fa-inbox mr-1"></i>暂无分享记录，请先到「智能报告」生成报告并分享</td></tr>';
        }

        document.addEventListener('DOMContentLoaded', refresh);
    </script>
</body>
</html>
