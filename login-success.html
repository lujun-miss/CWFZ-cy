    <style>

<body class="min-h-screen" style="background: linear-gradient(135deg, #eef2ff 0%, #e0f2fe 50%, #f5f3ff 100%);">
    <div class="min-h-screen flex items-center justify-center px-4 py-8">
        <div class="w-full max-w-md bg-white/85 backdrop-blur rounded-2xl border border-white/60 shadow-2xl p-8 text-center">
            <!-- 成功标识 -->
            <div class="w-16 h-16 mx-auto rounded-full flex items-center justify-center shadow-lg animate-pop" style="background: linear-gradient(135deg, #34d399 0%, #10b981 100%);">

            </div>
            <h1 class="text-xl font-black text-slate-800 mt-4">注册成功，欢迎加入策源易答！</h1>
            <p class="text-xs text-slate-500 mt-2 leading-relaxed">为了更好、更精准地为您匹配政策与服务，<br>请选择您所在的省份、城市、区县</p>

            <!-- 地区选择 -->
            <div class="mt-6 space-y-3 text-left">
                <div>
                    <label class="text-[11px] text-slate-500 font-bold block mb-1">所在省份</label>
                    <select id="ls_province" onchange="onProvChange()" class="w-full px-3 py-2.5 text-xs rounded-xl border border-slate-200 bg-white transition-all text-slate-700">
                        <option value="">请选择省份</option>
                    </select>
                </div>
                <div>
                    <label class="text-[11px] text-slate-500 font-bold block mb-1">所在城市</label>
                    <select id="ls_city" onchange="onCityChange()" class="w-full px-3 py-2.5 text-xs rounded-xl border border-slate-200 bg-white transition-all text-slate-700">
                        <option value="">请选择城市</option>
                    </select>
                </div>
                <div>
                    <label class="text-[11px] text-slate-500 font-bold block mb-1">所在区县</label>
                    <select id="ls_district" class="w-full px-3 py-2.5 text-xs rounded-xl border border-slate-200 bg-white transition-all text-slate-700">
                        <option value="">请选择区县</option>
                    </select>
                </div>
            </div>
            <p class="text-[10px] text-slate-400 mt-2 text-left"><i class="fa fa-map-marker mr-0.5"></i>选择后，首页将默认展示该地区的政策资讯，可随时在「会员中心」修改</p>

            <!-- 操作按钮 -->
            <button onclick="confirmRegion()" class="w-full py-3 mt-5 rounded-xl text-sm font-bold text-white bg-gradient-to-r from-indigo-500 to-purple-600 hover:opacity-90 transition-all shadow-lg">
                <i class="fa fa-rocket mr-1"></i>确认，进入首页
            </button>
            <button onclick="skipRegion()" class="w-full py-2.5 mt-2 rounded-xl text-xs font-bold text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition-all">
                跳过，稍后再设置
            </button>
        </div>
    </div>

function goPage(url) {
    try { if (parent && parent.window && parent.window.switchPage) { parent.window.switchPage(url, null); return; } } catch (e) {}
    window.location.href = url;
}
function toast(msg, ok) {
    var t = document.createElement('div');
    t.className = 'fixed top-5 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-xl text-xs font-bold text-white shadow-lg ' + (ok === false ? 'bg-red-500' : 'bg-slate-800');
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function(){ t.remove(); }, 2200);
}
function markErr(id) { document.getElementById(id).classList.add('field-err'); }
function clearErr(id) { document.getElementById(id).classList.remove('field-err'); }

(function initRegionSelects() {
    var pSel = document.getElementById('ls_province');
    REGION_DATA.provinces.forEach(function(p) {
        var o = document.createElement('option'); o.value = p; o.textContent = p; pSel.appendChild(o);
    });
})();
function onProvChange() {
    var prov = document.getElementById('ls_province').value;
    var cSel = document.getElementById('ls_city');
    var dSel = document.getElementById('ls_district');
    cSel.innerHTML = '<option value="">请选择城市</option>';
    dSel.innerHTML = '<option value="">请选择区县</option>';
    (REGION_DATA.cityMap[prov] || []).forEach(function(c) {
        var o = document.createElement('option'); o.value = c; o.textContent = c; cSel.appendChild(o);
    });
}
function onCityChange() {
    var city = document.getElementById('ls_city').value;
    var dSel = document.getElementById('ls_district');
    dSel.innerHTML = '<option value="">请选择区县</option>';
    (REGION_DATA.districtMap[city] || REGION_DATA.genericDistricts).forEach(function(d) {
        var o = document.createElement('option'); o.value = d; o.textContent = d; dSel.appendChild(o);
    });
}

function confirmRegion() {
    var prov = document.getElementById('ls_province').value;
    var city = document.getElementById('ls_city').value;
    var district = document.getElementById('ls_district').value;
    ['ls_province','ls_city','ls_district'].forEach(clearErr);
    if (!prov) { toast('请选择所在省份', false); markErr('ls_province'); return; }
    if (!city) { toast('请选择所在城市', false); markErr('ls_city'); return; }
    if (!district) { toast('请选择所在区县', false); markErr('ls_district'); return; }
    // 写入会员信息与当前城市，供首页/政策服务使用
    try {
        var prof = {};
        try { prof = JSON.parse(localStorage.getItem('ceyuan_member_profile') || '{}'); } catch (e) {}
        prof.province = prov; prof.city = city; prof.district = district;
        prof.region = prov + ' ' + city + ' ' + district;
        localStorage.setItem('ceyuan_member_profile', JSON.stringify(prof));
        localStorage.setItem('ceyuan_current_city', JSON.stringify({ name: city, province: prov, district: district, t: Date.now() }));
    } catch (e) {}
    toast('所在地区已保存，正在进入首页...');
    setTimeout(function(){ goPage('dashboard.html'); }, 900);
}
function skipRegion() {
    goPage('dashboard.html');
}
