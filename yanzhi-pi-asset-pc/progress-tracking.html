<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>申报进度跟踪 - 策源易答无形资产</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="asset-data.js"></script>
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: #f7f8fa; }
        .toast { animation: toastIn .25s ease; }
        @keyframes toastIn { from { opacity:0; transform: translateY(-12px);} to {opacity:1; transform:none;} }
        .step-line { position:absolute; top:20px; left:20px; right:20px; height:2px; background:#e2e8f0; z-index:0; }
        .step-line-fill { position:absolute; top:20px; left:20px; height:2px; background:#2563eb; z-index:0; transition: width .3s; }
        .field-label { font-size:11px; font-weight:800; color:#64748b; margin-bottom:4px; display:block; }
        .field-input { width:100%; padding:8px 12px; border:1px solid #e2e8f0; border-radius:12px; font-size:12px; outline:none; transition:all .15s; }
        .field-input:focus { border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,.12); }
    </style>
</head>
<body class="text-slate-800 p-6 min-h-screen">
    <div class="max-w-[1400px] mx-auto">
        <!-- 头部 -->
        <div class="flex justify-between items-center mb-6 flex-wrap gap-4">
            <div>
                <h1 class="text-2xl font-black text-slate-800">申报进度跟踪</h1>
                <p class="text-sm text-slate-400 mt-1">跟踪申请中资产的每个节点：递交、审查、拿证，节点日期+操作人+附件一目了然</p>
            </div>
            <div class="flex items-center gap-3">
                <div class="px-4 py-2 bg-white rounded-xl border border-slate-200 text-xs font-bold text-slate-500">
                    <i class="fa fa-hourglass-half text-orange-500 mr-1"></i>申请中 <span id="statPending" class="text-orange-600">0</span> 项
                </div>
                <div class="px-4 py-2 bg-white rounded-xl border border-slate-200 text-xs font-bold text-slate-500">
                    <i class="fa fa-exclamation-triangle text-red-500 mr-1"></i>异常待办 <span id="statAlert" class="text-red-600">0</span> 项
                </div>
            </div>
        </div>

        <!-- 异常提醒区 -->
        <div id="alertBox" class="mb-6 hidden">
            <div class="bg-red-50 border border-red-200 rounded-2xl p-4">
                <p class="text-xs font-black text-red-600 mb-3"><i class="fa fa-bell mr-1"></i>进度异常提醒</p>
                <div id="alertList" class="space-y-2"></div>
            </div>
        </div>

        <!-- 申请中资产列表 -->
        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm">
            <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
                <h2 class="text-sm font-black text-slate-800"><i class="fa fa-tasks text-blue-500 mr-1.5"></i>申请中资产进度</h2>
                <span id="countText" class="text-xs text-slate-400 font-bold">共 0 项</span>
            </div>
            <div id="listBox" class="divide-y divide-slate-50"></div>
        </div>
    </div>

    <!-- 推进弹窗 -->
    <div id="advanceMask" class="hidden fixed inset-0 bg-black/50 z-50 items-center justify-center">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md mx-4 overflow-hidden">
            <div class="px-6 py-4 bg-blue-600 text-white flex justify-between items-center">
                <div>
                    <p class="text-sm font-black"><i class="fa fa-forward mr-1"></i>推进申报进度</p>
                    <p class="text-[10px] opacity-80 mt-0.5" id="advAssetName">—</p>
                </div>
                <button onclick="closeAdvance()" class="w-8 h-8 hover:bg-white/20 rounded-lg transition-all"><i class="fa fa-times"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <input type="hidden" id="advAssetId">
                <input type="hidden" id="advTargetStep">
                <div>
                    <p class="text-[11px] font-bold text-slate-400 mb-1">即将推进到</p>
                    <p class="text-base font-black text-blue-600" id="advStepLabel">—</p>
                </div>
                <div>
                    <label class="field-label">完成日期 <span class="text-red-400">*</span></label>
                    <input id="advDate" type="date" class="field-input">
                </div>
                <div>
                    <label class="field-label">操作人</label>
                    <input id="advOperator" class="field-input" placeholder="如：张工 / 李经理">
                </div>
                <div>
                    <label class="field-label">备注</label>
                    <input id="advNote" class="field-input" placeholder="如：已交专利局 / 实审通知书收到">
                </div>
                <div>
                    <label class="field-label">附件（文件名，模拟上传）</label>
                    <input id="advAttachment" class="field-input" placeholder="如：受理通知书.pdf">
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button onclick="closeAdvance()" class="px-4 py-2 text-slate-500 text-xs font-bold hover:bg-slate-50 rounded-xl transition-all">取消</button>
                    <button onclick="confirmAdvance()" class="px-5 py-2 bg-blue-600 text-white text-xs font-bold rounded-xl hover:bg-blue-700 transition-all">确认推进</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 节点详情弹窗 -->
    <div id="detailMask" class="hidden fixed inset-0 bg-black/50 z-50 items-center justify-center">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-2xl mx-4 overflow-hidden max-h-[90vh] flex flex-col">
            <div class="px-6 py-4 bg-slate-800 text-white flex justify-between items-center flex-shrink-0">
                <div>
                    <p class="text-sm font-black"><i class="fa fa-file-text-o mr-1"></i>申报进度详情</p>
                    <p class="text-[10px] opacity-80 mt-0.5" id="detAssetName">—</p>
                </div>
                <button onclick="closeDetail()" class="w-8 h-8 hover:bg-white/20 rounded-lg transition-all"><i class="fa fa-times"></i></button>
            </div>
            <div class="p-6 overflow-y-auto" id="detBody"></div>
        </div>
    </div>

    <script>
        var STEP_LABELS = ['写交底书', '已经递交', '正在审查', '成功拿证'];
        var STEP_ICONS = ['fa-pencil', 'fa-send', 'fa-search', 'fa-check'];

        function renderList() {
            var pendings = getAssetsByStatus('pending');
            document.getElementById('statPending').innerText = pendings.length;
            document.getElementById('countText').innerText = '共 ' + pendings.length + ' 项';

            // 异常提醒
            var alerts = [];
            pendings.forEach(function (a) {
                var steps = a.applySteps || [];
                // 找最后一个有 date 的节点
                var lastStep = -1, lastDate = null;
                steps.forEach(function (s) { if (s.date) { lastStep = s.step; lastDate = s.date; } });
                if (lastStep >= 1 && lastDate) {
                    // 递交超 30 天还没进审查
                    var daysWait = Math.floor((new Date() - new Date(lastDate)) / 86400000);
                    if (lastStep === 1 && daysWait > 30) {
                        alerts.push({ id: a.id, name: a.name, msg: '已递交 ' + daysWait + ' 天，还未进入审查阶段', level: 'orange' });
                    }
                    if (lastStep === 2 && daysWait > 540) {
                        alerts.push({ id: a.id, name: a.name, msg: '审查已 ' + daysWait + ' 天（超 18 个月），建议关注', level: 'red' });
                    }
                }
            });
            document.getElementById('statAlert').innerText = alerts.length;
            var alertBox = document.getElementById('alertBox');
            var alertList = document.getElementById('alertList');
            if (alerts.length) {
                alertBox.classList.remove('hidden');
                alertList.innerHTML = alerts.map(function (al) {
                    return '<div class="flex items-center justify-between px-3 py-2 bg-white rounded-xl cursor-pointer hover:bg-slate-50" onclick="openDetail(\'' + al.id + '\')">'
                        + '<div><span class="text-xs font-bold text-slate-700">' + al.name + '</span>'
                        + '<span class="text-[10px] ml-2 ' + (al.level === 'red' ? 'text-red-500' : 'text-orange-500') + ' font-bold">' + al.msg + '</span></div>'
                        + '<i class="fa fa-chevron-right text-slate-300 text-xs"></i></div>';
                }).join('');
            } else {
                alertBox.classList.add('hidden');
            }

            // 列表
            var box = document.getElementById('listBox');
            if (!pendings.length) {
                box.innerHTML = '<div class="px-6 py-16 text-center text-slate-300"><i class="fa fa-inbox text-3xl block mb-3"></i><span class="text-xs font-bold">当前没有申请中的资产，进度跟踪暂无内容</span></div>';
                return;
            }
            box.innerHTML = pendings.map(function (a) {
                var prog = a.progress;
                var linePct = prog >= 3 ? 100 : (prog / 3) * 100;
                var steps = (a.applySteps || []).map(function (s, i) {
                    var done = i <= prog;
                    var current = i === prog && prog < 3;
                    var circle;
                    if (current) {
                        circle = '<div class="w-10 h-10 bg-white border-4 border-blue-600 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-2 shadow-lg animate-pulse"><i class="fa ' + STEP_ICONS[i] + '"></i></div>'
                               + '<p class="text-[10px] font-black text-blue-600">' + STEP_LABELS[i] + '</p>'
                               + (s.date ? '<p class="text-[9px] text-slate-400 mt-0.5">' + s.date + '</p>' : '');
                    } else if (done) {
                        circle = '<div class="w-10 h-10 bg-blue-600 text-white rounded-full flex items-center justify-center mx-auto mb-2 shadow-lg shadow-blue-100"><i class="fa ' + STEP_ICONS[i] + '"></i></div>'
                               + '<p class="text-[10px] font-bold text-slate-800">' + STEP_LABELS[i] + '</p>'
                               + (s.date ? '<p class="text-[9px] text-slate-400 mt-0.5">' + s.date + '</p>' : '');
                    } else {
                        circle = '<div class="w-10 h-10 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-2"><i class="fa ' + STEP_ICONS[i] + '"></i></div>'
                               + '<p class="text-[10px] font-bold text-slate-400">' + STEP_LABELS[i] + '</p>';
                    }
                    return '<div class="relative z-10 text-center flex-1">' + circle + '</div>';
                }).join('');

                var nextStep = prog < 3 ? prog + 1 : null;
                var actionBtn = nextStep
                    ? '<button onclick="openAdvance(\'' + a.id + '\',' + nextStep + ')" class="px-4 py-2 bg-blue-600 text-white text-xs font-bold rounded-xl hover:bg-blue-700 transition-all"><i class="fa fa-forward mr-1"></i>推进到「' + STEP_LABELS[nextStep] + '」</button>'
                    : '<span class="px-4 py-2 bg-green-50 text-green-600 text-xs font-bold rounded-xl"><i class="fa fa-check mr-1"></i>已拿证</span>';

                return '<div class="px-6 py-5">'
                    + '<div class="flex items-center justify-between mb-4 flex-wrap gap-2">'
                    +   '<div class="flex items-center">'
                    +     '<div class="w-10 h-10 bg-orange-50 text-orange-600 rounded-xl flex items-center justify-center mr-3 text-lg"><i class="fa fa-file-text-o"></i></div>'
                    +     '<div><p class="text-sm font-bold text-slate-800 cursor-pointer hover:text-blue-600" onclick="openDetail(\'' + a.id + '\')">' + a.name + '</p>'
                    +     '<p class="text-[10px] text-slate-400 mt-0.5">' + (a.assetCode || a.id) + ' · ' + a.type + ' · 已投入 ' + (a.cost || 0) + ' 万</p></div>'
                    +   '</div>'
                    +   actionBtn
                    + '</div>'
                    + '<div class="flex items-center justify-between px-10 relative pt-2">'
                    +   '<div class="step-line"></div>'
                    +   '<div class="step-line-fill" style="width:calc((100% - 10rem) * ' + (linePct/100) + ')"></div>'
                    +   '<div class="flex w-full relative z-10">' + steps + '</div>'
                    + '</div>'
                    + '</div>';
            }).join('');
        }

        // 推进弹窗
        function openAdvance(id, targetStep) {
            var a = getAssetById(id);
            if (!a) return;
            document.getElementById('advAssetId').value = id;
            document.getElementById('advTargetStep').value = targetStep;
            document.getElementById('advAssetName').innerText = a.name;
            document.getElementById('advStepLabel').innerText = '④ ' + STEP_LABELS[targetStep] + (targetStep === 3 ? '（完成后需到「取得入库」办理入账，审批后进入资产档案）' : '');
            document.getElementById('advDate').value = new Date().toISOString().slice(0, 10);
            document.getElementById('advOperator').value = '';
            document.getElementById('advNote').value = '';
            document.getElementById('advAttachment').value = '';
            var mask = document.getElementById('advanceMask');
            mask.classList.remove('hidden'); mask.classList.add('flex');
        }
        function closeAdvance() {
            var mask = document.getElementById('advanceMask');
            mask.classList.add('hidden'); mask.classList.remove('flex');
        }
        function confirmAdvance() {
            var id = document.getElementById('advAssetId').value;
            var target = Number(document.getElementById('advTargetStep').value);
            var date = document.getElementById('advDate').value;
            if (!date) { toast('请选择完成日期', 'red'); return; }
            var info = {
                date: date,
                operator: document.getElementById('advOperator').value.trim(),
                note: document.getElementById('advNote').value.trim(),
                attachment: document.getElementById('advAttachment').value.trim()
            };
            var a = advanceStep(id, target, info);
            if (a) {
                toast('已推进到「' + STEP_LABELS[target] + '」' + (target === 3 ? '，已生成取得入库待审批申请' : ''), 'green');
                closeAdvance();
                renderList();
            }
        }

        // 详情弹窗：完整节点时间线
        function openDetail(id) {
            var a = getAssetById(id);
            if (!a) return;
            document.getElementById('detAssetName').innerText = a.name + ' · ' + (a.assetCode || a.id);
            var steps = a.applySteps || [];
            var html = '<div class="space-y-4">';
            steps.forEach(function (s, i) {
                var done = s.date;
                var icon = done ? 'fa-check-circle text-blue-600' : 'fa-circle-o text-slate-300';
                html += '<div class="flex items-start gap-4">'
                    +   '<div class="flex flex-col items-center">'
                    +     '<div class="w-8 h-8 ' + (done ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-400') + ' rounded-full flex items-center justify-center text-sm"><i class="fa ' + (done ? STEP_ICONS[i] : 'fa-circle-o') + '"></i></div>'
                    +     (i < 3 ? '<div class="w-0.5 h-12 ' + (steps[i+1] && steps[i+1].date ? 'bg-blue-300' : 'bg-slate-100') + ' mt-1"></div>' : '')
                    +   '</div>'
                    +   '<div class="flex-1 pb-2">'
                    +     '<p class="text-sm font-bold ' + (done ? 'text-slate-800' : 'text-slate-400') + '">' + (i+1) + '. ' + s.label + '</p>';
                if (done) {
                    html += '<div class="mt-1 space-y-0.5">'
                        +   '<p class="text-[11px] text-slate-500"><i class="fa fa-calendar mr-1 text-slate-400"></i>' + s.date + (s.operator ? ' · ' + s.operator : '') + '</p>';
                    if (s.note) html += '<p class="text-[11px] text-slate-500"><i class="fa fa-sticky-note-o mr-1 text-slate-400"></i>' + s.note + '</p>';
                    if (s.attachment) html += '<p class="text-[11px] text-blue-600 font-bold cursor-pointer hover:underline"><i class="fa fa-paperclip mr-1"></i>' + s.attachment + '</p>';
                    html += '</div>';
                } else {
                    var nextStep = i;
                    // 找到第一个未完成的
                    var hasPrev = i > 0 && steps[i-1] && steps[i-1].date;
                    if (a.status === '审查中' && hasPrev) {
                        html += '<button onclick="openAdvance(\'' + a.id + '\',' + i + ')" class="mt-1 px-3 py-1.5 bg-blue-50 text-blue-600 text-[10px] font-bold rounded-lg hover:bg-blue-100 transition-all"><i class="fa fa-forward mr-1"></i>推进到此节点</button>';
                    } else {
                        html += '<p class="text-[10px] text-slate-400 mt-1">待完成</p>';
                    }
                }
                html += '</div></div>';
            });
            html += '</div>';
            document.getElementById('detBody').innerHTML = html;
            var mask = document.getElementById('detailMask');
            mask.classList.remove('hidden'); mask.classList.add('flex');
        }
        function closeDetail() {
            var mask = document.getElementById('detailMask');
            mask.classList.add('hidden'); mask.classList.remove('flex');
        }

        function toast(msg, color) {
            var el = document.createElement('div');
            el.className = 'toast fixed top-6 left-1/2 -translate-x-1/2 z-[60] px-5 py-3 rounded-2xl text-white text-xs font-bold shadow-xl ' + (color === 'red' ? 'bg-red-500' : 'bg-emerald-500');
            el.innerHTML = '<i class="fa ' + (color === 'red' ? 'fa-exclamation-circle' : 'fa-check-circle') + ' mr-2"></i>' + msg;
            document.body.appendChild(el);
            setTimeout(function () { el.remove(); }, 2400);
        }

        window.addEventListener('assets-changed', renderList);
        renderList();
    </script>
</body>
</html>
