<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合同管理 - 研知π无形资产</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="asset-data.js"></script>
    <style>
        body { font-family:'PingFang SC','Microsoft YaHei',sans-serif; background:#f7f8fa; }
        .field-label { font-size:11px; font-weight:800; color:#64748b; margin-bottom:4px; display:block; }
        .field-input { width:100%; padding:8px 12px; border:1px solid #e2e8f0; border-radius:12px; font-size:12px; outline:none; }
        .field-input:focus { border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,.12); }
        .asset-pick { display:inline-block; margin:2px; padding:3px 8px; border-radius:8px; font-size:10px; cursor:pointer; border:1px solid #e2e8f0; }
        .asset-pick.on { background:#2563eb; color:#fff; border-color:#2563eb; }
    </style>
</head>
<body class="text-slate-800 p-6 min-h-screen">
    <div class="max-w-[1400px] mx-auto">
        <div class="flex justify-between items-center mb-6 flex-wrap gap-4">
            <div>
                <h1 class="text-2xl font-black text-slate-800">合同管理</h1>
                <p class="text-sm text-slate-400 mt-1">知识产权许可/转让/质押合同，监控履约进度与收付款节点</p>
            </div>
            <button onclick="openForm()" class="px-5 py-2.5 bg-blue-600 text-white text-xs font-bold rounded-xl hover:bg-blue-700 transition-all"><i class="fa fa-plus mr-1"></i>新增合同</button>
        </div>

        <!-- 合同列表 -->
        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-xs">
                    <thead class="bg-slate-50 text-slate-500">
                        <tr>
                            <th class="text-left px-4 py-3 font-bold">合同编号</th>
                            <th class="text-left px-4 py-3 font-bold">标题</th>
                            <th class="text-left px-4 py-3 font-bold">类型</th>
                            <th class="text-left px-4 py-3 font-bold">关联资产</th>
                            <th class="text-left px-4 py-3 font-bold">对方</th>
                            <th class="text-right px-4 py-3 font-bold">金额(万)</th>
                            <th class="text-center px-4 py-3 font-bold">履约进度</th>
                            <th class="text-center px-4 py-3 font-bold">状态</th>
                            <th class="text-center px-4 py-3 font-bold">操作</th>
                        </tr>
                    </thead>
                    <tbody id="contractTbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 新增/编辑弹窗 -->
    <div id="formMask" class="hidden fixed inset-0 bg-black/50 z-50 items-center justify-center overflow-y-auto py-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-2xl mx-4 overflow-hidden">
            <div class="px-6 py-4 bg-blue-600 text-white flex justify-between items-center">
                <p class="text-sm font-black" id="formTitle"><i class="fa fa-file-text-o mr-1"></i>新增合同</p>
                <button onclick="closeForm()" class="w-8 h-8 hover:bg-white/20 rounded-lg"><i class="fa fa-times"></i></button>
            </div>
            <div class="p-6 space-y-4 max-h-[80vh] overflow-y-auto">
                <input type="hidden" id="cId">
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="field-label">合同编号</label><input id="cNo" class="field-input bg-slate-50" placeholder="留空自动生成"></div>
                    <div><label class="field-label">合同类型 <span class="text-red-400">*</span></label>
                        <select id="cType" class="field-input"><option>许可合同</option><option>转让合同</option><option>质押合同</option></select>
                    </div>
                </div>
                <div><label class="field-label">合同标题 <span class="text-red-400">*</span></label><input id="cTitle" class="field-input" placeholder="如：AI算法专利普通许可协议"></div>
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="field-label">对方当事人 <span class="text-red-400">*</span></label><input id="cCounterparty" class="field-input" placeholder="如：深圳智控科技有限公司"></div>
                    <div><label class="field-label">合同金额(万)</label><input id="cAmount" type="number" min="0" step="0.01" class="field-input" value="0"></div>
                </div>
                <div class="grid grid-cols-3 gap-4">
                    <div><label class="field-label">签订日期</label><input id="cSignDate" type="date" class="field-input"></div>
                    <div><label class="field-label">生效日期</label><input id="cStartDate" type="date" class="field-input"></div>
                    <div><label class="field-label">截止日期</label><input id="cEndDate" type="date" class="field-input"></div>
                </div>
                <div>
                    <label class="field-label">关联资产（多选）</label>
                    <div id="cAssetPicker" class="flex flex-wrap gap-1 bg-slate-50 rounded-xl p-3 border border-slate-200"></div>
                </div>
                <!-- 收付款节点 -->
                <div>
                    <label class="field-label">收付款节点</label>
                    <div id="cNodes" class="space-y-2"></div>
                    <button onclick="addNodeRow()" class="mt-2 px-3 py-1.5 bg-slate-100 text-slate-600 text-[10px] font-bold rounded-lg hover:bg-slate-200"><i class="fa fa-plus mr-1"></i>添加节点</button>
                </div>
                <!-- 附件 -->
                <div>
                    <label class="field-label">附件（文件名列表）</label>
                    <div class="flex gap-2">
                        <input id="cFileName" class="field-input flex-1" placeholder="如：许可协议.pdf">
                        <button onclick="addFileRow()" class="px-3 bg-slate-100 text-slate-600 rounded-xl text-xs font-bold hover:bg-slate-200"><i class="fa fa-plus"></i></button>
                    </div>
                    <div id="cFiles" class="flex flex-wrap gap-2 mt-2"></div>
                </div>
            </div>
            <div class="px-6 py-4 border-t border-slate-100 flex justify-end gap-3">
                <button onclick="closeForm()" class="px-4 py-2 text-slate-500 text-xs font-bold hover:bg-slate-50 rounded-xl">取消</button>
                <button onclick="submitContract()" class="px-5 py-2 bg-blue-600 text-white text-xs font-bold rounded-xl hover:bg-blue-700">保存</button>
            </div>
        </div>
    </div>

    <!-- 详情弹窗 -->
    <div id="detailMask" class="hidden fixed inset-0 bg-black/50 z-50 items-center justify-center">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-2xl mx-4 overflow-hidden max-h-[90vh] flex flex-col">
            <div class="px-6 py-4 bg-slate-800 text-white flex justify-between items-center flex-shrink-0">
                <p class="text-sm font-black"><i class="fa fa-file-text-o mr-1"></i>合同详情</p>
                <button onclick="closeDetail()" class="w-8 h-8 hover:bg-white/20 rounded-lg"><i class="fa fa-times"></i></button>
            </div>
            <div class="p-6 overflow-y-auto" id="detailBody"></div>
        </div>
    </div>

    <!-- 标记收款弹窗 -->
    <div id="payNodeMask" class="hidden fixed inset-0 bg-black/50 z-50 items-center justify-center">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm mx-4 overflow-hidden">
            <div class="px-6 py-4 bg-emerald-600 text-white flex justify-between items-center">
                <p class="text-sm font-black"><i class="fa fa-check mr-1"></i>标记收款</p>
                <button onclick="closePayNode()" class="w-8 h-8 hover:bg-white/20 rounded-lg"><i class="fa fa-times"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <input type="hidden" id="pnContractId"><input type="hidden" id="pnNodeIdx">
                <p class="text-xs font-bold text-slate-700" id="pnNodeName">—</p>
                <div><label class="field-label">收款日期 <span class="text-red-400">*</span></label><input id="pnPaidDate" type="date" class="field-input"></div>
                <div><label class="field-label">凭证号</label><input id="pnVoucher" class="field-input" placeholder="如：银行流水号"></div>
                <div class="flex justify-end gap-3 pt-2">
                    <button onclick="closePayNode()" class="px-4 py-2 text-slate-500 text-xs font-bold hover:bg-slate-50 rounded-xl">取消</button>
                    <button onclick="confirmPayNode()" class="px-5 py-2 bg-emerald-600 text-white text-xs font-bold rounded-xl hover:bg-emerald-700">确认收款</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        var editingContractId = null;
        var _selAssets = {};
        var _nodes = [];
        var _files = [];

        function renderList() {
            var tb = document.getElementById('contractTbody');
            if (!ASSET_CONTRACTS.length) { tb.innerHTML = '<tr><td colspan="9" class="text-center py-12 text-slate-300"><i class="fa fa-inbox text-3xl block mb-2"></i><span class="text-xs font-bold">暂无合同</span></td></tr>'; return; }
            var typeColor = {'许可合同':'text-blue-600','转让合同':'text-emerald-600','质押合同':'text-amber-600'};
            var statusColor = {'履约中':'bg-blue-50 text-blue-600 border-blue-200','已完成':'bg-emerald-50 text-emerald-600 border-emerald-200','草稿':'bg-slate-100 text-slate-500 border-slate-200'};
            tb.innerHTML = ASSET_CONTRACTS.map(function(c) {
                var assetNames = (c.assetIds||[]).map(function(id){ var a=getAssetById(id); return a?a.name:id; }).join('、') || '—';
                var nodes = c.paymentNodes || [];
                var paidCnt = nodes.filter(function(n){ return n.status==='已收'; }).length;
                var pct = nodes.length ? Math.round(paidCnt/nodes.length*100) : 0;
                var st = statusColor[c.status] || statusColor['草稿'];
                return '<tr class="border-t border-slate-50 hover:bg-slate-50">'
                    + '<td class="px-4 py-3 font-mono text-slate-500">'+c.contractNo+'</td>'
                    + '<td class="px-4 py-3 font-bold cursor-pointer hover:text-blue-600" onclick="openDetail(\''+c.id+'\')">'+c.title+'</td>'
                    + '<td class="px-4 py-3 font-bold '+(typeColor[c.type]||'text-slate-600')+'">'+c.type+'</td>'
                    + '<td class="px-4 py-3 text-slate-500 max-w-xs truncate" title="'+assetNames+'">'+assetNames+'</td>'
                    + '<td class="px-4 py-3 text-slate-500">'+c.counterparty+'</td>'
                    + '<td class="px-4 py-3 text-right font-bold">'+(c.amount||0)+'</td>'
                    + '<td class="px-4 py-3"><div class="flex items-center gap-2"><div class="flex-1 bg-slate-100 rounded-full h-2 overflow-hidden"><div class="bg-blue-500 h-2" style="width:'+pct+'%"></div></div><span class="text-[10px] font-bold text-slate-500">'+pct+'%</span></div></td>'
                    + '<td class="px-4 py-3 text-center"><span class="px-2 py-0.5 rounded-full border text-[10px] font-bold '+st+'">'+c.status+'</span></td>'
                    + '<td class="px-4 py-3 text-center"><button onclick="openDetail(\''+c.id+'\')" class="text-blue-500 text-[10px] font-bold hover:underline">详情</button> <button onclick="editContract(\''+c.id+'\')" class="text-slate-500 text-[10px] font-bold hover:underline ml-2">编辑</button> <button onclick="delContract(\''+c.id+'\')" class="text-red-400 text-[10px] font-bold hover:underline ml-2">删除</button></td>'
                    + '</tr>';
            }).join('');
        }

        function openForm() {
            editingContractId = null;
            _selAssets = {}; _nodes = []; _files = [];
            document.getElementById('formTitle').innerText = '新增合同';
            document.getElementById('cId').value = '';
            document.getElementById('cNo').value = '';
            document.getElementById('cType').value = '许可合同';
            document.getElementById('cTitle').value = '';
            document.getElementById('cCounterparty').value = '';
            document.getElementById('cAmount').value = '0';
            document.getElementById('cSignDate').value = '';
            document.getElementById('cStartDate').value = '';
            document.getElementById('cEndDate').value = '';
            renderAssetPicker(); renderNodes(); renderFiles();
            var mask = document.getElementById('formMask');
            mask.classList.remove('hidden'); mask.classList.add('flex');
        }
        function editContract(id) {
            var c = ASSET_CONTRACTS.find(function(x){return x.id===id;}); if(!c) return;
            editingContractId = id;
            _selAssets = {}; _nodes = JSON.parse(JSON.stringify(c.paymentNodes||[])); _files = JSON.parse(JSON.stringify(c.files||[]));
            (c.assetIds||[]).forEach(function(aid){ _selAssets[aid]=true; });
            document.getElementById('formTitle').innerText = '编辑合同';
            document.getElementById('cId').value = c.id;
            document.getElementById('cNo').value = c.contractNo;
            document.getElementById('cType').value = c.type;
            document.getElementById('cTitle').value = c.title;
            document.getElementById('cCounterparty').value = c.counterparty;
            document.getElementById('cAmount').value = c.amount;
            document.getElementById('cSignDate').value = c.signDate;
            document.getElementById('cStartDate').value = c.startDate;
            document.getElementById('cEndDate').value = c.endDate;
            renderAssetPicker(); renderNodes(); renderFiles();
            var mask = document.getElementById('formMask');
            mask.classList.remove('hidden'); mask.classList.add('flex');
        }
        function closeForm() {
            var mask = document.getElementById('formMask');
            mask.classList.add('hidden'); mask.classList.remove('flex');
        }
        function renderAssetPicker() {
            var box = document.getElementById('cAssetPicker');
            box.innerHTML = ASSETS.map(function(a) {
                return '<span class="asset-pick '+(_selAssets[a.id]?'on':'')+'" onclick="toggleAsset(\''+a.id+'\')">'+a.name+'</span>';
            }).join('');
        }
        function toggleAsset(id) { _selAssets[id]=!_selAssets[id]; renderAssetPicker(); }
        function renderNodes() {
            var box = document.getElementById('cNodes');
            if (!_nodes.length) { box.innerHTML = '<p class="text-[10px] text-slate-300">暂无节点，点上方添加</p>'; return; }
            box.innerHTML = _nodes.map(function(n,i) {
                return '<div class="flex items-center gap-2">'
                    + '<input class="field-input w-24" placeholder="名称" value="'+(n.name||'')+'" oninput="_nodes['+i+'].name=this.value">'
                    + '<input type="number" class="field-input w-20" placeholder="金额" value="'+(n.amount||0)+'" oninput="_nodes['+i+'].amount=Number(this.value)">'
                    + '<input type="date" class="field-input w-32" value="'+(n.dueDate||'')+'" oninput="_nodes['+i+'].dueDate=this.value">'
                    + '<button onclick="_nodes.splice('+i+',1);renderNodes()" class="text-slate-400 hover:text-red-500"><i class="fa fa-times"></i></button>'
                    + '</div>';
            }).join('');
        }
        function addNodeRow() { _nodes.push({name:'',amount:0,dueDate:'',paidDate:'',status:'待收'}); renderNodes(); }
        function renderFiles() {
            var box = document.getElementById('cFiles');
            if (!_files.length) { box.innerHTML = '<p class="text-[10px] text-slate-300">暂无附件</p>'; return; }
            box.innerHTML = _files.map(function(f,i) {
                return '<span class="px-2 py-1 bg-slate-100 rounded-lg text-[10px] font-bold text-slate-600 flex items-center gap-1"><i class="fa fa-paperclip"></i>'+f.name+'<button onclick="_files.splice('+i+',1);renderFiles()" class="text-slate-400 hover:text-red-500 ml-1"><i class="fa fa-times"></i></button></span>';
            }).join('');
        }
        function addFileRow() {
            var name = document.getElementById('cFileName').value.trim();
            if (!name) { toast('请输入文件名', 'red'); return; }
            _files.push({name:name, uploadDate:new Date().toISOString().slice(0,10)});
            document.getElementById('cFileName').value = '';
            renderFiles();
        }
        function submitContract() {
            var title = document.getElementById('cTitle').value.trim();
            var counterparty = document.getElementById('cCounterparty').value.trim();
            if (!title) { toast('请填写合同标题', 'red'); return; }
            if (!counterparty) { toast('请填写对方当事人', 'red'); return; }
            var c = {
                contractNo: document.getElementById('cNo').value.trim(),
                type: document.getElementById('cType').value,
                title: title,
                counterparty: counterparty,
                amount: Number(document.getElementById('cAmount').value) || 0,
                signDate: document.getElementById('cSignDate').value,
                startDate: document.getElementById('cStartDate').value,
                endDate: document.getElementById('cEndDate').value,
                assetIds: Object.keys(_selAssets).filter(function(k){return _selAssets[k];}),
                paymentNodes: _nodes.slice(),
                files: _files.slice(),
                status: '履约中'
            };
            if (editingContractId) {
                var old = ASSET_CONTRACTS.find(function(x){return x.id===editingContractId;});
                if (old) { c.status = old.status; }
                updateContract(editingContractId, c);
                toast('合同已更新', 'green');
            } else {
                addContract(c);
                toast('合同已创建：'+c.contractNo, 'green');
            }
            closeForm(); renderList();
        }
        function delContract(id) {
            if (!confirm('确认删除此合同？')) return;
            deleteContract(id); renderList(); toast('已删除', 'green');
        }
        function openDetail(id) {
            var c = ASSET_CONTRACTS.find(function(x){return x.id===id;}); if(!c) return;
            var assetNames = (c.assetIds||[]).map(function(aid){ var a=getAssetById(aid); return a?a.name:aid; }).join('、')||'—';
            var nodes = c.paymentNodes||[];
            var paidCnt = nodes.filter(function(n){return n.status==='已收';}).length;
            var pct = nodes.length?Math.round(paidCnt/nodes.length*100):0;
            var nodeHtml = nodes.length ? nodes.map(function(n,i) {
                var paid = n.status==='已收';
                return '<div class="flex items-center justify-between px-3 py-2 '+(paid?'bg-emerald-50':'bg-slate-50')+' rounded-xl">'
                    + '<div><p class="text-xs font-bold text-slate-700">'+n.name+'</p>'
                    + '<p class="text-[10px] text-slate-400">到期 '+n.dueDate+(paid?' · 已收 '+n.paidDate:'')+'</p></div>'
                    + '<div class="flex items-center gap-3">'
                    + '<span class="text-xs font-bold '+(paid?'text-emerald-600':'text-slate-600')+'">'+n.amount+' 万</span>'
                    + (paid?'<i class="fa fa-check-circle text-emerald-500"></i>':'<button onclick="openPayNode(\''+c.id+'\','+i+')" class="px-2 py-1 bg-emerald-100 text-emerald-600 text-[10px] font-bold rounded-lg hover:bg-emerald-200">标记收款</button>')
                    + '</div></div>';
            }).join('') : '<p class="text-[10px] text-slate-300">暂无收付款节点</p>';
            var fileHtml = (c.files||[]).length ? (c.files||[]).map(function(f){ return '<span class="px-2 py-1 bg-slate-100 rounded-lg text-[10px] font-bold text-slate-600 mr-2"><i class="fa fa-paperclip mr-1"></i>'+f.name+'</span>'; }).join('') : '<span class="text-[10px] text-slate-300">无</span>';
            document.getElementById('detailBody').innerHTML =
                '<div class="grid grid-cols-2 gap-4 mb-4">'
                + '<div><p class="text-[10px] font-bold text-slate-400">合同编号</p><p class="text-sm font-mono font-bold">'+c.contractNo+'</p></div>'
                + '<div><p class="text-[10px] font-bold text-slate-400">合同类型</p><p class="text-sm font-bold">'+c.type+'</p></div>'
                + '<div class="col-span-2"><p class="text-[10px] font-bold text-slate-400">合同标题</p><p class="text-sm font-black">'+c.title+'</p></div>'
                + '<div><p class="text-[10px] font-bold text-slate-400">对方当事人</p><p class="text-sm">'+c.counterparty+'</p></div>'
                + '<div><p class="text-[10px] font-bold text-slate-400">合同金额</p><p class="text-sm font-bold">'+(c.amount||0)+' 万</p></div>'
                + '<div><p class="text-[10px] font-bold text-slate-400">签订日期</p><p class="text-sm">'+(c.signDate||'—')+'</p></div>'
                + '<div><p class="text-[10px] font-bold text-slate-400">履约期间</p><p class="text-sm">'+(c.startDate||'—')+' 至 '+(c.endDate||'—')+'</p></div>'
                + '<div class="col-span-2"><p class="text-[10px] font-bold text-slate-400">关联资产</p><p class="text-sm">'+assetNames+'</p></div>'
                + '</div>'
                + '<div class="mb-4"><p class="text-[10px] font-bold text-slate-400 mb-1">履约进度</p>'
                + '<div class="flex items-center gap-2"><div class="flex-1 bg-slate-100 rounded-full h-3 overflow-hidden"><div class="bg-blue-500 h-3" style="width:'+pct+'%"></div></div><span class="text-xs font-bold">'+pct+'%</span></div></div>'
                + '<div class="mb-4"><p class="text-[10px] font-bold text-slate-400 mb-2">收付款节点</p><div class="space-y-2">'+nodeHtml+'</div></div>'
                + '<div><p class="text-[10px] font-bold text-slate-400 mb-2">附件</p>'+fileHtml+'</div>';
            var mask = document.getElementById('detailMask');
            mask.classList.remove('hidden'); mask.classList.add('flex');
        }
        function closeDetail() {
            var mask = document.getElementById('detailMask');
            mask.classList.add('hidden'); mask.classList.remove('flex');
        }
        function openPayNode(contractId, nodeIdx) {
            closeDetail();
            var c = ASSET_CONTRACTS.find(function(x){return x.id===contractId;}); if(!c) return;
            var n = c.paymentNodes[nodeIdx]; if(!n) return;
            document.getElementById('pnContractId').value = contractId;
            document.getElementById('pnNodeIdx').value = nodeIdx;
            document.getElementById('pnNodeName').innerText = n.name + ' · ' + n.amount + ' 万';
            document.getElementById('pnPaidDate').value = new Date().toISOString().slice(0,10);
            document.getElementById('pnVoucher').value = '';
            var mask = document.getElementById('payNodeMask');
            mask.classList.remove('hidden'); mask.classList.add('flex');
        }
        function closePayNode() {
            var mask = document.getElementById('payNodeMask');
            mask.classList.add('hidden'); mask.classList.remove('flex');
        }
        function confirmPayNode() {
            var cid = document.getElementById('pnContractId').value;
            var idx = Number(document.getElementById('pnNodeIdx').value);
            var date = document.getElementById('pnPaidDate').value;
            if (!date) { toast('请选择收款日期', 'red'); return; }
            var voucher = document.getElementById('pnVoucher').value.trim();
            var c = markNodePaid(cid, idx, date, voucher);
            if (c) {
                toast('已标记收款：'+c.paymentNodes[idx].name+(c.status==='已完成'?'，合同已完成':''), 'green');
                closePayNode(); renderList();
            }
        }
        function toast(msg, color) {
            var el = document.createElement('div');
            el.className = 'fixed top-6 left-1/2 -translate-x-1/2 z-[60] px-5 py-3 rounded-2xl text-white text-xs font-bold shadow-xl '+(color==='red'?'bg-red-500':'bg-emerald-500');
            el.innerHTML = '<i class="fa '+(color==='red'?'fa-exclamation-circle':'fa-check-circle')+' mr-2"></i>'+msg;
            document.body.appendChild(el);
            setTimeout(function(){ el.remove(); }, 2400);
        }
        window.addEventListener('contracts-changed', renderList);
        renderList();
    </script>
</body>
</html>
