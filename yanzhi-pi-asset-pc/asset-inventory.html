<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="asset-data.js"></script>
</head>
<body class="bg-slate-50 p-6 min-h-screen">
    <div class="max-w-[1400px] mx-auto">
        <!-- 头部 -->
        <div class="flex justify-between items-center mb-8 flex-wrap gap-4">
            <div>
                <h1 class="text-2xl font-black text-slate-800">资产盘点管理</h1>
                <p class="text-sm text-slate-400 mt-1">定期盘点无形资产，核对账实是否相符，发现异常及时处理</p>
            </div>
            <button onclick="openNewInventory()" class="px-6 py-3 bg-emerald-600 text-white rounded-2xl text-xs font-bold shadow-xl shadow-emerald-100 hover:bg-emerald-700 transition-all flex items-center">
                <i class="fa fa-play-circle mr-2"></i> 发起盘点任务
            </button>
        </div>

        <!-- 盘点统计（口径：仅统计所选盘点任务/期间，不跨任务汇总） -->
        <div id="statsWrap" class="mb-8">
            <div class="flex items-center justify-between mb-4 flex-wrap gap-3">
                <div class="flex items-center gap-3 flex-wrap">
                    <label class="text-[11px] font-bold text-slate-400 uppercase">统计口径（盘点任务）</label>
                    <select id="statTaskSel" onchange="onStatTaskChange()" class="px-3 py-2 bg-white border border-slate-200 rounded-xl text-xs font-bold text-slate-700 outline-none cursor-pointer"></select>
                </div>
                <p id="statCaliber" class="text-[11px] text-slate-400"></p>
            </div>
            <div id="statsBox" class="grid grid-cols-1 md:grid-cols-4 gap-6"></div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- 盘点任务列表 -->
            <div class="lg:col-span-2 bg-white rounded-[32px] p-8 border border-slate-100 shadow-sm">
                <h3 class="text-sm font-black text-slate-800 uppercase tracking-widest mb-6">盘点任务</h3>
                <div id="taskList" class="space-y-4"></div>
            </div>

            <!-- 本任务盘点异常（口径跟随上方所选任务） -->
            <div id="abnWrap" class="bg-white rounded-[32px] p-8 border border-slate-100 shadow-sm">
                <h3 class="text-sm font-black text-slate-800 uppercase tracking-widest mb-1">盘点发现异常 <span id="abnCount" class="ml-2 px-2 py-0.5 bg-red-100 text-red-600 text-[10px] rounded-full">0</span></h3>
                <p class="text-[10px] text-slate-400 mb-5">仅列示当前所选盘点任务中标记为"异常"的资产</p>
                <div id="abnormalList" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <!-- 发起盘点任务弹窗 -->
    <div id="newInvMask" class="hidden fixed inset-0 bg-black/50 z-50 items-center justify-center">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md mx-4 overflow-hidden">
            <div class="px-6 py-4 bg-emerald-600 text-white flex justify-between items-center">
                <div>
                    <p class="text-sm font-black"><i class="fa fa-play-circle-o mr-1"></i>发起盘点任务</p>
                    <p class="text-[10px] opacity-80 mt-0.5">选择盘点范围，系统将自动生成盘点明细</p>
                </div>
                <button onclick="closeNewInventory()" class="w-8 h-8 hover:bg-white/20 rounded-lg transition-all"><i class="fa fa-times"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="text-[11px] font-bold text-slate-500 mb-1 block">任务名称 <span class="text-red-400">*</span></label>
                    <input id="invName" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs outline-none focus:border-emerald-500" placeholder="如：2026年度资产盘点">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[11px] font-bold text-slate-500 mb-1 block">盘点周期</label>
                        <select id="invPeriod" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs outline-none focus:border-emerald-500">
                            <option>年度盘点</option><option>半年度盘点</option><option>季度盘点</option><option>月度盘点</option><option>临时抽盘</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[11px] font-bold text-slate-500 mb-1 block">开始日期</label>
                        <input id="invStart" type="date" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs outline-none focus:border-emerald-500">
                    </div>
                </div>
                <div>
                    <label class="text-[11px] font-bold text-slate-500 mb-1 block">盘点范围（资产类型）</label>
                    <div id="typeBox" class="flex flex-wrap gap-2"></div>
                    <p class="text-[10px] text-slate-400 mt-1">不选则盘点全部有效中资产</p>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[11px] font-bold text-slate-500 mb-1 block">负责人</label>
                        <input id="invOwner" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs outline-none focus:border-emerald-500" value="财务部" placeholder="如：财务部">
                    </div>
                    <div>
                        <label class="text-[11px] font-bold text-slate-500 mb-1 block">截止日期</label>
                        <input id="invDeadline" type="date" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs outline-none focus:border-emerald-500">
                    </div>
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button onclick="closeNewInventory()" class="px-4 py-2 text-slate-500 text-xs font-bold hover:bg-slate-50 rounded-xl transition-all">取消</button>
                    <button onclick="confirmNewInventory()" class="px-5 py-2 bg-emerald-600 text-white text-xs font-bold rounded-xl hover:bg-emerald-700 transition-all"><i class="fa fa-check mr-1"></i>创建任务</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 盘点明细弹窗（继续盘点） -->
    <div id="detailMask" class="hidden fixed inset-0 bg-black/50 z-50 items-center justify-center">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-3xl mx-4 overflow-hidden max-h-[85vh] flex flex-col">
            <div class="px-6 py-4 bg-blue-600 text-white flex justify-between items-center flex-shrink-0">
                <div>
                    <p id="detailTitle" class="text-sm font-black">盘点明细</p>
                    <p id="detailSub" class="text-[10px] opacity-80 mt-0.5"></p>
                </div>
                <button onclick="closeDetail()" class="w-8 h-8 hover:bg-white/20 rounded-lg transition-all"><i class="fa fa-times"></i></button>
            </div>
            <div class="p-6 overflow-y-auto space-y-2" id="detailList"></div>
        </div>
    </div>

    <!-- 单项盘点确认弹窗 -->
    <div id="itemMask" class="hidden fixed inset-0 bg-black/50 z-[60] items-center justify-center">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm mx-4 overflow-hidden">
            <div class="px-6 py-4 bg-blue-600 text-white flex justify-between items-center">
                <p id="itemTitle" class="text-sm font-black">盘点确认</p>
                <button onclick="closeItem()" class="w-8 h-8 hover:bg-white/20 rounded-lg transition-all"><i class="fa fa-times"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="text-[11px] font-bold text-slate-500 mb-1 block">盘点结果 <span class="text-red-400">*</span></label>
                    <div class="flex gap-3">
                        <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="itemResult" value="正常" checked class="accent-emerald-600"><span class="text-xs font-bold text-emerald-600"><i class="fa fa-check-circle mr-1"></i>正常</span></label>
                        <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="itemResult" value="异常" class="accent-red-500"><span class="text-xs font-bold text-red-600"><i class="fa fa-exclamation-circle mr-1"></i>异常</span></label>
                    </div>
                </div>
                <div>
                    <label class="text-[11px] font-bold text-slate-500 mb-1 block">备注</label>
                    <textarea id="itemNote" rows="2" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs outline-none focus:border-blue-500" placeholder="如：证书原件已核对 / 权属证明缺失等"></textarea>
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button onclick="closeItem()" class="px-4 py-2 text-slate-500 text-xs font-bold hover:bg-slate-50 rounded-xl transition-all">取消</button>
                    <button onclick="confirmItem()" class="px-5 py-2 bg-blue-600 text-white text-xs font-bold rounded-xl hover:bg-blue-700 transition-all"><i class="fa fa-check mr-1"></i>确认盘点</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        var _selectedTypes = [];
        var _curTaskId = null;
        var _curAssetId = null;
        var _statTaskId = null;

        // 渲染顶部任务选择器 + 该任务口径统计
        function renderStats() {
            var wrap = document.getElementById('statsWrap');
            if (!INVENTORY_TASKS.length) { wrap.classList.add('hidden'); return; }
            wrap.classList.remove('hidden');
            // 选中任务有效性兜底
            if (!_statTaskId || !INVENTORY_TASKS.some(function (t) { return t.id === _statTaskId; })) {
                _statTaskId = INVENTORY_TASKS[0].id;
            }
            var sel = document.getElementById('statTaskSel');
            sel.innerHTML = INVENTORY_TASKS.map(function (t) {
                return '<option value="' + t.id + '"' + (t.id === _statTaskId ? ' selected' : '') + '>' + t.name + '（' + t.periodType + '）</option>';
            }).join('');

            var s = getInventoryStats(_statTaskId);
            var t = s.task;
            var pct = s.should ? Math.round(s.inventoried / s.should * 100) : 0;
            var period = (t.startDate || t.createdAt) + ' ~ ' + (t.deadline || '待完成');
            document.getElementById('statCaliber').innerHTML = '<i class="fa fa-info-circle mr-1"></i>口径：' + t.periodType + ' · 期间 ' + period + ' · 范围 ' + (t.scopeTypes.length ? t.scopeTypes.join('、') : '全部类型') + '（仅统计本任务，不跨任务汇总）';
            document.getElementById('statsBox').innerHTML = [
                card('应盘点', s.should, '项', 'text-slate-800', 'fa-list-alt'),
                card('已盘点', s.inventoried, '项 (' + pct + '%)', 'text-green-600', 'fa-check-square-o'),
                card('正常', s.normal, '项', 'text-blue-600', 'fa-thumbs-up'),
                card('异常', s.abnormal, '项', 'text-red-600', 'fa-exclamation-triangle')
            ].join('');
        }
        function onStatTaskChange() {
            _statTaskId = document.getElementById('statTaskSel').value;
            renderStats();
            renderAbnormal();
        }
        function card(label, val, unit, color, icon) {
            return '<div class="bg-white p-6 rounded-[32px] border border-slate-100 shadow-sm">'
                + '<p class="text-[10px] font-bold text-slate-400 uppercase mb-2">' + label + '</p>'
                + '<div class="flex items-baseline space-x-2">'
                +   '<i class="fa ' + icon + ' ' + color + ' mr-1"></i>'
                +   '<span class="text-3xl font-black ' + color + '">' + val + '</span>'
                +   '<span class="text-xs ' + color + ' font-bold">' + unit + '</span>'
                + '</div></div>';
        }

        function renderTasks() {
            var box = document.getElementById('taskList');
            if (!INVENTORY_TASKS.length) {
                box.innerHTML = '<div class="text-center py-10"><p class="text-xs text-slate-400 mb-3"><i class="fa fa-clipboard text-slate-300 mr-1"></i>暂无盘点任务</p><button onclick="openNewInventory()" class="px-4 py-2 bg-emerald-600 text-white text-[11px] font-bold rounded-xl hover:bg-emerald-700"><i class="fa fa-plus mr-1"></i>发起第一个盘点任务</button></div>';
                return;
            }
            box.innerHTML = INVENTORY_TASKS.map(function (t) {
                var done = t.items.filter(function (i) { return i.status === '已盘点'; }).length;
                var total = t.items.length;
                var pct = total ? Math.round(done / total * 100) : 100;
                var isDone = t.status === '已完成';
                var scope = t.scopeTypes.length ? t.scopeTypes.join('、') : '全部类型';
                var stCls = isDone ? 'bg-green-100 text-green-600' : 'bg-blue-100 text-blue-600';
                var barCls = isDone ? 'bg-green-600' : 'bg-blue-600';
                var btnCls = isDone ? 'bg-green-600 hover:bg-green-700' : 'bg-blue-600 hover:bg-blue-700';
                var btnText = isDone ? '查看报告' : '继续盘点';
                return '<div class="p-4 ' + (isDone ? 'bg-green-50 border-green-100' : 'bg-blue-50 border-blue-100') + ' rounded-2xl border">'
                    + '<div class="flex justify-between items-start mb-3 flex-wrap gap-2">'
                    +   '<div>'
                    +     '<p class="text-sm font-bold text-slate-800">' + t.name + '</p>'
                    +     '<p class="text-[10px] text-slate-400 mt-1">' + t.periodType + ' · 创建：' + t.createdAt + ' · 负责人：' + t.owner + (t.deadline ? ' · 截止：' + t.deadline : '') + '</p>'
                    +     '<p class="text-[10px] text-slate-400 mt-0.5">范围：' + scope + '</p>'
                    +   '</div>'
                    +   '<span class="px-2 py-1 ' + stCls + ' text-[10px] font-bold rounded">' + t.status + '</span>'
                    + '</div>'
                    + '<div class="flex items-center justify-between flex-wrap gap-3">'
                    +   '<div class="flex items-center">'
                    +     '<div class="w-32 bg-slate-200 h-2 rounded-full overflow-hidden mr-3"><div class="' + barCls + ' h-full" style="width:' + pct + '%"></div></div>'
                    +     '<span class="text-xs font-bold text-slate-600">' + done + '/' + total + '（' + pct + '%）</span>'
                    +   '</div>'
                    +   '<button onclick="openDetail(\'' + t.id + '\')" class="px-3 py-1.5 ' + btnCls + ' text-white text-[10px] font-bold rounded-lg transition-all">' + btnText + '</button>'
                    + '</div>'
                    + '</div>';
            }).join('');
        }

        function renderAbnormal() {
            var box = document.getElementById('abnormalList');
            if (!INVENTORY_TASKS.length) {
                document.getElementById('abnCount').innerText = 0;
                box.innerHTML = '<p class="text-xs text-slate-400 text-center py-6"><i class="fa fa-clipboard mr-1"></i>暂无盘点任务，发起任务后此处显示盘点异常</p>';
                return;
            }
            var list = getTaskAbnormalItems(_statTaskId);
            document.getElementById('abnCount').innerText = list.length;
            if (!list.length) {
                box.innerHTML = '<p class="text-xs text-slate-400 text-center py-6"><i class="fa fa-check-circle text-emerald-400 mr-1"></i>本任务暂未发现异常</p>';
                return;
            }
            box.innerHTML = list.map(function (i) {
                return '<div class="p-4 bg-red-50 rounded-2xl border border-red-100">'
                    + '<div class="flex items-center justify-between mb-2">'
                    +   '<p class="text-xs font-bold text-slate-800 truncate">' + i.name + '</p>'
                    +   '<span class="text-[9px] text-red-600 font-bold flex-shrink-0 ml-2"><i class="fa fa-exclamation-circle mr-0.5"></i>盘点异常</span>'
                    + '</div>'
                    + '<p class="text-[10px] text-slate-500">' + i.type + ' · ' + (i.certNo || '—') + ' · 盘点日 ' + (i.inventoryDate || '—') + '</p>'
                    + '<p class="text-[10px] text-red-500 mt-1.5 leading-relaxed">' + (i.note || '盘点时标记为异常，未填写说明') + '</p>'
                    + '<button onclick="openAssetDetail(\'' + i.assetId + '\')" class="mt-3 w-full px-3 py-2 bg-red-600 text-white text-[10px] font-bold rounded-lg hover:bg-red-700 transition-all">查看资产并处理</button>'
                    + '</div>';
            }).join('');
        }

        function openNewInventory() {
            _selectedTypes = [];
            var today = new Date().toISOString().slice(0, 10);
            var year = today.slice(0, 4);
            document.getElementById('invName').value = year + '年度资产盘点';
            document.getElementById('invPeriod').value = '年度盘点';
            document.getElementById('invStart').value = today;
            document.getElementById('invOwner').value = '财务部';
            document.getElementById('invDeadline').value = '';
            renderTypeBox();
            document.getElementById('newInvMask').classList.remove('hidden');
            document.getElementById('newInvMask').classList.add('flex');
        }
        function closeNewInventory() {
            document.getElementById('newInvMask').classList.add('hidden');
            document.getElementById('newInvMask').classList.remove('flex');
        }
        function renderTypeBox() {
            var box = document.getElementById('typeBox');
            box.innerHTML = Object.keys(ASSET_TYPE_STYLE).map(function (t) {
                var on = _selectedTypes.indexOf(t) >= 0;
                return '<span onclick="toggleType(\'' + t + '\')" class="px-3 py-1.5 rounded-xl text-[11px] font-bold cursor-pointer transition-all ' + (on ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-500 hover:bg-slate-200') + '">' + t + '</span>';
            }).join('');
        }
        function toggleType(t) {
            var i = _selectedTypes.indexOf(t);
            if (i >= 0) _selectedTypes.splice(i, 1); else _selectedTypes.push(t);
            renderTypeBox();
        }
        function confirmNewInventory() {
            var name = document.getElementById('invName').value.trim();
            if (!name) { toast('请填写任务名称', 'red'); return; }
            var task = createInventoryTask({
                name: name,
                periodType: document.getElementById('invPeriod').value,
                startDate: document.getElementById('invStart').value,
                owner: document.getElementById('invOwner').value.trim(),
                deadline: document.getElementById('invDeadline').value,
                types: _selectedTypes
            });
            _statTaskId = task.id;
            toast('盘点任务已创建，共 ' + task.items.length + ' 项资产待盘点', 'green');
            closeNewInventory();
            renderStats(); renderTasks(); renderAbnormal();
        }

        function openDetail(taskId) {
            _curTaskId = taskId;
            _statTaskId = taskId;
            renderStats();
            renderAbnormal();
            var task = INVENTORY_TASKS.find(function (t) { return t.id === taskId; });
            if (!task) return;
            document.getElementById('detailTitle').innerText = task.name + ' · 盘点明细';
            var done = task.items.filter(function (i) { return i.status === '已盘点'; }).length;
            document.getElementById('detailSub').innerText = '已盘点 ' + done + '/' + task.items.length + ' · 状态：' + task.status;
            renderDetailList();
            document.getElementById('detailMask').classList.remove('hidden');
            document.getElementById('detailMask').classList.add('flex');
        }
        function closeDetail() {
            document.getElementById('detailMask').classList.add('hidden');
            document.getElementById('detailMask').classList.remove('flex');
        }
        function renderDetailList() {
            var task = INVENTORY_TASKS.find(function (t) { return t.id === _curTaskId; });
            if (!task) return;
            var box = document.getElementById('detailList');
            box.innerHTML = task.items.map(function (i) {
                var isDone = i.status === '已盘点';
                var rowCls = isDone ? (i.result === '异常' ? 'bg-red-50 border-red-100' : 'bg-emerald-50 border-emerald-100') : 'bg-slate-50 border-slate-100';
                var badge = isDone
                    ? (i.result === '异常' ? '<span class="px-2 py-0.5 bg-red-100 text-red-600 text-[10px] font-bold rounded">异常</span>' : '<span class="px-2 py-0.5 bg-emerald-100 text-emerald-600 text-[10px] font-bold rounded">正常</span>')
                    : '<span class="px-2 py-0.5 bg-slate-200 text-slate-500 text-[10px] font-bold rounded">未盘点</span>';
                var btn = isDone
                    ? '<button onclick="openItem(\'' + i.assetId + '\')" class="px-3 py-1.5 bg-slate-400 text-white text-[10px] font-bold rounded-lg hover:bg-slate-500">重新盘点</button>'
                    : '<button onclick="openItem(\'' + i.assetId + '\')" class="px-3 py-1.5 bg-blue-600 text-white text-[10px] font-bold rounded-lg hover:bg-blue-700">去盘点</button>';
                var noteTxt = isDone && i.note ? '<p class="text-[10px] text-slate-500 mt-1"><i class="fa fa-sticky-note-o mr-1"></i>' + i.note + '</p>' : '';
                return '<div class="flex items-center p-3 rounded-2xl border ' + rowCls + ' gap-3">'
                    + '<div class="flex-1 min-w-0">'
                    +   '<p class="text-xs font-bold text-slate-800 truncate">' + i.name + ' ' + badge + '</p>'
                    +   '<p class="text-[10px] text-slate-400 mt-0.5">' + i.type + ' · ' + (i.certNo || '—') + (isDone ? ' · ' + i.inventoryDate : '') + '</p>'
                    +   noteTxt
                    + '</div>'
                    + btn
                    + '</div>';
            }).join('');
        }

        function openItem(assetId) {
            _curAssetId = assetId;
            document.getElementById('itemTitle').innerText = '盘点确认';
            document.querySelectorAll('input[name="itemResult"]').forEach(function (r) { r.checked = r.value === '正常'; });
            document.getElementById('itemNote').value = '';
            document.getElementById('itemMask').classList.remove('hidden');
            document.getElementById('itemMask').classList.add('flex');
        }
        function closeItem() {
            document.getElementById('itemMask').classList.add('hidden');
            document.getElementById('itemMask').classList.remove('flex');
        }
        function confirmItem() {
            var result = document.querySelector('input[name="itemResult"]:checked').value;
            var note = document.getElementById('itemNote').value.trim();
            inventoryAsset(_curTaskId, _curAssetId, result, note);
            toast('已记录盘点结果：' + result, 'green');
            closeItem();
            renderDetailList();
            var task = INVENTORY_TASKS.find(function (t) { return t.id === _curTaskId; });
            if (task) {
                var done = task.items.filter(function (i) { return i.status === '已盘点'; }).length;
                document.getElementById('detailSub').innerText = '已盘点 ' + done + '/' + task.items.length + ' · 状态：' + task.status;
            }
            renderStats(); renderTasks();
        }

        function toast(msg, color) {
            var el = document.createElement('div');
            el.className = 'fixed top-6 left-1/2 -translate-x-1/2 z-[70] px-5 py-3 rounded-2xl text-white text-xs font-bold shadow-xl ' + (color === 'red' ? 'bg-red-500' : 'bg-emerald-500');
            el.innerHTML = '<i class="fa ' + (color === 'red' ? 'fa-exclamation-circle' : 'fa-check-circle') + ' mr-2"></i>' + msg;
            document.body.appendChild(el);
            setTimeout(function () { el.remove(); }, 2400);
        }

        window.addEventListener('inventory-changed', function () {
            renderStats(); renderTasks(); renderAbnormal();
            if (!document.getElementById('detailMask').classList.contains('hidden') && _curTaskId) {
                renderDetailList();
                var t = INVENTORY_TASKS.find(function (x) { return x.id === _curTaskId; });
                if (t) {
                    var d = t.items.filter(function (i) { return i.status === '已盘点'; }).length;
                    document.getElementById('detailSub').innerText = '已盘点 ' + d + '/' + t.items.length + ' · 状态：' + t.status;
                }
            }
        });

        renderStats();
        renderTasks();
        renderAbnormal();
    </script>
</body>
</html>
