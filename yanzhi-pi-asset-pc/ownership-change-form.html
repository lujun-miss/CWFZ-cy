<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>变更登记 - 研知π无形资产</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="asset-data.js"></script>
    <style>
        body { font-family:'PingFang SC','Microsoft YaHei',sans-serif; background:#f7f8fa; }
        .field-label { font-size:11px; font-weight:800; color:#64748b; margin-bottom:4px; display:block; }
        .field-input { width:100%; padding:8px 12px; border:1px solid #e2e8f0; border-radius:12px; font-size:12px; outline:none; background:#fff; }
        .field-input:focus { border-color:#f59e0b; box-shadow:0 0 0 3px rgba(245,158,11,.12); }
        .type-card { cursor:pointer; transition:all .2s; }
        .type-card.active { border-color:#f59e0b; background:#fffbeb; box-shadow:0 0 0 3px rgba(245,158,11,.12); }
    </style>
</head>
<body class="text-slate-800 p-6 min-h-screen">
    <div class="max-w-[1100px] mx-auto">
        <!-- 头部 + 返回 -->
        <div class="flex items-center justify-between mb-6 flex-wrap gap-4">
            <div class="flex items-center gap-3">
                <button onclick="goBack()" class="w-10 h-10 rounded-xl bg-white border border-slate-200 hover:bg-slate-50 flex items-center justify-center text-slate-500">
                    <i class="fa fa-arrow-left"></i>
                </button>
                <div>
                    <h1 class="text-2xl font-black text-slate-800"><i class="fa fa-exchange text-orange-500 mr-2"></i>变更登记</h1>
                    <p class="text-sm text-slate-400 mt-1">选择变更类型 → 填写变更表单 → 提交审批 → 通过后自动更新资产档案</p>
                </div>
            </div>
        </div>

        <!-- 流程步骤条 -->
        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-4 mb-6">
            <div class="flex items-center">
                <div class="flex-1 flex items-center">
                    <div class="w-8 h-8 rounded-full bg-amber-500 text-white flex items-center justify-center text-xs font-black">1</div>
                    <span class="ml-2 text-xs font-bold text-amber-600">选择变更类型</span>
                </div>
                <div class="flex-1 h-0.5 bg-slate-200"></div>
                <div class="flex-1 flex items-center">
                    <div id="step2" class="w-8 h-8 rounded-full bg-slate-200 text-slate-500 flex items-center justify-center text-xs font-black">2</div>
                    <span id="step2Label" class="ml-2 text-xs font-bold text-slate-400">填写变更表单</span>
                </div>
                <div class="flex-1 h-0.5 bg-slate-200"></div>
                <div class="flex-1 flex items-center">
                    <div id="step3" class="w-8 h-8 rounded-full bg-slate-200 text-slate-500 flex items-center justify-center text-xs font-black">3</div>
                    <span id="step3Label" class="ml-2 text-xs font-bold text-slate-400">提交审批</span>
                </div>
            </div>
        </div>

        <!-- 变更类型卡片 -->
        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-6 mb-6">
            <h2 class="text-sm font-black text-slate-800 mb-4"><i class="fa fa-th text-orange-500 mr-1.5"></i>选择变更类型</h2>
            <div id="typeBox" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div>
            <p id="formHint" class="text-[10px] text-slate-400 mt-3">请先选择变更类型，再填写下方变更表单</p>
        </div>

        <!-- 变更登记表单 -->
        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm">
            <div class="px-6 py-4 border-b border-slate-100">
                <h2 class="text-sm font-black text-slate-800"><i class="fa fa-edit text-orange-500 mr-1.5"></i>变更登记表单</h2>
            </div>
            <div class="p-6 space-y-4">
                <input type="hidden" id="fType" value="">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="field-label">选择资产 <span class="text-red-400">*</span></label>
                        <select id="fAsset" class="field-input" onchange="syncFromAsset()"><option value="">请选择</option></select>
                    </div>
                    <div>
                        <label class="field-label">变更日期 <span class="text-red-400">*</span></label>
                        <input id="fDate" type="date" class="field-input">
                    </div>
                </div>
                <!-- 各变更类型专属字段 -->
                <div id="extraFields" class="space-y-3"></div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="field-label">操作人</label>
                        <input id="fOperator" class="field-input" placeholder="如：王法务">
                    </div>
                    <div>
                        <label class="field-label">变更原因 / 说明</label>
                        <input id="fReason" class="field-input" placeholder="如：产品升级更名 / 业务调整权属">
                    </div>
                </div>
                <div class="p-3 bg-amber-50 border border-amber-200 rounded-xl text-[10px] text-amber-700 font-bold">
                    <i class="fa fa-exclamation-triangle mr-1"></i>提交后将创建一条"变更"阶段的生命周期事件（状态=待审批）。审批通过后系统自动更新资产档案字段（名称/权属/估值/状态）。
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button onclick="goBack()" class="px-4 py-2 text-slate-500 text-xs font-bold hover:bg-slate-50 rounded-xl">取消返回</button>
                    <button onclick="resetForm()" class="px-4 py-2 text-slate-500 text-xs font-bold hover:bg-slate-50 rounded-xl border border-slate-200">重置</button>
                    <button onclick="submitChange()" class="px-6 py-2 bg-amber-500 text-white text-xs font-bold rounded-xl hover:bg-amber-600 shadow-md shadow-amber-100"><i class="fa fa-check mr-1"></i>提交变更登记</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        var _type = '';

        var TYPE_META = {
            '名称变更': { icon: 'fa-pencil',    color: 'text-blue-600 bg-blue-50', desc: '更新资产名称', extra: [
                { key: 'fromName', label: '原名称（自动带出，可改）', placeholder: '原名' },
                { key: 'toName', label: '新名称 <span class="text-red-400">*</span>', placeholder: '新名称', type: 'input' }
            ]},
            '权属转移': { icon: 'fa-share-square-o', color: 'text-orange-600 bg-orange-50', desc: '内部调拨/外部转让', extra: [
                { key: 'transferType', label: '转移类型 <span class="text-red-400">*</span>', options: ['内部调拨', '外部转让'] },
                { key: 'fromOwner', label: '原权利人', placeholder: '如：本公司' },
                { key: 'toOwner', label: '新权利人 <span class="text-red-400">*</span>', placeholder: '如：子公司A' }
            ]},
            '价值重估': { icon: 'fa-line-chart', color: 'text-emerald-600 bg-emerald-50', desc: '调整账面估值', extra: [
                { key: 'fromValue', label: '原净值（自动带出）', placeholder: '原值' },
                { key: 'toValue', label: '新估值(万) <span class="text-red-400">*</span>', placeholder: '0.00', type: 'number' },
                { key: 'method', label: '评估方法', options: ['收益法', '市场法', '成本法'] }
            ]},
            '状态变更': { icon: 'fa-power-off', color: 'text-slate-600 bg-slate-100', desc: '启用/停用/封存', extra: [
                { key: 'fromState', label: '当前状态（自动带出）', placeholder: '当前状态' },
                { key: 'toState', label: '目标状态 <span class="text-red-400">*</span>', options: USE_STATES }
            ]}
        };

        function goBack() {
            try {
                if (parent && parent.loadPage) {
                    parent.loadPage('ownership-change.html', null);
                    return;
                }
            } catch (e) {}
            window.location.href = 'ownership-change.html';
        }

        function renderTypes() {
            var box = document.getElementById('typeBox');
            box.innerHTML = CHANGE_TYPES.map(function (t) {
                var meta = TYPE_META[t];
                var active = _type === t;
                return '<div class="type-card p-4 rounded-2xl border ' + (active ? 'active' : 'border-slate-200 bg-slate-50') + '" onclick="selectType(\'' + t + '\')">'
                    + '<div class="w-9 h-9 rounded-xl flex items-center justify-center ' + meta.color + ' mb-2"><i class="fa ' + meta.icon + '"></i></div>'
                    + '<p class="text-xs font-black text-slate-800">' + t + '</p>'
                    + '<p class="text-[10px] text-slate-400 mt-1">' + meta.desc + '</p>'
                    + '</div>';
            }).join('');
        }

        function selectType(t) {
            _type = t;
            document.getElementById('fType').value = t;
            document.getElementById('formHint').innerHTML = '<i class="fa fa-check-circle text-emerald-500 mr-1"></i>已选择：「<span class="font-bold text-amber-600">' + t + '</span>」 · ' + TYPE_META[t].desc;
            var s2 = document.getElementById('step2');
            s2.className = 'w-8 h-8 rounded-full bg-amber-500 text-white flex items-center justify-center text-xs font-black';
            document.getElementById('step2Label').className = 'ml-2 text-xs font-bold text-amber-600';
            renderTypes();
            renderExtraFields();
            syncFromAsset();
        }

        function renderExtraFields() {
            var box = document.getElementById('extraFields');
            if (!_type) { box.innerHTML = ''; return; }
            var extras = TYPE_META[_type].extra;
            box.innerHTML = extras.map(function (ex) {
                if (ex.options) {
                    var opts = ['<option value="">请选择</option>'].concat(ex.options.map(function (o) { return '<option>' + o + '</option>'; })).join('');
                    return '<div><label class="field-label">' + ex.label + '</label><select id="ext_' + ex.key + '" class="field-input">' + opts + '</select></div>';
                }
                var t = ex.type === 'number' ? ' type="number" min="0" step="0.01"' : '';
                return '<div><label class="field-label">' + ex.label + '</label><input id="ext_' + ex.key + '" class="field-input" placeholder="' + ex.placeholder + '"' + t + '></div>';
            }).join('');
            syncFromAsset();
        }

        function initAssetSelect() {
            var sel = document.getElementById('fAsset');
            sel.innerHTML = '<option value="">请选择</option>';
            ASSETS.forEach(function (a) {
                var opt = document.createElement('option');
                opt.value = a.id;
                opt.innerText = a.name + ' · ' + (a.assetCode || a.id);
                sel.appendChild(opt);
            });
        }

        function syncFromAsset() {
            if (!_type) return;
            var id = document.getElementById('fAsset').value;
            var a = id ? getAssetById(id) : null;
            if (_type === '名称变更' && a) {
                var f = document.getElementById('ext_fromName'); if (f) f.value = a.name;
            }
            if (_type === '权属转移' && a) {
                var f2 = document.getElementById('ext_fromOwner'); if (f2) f2.value = a.ownerShip || '本公司';
            }
            if (_type === '价值重估' && a) {
                var f3 = document.getElementById('ext_fromValue'); if (f3) f3.value = a.netValue;
            }
            if (_type === '状态变更' && a) {
                var f4 = document.getElementById('ext_fromState');
                if (f4) f4.value = a.active ? '启用' : (a.tags.indexOf('沉睡资产') >= 0 ? '封存' : '停用');
            }
        }

        function resetForm() {
            _type = '';
            document.getElementById('fType').value = '';
            document.getElementById('fAsset').value = '';
            document.getElementById('fDate').value = new Date().toISOString().slice(0, 10);
            document.getElementById('fOperator').value = '';
            document.getElementById('fReason').value = '';
            document.getElementById('formHint').innerText = '请先选择变更类型，再填写下方变更表单';
            var s2 = document.getElementById('step2');
            s2.className = 'w-8 h-8 rounded-full bg-slate-200 text-slate-500 flex items-center justify-center text-xs font-black';
            document.getElementById('step2Label').className = 'ml-2 text-xs font-bold text-slate-400';
            renderTypes();
            renderExtraFields();
        }

        function submitChange() {
            if (!_type) { toast('请先选择变更类型', 'red'); return; }
            var assetId = document.getElementById('fAsset').value;
            var date = document.getElementById('fDate').value;
            var operator = document.getElementById('fOperator').value.trim();
            var reason = document.getElementById('fReason').value.trim();
            if (!assetId) { toast('请选择资产', 'red'); return; }
            if (!date) { toast('请选择变更日期', 'red'); return; }
            var a = getAssetById(assetId);
            if (!a) { toast('资产不存在', 'red'); return; }

            var fromVal = '', toVal = '', amount = 0, noteExtra = '';
            if (_type === '名称变更') {
                var oldName = document.getElementById('ext_fromName').value || a.name;
                var newName = document.getElementById('ext_toName').value.trim();
                if (!newName) { toast('请填写新名称', 'red'); return; }
                fromVal = oldName; toVal = newName;
            } else if (_type === '权属转移') {
                var tt = document.getElementById('ext_transferType').value;
                var fromOwner = document.getElementById('ext_fromOwner').value;
                var toOwner = document.getElementById('ext_toOwner').value.trim();
                if (!tt) { toast('请选择转移类型', 'red'); return; }
                if (!toOwner) { toast('请填写新权利人', 'red'); return; }
                fromVal = fromOwner || (a.ownerShip || '本公司');
                toVal = toOwner;
                noteExtra = '转移类型：' + tt;
            } else if (_type === '价值重估') {
                var fromV = document.getElementById('ext_fromValue').value;
                var toV = Number(document.getElementById('ext_toValue').value);
                var method = document.getElementById('ext_method').value;
                if (!toV || toV <= 0) { toast('请填写新估值', 'red'); return; }
                fromVal = String(fromV || a.netValue); toVal = String(toV);
                if (method) noteExtra = '评估方法：' + method;
            } else if (_type === '状态变更') {
                var fromS = document.getElementById('ext_fromState').value || (a.active ? '启用' : '封存');
                var toS = document.getElementById('ext_toState').value;
                if (!toS) { toast('请选择目标状态', 'red'); return; }
                fromVal = fromS; toVal = toS;
            }

            var fullNote = '变更类型：' + _type;
            if (noteExtra) fullNote += '；' + noteExtra;
            if (reason) fullNote += '；说明：' + reason;

            // 步骤3激活
            var s3 = document.getElementById('step3');
            s3.className = 'w-8 h-8 rounded-full bg-amber-500 text-white flex items-center justify-center text-xs font-black';
            document.getElementById('step3Label').className = 'ml-2 text-xs font-bold text-amber-600';

            var ev = addLifecycleEvent({
                assetId: assetId,
                stage: '变更',
                eventType: _type,
                eventDate: date,
                operator: operator,
                approver: '',
                status: '待审批',
                note: fullNote,
                attachments: [],
                fromVal: fromVal,
                toVal: toVal,
                amount: amount
            });
            if (ev) {
                toast('已提交变更登记（待审批）：' + a.name, 'green');
                setTimeout(function () { goBack(); }, 900);
            }
        }

        function toast(msg, color) {
            var el = document.createElement('div');
            el.className = 'fixed top-6 left-1/2 -translate-x-1/2 z-[60] px-5 py-3 rounded-2xl text-white text-xs font-bold shadow-xl ' + (color === 'red' ? 'bg-red-500' : 'bg-emerald-500');
            el.innerHTML = '<i class="fa ' + (color === 'red' ? 'fa-exclamation-circle' : 'fa-check-circle') + ' mr-2"></i>' + msg;
            document.body.appendChild(el);
            setTimeout(function () { el.remove(); }, 2400);
        }

        window.addEventListener('assets-changed', initAssetSelect);

        // 初始化
        document.getElementById('fDate').value = new Date().toISOString().slice(0, 10);
        initAssetSelect();
        renderTypes();
    </script>
</body>
</html>
