<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>年费与续展预警 - 研知π无形资产</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="asset-data.js"></script>
    <style>
        body { font-family:'PingFang SC','Microsoft YaHei',sans-serif; background:#f7f8fa; }
        .field-label { font-size:11px; font-weight:800; color:#64748b; margin-bottom:4px; display:block; }
        .field-input { width:100%; padding:8px 12px; border:1px solid #e2e8f0; border-radius:12px; font-size:12px; outline:none; }
        .field-input:focus { border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,.12); }
    </style>
</head>
<body class="text-slate-800 p-6 min-h-screen">
    <div class="max-w-[1400px] mx-auto">
        <div class="mb-6">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-2xl font-black text-slate-800">年费与续展预警</h1>
                    <p class="text-sm text-slate-400 mt-1">专利年费/商标续展/软件维保多级预警，防止资产"非主动失效"</p>
                </div>
                <button onclick="restoreData()" class="px-4 py-2 bg-slate-100 text-slate-500 text-xs font-bold rounded-xl hover:bg-slate-200 transition-all"><i class="fa fa-refresh mr-1"></i>恢复示例数据</button>
            </div>
        </div>

        <!-- 年费/续展预警 -->
        <div class="mb-3">
            <h2 class="text-sm font-black text-slate-700"><i class="fa fa-bell text-amber-500 mr-1.5"></i>年费 / 续展到期提醒</h2>
            <p class="text-[10px] text-slate-400 mt-0.5">系统按档案登记的到期日自动计算剩余天数，以下展示需关注的资产</p>
        </div>

        <!-- 预警统计（2档+已过期+已缴费） -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
            <div class="bg-white p-5 rounded-2xl border border-red-200 shadow-sm cursor-pointer hover:shadow-md transition-all" onclick="setFilter('urgent')">
                <p class="text-[10px] font-bold text-red-500 uppercase tracking-widest mb-1">1个月内到期</p>
                <p class="text-2xl font-black text-red-600" id="cntUrgent">0</p>
                <p class="text-[10px] text-slate-400 mt-1">需立即缴费</p>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-amber-200 shadow-sm cursor-pointer hover:shadow-md transition-all" onclick="setFilter('remind')">
                <p class="text-[10px] font-bold text-amber-500 uppercase tracking-widest mb-1">3个月内到期</p>
                <p class="text-2xl font-black text-amber-600" id="cntRemind">0</p>
                <p class="text-[10px] text-slate-400 mt-1">建议安排缴费</p>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-300 shadow-sm cursor-pointer hover:shadow-md transition-all" onclick="setFilter('expired')">
                <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">已过期</p>
                <p class="text-2xl font-black text-slate-600" id="cntExpired">0</p>
                <p class="text-[10px] text-slate-400 mt-1">超期未缴，请补缴</p>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-emerald-200 shadow-sm cursor-pointer hover:shadow-md transition-all" onclick="setFilter('paid')">
                <p class="text-[10px] font-bold text-emerald-500 uppercase tracking-widest mb-1">已缴费</p>
                <p class="text-2xl font-black text-emerald-600" id="cntPaid">0</p>
                <p class="text-[10px] text-slate-400 mt-1">本期已处理</p>
            </div>
        </div>

        <!-- 筛选标签 -->
        <div class="flex items-center gap-2 mb-4">
            <button onclick="setFilter('all')" id="tabAll" class="px-4 py-2 bg-blue-600 text-white text-xs font-bold rounded-xl">全部</button>
            <button onclick="setFilter('urgent')" id="tabUrgent" class="px-4 py-2 bg-white text-red-500 text-xs font-bold rounded-xl border border-red-200">1个月内</button>
            <button onclick="setFilter('remind')" id="tabRemind" class="px-4 py-2 bg-white text-amber-500 text-xs font-bold rounded-xl border border-amber-200">3个月内</button>
            <button onclick="setFilter('expired')" id="tabExpired" class="px-4 py-2 bg-white text-slate-500 text-xs font-bold rounded-xl border border-slate-200">已过期</button>
            <button onclick="setFilter('paid')" id="tabPaid" class="px-4 py-2 bg-white text-emerald-500 text-xs font-bold rounded-xl border border-emerald-200">已缴费</button>
        </div>

        <!-- 列表 -->
        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-xs">
                    <thead class="bg-slate-50 text-slate-500">
                        <tr>
                            <th class="text-left px-4 py-3 font-bold">资产名称</th>
                            <th class="text-left px-4 py-3 font-bold">类型</th>
                            <th class="text-left px-4 py-3 font-bold">费用类型</th>
                            <th class="text-right px-4 py-3 font-bold">金额(万)</th>
                            <th class="text-left px-4 py-3 font-bold">到期日</th>
                            <th class="text-center px-4 py-3 font-bold">剩余天数</th>
                            <th class="text-center px-4 py-3 font-bold">状态</th>
                            <th class="text-center px-4 py-3 font-bold">操作</th>
                        </tr>
                    </thead>
                    <tbody id="feeTbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 标记已缴费弹窗 -->
    <div id="payMask" class="hidden fixed inset-0 bg-black/50 z-50 items-center justify-center">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm mx-4 overflow-hidden">
            <div class="px-6 py-4 bg-emerald-600 text-white flex justify-between items-center">
                <p class="text-sm font-black"><i class="fa fa-check-circle mr-1"></i>标记已缴费</p>
                <button onclick="closePay()" class="w-8 h-8 hover:bg-white/20 rounded-lg"><i class="fa fa-times"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <input type="hidden" id="payAssetId">
                <p class="text-xs font-bold text-slate-800" id="payAssetName">—</p>
                <div><label class="field-label">缴费日期 <span class="text-red-400">*</span></label><input id="payDate" type="date" class="field-input"></div>
                <div><label class="field-label">缴费金额（万元）<span class="text-red-400">*</span></label><input id="payAmount" type="number" min="0" step="0.01" class="field-input" placeholder="如：0.9"></div>
                <div><label class="field-label">凭证号</label><input id="payVoucher" class="field-input" placeholder="如：银行流水号 / 票据号"></div>
                <div class="flex justify-end gap-3 pt-2">
                    <button onclick="closePay()" class="px-4 py-2 text-slate-500 text-xs font-bold hover:bg-slate-50 rounded-xl">取消</button>
                    <button onclick="confirmPay()" class="px-5 py-2 bg-emerald-600 text-white text-xs font-bold rounded-xl hover:bg-emerald-700">确认缴费</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        var _filter = 'all';
        var ALERT_STYLE = {
            remind:  { label:'3个月内', cls:'bg-amber-50 text-amber-600 border-amber-200' },
            urgent:  { label:'1个月内', cls:'bg-red-50 text-red-600 border-red-200' },
            expired: { label:'已过期', cls:'bg-slate-100 text-slate-500 border-slate-300' },
            paid:    { label:'已缴费', cls:'bg-emerald-100 text-emerald-700 border-emerald-300' }
        };

        function buildFeeList() {
            var list = [];
            ASSETS.forEach(function(a) {
                if (a.status !== '有效中') return;
                var fr = a.feeRenewal || {};
                if (!fr.dueDate) return;
                list.push({
                    assetId: a.id, assetName: a.name, type: a.type,
                    feeType: fr.type, amount: fr.amount, dueDate: fr.dueDate,
                    paidDate: fr.paidDate, alertLevel: fr.alertLevel, remainDays: fr.remainDays
                });
            });
            return list;
        }

        function render() {
            var list = buildFeeList();
            // 统计：只展示需关注的（1个月内、3个月内、已过期、已缴费）
            document.getElementById('cntUrgent').innerText = list.filter(function(x){return x.alertLevel==='urgent';}).length;
            document.getElementById('cntRemind').innerText = list.filter(function(x){return x.alertLevel==='remind';}).length;
            document.getElementById('cntExpired').innerText = list.filter(function(x){return x.alertLevel==='expired';}).length;
            document.getElementById('cntPaid').innerText = list.filter(function(x){return x.alertLevel==='paid';}).length;

            // 筛选：全部 = 只展示需关注的（urgent+remind+expired+paid，不含 normal）
            var filtered;
            if (_filter === 'all') {
                filtered = list.filter(function(x){ return x.alertLevel !== 'normal'; });
            } else {
                filtered = list.filter(function(x){ return x.alertLevel === _filter; });
            }
            // 排序：紧急 > 已过期 > 待缴 > 已缴费
            var order = {urgent:0,expired:1,remind:2,paid:3};
            filtered.sort(function(a,b){ return (order[a.alertLevel]||9) - (order[b.alertLevel]||9); });

            var tb = document.getElementById('feeTbody');
            if (!filtered.length) { tb.innerHTML = '<tr><td colspan="8" class="text-center py-10 text-slate-300"><i class="fa fa-check-circle text-2xl block mb-2"></i><span class="text-[10px] font-bold">暂无待缴费资产，所有年费/续展均在正常期内</span></td></tr>'; return; }
            tb.innerHTML = filtered.map(function(x) {
                var st = ALERT_STYLE[x.alertLevel] || ALERT_STYLE.remind;
                var remainText;
                if (x.alertLevel === 'paid') remainText = '已缴费';
                else if (x.alertLevel === 'expired') remainText = '已过期 ' + Math.abs(x.remainDays) + ' 天';
                else remainText = '剩 ' + x.remainDays + ' 天';
                var actionBtn = x.alertLevel === 'paid'
                    ? '<span class="text-emerald-500 text-[10px] font-bold"><i class="fa fa-check mr-1"></i>已处理</span>'
                    : '<button onclick="openPay(\''+x.assetId+'\')" class="px-3 py-1.5 bg-emerald-50 text-emerald-600 text-[10px] font-bold rounded-lg hover:bg-emerald-100 transition-all">标记已缴费</button>';
                return '<tr class="border-t border-slate-50 hover:bg-slate-50">'
                    + '<td class="px-4 py-3 font-bold">'+x.assetName+'</td>'
                    + '<td class="px-4 py-3 text-slate-500">'+x.type+'</td>'
                    + '<td class="px-4 py-3 text-slate-600">'+x.feeType+'</td>'
                    + '<td class="px-4 py-3 text-right font-bold '+(x.amount>0?'text-slate-700':'text-slate-400')+'">'+(x.amount>0?x.amount:'待定')+'</td>'
                    + '<td class="px-4 py-3 text-slate-500">'+x.dueDate+'</td>'
                    + '<td class="px-4 py-3 text-center font-bold">'+remainText+'</td>'
                    + '<td class="px-4 py-3 text-center"><span class="px-2 py-0.5 rounded-full border text-[10px] font-bold '+st.cls+'">'+st.label+'</span></td>'
                    + '<td class="px-4 py-3 text-center">'+actionBtn+'</td>'
                    + '</tr>';
            }).join('');
        }

        function setFilter(f) {
            _filter = f;
            var tabs = ['all','remind','urgent','expired','paid'];
            tabs.forEach(function(t) {
                var el = document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1));
                if (!el) return;
                if (t === f) {
                    el.classList.remove('bg-white','text-amber-500','text-red-500','text-slate-500','text-emerald-500','border','border-slate-200','border-amber-200','border-red-200','border-emerald-200');
                    el.classList.add('bg-blue-600','text-white');
                } else {
                    el.classList.remove('bg-blue-600','text-white');
                    el.classList.add('bg-white');
                }
            });
            render();
        }

        function openPay(id) {
            var a = getAssetById(id); if (!a) return;
            document.getElementById('payAssetId').value = id;
            document.getElementById('payAssetName').innerText = a.name + ' · ' + (a.feeRenewal.type||'年费') + ' · 到期 ' + a.feeRenewal.dueDate;
            document.getElementById('payDate').value = new Date().toISOString().slice(0,10);
            document.getElementById('payAmount').value = (a.feeRenewal.amountSet ? a.feeRenewal.amount : '');
            document.getElementById('payVoucher').value = '';
            var mask = document.getElementById('payMask');
            mask.classList.remove('hidden'); mask.classList.add('flex');
        }
        function closePay() {
            var mask = document.getElementById('payMask');
            mask.classList.add('hidden'); mask.classList.remove('flex');
        }
        function confirmPay() {
            var id = document.getElementById('payAssetId').value;
            var date = document.getElementById('payDate').value;
            if (!date) { toast('请选择缴费日期', 'red'); return; }
            var voucher = document.getElementById('payVoucher').value.trim();
            var amount = Number(document.getElementById('payAmount').value);
            if (!(amount > 0)) { toast('请填写有效的缴费金额', 'red'); return; }
            var a = getAssetById(id); if (!a) return;
            // 标记已缴费：金额 + paidDate + alertLevel=paid，到期日顺延一年
            a.feeRenewal.amount = amount;
            a.feeRenewal.amountSet = true;
            a.feeRenewal.paidDate = date;
            a.feeRenewal.voucherNo = voucher;
            a.feeRenewal.alertLevel = 'paid';
            a.feeRemainDays = null;
            a.feeStatus = 'ok';
            // 到期日顺延一个周期（年费/续展=1年，域名维保=1年）
            var oldDue = a.feeRenewal.dueDate;
            if (oldDue) {
                var d = new Date(oldDue); d.setFullYear(d.getFullYear() + 1);
                a.feeRenewal.dueDate = d.toISOString().slice(0,10);
            }
            persistAssets();
            toast('已标记缴费，到期日已顺延至 ' + a.feeRenewal.dueDate, 'green');
            closePay(); render();
        }

        function toast(msg, color) {
            var el = document.createElement('div');
            el.className = 'fixed top-6 left-1/2 -translate-x-1/2 z-[60] px-5 py-3 rounded-2xl text-white text-xs font-bold shadow-xl '+(color==='red'?'bg-red-500':'bg-emerald-500');
            el.innerHTML = '<i class="fa '+(color==='red'?'fa-exclamation-circle':'fa-check-circle')+' mr-2"></i>'+msg;
            document.body.appendChild(el);
            setTimeout(function(){ el.remove(); }, 2800);
        }
        function restoreData() {
            resetAssetsToDemo();
            ASSETS.length = 0;
            var fresh = loadAssets();
            fresh.forEach(function(a){ ASSETS.push(a); });
            ASSETS.forEach(function(a){ deriveAssetFields(a); });
            render();
            toast('已恢复示例数据', 'green');
        }
        window.addEventListener('assets-changed', render);
        render();
    </script>
</body>
</html>
