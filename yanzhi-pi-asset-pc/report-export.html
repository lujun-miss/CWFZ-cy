<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>报表与导出 - 研知π无形资产</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="asset-data.js"></script>
    <style>body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:#f7f8fa;}
    .field-input{padding:8px 12px;border:1px solid #e2e8f0;border-radius:12px;font-size:12px;outline:none;}
    .field-input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12);}</style>
</head>
<body class="text-slate-800 p-6 min-h-screen">
<div class="max-w-[1400px] mx-auto">
    <div class="mb-6"><h1 class="text-2xl font-black">自定义报表与导出</h1>
    <p class="text-sm text-slate-400 mt-1">按部门/资产类型/时间维度生成统计报表，支持导出 Excel / PDF</p></div>
    <!-- 筛选条件 -->
    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-5 mb-6">
        <h2 class="text-sm font-black mb-3"><i class="fa fa-filter text-blue-500 mr-1.5"></i>筛选条件</h2>
        <div class="flex flex-wrap gap-3 items-end">
            <div><label class="text-[10px] font-bold text-slate-400 block mb-1">资产类型</label>
                <select id="fType" class="field-input"><option value="">全部</option>
                <option>发明专利</option><option>实用新型</option><option>软件著作权</option><option>商标</option><option>域名</option><option>非专利技术</option><option>客户关系</option><option>品牌价值</option></select></div>
            <div><label class="text-[10px] font-bold text-slate-400 block mb-1">法律状态</label>
                <select id="fStatus" class="field-input"><option value="">全部</option>
                <option>有效中</option><option>待入库</option><option>审查中</option><option>质押冻结</option><option>诉讼中</option><option>已失效</option></select></div>
            <div><label class="text-[10px] font-bold text-slate-400 block mb-1">取得方式</label>
                <select id="fAcquire" class="field-input"><option value="">全部</option>
                <option>外购</option><option>自主研发</option><option>投资入股</option><option>捐赠</option><option>内部调拨</option></select></div>
            <div><label class="text-[10px] font-bold text-slate-400 block mb-1">资产大类</label>
                <select id="fCategory" class="field-input"><option value="">全部</option>
                <option>知识产权类</option><option>权利特许类</option><option>技术秘密类</option><option>市场客户类</option><option>品牌价值类</option></select></div>
            <button onclick="render()" class="px-4 py-2 bg-blue-600 text-white text-xs font-bold rounded-xl hover:bg-blue-700"><i class="fa fa-search mr-1"></i>查询</button>
            <button onclick="resetFilter()" class="px-4 py-2 bg-white text-slate-600 text-xs font-bold rounded-xl border border-slate-200 hover:bg-slate-50">重置</button>
        </div>
    </div>
    <!-- 汇总卡片 -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <div class="bg-white p-5 rounded-2xl border border-slate-100"><p class="text-[10px] font-bold text-slate-400 uppercase mb-1">资产数量</p><p class="text-2xl font-black" id="sCnt">0</p></div>
        <div class="bg-white p-5 rounded-2xl border border-slate-100"><p class="text-[10px] font-bold text-slate-400 uppercase mb-1">原值合计(万)</p><p class="text-2xl font-black text-blue-600" id="sCost">0</p></div>
        <div class="bg-white p-5 rounded-2xl border border-slate-100"><p class="text-[10px] font-bold text-slate-400 uppercase mb-1">净值合计(万)</p><p class="text-2xl font-black text-indigo-600" id="sNet">0</p></div>
        <div class="bg-white p-5 rounded-2xl border border-slate-100"><p class="text-[10px] font-bold text-slate-400 uppercase mb-1">估值合计(万)</p><p class="text-2xl font-black text-emerald-600" id="sVal">0</p></div>
    </div>
    <!-- 报表表格 -->
    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
            <h2 class="text-sm font-black"><i class="fa fa-table text-slate-500 mr-1.5"></i>资产明细报表</h2>
            <div class="flex gap-2">
                <button onclick="exportExcel()" class="px-4 py-2 bg-emerald-50 text-emerald-600 text-xs font-bold rounded-xl border border-emerald-200 hover:bg-emerald-100"><i class="fa fa-file-excel-o mr-1"></i>导出 Excel</button>
                <button onclick="exportPDF()" class="px-4 py-2 bg-red-50 text-red-600 text-xs font-bold rounded-xl border border-red-200 hover:bg-red-100"><i class="fa fa-file-pdf-o mr-1"></i>导出 PDF</button>
            </div>
        </div>
        <div class="overflow-x-auto"><table class="w-full text-xs">
            <thead class="bg-slate-50 text-slate-500"><tr>
                <th class="text-left px-4 py-3 font-bold">资产编号</th>
                <th class="text-left px-4 py-3 font-bold">名称</th>
                <th class="text-left px-4 py-3 font-bold">类型</th>
                <th class="text-left px-4 py-3 font-bold">大类</th>
                <th class="text-left px-4 py-3 font-bold">状态</th>
                <th class="text-left px-4 py-3 font-bold">取得方式</th>
                <th class="text-right px-4 py-3 font-bold">原值</th>
                <th class="text-right px-4 py-3 font-bold">累计摊销</th>
                <th class="text-right px-4 py-3 font-bold">净值</th>
                <th class="text-right px-4 py-3 font-bold">估值</th>
            </tr></thead>
            <tbody id="repTbody"></tbody>
        </table></div>
    </div>
</div>
<script>
    var _filtered = [];
    function getFiltered() {
        var t = document.getElementById('fType').value;
        var st = document.getElementById('fStatus').value;
        var ac = document.getElementById('fAcquire').value;
        var cat = document.getElementById('fCategory').value;
        return ASSETS.filter(function(a) {
            if (t && a.type !== t) return false;
            if (st && a.status !== st) return false;
            if (ac && a.acquireMethod !== ac) return false;
            if (cat && a.category !== cat) return false;
            return true;
        });
    }
    function render() {
        _filtered = getFiltered();
        document.getElementById('sCnt').innerText = _filtered.length;
        document.getElementById('sCost').innerText = _filtered.reduce(function(s,a){return s+(a.cost||0);},0).toFixed(0);
        document.getElementById('sNet').innerText = _filtered.reduce(function(s,a){return s+(a.netValue||0);},0).toFixed(0);
        document.getElementById('sVal').innerText = _filtered.reduce(function(s,a){return s+(a.valuation||0);},0).toFixed(0);
        var tb = document.getElementById('repTbody');
        if (!_filtered.length) { tb.innerHTML = '<tr><td colspan="10" class="text-center py-10 text-slate-300">无数据</td></tr>'; return; }
        tb.innerHTML = _filtered.map(function(a) {
            return '<tr class="border-t border-slate-50 hover:bg-slate-50">'
                + '<td class="px-4 py-3 font-mono text-slate-500">'+(a.assetCode||a.id)+'</td>'
                + '<td class="px-4 py-3 font-bold">'+a.name+'</td>'
                + '<td class="px-4 py-3 text-slate-600">'+a.type+'</td>'
                + '<td class="px-4 py-3 text-slate-500">'+a.category+'</td>'
                + '<td class="px-4 py-3">'+a.status+'</td>'
                + '<td class="px-4 py-3 text-slate-500">'+(a.acquireMethod||'—')+'</td>'
                + '<td class="px-4 py-3 text-right">'+(a.cost||0)+'</td>'
                + '<td class="px-4 py-3 text-right text-slate-500">'+(a.amortized||0)+'</td>'
                + '<td class="px-4 py-3 text-right font-bold">'+(a.netValue||0)+'</td>'
                + '<td class="px-4 py-3 text-right text-emerald-600 font-bold">'+(a.valuation||0)+'</td>'
                + '</tr>';
        }).join('');
    }
    function resetFilter() {
        document.getElementById('fType').value='';
        document.getElementById('fStatus').value='';
        document.getElementById('fAcquire').value='';
        document.getElementById('fCategory').value='';
        render();
    }
    function exportExcel() {
        // 模拟导出：生成 CSV 并用 Blob 下载
        var headers = ['资产编号','名称','类型','大类','状态','取得方式','原值','累计摊销','净值','估值'];
        var rows = _filtered.map(function(a) {
            return [a.assetCode||a.id, a.name, a.type, a.category, a.status, a.acquireMethod||'', a.cost||0, a.amortized||0, a.netValue||0, a.valuation||0];
        });
        var csv = '\ufeff' + [headers, ...rows].map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
        var blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = '无形资产报表_' + new Date().toISOString().slice(0,10) + '.csv';
        a.click(); URL.revokeObjectURL(url);
        toast('已导出 Excel（CSV 格式），共 ' + _filtered.length + ' 条', 'green');
    }
    function exportPDF() {
        // 模拟导出 PDF：打开新窗口打印
        var html = '<html><head><meta charset="utf-8"><title>无形资产报表</title>'
            + '<style>body{font-family:sans-serif;padding:20px;}h2{color:#1e40af;}table{width:100%;border-collapse:collapse;margin-top:16px;}th,td{border:1px solid #ddd;padding:6px;text-align:left;font-size:12px;}th{background:#f1f5f9;}</style>'
            + '</head><body><h2>无形资产明细报表</h2><p>生成时间：' + new Date().toLocaleString() + '</p>'
            + '<table><thead><tr><th>编号</th><th>名称</th><th>类型</th><th>状态</th><th>原值</th><th>净值</th><th>估值</th></tr></thead><tbody>'
            + _filtered.map(function(a){return '<tr><td>'+(a.assetCode||a.id)+'</td><td>'+a.name+'</td><td>'+a.type+'</td><td>'+a.status+'</td><td>'+(a.cost||0)+'</td><td>'+(a.netValue||0)+'</td><td>'+(a.valuation||0)+'</td></tr>';}).join('')
            + '</tbody></table></body></html>';
        var w = window.open('', '_blank');
        w.document.write(html); w.document.close();
        setTimeout(function(){w.print();}, 300);
        toast('已生成 PDF，请在新窗口中打印/另存', 'green');
    }
    function toast(msg, color) {
        var el = document.createElement('div');
        el.className = 'fixed top-6 left-1/2 -translate-x-1/2 z-[60] px-5 py-3 rounded-2xl text-white text-xs font-bold shadow-xl '+(color==='red'?'bg-red-500':'bg-emerald-500');
        el.innerHTML = '<i class="fa fa-info-circle mr-2"></i>'+msg;
        document.body.appendChild(el); setTimeout(function(){el.remove();}, 2800);
    }
    render();
</script>
</body>
</html>
