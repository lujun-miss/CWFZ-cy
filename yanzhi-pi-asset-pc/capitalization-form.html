<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>取得入库登记 - 研知π无形资产</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="asset-data.js"></script>
    <style>
        body { font-family:'PingFang SC','Microsoft YaHei',sans-serif; background:#f7f8fa; }
        .field-label { font-size:11px; font-weight:800; color:#64748b; margin-bottom:4px; display:block; }
        .field-input { width:100%; padding:8px 12px; border:1px solid #e2e8f0; border-radius:12px; font-size:12px; outline:none; background:#fff; }
        .field-input:focus { border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,.12); }
        .method-card { cursor:pointer; transition:all .2s; }
        .method-card.active { border-color:#2563eb; background:#eff6ff; box-shadow:0 0 0 3px rgba(37,99,235,.12); }
    </style>
</head>
<body class="text-slate-800 p-6 min-h-screen">
    <div class="max-w-[1100px] mx-auto">
        <!-- 头部 + 返回 -->
        <div class="flex items-center justify-between mb-6 flex-wrap gap-4">
            <div class="flex items-center gap-3">
                <button onclick="goBack()" class="w-10 h-10 rounded-xl bg-white border border-slate-200 hover:bg-slate-50 flex items-center justify-center text-slate-500">
                    <i class="fa fa-arrow-left"></i>
                </button>
                <div>
                    <h1 class="text-2xl font-black text-slate-800"><i class="fa fa-magic text-blue-500 mr-2"></i>取得入库登记</h1>
                    <p class="text-sm text-slate-400 mt-1">选择取得方式 → 填写入库表单 → 提交审批 → 审批通过后落地为资产档案</p>
                </div>
            </div>
        </div>

        <!-- 流程步骤条 -->
        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-4 mb-6">
            <div class="flex items-center">
                <div class="flex-1 flex items-center">
                    <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-black">1</div>
                    <span class="ml-2 text-xs font-bold text-blue-600">选择取得方式</span>
                </div>
                <div class="flex-1 h-0.5 bg-slate-200"></div>
                <div class="flex-1 flex items-center">
                    <div id="step2" class="w-8 h-8 rounded-full bg-slate-200 text-slate-500 flex items-center justify-center text-xs font-black">2</div>
                    <span id="step2Label" class="ml-2 text-xs font-bold text-slate-400">填写入库表单</span>
                </div>
                <div class="flex-1 h-0.5 bg-slate-200"></div>
                <div class="flex-1 flex items-center">
                    <div id="step3" class="w-8 h-8 rounded-full bg-slate-200 text-slate-500 flex items-center justify-center text-xs font-black">3</div>
                    <span id="step3Label" class="ml-2 text-xs font-bold text-slate-400">提交审批</span>
                </div>
            </div>
        </div>

        <!-- 取得方式卡片 -->
        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-6 mb-6">
            <h2 class="text-sm font-black text-slate-800 mb-4"><i class="fa fa-th text-blue-500 mr-1.5"></i>选择取得方式</h2>
            <div id="methodBox" class="grid grid-cols-2 md:grid-cols-5 gap-3"></div>
            <p id="formHint" class="text-[10px] text-slate-400 mt-3">请先选择取得方式，再填写下方入库表单</p>
        </div>

        <!-- 入库登记表单 -->
        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm">
            <div class="px-6 py-4 border-b border-slate-100">
                <h2 class="text-sm font-black text-slate-800"><i class="fa fa-edit text-blue-500 mr-1.5"></i>入库登记表单</h2>
            </div>
            <div class="p-6 space-y-4">
                <input type="hidden" id="fMethod" value="">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="field-label">资产名称 <span class="text-red-400">*</span></label>
                        <input id="fName" class="field-input" placeholder="如：智能控制算法软件 V1.0">
                    </div>
                    <div>
                        <label class="field-label">资产类型 <span class="text-red-400">*</span></label>
                        <select id="fType" class="field-input">
                            <option value="">请选择</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-4">
                    <div>
                        <label class="field-label">入账金额(万) <span class="text-red-400">*</span></label>
                        <input id="fAmount" type="number" min="0" step="0.01" class="field-input" placeholder="0.00">
                    </div>
                    <div>
                        <label class="field-label">取得日期 <span class="text-red-400">*</span></label>
                        <input id="fDate" type="date" class="field-input">
                    </div>
                    <div>
                        <label class="field-label">操作人</label>
                        <input id="fOperator" class="field-input" placeholder="如：王财务">
                    </div>
                </div>
                <div id="extraFields" class="grid grid-cols-2 gap-4"></div>
                <div>
                    <label class="field-label">备注 / 资本化依据</label>
                    <textarea id="fNote" class="field-input" rows="2" placeholder="如：开发阶段符合资本化条件；股东以无形资产作价入股；捐赠协议编号等"></textarea>
                </div>
                <div class="p-3 bg-blue-50 border border-blue-200 rounded-xl text-[10px] text-blue-700 font-bold">
                    <i class="fa fa-info-circle mr-1"></i>提交后将创建一条"取得入库"阶段的生命周期事件（状态=待审批），审批通过后自动落地为资产档案
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button onclick="goBack()" class="px-4 py-2 text-slate-500 text-xs font-bold hover:bg-slate-50 rounded-xl">取消返回</button>
                    <button onclick="resetForm()" class="px-4 py-2 text-slate-500 text-xs font-bold hover:bg-slate-50 rounded-xl border border-slate-200">重置</button>
                    <button onclick="submitAcquire()" class="px-6 py-2 bg-blue-600 text-white text-xs font-bold rounded-xl hover:bg-blue-700 shadow-md shadow-blue-100"><i class="fa fa-check mr-1"></i>提交入库登记</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        var _method = '';

        var METHOD_META = {
            '外购':       { icon: 'fa-shopping-cart', color: 'text-blue-600 bg-blue-50', desc: '通过购买合同取得', extra: [
                { key: 'seller', label: '出让方 / 供应商', placeholder: '如：深圳智控科技' },
                { key: 'contract', label: '合同编号', placeholder: '如：HT202509001' }
            ]},
            '自主研发':   { icon: 'fa-flask',         color: 'text-indigo-600 bg-indigo-50', desc: '研发支出资本化入账', extra: [
                { key: 'project', label: '研发项目名称', placeholder: '如：智能算法研发项目' },
                { key: 'phase', label: '资本化阶段', placeholder: '如：开发阶段' }
            ]},
            '投资入股':   { icon: 'fa-handshake-o',   color: 'text-emerald-600 bg-emerald-50', desc: '股东作价入股', extra: [
                { key: 'shareholder', label: '入股股东', placeholder: '如：张三' },
                { key: 'verifyNo', label: '验资报告号', placeholder: '如：YZ2025-001' }
            ]},
            '捐赠':       { icon: 'fa-gift',          color: 'text-amber-600 bg-amber-50', desc: '受赠取得', extra: [
                { key: 'donor', label: '捐赠方', placeholder: '如：XX研究院' },
                { key: 'agreementNo', label: '捐赠协议号', placeholder: '如：JY2025-008' }
            ]},
            '内部调拨':   { icon: 'fa-exchange',      color: 'text-purple-600 bg-purple-50', desc: '集团内调拨', extra: [
                { key: 'fromDept', label: '调出主体', placeholder: '如：集团子公司A' },
                { key: 'toDept', label: '调入主体', placeholder: '如：本公司' }
            ]}
        };

        function goBack() {
            try {
                if (parent && parent.loadPage) {
                    parent.loadPage('capitalization.html', null);
                    return;
                }
            } catch (e) {}
            window.location.href = 'capitalization.html';
        }

        function renderMethods() {
            var box = document.getElementById('methodBox');
            box.innerHTML = ACQUIRE_METHODS.map(function (m) {
                var meta = METHOD_META[m];
                var active = _method === m;
                return '<div class="method-card p-4 rounded-2xl border ' + (active ? 'active' : 'border-slate-200 bg-slate-50') + '" onclick="selectMethod(\'' + m + '\')">'
                    + '<div class="w-9 h-9 rounded-xl flex items-center justify-center ' + meta.color + ' mb-2"><i class="fa ' + meta.icon + '"></i></div>'
                    + '<p class="text-xs font-black text-slate-800">' + m + '</p>'
                    + '<p class="text-[10px] text-slate-400 mt-1">' + meta.desc + '</p>'
                    + '</div>';
            }).join('');
        }

        function selectMethod(m) {
            _method = m;
            document.getElementById('fMethod').value = m;
            document.getElementById('formHint').innerHTML = '<i class="fa fa-check-circle text-emerald-500 mr-1"></i>已选择：「<span class="font-bold text-blue-600">' + m + '</span>」 · ' + METHOD_META[m].desc;
            // 步骤条推进
            var s2 = document.getElementById('step2');
            s2.className = 'w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-black';
            document.getElementById('step2Label').className = 'ml-2 text-xs font-bold text-blue-600';
            renderMethods();
            renderExtraFields();
        }

        function renderExtraFields() {
            var box = document.getElementById('extraFields');
            if (!_method) { box.innerHTML = ''; return; }
            var extras = METHOD_META[_method].extra;
            box.innerHTML = extras.map(function (ex) {
                return '<div><label class="field-label">' + ex.label + '</label><input id="ext_' + ex.key + '" class="field-input" placeholder="' + ex.placeholder + '"></div>';
            }).join('');
        }

        function initTypeSelect() {
            var sel = document.getElementById('fType');
            Object.keys(ASSET_TYPE_STYLE).forEach(function (t) {
                var opt = document.createElement('option');
                opt.value = t; opt.innerText = t;
                sel.appendChild(opt);
            });
        }

        function resetForm() {
            _method = '';
            document.getElementById('fMethod').value = '';
            document.getElementById('fName').value = '';
            document.getElementById('fType').value = '';
            document.getElementById('fAmount').value = '';
            document.getElementById('fDate').value = new Date().toISOString().slice(0, 10);
            document.getElementById('fOperator').value = '';
            document.getElementById('fNote').value = '';
            document.getElementById('formHint').innerText = '请先选择取得方式，再填写下方入库表单';
            var s2 = document.getElementById('step2');
            s2.className = 'w-8 h-8 rounded-full bg-slate-200 text-slate-500 flex items-center justify-center text-xs font-black';
            document.getElementById('step2Label').className = 'ml-2 text-xs font-bold text-slate-400';
            renderMethods();
            renderExtraFields();
        }

        function submitAcquire() {
            if (!_method) { toast('请先选择取得方式', 'red'); return; }
            var name = document.getElementById('fName').value.trim();
            var type = document.getElementById('fType').value;
            var amount = Number(document.getElementById('fAmount').value);
            var date = document.getElementById('fDate').value;
            var operator = document.getElementById('fOperator').value.trim();
            var note = document.getElementById('fNote').value.trim();
            if (!name) { toast('请填写资产名称', 'red'); return; }
            if (!type) { toast('请选择资产类型', 'red'); return; }
            if (!amount || amount <= 0) { toast('请填写入账金额', 'red'); return; }
            if (!date) { toast('请选择取得日期', 'red'); return; }

            // 收集扩展字段
            var extras = {};
            (METHOD_META[_method].extra || []).forEach(function (ex) {
                var v = document.getElementById('ext_' + ex.key);
                if (v) extras[ex.key] = v.value.trim();
            });
            var extraStr = Object.keys(extras).filter(function (k) { return extras[k]; }).map(function (k) { return k + '：' + extras[k]; }).join('；');

            // 若该资产已存在（按名称匹配）则附事件到既有资产；否则不立即建档，审批通过时由系统自动建档
            var existing = ASSETS.find(function (a) { return a.name === name; });
            // 防护：该资产已有待审批的入库事件时，不允许重复登记
            if (existing) {
                var dupEvent = ASSET_LIFECYCLE_EVENTS.find(function (e) {
                    return e.assetId === existing.id && e.stage === '取得入库' && e.status === '待审批';
                });
                if (dupEvent) { toast('该资产已有待审批的取得入库记录，请勿重复登记，可直接到列表审批', 'red'); return; }
            }
            var assetId = existing ? existing.id : 'PENDING_' + Date.now();
            var pendingAsset = existing ? null : { name: name, type: type };

            var fullNote = '取得方式：' + _method;
            if (extraStr) fullNote += '；' + extraStr;
            if (note) fullNote += '；' + note;
            if (!existing) fullNote += '（审批通过后自动建档）';

            // 步骤3激活
            var s3 = document.getElementById('step3');
            s3.className = 'w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-black';
            document.getElementById('step3Label').className = 'ml-2 text-xs font-bold text-blue-600';

            var ev = addLifecycleEvent({
                assetId: assetId,
                pendingAsset: pendingAsset,
                stage: '取得入库',
                eventType: _method,
                eventDate: date,
                operator: operator,
                approver: '',
                status: '待审批',
                note: fullNote,
                attachments: [],
                fromVal: '',
                toVal: String(amount),
                amount: amount
            });
            if (ev) {
                toast('已提交入库登记（待审批），审批通过后自动建档：' + name, 'green');
                setTimeout(function () { goBack(); }, 900);
            }
        }

        function toast(msg, color) {
            var el = document.createElement('div');
            el.className = 'fixed top-6 left-1/2 -translate-x-1/2 z-[60] px-5 py-3 rounded-2xl text-white text-xs font-bold shadow-xl ' + (color === 'red' ? 'bg-red-500' : 'bg-emerald-500');
            el.innerHTML = '<i class="fa ' + (color === 'red' ? 'fa-exclamation-circle' : 'fa-check-circle') + ' mr-2"></i>' + msg;
            document.body.appendChild(el);
            setTimeout(function () { el.remove(); }, 2400);
        }

        // 初始化
        document.getElementById('fDate').value = new Date().toISOString().slice(0, 10);
        initTypeSelect();
        renderMethods();
    </script>
</body>
</html>
