<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业画像配置 - 策源易答运营平台</title>
    <link href="libs/css/tailwind.css" rel="stylesheet">
    <link href="libs/css/font-awesome.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 4px; }
        .switch { width: 38px; height: 22px; border-radius: 999px; background: #cbd5e1; position: relative; cursor: pointer; transition: all .2s; }
        .switch.on { background: #10b981; }
        .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 999px; background: #fff; transition: all .2s; }
        .switch.on::after { left: 19px; }
    </style>
    <script>
        // 演示模式：未登录时自动注入演示账号
        (function authGuard() {
            try {
                var p = localStorage.getItem('ceyuan_member_profile');
                if (p) {
                    var d = JSON.parse(p);
                    if (d && d.phone) return;
                }
            } catch (e) {}
            try {
                localStorage.setItem('ceyuan_member_profile', JSON.stringify({
                    phone: '13800138000', contact: '演示用户', company: '演示企业', type: 'personal'
                }));
            } catch (e) {}
        })();
    </script>
</head>
<body class="bg-slate-50 p-8">
    <script src="data-bridge.js?v=20261126i"></script>

    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 id="pageTitle" class="text-2xl font-black text-slate-800 flex items-center">
                <i id="pageIcon" class="fa fa-sitemap text-indigo-500 mr-3"></i><span id="pageTitleText">企业所属产业</span>
            </h1>
            <p class="text-sm text-slate-400 mt-1">运营管理平台 / 基础配置 / <span id="pageCrumb">企业所属产业</span></p>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="resetDefault()" class="px-4 py-2.5 bg-white border border-slate-200 text-slate-600 rounded-xl text-sm font-bold hover:bg-slate-50 transition-all">
                <i class="fa fa-undo mr-2"></i>恢复默认
            </button>
            <button onclick="saveConfig()" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-bold transition-all shadow-lg shadow-indigo-600/20">
                <i class="fa fa-cloud-upload mr-2"></i>保存并同步
            </button>
        </div>
    </div>

    <div class="mb-5 p-4 bg-gradient-to-r from-indigo-50 to-purple-50 rounded-xl border border-indigo-100 flex items-start space-x-3">
        <i class="fa fa-info-circle text-indigo-500 mt-0.5"></i>
        <div class="text-xs text-slate-600 leading-relaxed">
            <b class="text-indigo-700">配置即生效。</b>
            产业按「一级产业 → 二级细分类」两级维护，可编辑、新增、停用与排序；一级产业仅作分组管理，雷达筛选中供企业勾选的是二级细分类。
            停用后雷达不再展示该选项，已有历史企业数据不受影响。
        </div>
    </div>

    <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-2">
            <span class="text-xs text-slate-500" id="countText">共 0 项</span>
        </div>
        <div class="flex items-center gap-2">
            <button id="btnAddParent" onclick="openAddParent()" class="px-4 py-2 bg-white border border-indigo-200 text-indigo-600 rounded-xl text-xs font-bold hover:bg-indigo-50 transition-all">
                <i class="fa fa-plus mr-1"></i>新增一级产业
            </button>
            <button id="btnAddChild" onclick="openAddChild('')" class="px-4 py-2 bg-white border border-indigo-200 text-indigo-600 rounded-xl text-xs font-bold hover:bg-indigo-50 transition-all">
                <i class="fa fa-plus mr-1"></i>新增细分类
            </button>
            <button id="btnAddFlat" onclick="openEdit()" class="hidden px-4 py-2 bg-white border border-indigo-200 text-indigo-600 rounded-xl text-xs font-bold hover:bg-indigo-50 transition-all">
                <i class="fa fa-plus mr-1"></i>新增<span id="addLabel">产业</span>
            </button>
        </div>
    </div>

    <div class="grid gap-5 items-start" id="treeLayout" style="grid-template-columns: 320px minmax(0, 1fr);">
        <!-- 左侧产业树 -->
        <div class="bg-white rounded-[20px] border border-slate-100 shadow-sm overflow-hidden">
            <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between">
                <span class="text-sm font-black text-slate-800"><i class="fa fa-sitemap text-indigo-500 mr-2"></i>产业结构</span>
                <span class="text-[10px] text-slate-400">点击节点编辑</span>
            </div>
            <div id="indTree" class="p-2 overflow-y-auto" style="max-height: calc(100vh - 330px);"></div>
        </div>
        <!-- 右侧编辑区 -->
        <div class="bg-white rounded-[20px] border border-slate-100 shadow-sm overflow-hidden">
            <div id="indEmpty" class="py-24 text-center text-xs text-slate-400">
                <i class="fa fa-hand-o-left text-2xl block mb-3 text-slate-300"></i>
                请在左侧选择一个一级产业或细分类进行编辑
            </div>
            <div id="indEditor" class="hidden">
                <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <span class="text-sm font-black text-slate-800">编辑</span>
                        <span id="selType" class="px-2 py-0.5 text-[10px] font-bold rounded bg-indigo-50 text-indigo-600">一级产业</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="moveSelected(-1)" id="selUpBtn" class="px-2 py-1 text-[11px] font-bold text-slate-500 border border-slate-200 rounded-lg hover:bg-slate-50"><i class="fa fa-arrow-up mr-1"></i>上移</button>
                        <button onclick="moveSelected(1)" id="selDownBtn" class="px-2 py-1 text-[11px] font-bold text-slate-500 border border-slate-200 rounded-lg hover:bg-slate-50"><i class="fa fa-arrow-down mr-1"></i>下移</button>
                    </div>
                </div>
                <div class="px-5 py-5 space-y-4">
                    <div>
                        <label class="text-[11px] font-bold text-slate-500 block mb-1">名称</label>
                        <input id="selName" maxlength="30" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-400">
                    </div>
                    <div id="selParentWrap">
                        <label class="text-[11px] font-bold text-slate-500 block mb-1">所属一级产业</label>
                        <select id="selParent" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-400 bg-white"></select>
                    </div>
                    <div class="flex items-center justify-between py-2 border-t border-slate-100">
                        <div>
                            <p class="text-xs font-bold text-slate-700">启用</p>
                            <p class="text-[10px] text-slate-400 mt-0.5">停用后雷达不展示该项</p>
                        </div>
                        <div id="selSwitch" class="switch on" onclick="toggleSelEnabled()"></div>
                    </div>
                </div>
                <div class="px-5 py-4 border-t border-slate-100 flex items-center justify-between">
                    <button onclick="removeSelected()" class="px-3 py-2 text-xs font-bold text-red-500 bg-red-50 border border-red-100 rounded-lg hover:bg-red-100">删除</button>
                    <div class="flex items-center gap-2">
                        <button id="selAddChildBtn" onclick="addChildForSelected()" class="px-3 py-2 text-xs font-bold text-indigo-600 bg-indigo-50 border border-indigo-100 rounded-lg hover:bg-indigo-100">新增细分类</button>
                        <button onclick="saveSelected()" class="px-4 py-2 text-xs font-bold text-white bg-indigo-600 rounded-lg hover:bg-indigo-700">保存修改</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="tableWrap" class="bg-white rounded-[20px] border border-slate-100 shadow-sm overflow-hidden">
        <table class="w-full text-xs">
            <thead class="bg-slate-50 text-slate-500">
                <tr>
                    <th class="px-4 py-3 text-left font-bold w-16">排序</th>
                    <th class="px-4 py-3 text-left font-bold">名称</th>
                    <th class="px-4 py-3 text-left font-bold w-28">状态</th>
                    <th class="px-4 py-3 text-right font-bold w-56">操作</th>
                </tr>
            </thead>
            <tbody id="dictBody"></tbody>
        </table>
    </div>

    <!-- 新增 / 编辑弹窗 -->
    <div id="editModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[1000] hidden items-center justify-center p-6">
        <div class="bg-white rounded-2xl w-full max-w-md shadow-2xl">
            <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
                <h3 id="modalTitle" class="text-sm font-black text-slate-800">新增产业</h3>
                <button onclick="closeEdit()" class="text-slate-400 hover:text-slate-600"><i class="fa fa-times"></i></button>
            </div>
            <div class="px-6 py-5 space-y-4">
                <div>
                    <label class="text-[11px] font-bold text-slate-500 block mb-1"><span class="text-red-500">*</span> 名称</label>
                    <input id="editName" maxlength="30" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-400" placeholder="请输入名称">
                    <p class="text-[10px] text-slate-400 mt-1">名称需唯一，建议与政策原文表述保持一致</p>
                </div>
                <div id="editLevelWrap">
                    <label class="text-[11px] font-bold text-slate-500 block mb-1">层级</label>
                    <select id="editLevel" onchange="onLevelChange()" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-400 bg-white">
                        <option value="parent">一级产业</option>
                        <option value="child">二级细分类</option>
                    </select>
                </div>
                <div id="editParentWrap">
                    <label class="text-[11px] font-bold text-slate-500 block mb-1"><span class="text-red-500">*</span> 所属一级产业</label>
                    <select id="editParent" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-400 bg-white"></select>
                </div>
                <div class="flex items-center justify-between py-2 border-t border-slate-100">
                    <div>
                        <p class="text-xs font-bold text-slate-700">启用</p>
                        <p class="text-[10px] text-slate-400 mt-0.5">停用后雷达不展示该项</p>
                    </div>
                    <div id="editSwitch" class="switch on" onclick="toggleEditEnabled()"></div>
                </div>
            </div>
            <div class="px-6 py-4 border-t border-slate-100 flex justify-end gap-2">
                <button onclick="closeEdit()" class="px-4 py-2 text-xs font-bold text-slate-500 bg-slate-50 border border-slate-200 rounded-lg hover:bg-slate-100">取消</button>
                <button onclick="submitEdit()" class="px-4 py-2 text-xs font-bold text-white bg-indigo-600 rounded-lg hover:bg-indigo-700">确定</button>
            </div>
        </div>

    <div id="toast" class="fixed bottom-6 right-6 px-4 py-2.5 bg-slate-800 text-white text-xs font-bold rounded-xl shadow-lg z-[1100] hidden"></div>

    <script>
        // 当前配置类型：industry 所属产业 / qualification 企业资质
        var DICT_KEY = (function () {
            var t = new URLSearchParams(location.search).get('type');
            return t === 'qualification' ? 'qualification' : 'industry';
        })();
        var DICT = DataBridge.loadProfileDict();
        var LIST = (DICT_KEY === 'industry' ? DICT.industries : DICT.qualifications || []).slice();
        var editingIndex = -1;

        var META = {
            industry: { title: '企业所属产业', crumb: '企业所属产业', icon: 'fa-sitemap', unit: '产业' },
            qualification: { title: '企业资质', crumb: '企业资质', icon: 'fa-certificate', unit: '资质' }
        };

        function esc(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        function toast(msg, ok) {
            var el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'fixed bottom-6 right-6 px-4 py-2.5 text-white text-xs font-bold rounded-xl shadow-lg z-[1100] ' + (ok === false ? 'bg-red-500' : 'bg-slate-800');
            clearTimeout(el._t);
            el._t = setTimeout(function () { el.className += ' hidden'; }, 2200);
        }

        function isIndustry() { return DICT_KEY === 'industry'; }

        function applyMeta() {
            var m = META[DICT_KEY];
            document.getElementById('pageTitleText').textContent = m.title;
            document.getElementById('pageCrumb').textContent = m.crumb;
            document.getElementById('pageIcon').className = 'fa ' + m.icon + ' text-indigo-500 mr-3';
            document.getElementById('addLabel').textContent = m.unit;
            var ind = isIndustry();
            document.getElementById('btnAddParent').classList.toggle('hidden', !ind);
            document.getElementById('btnAddChild').classList.toggle('hidden', !ind);
            document.getElementById('btnAddFlat').classList.toggle('hidden', ind);
            document.getElementById('treeLayout').classList.toggle('hidden', !ind);
            document.getElementById('tableWrap').classList.toggle('hidden', ind);
        }

        function statusHtml(it) {
            return it.enabled !== false
                ? '<span class="px-2 py-0.5 text-[10px] font-bold rounded-md bg-emerald-50 text-emerald-600">启用</span>'
                : '<span class="px-2 py-0.5 text-[10px] font-bold rounded-md bg-slate-100 text-slate-500">已停用</span>';
        }
        function toggleText(it) { return it.enabled !== false ? '停用' : '启用'; }
        function toggleCls(it) { return it.enabled !== false ? 'text-emerald-600 hover:text-emerald-700' : 'text-slate-400 hover:text-slate-600'; }
        function disabledCls(cond) { return cond ? 'opacity-30 pointer-events-none' : ''; }

        // 产业二级结构：按一级产业分组，返回 [{parent, children}]
        function indGroups() {
            var parents = LIST.filter(function (x) { return x.isParent; });
            var groups = parents.map(function (p) {
                return { parent: p, children: LIST.filter(function (x) { return !x.isParent && x.parent === p.name; }) };
            });
            var orphans = LIST.filter(function (x) {
                return !x.isParent && !parents.some(function (p) { return p.name === x.parent; });
            });
            if (orphans.length) groups.push({ parent: null, children: orphans });
            return groups;
        }
        function rebuildInd(groups) {
            var out = [];
            groups.forEach(function (g) { if (g.parent) out.push(g.parent); out = out.concat(g.children); });
            LIST = out;
        }
        function idxOf(obj) { return LIST.indexOf(obj); }

        var selectedItem = null;

        function render() {
            if (isIndustry()) {
                renderTree();
                renderEditor();
            } else {
                renderFlat(document.getElementById('dictBody'));
            }
            updateCounts();
        }

        function selectByIndex(gi, ci) {
            var groups = indGroups();
            var g = groups[gi];
            if (!g) return;
            selectedItem = ci < 0 ? g.parent : g.children[ci];
            render();
        }

        function renderTree() {
            var box = document.getElementById('indTree');
            var keepTop = box.scrollTop;
            if (!LIST.length) {
                box.innerHTML = '<div class="py-10 text-center text-xs text-slate-400">暂无产业配置，请点击右上角「新增一级产业」</div>';
                return;
            }
            var html = '';
            indGroups().forEach(function (g, gi) {
                if (g.parent) {
                    var p = g.parent;
                    var on = selectedItem === p;
                    html += '<div onclick="selectByIndex(' + gi + ',-1)" class="flex items-center gap-2 px-2 py-2 rounded-lg cursor-pointer ' + (on ? 'bg-indigo-50' : 'hover:bg-slate-50') + '">'
                        + '<span class="flex-shrink-0 text-[11px] font-black ' + (on ? 'text-indigo-600' : 'text-indigo-500') + '">' + (gi + 1) + '、</span>'
                        + '<i class="fa fa-folder-open-o text-indigo-400 text-xs"></i>'
                        + '<span class="flex-1 text-xs font-bold truncate ' + (on ? 'text-indigo-700' : 'text-slate-700') + '">' + esc(p.name) + '</span>'
                        + '<span class="text-[10px] text-slate-400">' + g.children.length + '</span>'
                        + '<span class="w-1.5 h-1.5 rounded-full ' + (p.enabled !== false ? 'bg-emerald-500' : 'bg-slate-300') + '"></span>'
                        + '</div>';
                } else {
                    html += '<div class="px-2 pt-3 pb-1 text-[10px] font-bold text-amber-500">未归入一级产业的细分类</div>';
                }
                g.children.forEach(function (c, ci) {
                    var con = selectedItem === c;
                    html += '<div onclick="selectByIndex(' + gi + ',' + ci + ')" class="flex items-center gap-2 pl-7 pr-2 py-1.5 rounded-lg cursor-pointer ' + (con ? 'bg-indigo-50' : 'hover:bg-slate-50') + '">'
                        + '<span class="flex-shrink-0 w-7 text-right text-[10px] font-bold ' + (con ? 'text-indigo-500' : 'text-slate-400') + '">' + (g.parent ? (gi + 1) + '.' + (ci + 1) : '-') + '</span>'
                        + '<span class="flex-1 text-xs truncate ' + (con ? 'text-indigo-700 font-bold' : 'text-slate-600') + '">' + esc(c.name) + '</span>'
                        + '<span class="w-1.5 h-1.5 rounded-full ' + (c.enabled !== false ? 'bg-emerald-500' : 'bg-slate-300') + '"></span>'
                        + '</div>';
                });
            });
            box.innerHTML = html;
            box.scrollTop = keepTop;
        }

        function renderEditor() {
            var empty = document.getElementById('indEmpty');
            var ed = document.getElementById('indEditor');
            var it = selectedItem;
            if (!it || LIST.indexOf(it) < 0) {
                selectedItem = null;
                empty.classList.remove('hidden');
                ed.classList.add('hidden');
                return;
            }
            empty.classList.add('hidden');
            ed.classList.remove('hidden');
            document.getElementById('selType').textContent = it.isParent ? '一级产业' : '二级细分类';
            document.getElementById('selName').value = it.name;
            var child = !it.isParent;
            document.getElementById('selParentWrap').style.display = child ? '' : 'none';
            if (child) {
                var parents = LIST.filter(function (x) { return x.isParent; });
                var sel = document.getElementById('selParent');
                sel.innerHTML = '<option value="">请选择一级产业</option>' + parents.map(function (p) {
                    return '<option value="' + esc(p.name) + '">' + esc(p.name) + '</option>';
                }).join('');
                sel.value = it.parent || '';
            }
            document.getElementById('selSwitch').className = 'switch' + (it.enabled !== false ? ' on' : '');
            document.getElementById('selAddChildBtn').style.display = it.isParent ? '' : 'none';
            // 排序按钮状态
            var groups = indGroups(), gi = -1, ci = -1;
            groups.forEach(function (g, i) {
                if (g.parent === it) gi = i;
                var j = g.children.indexOf(it);
                if (j >= 0) { gi = i; ci = j; }
            });
            var canUp = it.isParent ? (gi > 0 && !!groups[gi - 1].parent) : ci > 0;
            var canDown = it.isParent ? (gi >= 0 && gi < groups.length - 1 && !!groups[gi + 1].parent) : (ci >= 0 && ci < groups[gi].children.length - 1);
            var up = document.getElementById('selUpBtn'), down = document.getElementById('selDownBtn');
            up.disabled = !canUp; up.classList.toggle('opacity-40', !canUp);
            down.disabled = !canDown; down.classList.toggle('opacity-40', !canDown);
        }

        function insertAfterLastChild(child) {
            var pIdx = -1;
            LIST.forEach(function (x, i) { if (x.isParent && x.name === child.parent) pIdx = i; });
            var at = pIdx >= 0 ? pIdx + 1 : LIST.length;
            while (at < LIST.length && !LIST[at].isParent && LIST[at].parent === child.parent) at++;
            LIST.splice(at, 0, child);
        }

        function saveSelected() {
            var it = selectedItem;
            if (!it) return;
            var name = document.getElementById('selName').value.trim();
            if (!name) { toast('请输入名称', false); return; }
            var enabled = document.getElementById('selSwitch').classList.contains('on');
            if (it.isParent) {
                var dup = LIST.some(function (x) { return x !== it && x.isParent && x.name === name; });
                if (dup) { toast('一级产业名称已存在', false); return; }
                LIST.forEach(function (x) { if (!x.isParent && x.parent === it.name) x.parent = name; });
                it.name = name;
                it.enabled = enabled;
            } else {
                var parentName = document.getElementById('selParent').value;
                if (!parentName) { toast('请选择所属一级产业', false); return; }
                var dup2 = LIST.some(function (x) { return x !== it && !x.isParent && x.parent === parentName && x.name === name; });
                if (dup2) { toast('该一级产业下已存在同名细分类', false); return; }
                var moved = it.parent !== parentName;
                it.name = name;
                it.enabled = enabled;
                if (moved) {
                    LIST.splice(LIST.indexOf(it), 1);
                    it.parent = parentName;
                    insertAfterLastChild(it);
                }
            }
            render();
            toast('已修改，记得点击「保存并同步」');
        }

        function toggleSelEnabled() {
            if (!selectedItem) return;
            selectedItem.enabled = selectedItem.enabled === false;
            render();
        }

        function removeSelected() {
            if (!selectedItem) return;
            var i = LIST.indexOf(selectedItem);
            if (i < 0) return;
            removeIndItem(i);
            selectedItem = null;
            render();
        }

        function moveSelected(dir) {
            if (!selectedItem) return;
            var groups = indGroups(), gi = -1, ci = -1;
            groups.forEach(function (g, i) {
                if (g.parent === selectedItem) gi = i;
                var j = g.children.indexOf(selectedItem);
                if (j >= 0) { gi = i; ci = j; }
            });
            if (selectedItem.isParent) moveGroup(gi, dir); else moveChild(gi, ci, dir);
            render();
        }

        function addChildForSelected() {
            if (!selectedItem) return;
            openAddChild(selectedItem.isParent ? selectedItem.name : (selectedItem.parent || ''));
        }

        function renderFlat(body) {
            if (!LIST.length) {
                body.innerHTML = '<tr><td colspan="4" class="px-4 py-12 text-center text-slate-400 text-xs"><i class="fa fa-inbox text-2xl block mb-2"></i>暂无配置项，点击右上角「新增' + META[DICT_KEY].unit + '」添加</td></tr>';
                return;
            }
            body.innerHTML = LIST.map(function (it, i) {
                return '<tr class="border-t border-slate-100' + (it.enabled === false ? ' opacity-60' : '') + '">'
                    + '<td class="px-4 py-3 text-slate-400 font-bold">' + (i + 1) + '</td>'
                    + '<td class="px-4 py-3"><span class="font-bold text-slate-700">' + esc(it.name) + '</span></td>'
                    + '<td class="px-4 py-3">' + statusHtml(it) + '</td>'
                    + '<td class="px-4 py-3 text-right whitespace-nowrap">'
                    + '<button onclick="moveItem(' + i + ',-1)" class="px-1.5 py-1 text-slate-400 hover:text-indigo-600 ' + disabledCls(i === 0) + '" title="上移"><i class="fa fa-arrow-up"></i></button>'
                    + '<button onclick="moveItem(' + i + ',1)" class="px-1.5 py-1 text-slate-400 hover:text-indigo-600 ' + disabledCls(i === LIST.length - 1) + '" title="下移"><i class="fa fa-arrow-down"></i></button>'
                    + '<button onclick="toggleItem(' + i + ')" class="px-2 py-1 text-[11px] font-bold ' + toggleCls(it) + '">' + toggleText(it) + '</button>'
                    + '<button onclick="openEdit(' + i + ')" class="px-2 py-1 text-[11px] font-bold text-indigo-600 hover:text-indigo-700">编辑</button>'
                    + '<button onclick="removeItem(' + i + ')" class="px-2 py-1 text-[11px] font-bold text-red-500 hover:text-red-600">删除</button>'
                    + '</td></tr>';
            }).join('');
        }

        function updateCounts() {
            var el = document.getElementById('countText');
            if (isIndustry()) {
                var pn = LIST.filter(function (x) { return x.isParent; }).length;
                var cn = LIST.filter(function (x) { return !x.isParent; }).length;
                el.innerHTML = '共 <b class="text-indigo-600">' + pn + '</b> 个一级产业 / <b class="text-indigo-600">' + cn + '</b> 个细分类';
            } else {
                el.innerHTML = '共 <b class="text-indigo-600">' + LIST.length + '</b> 项（启用 <b>' + LIST.filter(function (x) { return x.enabled !== false; }).length + '</b> 项）';
            }
        }

        function moveItem(i, dir) {
            var j = i + dir;
            if (j < 0 || j >= LIST.length) return;
            var tmp = LIST[i]; LIST[i] = LIST[j]; LIST[j] = tmp;
            render();
        }
        function toggleItem(i) {
            LIST[i].enabled = LIST[i].enabled === false;
            render();
        }
        function removeItem(i) {
            if (!confirm('确定删除「' + LIST[i].name + '」？删除后雷达不再展示该项。')) return;
            LIST.splice(i, 1);
            render();
        }

        function moveGroup(gi, dir) {
            var groups = indGroups();
            var j = gi + dir;
            if (j < 0 || j >= groups.length) return;
            if (!groups[gi].parent || !groups[j].parent) return;
            var tmp = groups[gi]; groups[gi] = groups[j]; groups[j] = tmp;
            rebuildInd(groups);
            render();
        }
        function moveChild(gi, ci, dir) {
            var groups = indGroups();
            var g = groups[gi];
            if (!g) return;
            var j = ci + dir;
            if (j < 0 || j >= g.children.length) return;
            var tmp = g.children[ci]; g.children[ci] = g.children[j]; g.children[j] = tmp;
            rebuildInd(groups);
            render();
        }
        function removeIndItem(i) {
            var it = LIST[i];
            if (!it) return;
            if (it.isParent) {
                var n = LIST.filter(function (x) { return !x.isParent && x.parent === it.name; }).length;
                if (!confirm('删除一级产业「' + it.name + '」将同时删除其下 ' + n + ' 个细分类，确定继续？')) return;
                rebuildInd(indGroups().filter(function (g) { return g.parent !== it; }));
            } else {
                if (!confirm('确定删除「' + it.name + '」？删除后雷达不再展示该项。')) return;
                LIST.splice(i, 1);
            }
            render();
        }

        function fillParentOptions(selected) {
            var parents = LIST.filter(function (x) { return x.isParent; });
            var el = document.getElementById('editParent');
            el.innerHTML = '<option value="">请选择一级产业</option>' + parents.map(function (p) {
                return '<option value="' + esc(p.name) + '">' + esc(p.name) + '</option>';
            }).join('');
            el.value = selected && parents.some(function (p) { return p.name === selected; }) ? selected : '';
        }
        function onLevelChange() {
            var lv = document.getElementById('editLevel').value;
            document.getElementById('editParentWrap').style.display = lv === 'child' ? '' : 'none';
        }

        function showModal(opts) {
            var item = opts.item || null;
            document.getElementById('modalTitle').textContent = opts.title;
            document.getElementById('editName').value = item ? item.name : '';
            var sw = document.getElementById('editSwitch');
            sw.className = 'switch' + (!item || item.enabled !== false ? ' on' : '');
            if (isIndustry()) {
                document.getElementById('editLevelWrap').classList.remove('hidden');
                var lv = document.getElementById('editLevel');
                lv.value = opts.kind || 'parent';
                lv.disabled = !!item;
                lv.classList.toggle('opacity-60', !!item);
                fillParentOptions(opts.parent || (item && item.parent) || '');
                onLevelChange();
            } else {
                document.getElementById('editLevelWrap').classList.add('hidden');
                document.getElementById('editParentWrap').style.display = 'none';
            }
            var el = document.getElementById('editModal');
            el.classList.remove('hidden'); el.classList.add('flex');
            setTimeout(function () { document.getElementById('editName').focus(); }, 50);
        }
        function openAddParent() {
            editingIndex = -1;
            showModal({ title: '新增一级产业', item: null, kind: 'parent' });
        }
        function openAddChild(parentName) {
            editingIndex = -1;
            showModal({ title: '新增细分类', item: null, kind: 'child', parent: parentName || '' });
        }
        function openEdit(i) {
            if (!isIndustry()) {
                editingIndex = (typeof i === 'number') ? i : -1;
                var isEdit = editingIndex >= 0;
                showModal({ title: (isEdit ? '编辑' : '新增') + META[DICT_KEY].unit, item: isEdit ? LIST[editingIndex] : null });
                return;
            }
            var idx = (typeof i === 'number') ? i : -1;
            editingIndex = idx;
            var it = idx >= 0 ? LIST[idx] : null;
            showModal({
                title: (it ? '编辑' : '新增') + (it ? (it.isParent ? '一级产业' : '细分类') : '一级产业'),
                item: it,
                kind: it ? (it.isParent ? 'parent' : 'child') : 'parent'
            });
        }
        function closeEdit() {
            var el = document.getElementById('editModal');
            el.classList.add('hidden'); el.classList.remove('flex');
        }
        function toggleEditEnabled() {
            document.getElementById('editSwitch').classList.toggle('on');
        }
        function submitEdit() {
            var name = document.getElementById('editName').value.trim();
            if (!name) { toast('请输入名称', false); return; }
            var enabled = document.getElementById('editSwitch').classList.contains('on');

            if (isIndustry()) {
                var it = editingIndex >= 0 ? LIST[editingIndex] : null;
                var kind = it ? (it.isParent ? 'parent' : 'child') : document.getElementById('editLevel').value;
                var parentName = kind === 'child' ? document.getElementById('editParent').value : '';
                if (kind === 'child' && !parentName) { toast('请选择所属一级产业', false); return; }
                var dup = LIST.some(function (x, idx) {
                    if (idx === editingIndex) return false;
                    if (!!x.isParent !== (kind === 'parent')) return false;
                    if (kind === 'child' && x.parent !== parentName) return false;
                    return x.name === name;
                });
                if (dup) { toast('该层级下名称已存在', false); return; }

                if (it) {
                    if (it.isParent) {
                        LIST.forEach(function (x) { if (!x.isParent && x.parent === it.name) x.parent = name; });
                        it.name = name;
                        it.enabled = enabled;
                    } else {
                        it.name = name;
                        it.enabled = enabled;
                        if (it.parent !== parentName) {
                            LIST.splice(LIST.indexOf(it), 1);
                            it.parent = parentName;
                            var pIdx = -1;
                            LIST.forEach(function (x, idx) { if (x.isParent && x.name === parentName) pIdx = idx; });
                            var insertAt = pIdx + 1;
                            while (insertAt < LIST.length && !LIST[insertAt].isParent && LIST[insertAt].parent === parentName) insertAt++;
                            LIST.splice(insertAt, 0, it);
                        }
                    }
                } else if (kind === 'parent') {
                    var newParent = { name: name, enabled: enabled, isParent: true, parent: '' };
                    LIST.push(newParent);
                    selectedItem = newParent;
                } else {
                    var newChild = { name: name, enabled: enabled, isParent: false, parent: parentName };
                    var pIdx2 = -1;
                    LIST.forEach(function (x, idx) { if (x.isParent && x.name === parentName) pIdx2 = idx; });
                    var insertAt2 = pIdx2 >= 0 ? pIdx2 + 1 : LIST.length;
                    while (insertAt2 < LIST.length && !LIST[insertAt2].isParent && LIST[insertAt2].parent === parentName) insertAt2++;
                    LIST.splice(insertAt2, 0, newChild);
                    selectedItem = newChild;
                }
                closeEdit();
                render();
                toast('已修改，记得点击「保存并同步」');
                return;
            }

            var dupFlat = LIST.some(function (x, idx) { return idx !== editingIndex && x.name === name; });
            if (dupFlat) { toast('该名称已存在', false); return; }
            if (editingIndex >= 0) {
                LIST[editingIndex].name = name;
                LIST[editingIndex].enabled = enabled;
            } else {
                LIST.push({ name: name, enabled: enabled, parent: '', isParent: false });
            }
            closeEdit();
            render();
            toast('已修改，记得点击「保存并同步」');
        }

        function saveConfig() {
            var next = {
                industries: DICT_KEY === 'industry' ? LIST : DICT.industries,
                qualifications: DICT_KEY === 'qualification' ? LIST : DICT.qualifications
            };
            if (!DataBridge.saveProfileDict(next)) { toast('保存失败，请重试', false); return; }
            DICT = DataBridge.loadProfileDict();
            toast('已保存，雷达筛选已同步');
        }

        function resetDefault() {
            if (!confirm('恢复默认将丢弃当前自定义配置，确定继续？')) return;
            var other = DICT;
            try { localStorage.removeItem('ceyuan_profile_dict'); } catch (e) {}
            var def = DataBridge.loadProfileDict();
            LIST = (DICT_KEY === 'industry' ? def.industries : def.qualifications).slice();
            var next = {
                industries: DICT_KEY === 'industry' ? LIST : other.industries,
                qualifications: DICT_KEY === 'qualification' ? LIST : other.qualifications
            };
            DataBridge.saveProfileDict(next);
            DICT = DataBridge.loadProfileDict();
            render();
            toast('已恢复默认配置');
        }

        applyMeta();
        render();
    </script>
</body>
</html>
