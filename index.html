    <script>
        function toggleMenuGroup(groupId) {
            var group = document.getElementById(groupId);
            var header = group.previousElementSibling;
            group.classList.toggle('collapsed');
            header.classList.toggle('collapsed');
        }

        // 二级菜单展开 / 收起
        function toggleSubGroup(id, btn) {
            var el = document.getElementById(id);
            if (!el) return;
            var hidden = el.classList.toggle('hidden');
            var arrow = btn.querySelector('[data-arrow]');
            if (arrow) arrow.style.transform = hidden ? 'rotate(-90deg)' : '';
        }

        function switchPage(url, el) {
            document.getElementById('contentFrame').src = url + (url.indexOf('?') > -1 ? '&' : '?') + '_t=' + Date.now();

            var urlOnly = url.split('/').pop();

            document.body.classList.remove('mall-mode');

            if (!el) {
                var items = document.querySelectorAll('.sidebar-item');
                for (var i = 0; i < items.length; i++) {
                    if (items[i].getAttribute('onclick') && items[i].getAttribute('onclick').indexOf(urlOnly) !== -1) {
                        el = items[i];
                        break;
                    }
                }
            }

            document.querySelectorAll('.sidebar-item').forEach(function(item) {
                item.classList.remove('active', 'bg-blue-600', 'text-white', 'shadow-lg', 'shadow-blue-200');
            });
            if (el) {
                el.classList.add('active');
            }
        }

        // 默认展开所有分组
        document.addEventListener('DOMContentLoaded', function() {
            var groups = document.querySelectorAll('.menu-group-items');
            groups.forEach(function(g) { g.classList.remove('collapsed'); });
            var headers = document.querySelectorAll('.menu-group-header');
            headers.forEach(function(h) { h.classList.remove('collapsed'); });
        });
    </script>
