<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>套餐与定价 - 策源易答</title>
    <link href="libs/css/tailwind.css" rel="stylesheet">
    <link href="libs/css/font-awesome.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; }
        .toast { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 60; padding: 8px 16px; border-radius: 9999px; font-size: 12px; font-weight: 700; color: #fff; opacity: 0; transition: opacity .25s ease; pointer-events: none; }
        .toast.show { opacity: 1; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <!-- 顶栏 -->
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between sticky top-0 z-40">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center">
                <i class="fa fa-bolt text-white text-sm"></i>
            </div>
            <div>
                <h1 class="text-base font-black text-slate-900">套餐与定价</h1>
                <p class="text-[10px] text-slate-400 mt-0.5">维护会员中心「充值策能值」弹窗的套餐档位，保存后前台即时生效</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <a href="member-center.html" target="_blank" class="px-4 py-2 bg-white border border-slate-300 rounded-lg text-xs font-bold text-slate-600 hover:bg-slate-50 transition-all">
                <i class="fa fa-external-link mr-1.5"></i>预览会员中心
            </a>
            <button onclick="restoreDefault()" class="px-4 py-2 bg-white border border-slate-300 rounded-lg text-xs font-bold text-slate-600 hover:bg-slate-50 transition-all">
                <i class="fa fa-rotate-left mr-1.5"></i>恢复默认
            </button>
            <button onclick="save()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 rounded-lg text-xs font-bold text-white shadow-sm transition-all">
                <i class="fa fa-check mr-1.5"></i>保存生效
            </button>
        </div>
    </header>

    <div class="max-w-6xl mx-auto px-6 py-6 space-y-5">
        <div class="rounded-2xl bg-indigo-50 border border-indigo-100 px-5 py-4 text-[11px] text-indigo-700 leading-relaxed">
            <i class="fa fa-info-circle mr-1"></i>此处维护的是<b>付费充值套餐</b>（个人版/企业版），会员中心充值弹窗按账号类型默认展示对应分组；停用的套餐不在前台展示。会员指南里的「VIP 套餐对比」仍由「会员指南维护」单独维护。
        </div>

        <!-- 个人套餐 -->
        <section class="bg-white rounded-2xl border border-slate-200 p-5">
            <div class="flex items-center justify-between mb-4">
                <div>
                    <h2 class="text-sm font-black text-slate-800 flex items-center"><i class="fa fa-user text-indigo-500 mr-2"></i>个人套餐</h2>
                    <p class="text-[10px] text-slate-400 mt-0.5">面向个人账号，购买的策能值计入个人通用额度</p>
                </div>
                <button onclick="addPlan('personal')" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 rounded-lg text-xs font-bold text-white shadow-sm transition-all">
                    <i class="fa fa-plus mr-1.5"></i>新增套餐
                </button>
            </div>
            <div class="space-y-3" id="personalList"></div>
        </section>

        <!-- 企业套餐 -->
        <section class="bg-white rounded-2xl border border-slate-200 p-5">
            <div class="flex items-center justify-between mb-4">
                <div>
                    <h2 class="text-sm font-black text-slate-800 flex items-center"><i class="fa fa-building text-amber-500 mr-2"></i>企业套餐</h2>
                    <p class="text-[10px] text-slate-400 mt-0.5">面向企业账号，购买的策能值计入企业专属额度，支持配置成员账号数</p>
                </div>
                <button onclick="addPlan('enterprise')" class="px-4 py-2 bg-amber-500 hover:bg-amber-600 rounded-lg text-xs font-bold text-white shadow-sm transition-all">
                    <i class="fa fa-plus mr-1.5"></i>新增套餐
                </button>
            </div>
            <div class="space-y-3" id="enterpriseList"></div>
        </section>
    </div>

    <script>
        var KEY = 'ceyuan_member_plans';
        var DEFAULTS = {
            personal: [
                { id:'vip1', name:'个人 VIP1', credits:300, price:8.9, months:3, enabled:true },
                { id:'vip2', name:'个人 VIP2', credits:700, price:19.9, months:6, enabled:true },
                { id:'vip3', name:'个人 VIP3', credits:1100, price:29.9, months:6, enabled:true }
            ],
            enterprise: [
                { id:'ent1', name:'企业 VIP1', credits:1500, price:59, months:3, seats:3, enabled:true },
                { id:'ent2', name:'企业 VIP2', credits:3600, price:129, months:6, seats:5, enabled:true },
                { id:'ent3', name:'企业 VIP3', credits:7200, price:239, months:6, seats:10, enabled:true }
            ]
        };
        function clone(o) { return JSON.parse(JSON.stringify(o)); }
        function load() {
            try {
                var d = JSON.parse(localStorage.getItem(KEY) || 'null');
                if (d && typeof d === 'object') {
                    return {
                        personal: Array.isArray(d.personal) ? d.personal : clone(DEFAULTS.personal),
                        enterprise: Array.isArray(d.enterprise) ? d.enterprise : clone(DEFAULTS.enterprise)
                    };
                }
            } catch (e) {}
            return clone(DEFAULTS);
        }
        var cfg = load();

        function esc(s) {
            return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        function toast(msg) {
            var t = document.createElement('div');
            t.className = 'toast bg-slate-900';
            t.textContent = msg;
            document.body.appendChild(t);
            requestAnimationFrame(function () { t.classList.add('show'); });
            setTimeout(function () { t.classList.remove('show'); setTimeout(function () { t.remove(); }, 300); }, 1600);
        }
        function save() {
            var bad = false;
            ['personal', 'enterprise'].forEach(function (scope) {
                cfg[scope].forEach(function (p) {
                    if (!String(p.name || '').trim()) bad = true;
                    if (!(+p.credits > 0) || !(+p.price > 0) || !(+p.months > 0)) bad = true;
                });
            });
            if (bad) { toast('请补全名称，并确保策能值、价格、有效期均大于 0'); return; }
            try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) {}
            toast('已保存，会员中心充值弹窗即时生效');
        }
        function restoreDefault() {
            cfg = clone(DEFAULTS);
            render();
            toast('已恢复默认套餐，请点击「保存生效」写入');
        }
        function render() {
            renderGroup('personal');
            renderGroup('enterprise');
        }
        function renderGroup(scope) {
            var el = document.getElementById(scope + 'List');
            var list = cfg[scope];
            if (!list.length) {
                el.innerHTML = '<p class="text-xs text-slate-400 py-6 text-center">暂无套餐，点击右上角「新增套餐」添加</p>';
                return;
            }
            var cols = scope === 'enterprise' ? 'grid-cols-6' : 'grid-cols-5';
            el.innerHTML = list.map(function (p, i) {
                var seats = scope === 'enterprise'
                    ? '<div><label class="block text-[10px] text-slate-400 mb-1">成员账号数</label><input type="number" min="1" class="w-full px-3 py-1.5 border border-slate-300 rounded-lg text-xs" value="' + (p.seats || 1) + '" oninput="cfg.' + scope + '[' + i + '].seats=+this.value||1"></div>'
                    : '';
                return '<div class="border border-slate-200 rounded-xl p-4 bg-slate-50/40">' +
                    '<div class="flex items-center justify-between mb-3">' +
                        '<span class="text-sm font-black text-slate-700">' + esc(p.name || '未命名套餐') + '</span>' +
                        '<button onclick="delPlan(\'' + scope + '\',' + i + ')" class="text-xs text-red-500 hover:text-red-600"><i class="fa fa-trash-o mr-1"></i>删除</button>' +
                    '</div>' +
                    '<div class="grid ' + cols + ' gap-3">' +
                        '<div><label class="block text-[10px] text-slate-400 mb-1">套餐名称</label><input class="w-full px-3 py-1.5 border border-slate-300 rounded-lg text-xs" value="' + esc(p.name) + '" oninput="cfg.' + scope + '[' + i + '].name=this.value"></div>' +
                        '<div><label class="block text-[10px] text-slate-400 mb-1">策能值</label><input type="number" min="0" class="w-full px-3 py-1.5 border border-slate-300 rounded-lg text-xs" value="' + (p.credits || 0) + '" oninput="cfg.' + scope + '[' + i + '].credits=+this.value||0"></div>' +
                        '<div><label class="block text-[10px] text-slate-400 mb-1">价格（元）</label><input type="number" min="0" step="0.1" class="w-full px-3 py-1.5 border border-slate-300 rounded-lg text-xs" value="' + (p.price || 0) + '" oninput="cfg.' + scope + '[' + i + '].price=+this.value||0"></div>' +
                        '<div><label class="block text-[10px] text-slate-400 mb-1">有效期（月）</label><input type="number" min="1" class="w-full px-3 py-1.5 border border-slate-300 rounded-lg text-xs" value="' + (p.months || 1) + '" oninput="cfg.' + scope + '[' + i + '].months=+this.value||1"></div>' +
                        seats +
                        '<div class="flex items-end pb-1"><label class="flex items-center gap-1.5 text-xs text-slate-600 cursor-pointer"><input type="checkbox" class="accent-indigo-600" ' + (p.enabled !== false ? 'checked' : '') + ' onchange="cfg.' + scope + '[' + i + '].enabled=this.checked">启用</label></div>' +
                    '</div>' +
                '</div>';
            }).join('');
        }
        function addPlan(scope) {
            cfg[scope].push({
                id: (scope === 'enterprise' ? 'ent' : 'vip') + Date.now().toString(36),
                name: scope === 'enterprise' ? '企业套餐' : '个人套餐',
                credits: scope === 'enterprise' ? 1500 : 300,
                price: scope === 'enterprise' ? 59 : 8.9,
                months: 3,
                seats: scope === 'enterprise' ? 3 : undefined,
                enabled: true
            });
            renderGroup(scope);
        }
        function delPlan(scope, i) {
            cfg[scope].splice(i, 1);
            renderGroup(scope);
        }
        render();
    </script>
</body>
</html>
